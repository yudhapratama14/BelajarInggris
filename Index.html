const CHEER=['Yeay, tepat sekali! 🎉','Wuhuu! Otakmu kinclong ✨','Betul! Pak Yood sampai kepak-kepak 🦉👏','Mantap jiwa! Sini tos 🙌','Jawabanmu semulus tahu sutra 😎','Kamu jenius! Pak Yood jadi minder 🌟'];
const OOPS=['Ups, kepleset! Yuk kita bedah bareng 🛠️','Hampir! Otakmu cuma lagi loading… ⏳','Yood yood… salah dikit itu bumbu belajar 🌶️','Tenang, Pak Yood juga pernah salah (sekali, kemarin) 😅','Belum pas, tapi usahamu lucu dan keren 💛'];
const LEVELS=[{"id":"sd","name":"Level SD","tag":"Pemula","emoji":"🌱","mods":[{"n":"To Be: am / is / are","steps":[{"s":"Halo, aku <b>Pak Yood</b> 🦉! Hari ini kita kenalan sama <b>To Be</b>. Anggap saja To Be itu <b>lem perekat kata</b>: dia menempelkan \"siapa\" ke \"apa/bagaimana\".","ex":[]},{"s":"Lemnya ada 3 ukuran. <b>am</b> itu lem kecil khusus buat <b>I</b> (kamu sendiri). <b>is</b> lem sedang buat satu orang atau benda lain. <b>are</b> lem besar buat kamu dan orang banyak.","ex":["I → <b>am</b>","He / She / It → <b>is</b>","You / We / They → <b>are</b>"]},{"s":"Lihat, lemnya selalu nempel di tengah, di antara dua kata!","ex":["I <b>am</b> happy.","She <b>is</b> a teacher.","They <b>are</b> friends."]},{"s":"Lem juga bisa dilepas atau dipindah. <b>Negatif</b>: tambah <b>not</b>. <b>Tanya</b>: lemnya maju ke depan, seperti orang yang menyerobot antrean paling depan.","ex":["I am <b>not</b> tired.","<b>Is</b> she a teacher?","<b>Are</b> they here?"]}],"quiz":[{"q":"I ___ a student.","o":["am","is","are"],"a":0,"why":"\"I\" pasangannya selalu <b>am</b>, lem kecil buat satu orang: kamu sendiri."},{"q":"She ___ my sister.","o":["am","is","are"],"a":1,"why":"She itu satu orang, jadi pakai lem sedang: <b>is</b>."},{"q":"We ___ best friends.","o":["is","am","are"],"a":2,"why":"We itu banyak orang (kamu + aku), jadi butuh lem besar: <b>are</b>."},{"t":"type","q":"Ketik am/is/are: ___ they your friends?","a":["are"],"why":"They butuh lem besar <b>are</b>, dan lemnya maju ke depan untuk bertanya."},{"t":"order","q":"Susun pertanyaan: \"Apakah dia dokter?\"","w":["Is","he","a","doctor"],"a":"Is he a doctor","why":"Lem <b>is</b> maju ke depan."},{"t":"listen","say":"She is a teacher.","q":"Dengarkan, lalu ketik kalimat yang kamu dengar:","a":["she is a teacher"],"why":"Kalimatnya: <b>She is a teacher.</b> She pakai lem is."}],"map":{"c":"TO BE (lem kata)","b":[{"t":"I","k":["am"]},{"t":"He / She / It","k":["is"]},{"t":"You / We / They","k":["are"]},{"t":"Negatif & Tanya","k":["+ not","Is she…?"]}]},"g":"⏰ Tenses Dasar","game":{"e":"🏫","t":"Hari Pertama di Kelas","sc":[["🧑‍🎓","🎒","Kamu murid baru dan harus memperkenalkan diri.|Pilih kalimat yang kamu ucapkan.",["I am a student.","I is a student.","I are a student."],0,"🙋","hop","I selalu berpasangan dengan am (lem kecil)."],["👩‍🏫","📚","Bu Sari masuk kelas. Perkenalkan beliau!|Pilih kalimatnya.",["She are a teacher.","She is a teacher.","She am a teacher."],1,"👏","wiggle","She = satu orang, jadi pakai is."],["🧑‍🤝‍🧑","⚽","Kamu dan temanmu satu tim. Umumkan!|Pilih kalimatnya.",["We is a team.","We am a team.","We are a team."],2,"🏆","spin","We = banyak orang, jadi pakai are."]]}},{"n":"Kemarin, Sekarang, Besok","g":"⏰ Tenses Dasar","steps":[{"s":"Bayangkan <b>album foto</b> 📸. Foto lama = <b>kemarin</b> (sudah selesai). Foto langsung = <b>sekarang</b> (kebiasaan). Foto yang belum dicetak = <b>besok</b> (rencana).","ex":["I <b>play</b> football every day.","I <b>played</b> football yesterday.","I <b>will play</b> football tomorrow."]},{"s":"Kata penunjuk waktu itu seperti <b>label di foto</b>. Lihat labelnya, langsung tahu fotonya yang mana.","ex":[],"tbl":[["Label waktu","Tense","Bentuk"],["every day, always","Sekarang (kebiasaan)","play / plays"],["yesterday, last week","Kemarin","played, went, ate"],["tomorrow, next week","Besok","will + play"]],"tip":"Setelah <b>will</b>, kata kerja selalu polos: I will <b>go</b>, bukan I will went."}],"quiz":[{"t":"mc","q":"Tomorrow, I ___ my grandmother.","o":["will visit","visited","visits"],"a":0,"why":"Tomorrow = besok, pakai <b>will + V1</b>."},{"t":"mc","q":"Yesterday she ___ rice.","o":["eat","ate","will eat"],"a":1,"why":"Yesterday = kemarin. Eat itu murid bandel: <b>ate</b>."},{"t":"type","q":"Ketik: I ___ (will/did) study tomorrow.","a":["will"],"why":"Besok = <b>will</b>."},{"t":"order","q":"Susun: \"Aku akan makan nasi besok.\"","w":["I","will","eat","rice","tomorrow"],"a":"I will eat rice tomorrow","why":"Pelaku + will + V1 + keterangan waktu."},{"t":"listen","say":"Yesterday I played football.","q":"Kapan kejadiannya?","o":["Kemarin","Besok","Kebiasaan sehari-hari"],"a":0,"why":"Ada <b>yesterday</b> dan <b>played</b>: kemarin.","wr":["","Besok pakai will, tidak ada will di kalimat ini.","Kebiasaan biasanya pakai every day."]}],"map":{"c":"TENSES DASAR","b":[{"t":"📸 Kemarin","k":["yesterday","played","went"]},{"t":"📸 Sekarang","k":["every day","play / plays"]},{"t":"📸 Besok","k":["tomorrow","will + V1"]}]},"game":{"e":"⏳","t":"Mesin Waktu Dapur","sc":[["🧑‍🍳","🍳","Budi selalu masak nasi goreng tiap hari.|Ceritakan kebiasaannya.",["He cooks fried rice every day.","He cooked fried rice every day.","He will cook fried rice every day."],0,"🍳","wiggle","every day = kebiasaan, jadi Simple Present: cooks."],["🧑‍🍳","🍝","Kemarin Budi masak spageti.|Ceritakan kejadiannya.",["He will cook spaghetti yesterday.","He cooked spaghetti yesterday.","He cooks spaghetti yesterday."],1,"🍝","slide","yesterday = lampau, jadi cooked."],["🧑‍🍳","🍰","Besok Budi akan membuat kue.|Ceritakan rencananya.",["He will make a cake tomorrow.","He made a cake tomorrow.","He makes a cake yesterday."],0,"🍰","grow","tomorrow = masa depan: will + V1."]]}},{"n":"Pertanyaan WH","steps":[{"s":"<b>WH-questions</b> itu ibarat <b>peralatan detektif</b> 🔍. Tiap kata tanya mencari satu jenis petunjuk.","ex":[],"tbl":[["Kata tanya","Mencari","Contoh"],["Who","orang","Who is she?"],["What","benda / hal","What is this?"],["Where","tempat","Where are you?"],["When","waktu","When is the party?"],["Why","alasan","Why are you sad?"],["How","cara / keadaan","How are you?"]]},{"s":"Rumus: <b>kata tanya + is/are + subjek</b>. Untuk kata kerja biasa: <b>kata tanya + do/does + subjek + V1</b>. Ingat satpam!","ex":["Where <b>is</b> she?","Where <b>does</b> she live?","What <b>do</b> you want?"],"tip":"Where she lives? ❌ → Where <b>does</b> she live? ✅"}],"quiz":[{"t":"mc","q":"___ is your teacher? (orang)","o":["Who","Where","When"],"a":0,"why":"Mencari orang: <b>Who</b>."},{"t":"mc","q":"___ do you live? (tempat)","o":["Where","Why","Who"],"a":0,"why":"Mencari tempat: <b>Where</b>."},{"t":"type","q":"Ketik kata tanya alasan: ___ are you late?","a":["why"],"why":"Alasan: <b>Why</b>."},{"t":"mc","q":"Pilih yang benar:","o":["Where does she live?","Where she lives?","Where does she lives?"],"a":0,"why":"Satpam does + V1 polos."},{"t":"order","q":"Susun: \"Apa yang kamu mau?\"","w":["What","do","you","want"],"a":"What do you want","why":"WH + do + S + V1."}],"map":{"c":"WH-QUESTIONS","b":[{"t":"🔍 Petunjuk","k":["who = orang","what = hal","where = tempat","when = waktu","why = alasan","how = cara"]},{"t":"Rumus","k":["WH + is/are + S","WH + do/does + S + V1"]}]},"g":"🧱 Dasar Kalimat"},{"n":"Kosakata Dasar","g":"📦 Kosakata & Tata Bahasa Dasar","steps":[{"s":"Kosakata itu ibarat <b>kotak mainan berlabel</b> 🧸. Makin banyak label yang kamu hafal, makin cepat kamu menemukan mainan yang dicari.","ex":[],"tbl":[["Kotak","Isi"],["Keluarga","father, mother, brother, sister, uncle, aunt"],["Warna","red, blue, green, yellow, black, white"],["Angka","one, two, three … ten"],["Hewan","cat, dog, bird, fish, cow"],["Sekolah","book, pen, desk, bag, teacher"]]},{"s":"Jangan hafal sendirian. Pasangkan kata dengan <b>kalimat</b> dan <b>bunyinya</b>. Ketuk contoh ini biar Pak Yood yang bacakan!","ex":["My <b>mother</b> has a <b>red</b> bag.","I have <b>three</b> books.","The <b>cat</b> is under the <b>desk</b>."]}],"quiz":[{"t":"mc","q":"Saudara laki-laki ibumu disebut…","o":["uncle","brother","father"],"a":0,"why":"Saudara laki-laki orang tua: <b>uncle</b>."},{"t":"mc","q":"Angka \"seven\" adalah…","o":["6","7","8"],"a":1,"why":"Seven = <b>7</b>."},{"t":"type","q":"Ketik bahasa Inggrisnya: kucing","a":["cat"],"why":"Kucing = <b>cat</b>."},{"t":"order","q":"Susun: \"Ayahku seorang guru.\"","w":["My","father","is","a","teacher"],"a":"My father is a teacher","why":"My father = He, jadi lemnya <b>is</b>."},{"t":"listen","say":"I have three books.","q":"Dengarkan, lalu ketik kalimat yang kamu dengar:","a":["i have three books"],"why":"Kalimatnya: <b>I have three books.</b>"}],"map":{"c":"KOSAKATA DASAR","b":[{"t":"👪 Keluarga","k":["father","mother","uncle"]},{"t":"🎨 Warna","k":["red","blue","green"]},{"t":"🔢 Angka","k":["one","two","three"]},{"t":"🐾 Hewan","k":["cat","dog","bird"]}]},"fc":1},{"n":"A / An","steps":[{"s":"<b>a</b> dan <b>an</b> itu ibarat <b>sandal</b> untuk kata benda 👡. Kalau salah pasang, bicaramu jadi \"tersandung\".","ex":["a book","an apple"]},{"s":"Pakai <b>an</b> kalau kata setelahnya <b>berbunyi vokal</b> (a, i, u, e, o), biar jalannya landai dan mulus. Selain itu pakai <b>a</b>.","ex":["an egg","an orange","a cat","a dog"]},{"s":"Jebakan! Yang dihitung itu <b>bunyi</b>, bukan huruf. <b>hour</b> bunyinya \"aur\" (vokal), <b>university</b> bunyinya \"yu\" (konsonan).","ex":["an <b>h</b>our","a <b>u</b>niversity"]}],"quiz":[{"t":"mc","q":"___ umbrella","o":["a","an"],"a":1,"why":"Umbrella diawali bunyi vokal, jadi sandalnya <b>an</b>."},{"t":"type","q":"Ketik a atau an: ___ elephant","a":["an"],"why":"Elephant diawali vokal \"e\", jadi <b>an</b>."},{"t":"order","q":"Susun kalimat: \"Aku punya seekor kucing.\"","w":["I","have","a","cat"],"a":"I have a cat","why":"Urutannya: pelaku + kata kerja + benda."},{"t":"mc","q":"___ university","o":["a","an"],"a":0,"why":"Bunyinya \"yu\", konsonan, jadi <b>a</b>."},{"t":"type","q":"Ketik a/an: ___ hour","a":["an"],"why":"Bunyinya \"aur\", vokal, jadi <b>an</b>."}],"map":{"c":"A / AN (sandal)","b":[{"t":"an","k":["bunyi vokal","an apple","an hour"]},{"t":"a","k":["bunyi konsonan","a book","a university"]},{"t":"Jebakan","k":["lihat bunyi, bukan huruf"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar"},{"n":"Kata Ganti & Kepemilikan","steps":[{"s":"Kata ganti itu ibarat <b>kostum aktor</b> 🎭. Orangnya sama, kostumnya ganti sesuai peran: jadi <b>pelaku</b> (I), <b>penerima</b> (me), atau <b>pemilik</b> (my).","ex":["<b>I</b> love her. (pelaku)","She loves <b>me</b>. (penerima)","This is <b>my</b> bag. (pemilik)"]},{"s":"Ini tabel kostum lengkapnya. Kolom <b>+ benda</b> itu label nama di barang (my bag). Kolom <b>sendirian</b> dipakai kalau bendanya sudah jelas (it is mine).","ex":["This is <b>my</b> bag.","This bag is <b>mine</b>."],"tbl":[["Pelaku","Penerima","+ benda","Sendirian"],["I","me","my","mine"],["you","you","your","yours"],["he","him","his","his"],["she","her","her","hers"],["we","us","our","ours"],["they","them","their","theirs"]]},{"s":"Jebakan klasik: <b>its</b> vs <b>it's</b>. Apostrof itu tanda \"ada yang hilang\": it's = it is. Kalau tidak ada yang hilang, itu kepemilikan.","ex":["<b>It's</b> cold. (= It is)","The cat licks <b>its</b> paw."],"tip":"Tes cepat: kalau bisa diganti \"it is\", pakai <b>it's</b>."}],"quiz":[{"t":"mc","q":"This is ___ book. (milikku)","o":["my","mine","me"],"a":0,"why":"Diikuti benda, pakai label <b>my</b>."},{"t":"mc","q":"Please give ___ the key. (kepada dia perempuan)","o":["she","her","hers"],"a":1,"why":"Penerima perempuan: <b>her</b>."},{"t":"type","q":"Ketik: This pen is ___. (punyaku)","a":["mine"],"why":"Tanpa benda di belakangnya: <b>mine</b>."},{"t":"type","q":"Ketik: They love ___ dog. (anjing milik mereka)","a":["their"],"why":"Diikuti benda: <b>their</b>."},{"t":"mc","q":"The cat licks ___ paw.","o":["its","it's","its'"],"a":0,"why":"Tidak bisa diganti \"it is\", jadi <b>its</b>."},{"t":"order","q":"Susun: \"Tas ini miliknya (perempuan).\"","w":["This","bag","is","hers"],"a":"This bag is hers","why":"Tanpa benda setelahnya: hers."}],"map":{"c":"KATA GANTI","b":[{"t":"Pelaku","k":["I","he","she","we","they"]},{"t":"Penerima","k":["me","him","her","us","them"]},{"t":"+ benda (label)","k":["my bag","her book"]},{"t":"Sendirian","k":["mine","hers","theirs"]},{"t":"Jebakan","k":["it's = it is","its = milik"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar"},{"n":"This / That / These / Those","steps":[{"s":"Kata tunjuk itu ibarat <b>jari telunjuk</b> 👉. Ada dua pertanyaan: <b>dekat atau jauh</b>, dan <b>satu atau banyak</b>.","ex":[],"tbl":[["","Satu","Banyak"],["Dekat","this","these"],["Jauh","that","those"]]},{"s":"Ingat: <b>this/that</b> menempel pada lem <b>is</b>, <b>these/those</b> pada lem <b>are</b>.","ex":["<b>This is</b> my bag.","<b>Those are</b> my shoes."],"tip":"Banyak benda selalu pakai are: These <b>are</b>, bukan These is."}],"quiz":[{"t":"mc","q":"___ is my pen. (dekat, satu)","o":["This","These","Those"],"a":0,"why":"Dekat + satu: <b>This</b>."},{"t":"mc","q":"___ are my shoes over there.","o":["That","Those","This"],"a":1,"why":"Jauh + banyak: <b>Those</b>."},{"t":"type","q":"Ketik: ___ books here are new. (dekat, banyak)","a":["these"],"why":"Dekat + banyak: <b>These</b>."},{"t":"mc","q":"Pilih yang benar:","o":["These is my friend.","This is my friend.","Those is my friend."],"a":1,"why":"Satu orang: this + is."},{"t":"order","q":"Susun: \"Itu adalah rumahku.\"","w":["That","is","my","house"],"a":"That is my house","why":"Jauh + satu: That is."}],"map":{"c":"THIS / THAT","b":[{"t":"Dekat","k":["this (satu)","these (banyak)"]},{"t":"Jauh","k":["that (satu)","those (banyak)"]},{"t":"Lem","k":["this/that + is","these/those + are"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar","game":{"e":"🧸","t":"Toko Mainan","sc":[["🧒","🚗","Mobil mainan ada di tanganmu (dekat, satu).|Tunjuk dan katakan.",["This is my car.","That is my car.","Those are my car."],0,"🚗","hop","Dekat + satu = this."],["🧒","🏠","Rumah itu jauh di seberang jalan.|Tunjuk dan katakan.",["This is my house.","That is my house.","These are my house."],1,"🏠","slide","Jauh + satu = that."],["🧒","👟","Sepatu-sepatu di rak sana jauh dan banyak.|Tunjuk dan katakan.",["Those are my shoes.","This are my shoes.","That is my shoes."],0,"👟","grow","Jauh + banyak = those + are."]]}},{"n":"Preposisi: in / on / at","steps":[{"s":"Preposisi itu ibarat <b>posisi boneka terhadap sebuah kotak</b> 🧸📦. Bayangkan boneka dan kotaknya, maka artinya langsung ketemu.","ex":["The doll is <b>in</b> the box. (di dalam)","The doll is <b>on</b> the box. (di atas, menempel)","The doll is <b>under</b> the box.","The doll is <b>next to</b> the box."]},{"s":"<b>in / on / at</b> juga dipakai untuk waktu dan tempat. Anggap <b>in</b> = ruang besar, <b>on</b> = permukaan, <b>at</b> = satu titik kecil.","ex":[],"tbl":[["Kata","Bayangan","Contoh"],["in","di dalam ruang/wadah","in the room, in Jakarta, in May"],["on","menempel di permukaan","on the table, on Monday"],["at","titik tertentu","at school, at 7 o'clock"]],"tip":"Waktu: <b>in</b> the morning, <b>on</b> Monday, <b>at</b> 5 o'clock."}],"quiz":[{"t":"mc","q":"The cat is ___ the box. (di dalam)","o":["in","on","at"],"a":0,"why":"Di dalam wadah: <b>in</b>."},{"t":"mc","q":"The book is ___ the table.","o":["in","on","at"],"a":1,"why":"Menempel di permukaan: <b>on</b>."},{"t":"mc","q":"I wake up ___ 6 o'clock.","o":["in","on","at"],"a":2,"why":"Jam = titik waktu: <b>at</b>."},{"t":"type","q":"Ketik: My birthday is ___ Monday.","a":["on"],"why":"Hari pakai <b>on</b>."},{"t":"order","q":"Susun: \"Bola itu ada di bawah kursi.\"","w":["The","ball","is","under","the","chair"],"a":"The ball is under the chair","why":"Under = di bawah."}],"map":{"c":"IN / ON / AT","b":[{"t":"in","k":["wadah","kota","bulan & tahun"]},{"t":"on","k":["permukaan","hari","tanggal"]},{"t":"at","k":["titik","jam","alamat"]},{"t":"Lainnya","k":["under","next to","between"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar","game":{"e":"📦","t":"Boneka dan Kotak","sc":[["🧸","📦","Boneka beruang mau masuk ke DALAM kotak.|Beri perintah ke Pak Yood.",["Put the bear in the box.","Put the bear on the box.","Put the bear under the box."],0,"📦","hop","in = di dalam wadah."],["🧸","📦","Sekarang beruang harus duduk di ATAS kotak, menempel di permukaannya.|Beri perintah.",["Put the bear in the box.","Put the bear on the box.","Put the bear at the box."],1,"⬆️","hop","on = menempel di permukaan."],["🧸","⏰","Alarm berbunyi jam 7. Beruang bangun!|Pilih kalimat waktunya.",["The bear wakes up in 7 o'clock.","The bear wakes up at 7 o'clock.","The bear wakes up on 7 o'clock."],1,"⏰","wiggle","Jam = titik waktu, jadi at."]]}},{"n":"Jenis-jenis Teks","g":"📖 Jenis Teks","steps":[{"s":"Teks itu seperti <b>jenis tas</b> 🎒: ransel buat sekolah, koper buat liburan. Tiap teks punya tugas sendiri. Kenali tugasnya, kamu langsung tahu cara membacanya.","ex":[],"tbl":[["Teks","Ibarat","Tugasnya"],["Descriptive","Foto","Menggambarkan orang/benda"],["Recount","Buku harian","Menceritakan kejadian lalu"],["Procedure","Resep masakan","Memberi langkah-langkah"],["Narrative","Dongeng","Cerita dengan masalah & akhir"],["Announcement","Papan pengumuman","Memberi info acara"]]},{"s":"Biar makin jelas, lihat contoh pendeknya. Perhatikan <b>tense</b>-nya juga: deskripsi pakai sekarang, recount pakai lampau.","ex":["<b>Descriptive:</b> My cat is white. It has big eyes.","<b>Recount:</b> Yesterday I went to the zoo.","<b>Procedure:</b> First, boil the water. Then, add noodles.","<b>Narrative:</b> Once upon a time, there was a clever mouse."]}],"quiz":[{"t":"mc","q":"\"First, wash the rice. Then, cook it.\" termasuk teks apa?","o":["Descriptive","Procedure","Narrative"],"a":1,"why":"Ada urutan langkah (first, then): <b>Procedure</b>, seperti resep."},{"t":"mc","q":"\"Yesterday I went to the beach.\" termasuk teks apa?","o":["Recount","Announcement","Descriptive"],"a":0,"why":"Kejadian yang sudah lewat: <b>Recount</b>, seperti buku harian."},{"t":"mc","q":"\"Once upon a time...\" biasanya membuka teks…","o":["Procedure","Narrative","Announcement"],"a":1,"why":"Itu pembuka dongeng: <b>Narrative</b>."},{"t":"type","q":"Ketik jenis teks yang menggambarkan benda (awalan d):","a":["descriptive"],"why":"Menggambarkan seperti foto: <b>descriptive</b>."}],"map":{"c":"JENIS TEKS","b":[{"t":"📷 Descriptive","k":["gambarkan","is / has"]},{"t":"📔 Recount","k":["kejadian lalu","past tense"]},{"t":"🍳 Procedure","k":["langkah","first, then"]},{"t":"🧚 Narrative","k":["dongeng","once upon a time"]}]},"fc":1},{"n":"Membaca & Menulis Dasar","g":"✍️ Membaca & Menulis","steps":[{"s":"Menulis kalimat itu seperti <b>menyusun lego</b> 🧱: balok pertama <b>huruf kapital</b>, balok tengah <b>pelaku + kata kerja</b>, balok terakhir <b>titik</b>. Kurang satu, bangunannya miring.","ex":["<b>M</b>y name is Dina<b>.</b>","She likes apples<b>.</b>"],"tip":"Kata <b>I</b> dan nama orang selalu huruf kapital."},{"s":"Membaca? Pakai <b>senter</b> 🔦. Baca teks sekali untuk gambaran, lalu sorot kata kunci saat menjawab. Coba teks mini ini:","ex":["Dina has a <b>red</b> bag. It is new. She puts her books in it."]}],"quiz":[{"t":"mc","q":"Teks tadi: apa warna tas Dina?","o":["Red","Blue","Black"],"a":0,"why":"Ada di kalimat pertama: <b>red</b>."},{"t":"mc","q":"Kalimat mana yang ditulis benar?","o":["my name is budi.","My name is Budi.","My name is budi"],"a":1,"why":"Kapital di awal dan nama, titik di akhir."},{"t":"type","q":"Ketik: Dina puts her ___ in the bag.","a":["books"],"why":"Jawabannya ada di teks: <b>books</b>."},{"t":"order","q":"Susun: \"Namaku Dina.\"","w":["My","name","is","Dina"],"a":"My name is Dina","why":"Pemilik + benda + lem is + nama."}],"map":{"c":"MEMBACA & MENULIS","b":[{"t":"🧱 Menulis","k":["Kapital","Subjek + Verb","Titik"]},{"t":"🔦 Membaca","k":["baca sekali","sorot kata kunci"]}]}}]},{"id":"smp","name":"Level SMP","tag":"Pra-menengah","emoji":"🌿","mods":[{"n":"Peta 16 Tenses","g":"⏰ Tenses","fc":0,"steps":[{"s":"16 tenses itu ibarat <b>gedung 4 lantai dengan 4 kamar tiap lantai</b> 🏢. Lantainya adalah <b>waktu</b> (Present, Past, Future, Past Future). Kamarnya adalah <b>gaya</b> (Simple, Continuous, Perfect, Perfect Continuous). 4 × 4 = 16!","ex":[]},{"s":"Tiap gaya punya <b>ciri tetap</b> di semua lantai. Hafalkan gayanya, dan 16 rumus itu tinggal ganti kata bantu.","ex":["<b>Simple</b> 📸 = foto: kejadian apa adanya","<b>Continuous</b> 🎥 = video: sedang berlangsung (be + V-ing)","<b>Perfect</b> 📒 = rapor: hasil / sudah selesai (have + V3)","<b>Perfect Continuous</b> ⏱️ = durasi (have been + V-ing)"]},{"s":"Ini <b>denah gedungnya</b>. Baca per baris (waktu) lalu per kolom (gaya).","ex":[],"tbl":[["","Simple","Continuous","Perfect","Perfect Cont."],["Present","V1 / V-s","am/is/are + V-ing","has/have + V3","has/have been + V-ing"],["Past","V2","was/were + V-ing","had + V3","had been + V-ing"],["Future","will + V1","will be + V-ing","will have + V3","will have been + V-ing"],["Past Future","would + V1","would be + V-ing","would have + V3","would have been + V-ing"]],"tip":"Pola cepat: <b>Continuous = be + V-ing</b>, <b>Perfect = have + V3</b>, <b>Perfect Continuous = have been + V-ing</b>. Waktunya hanya mengubah kata bantu pertamanya."}],"quiz":[{"t":"mc","q":"Rumus \"will have + V3\" adalah…","o":["Future Perfect","Future Continuous","Simple Future"],"a":0,"why":"Future (will) + Perfect (have + V3)."},{"t":"mc","q":"\"had been + V-ing\" adalah…","o":["Past Perfect Continuous","Past Perfect","Past Continuous"],"a":0,"why":"Past (had) + Perfect Continuous (been + V-ing)."},{"t":"mc","q":"Gaya \"Continuous\" ibarat…","o":["Video (sedang berlangsung)","Foto","Rapor"],"a":0,"why":"Continuous = <b>video</b>."},{"t":"mc","q":"Tense \"would + V1\" berada di lantai…","o":["Past Future","Present","Future"],"a":0,"why":"would = bentuk lampau dari will: <b>Past Future</b>."},{"t":"type","q":"Ketik gaya yang menekankan hasil (awalan p):","a":["perfect"],"why":"Rapor = <b>Perfect</b>."},{"t":"mc","q":"\"I will be sleeping at 10\" adalah…","o":["Future Continuous","Future Perfect","Simple Future"],"a":0,"why":"will be + V-ing = <b>Future Continuous</b>."},{"t":"mc","q":"\"has been + V-ing\" adalah…","o":["Present Perfect Continuous","Present Perfect","Present Continuous"],"a":0,"why":"Present (has) + Perfect Continuous."},{"t":"order","q":"Susun rumus Future Perfect Continuous:","w":["will","have","been","V-ing"],"a":"will have been V-ing","why":"Urutan: will, have, been, V-ing."}],"map":{"c":"PETA 16 TENSES","b":[{"t":"🏢 4 Lantai","k":["Present","Past","Future","Past Future"]},{"t":"🚪 4 Kamar","k":["Simple","Continuous","Perfect","Perfect Cont."]},{"t":"🔑 Pola","k":["be + V-ing","have + V3","have been + V-ing"]}]}},{"n":"Simple Present Tense","steps":[{"s":"<b>Simple Present</b> itu ibarat <b>jadwal di buku harianmu</b>: kebiasaan atau hal yang terjadi berulang, bukan yang sedang terjadi detik ini.","ex":["I <b>wake up</b> at six.","They <b>play</b> football on Sunday."]},{"s":"Ada aturan unik: kalau pelakunya <b>He / She / It</b> (satu orang), kata kerja wajib pakai \"topi\" kecil, yaitu <b>-s / -es</b>. Ibarat satpam yang minta tamu tunggal pakai tanda pengenal.","ex":["She <b>eats</b> rice.","He <b>goes</b> to school.","They eat rice. (banyak orang, tanpa topi)"]},{"s":"Tips: kalau ada kata <b>every day, usually, always</b>, itu kode rahasia bahwa kalimatnya Simple Present.","ex":["My dad <b>drinks</b> coffee every morning."]},{"s":"<b>Termometer kebiasaan</b> 🌡️: always (100%), usually, often, sometimes, never (0%). Letaknya sebelum kata kerja utama, tapi setelah to be.","ex":["She <b>always</b> drinks tea.","He is <b>never</b> late."]},{"s":"Ini <b>peta tiga wajah</b> Simple Present: positif, negatif, tanya. Perhatikan: topi -s hanya muncul di kalimat positif. Di negatif dan tanya, topinya pindah ke satpam.","ex":[],"tbl":[["","Positif","Negatif","Tanya"],["I/You/We/They","They play","They don't play","Do they play?"],["He/She/It","She plays","She doesn't play","Does she play?"]],"tip":"Kesalahan umum: She don't like ❌ → She <b>doesn't</b> like ✅"}],"quiz":[{"q":"She ___ to school every day.","o":["go","goes","going"],"a":1,"why":"She itu satu orang, kata kerjanya wajib pakai topi: go + es = <b>goes</b>."},{"q":"They ___ football on Sunday.","o":["plays","play","playing"],"a":1,"why":"They itu banyak orang, jadi kata kerja tidak butuh topi: <b>play</b>."},{"q":"Tom ___ breakfast at 6 o'clock.","o":["eat","eating","eats"],"a":2,"why":"Tom = He (satu orang), topinya dipakai: <b>eats</b>."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["She always drinks tea.","She drinks always tea.","Always she drinks tea."],"a":0,"why":"Always berdiri sebelum kata kerja utama."},{"t":"order","q":"Susun: \"Dia tidak pernah makan daging.\"","w":["He","never","eats","meat"],"a":"He never eats meat","why":"Never sebelum kata kerja, dan He butuh topi: eats."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["She don't like fish.","She doesn't like fish.","She doesn't likes fish."],"a":1,"why":"Satpam doesn't sudah memakai topi, kata kerja polos."},{"t":"type","q":"Ketik: Does he ___ (play) chess?","a":["play"],"why":"Setelah does, kata kerja polos."}],"map":{"c":"SIMPLE PRESENT","b":[{"t":"Kapan?","k":["kebiasaan","fakta umum","every day"]},{"t":"Rumus","k":["S + V1","He/She/It + V-s/es"]},{"t":"Termometer","k":["always","usually","sometimes","never"]},{"t":"Tanya & negatif","k":["modul Do / Does"]},{"t":"Tiga wajah","k":["She plays","She doesn't play","Does she play?"]}]},"g":"⏰ Tenses","game":{"e":"⏰","t":"Rutinitas Pagi","sc":[["😴","🛏️","Dina selalu bangun jam enam tiap pagi.|Ceritakan kebiasaannya.",["She wake up at six.","She wakes up at six.","She waking up at six."],1,"⏰","hop","She butuh topi -s: wakes."],["🧑‍💼","☕","Ayah minum kopi tiap pagi.|Ceritakan kebiasaannya.",["My father drink coffee every morning.","My father drinks coffee every morning.","My father drinking coffee every morning."],1,"☕","wiggle","My father = He, jadi drinks."],["👧","🚌","Dina dan temannya naik bus ke sekolah.|Ceritakan kebiasaannya.",["They takes the bus.","They take the bus.","They taking the bus."],1,"🚌","slide","They = banyak, kata kerja tanpa topi: take."]]}},{"n":"Present Continuous","steps":[{"s":"Kalau Simple Present itu <b>buku harian</b>, <b>Present Continuous</b> itu <b>siaran langsung</b> 🎥: kejadian yang <b>sedang berlangsung sekarang</b>. Rumus: <b>am/is/are + V-ing</b>.","ex":["She <b>is cooking</b> now.","They <b>are playing</b> football."]},{"s":"Bandingkan dua \"kamera\" ini biar tidak tertukar.","ex":[],"tbl":[["","Simple Present","Present Continuous"],["Analogi","Buku harian","Siaran langsung"],["Rumus","V1 / V-s","be + V-ing"],["Penanda","every day, usually","now, Look!"],["Contoh","I drink tea daily.","I am drinking tea now."]]},{"s":"Menambah <b>-ing</b> ada aturannya. Anggap kata kerja itu balon: <b>e</b> di ujung dibuang, dan huruf akhir yang \"tegang\" digandakan.","ex":["write → <b>writing</b> (buang e)","run → <b>running</b> (gandakan n)","swim → <b>swimming</b>","lie → <b>lying</b>"]},{"s":"Ada kata kerja yang <b>tidak bisa disiarkan langsung</b>: kata kerja perasaan dan pikiran (<b>like, love, know, want, need</b>). Ibarat patung: tidak \"sedang melakukan\", cuma \"ada\".","ex":["I <b>know</b> the answer. ✅","I am knowing the answer. ❌"],"tip":"Ragu? Untuk kata kerja perasaan atau pikiran, pakai Simple Present."}],"quiz":[{"t":"mc","q":"Look! The baby ___.","o":["is sleeping","sleeps","sleep"],"a":0,"why":"\"Look!\" = sedang terjadi: <b>is sleeping</b>."},{"t":"mc","q":"I ___ coffee every morning.","o":["drink","am drinking","drinking"],"a":0,"why":"Every morning = kebiasaan: Simple Present."},{"t":"type","q":"Ketik: She is ___ (run) now.","a":["running"],"why":"Gandakan n: <b>running</b>."},{"t":"type","q":"Ketik: He is ___ (write) a letter.","a":["writing"],"why":"Buang e: <b>writing</b>."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["I am knowing her.","I know her.","I knowing her."],"a":1,"why":"Know itu \"patung\", tidak pakai -ing."},{"t":"order","q":"Susun: \"Mereka sedang bermain bola sekarang.\"","w":["They","are","playing","football","now"],"a":"They are playing football now","why":"be + V-ing."}],"map":{"c":"PRESENT CONTINUOUS","b":[{"t":"🎥 Rumus","k":["am/is/are + V-ing"]},{"t":"Penanda","k":["now","at the moment","Look!"]},{"t":"Ejaan -ing","k":["write → writing","run → running","lie → lying"]},{"t":"🗿 Tanpa -ing","k":["like","know","want","need"]}]},"g":"⏰ Tenses","game":{"e":"🎥","t":"Siaran Langsung","sc":[["👩‍🍳","🍲","LIHAT! Ibu sedang memasak sekarang.|Laporkan langsung.",["She is cooking now.","She cooks now.","She cooked now."],0,"🍲","wiggle","Sedang berlangsung = is + V-ing."],["🧑‍🎤","🎸","Kakak sedang bermain gitar.|Laporkan langsung.",["He plays guitar every day.","He is playing the guitar.","He is play the guitar."],1,"🎸","hop","Sedang = is + V-ing, jadi playing."],["🏃","🌳","Anak itu sedang berlari di taman.|Laporkan langsung.",["He is running now.","He is runing now.","He running now."],0,"🏃","slide","run: gandakan n jadi running."]]}},{"n":"Past Tense","steps":[{"s":"<b>Past Tense</b> itu ibarat <b>foto lama</b> 📷: kejadiannya sudah selesai. Kata kunci: <b>yesterday, last week, ago</b>.","ex":["I <b>watched</b> a movie yesterday."]},{"s":"Kata kerja biasa cukup ditambah <b>-ed</b>. Tapi ada \"murid bandel\" (irregular) yang punya bentuk sendiri dan harus dihafal.","ex":["play → <b>played</b>","go → <b>went</b>","eat → <b>ate</b>"]},{"s":"Di masa lampau, satpam hanya punya <b>satu seragam: did</b> 🛡️. Setelah did, kata kerja kembali polos (V1), karena \"waktu lampaunya\" sudah ditangani satpam.","ex":["I <b>didn't go</b> to school.","<b>Did</b> you eat?"]}],"quiz":[{"t":"mc","q":"Yesterday, I ___ to the market.","o":["go","went","goed"],"a":1,"why":"Go itu murid bandel: bentuk lampaunya <b>went</b>."},{"t":"type","q":"Ketik bentuk lampau: She ___ (play) tennis last week.","a":["played"],"why":"Kata kerja biasa + -ed = <b>played</b>."},{"t":"order","q":"Susun: \"Dia makan nasi tadi malam.\"","w":["She","ate","rice","last","night"],"a":"She ate rice last night","why":"Eat itu bandel, lampaunya <b>ate</b>."},{"t":"mc","q":"She didn't ___ yesterday.","o":["went","go","goes"],"a":1,"why":"Setelah didn't, kata kerja polos: <b>go</b>."},{"t":"type","q":"Ketik: Did he ___ (watch) the match?","a":["watch"],"why":"Setelah did, kata kerja polos: <b>watch</b>."}],"map":{"c":"PAST TENSE","b":[{"t":"Reguler","k":["+ed","play → played"]},{"t":"Irregular","k":["go → went","eat → ate","see → saw"]},{"t":"Satpam","k":["did + V1","didn't + V1"]},{"t":"Kata kunci","k":["yesterday","last week","ago"]}]},"g":"⏰ Tenses","game":{"e":"📷","t":"Foto Liburan","sc":[["🧑‍✈️","✈️","Kemarin Rudi pergi ke Bali.|Ceritakan fotonya.",["He goed to Bali yesterday.","He went to Bali yesterday.","He go to Bali yesterday."],1,"✈️","slide","go itu bandel: went."],["👧","🏖️","Dia bermain di pantai kemarin.|Ceritakan fotonya.",["She played on the beach yesterday.","She plays on the beach yesterday.","She playing on the beach yesterday."],0,"🏖️","hop","play + ed = played."],["🧑","🍜","Tadi malam dia makan bakso.|Ceritakan fotonya.",["He eated meatballs last night.","He ate meatballs last night.","He eats meatballs last night."],1,"🍜","grow","eat itu bandel: ate."]]}},{"n":"Past Continuous","steps":[{"s":"<b>Past Continuous</b> itu ibarat <b>video yang di-pause di tengah adegan</b> ⏸️: aksi yang <b>sedang berlangsung di masa lalu</b>. Rumus: <b>was/were + V-ing</b>.","ex":["At 8 last night, I <b>was studying</b>.","They <b>were playing</b> when it rained."]},{"s":"Sering dipasangkan dengan Past Simple: aksi panjang ibarat <b>sungai mengalir</b> 🌊 dipotong aksi pendek ibarat <b>batu jatuh</b> 🪨.","ex":["I <b>was cooking</b> when the phone <b>rang</b>.","While she <b>was reading</b>, he <b>slept</b>."],"tip":"<b>While</b> + proses panjang (V-ing), <b>when</b> + kejadian pendek (V2)."}],"quiz":[{"t":"mc","q":"At 7 pm yesterday, I ___ dinner.","o":["was eating","ate","am eating"],"a":0,"why":"Sedang berlangsung di waktu lampau tertentu."},{"t":"mc","q":"I was sleeping when the phone ___.","o":["rang","was ringing","rings"],"a":0,"why":"Batu jatuh = Past Simple."},{"t":"type","q":"Ketik: They ___ (play) football at 4 pm yesterday.","a":["were playing"],"why":"They + were + V-ing."},{"t":"order","q":"Susun: \"Dia sedang membaca ketika aku masuk.\"","w":["She","was","reading","when","I","came","in"],"a":"She was reading when I came in","why":"Sungai (was reading) + batu (came)."}],"map":{"c":"PAST CONTINUOUS","b":[{"t":"⏸️ Rumus","k":["was/were + V-ing"]},{"t":"🌊🪨 Gabungan","k":["sungai = was V-ing","batu = V2"]},{"t":"Penghubung","k":["while","when"]}]},"g":"⏰ Tenses"},{"n":"Future: will & going to","steps":[{"s":"Dua cara bicara masa depan. <b>will</b> = keputusan spontan atau prediksi, <b>ide mendadak</b> 💡. <b>going to</b> = rencana yang sudah disiapkan atau ada bukti, <b>tiket yang sudah dibeli</b> 🎟️.","ex":["The phone is ringing. I <b>will</b> answer it.","I <b>am going to</b> visit Bali next week."]},{"s":"Ringkasan perbedaannya.","ex":[],"tbl":[["","will","going to"],["Analogi","ide mendadak 💡","tiket sudah dibeli 🎟️"],["Rumus","will + V1","am/is/are + going to + V1"],["Untuk","janji, tawaran, prediksi","rencana, bukti terlihat"],["Contoh","I will help you.","Look at those clouds! It is going to rain."]]}],"quiz":[{"t":"mc","q":"Tiba-tiba haus: \"I ___ get some water.\"","o":["will","am going to"],"a":0,"why":"Keputusan mendadak: <b>will</b>."},{"t":"mc","q":"Sudah beli tiket: \"I ___ visit Japan.\"","o":["will","am going to"],"a":1,"why":"Rencana: <b>am going to</b>."},{"t":"mc","q":"Look at the dark clouds! It ___ rain.","o":["will","is going to"],"a":1,"why":"Ada bukti: <b>is going to</b>."},{"t":"type","q":"Ketik: She is going to ___ (study) tonight.","a":["study"],"why":"Going to + V1."},{"t":"order","q":"Susun: \"Aku akan membantumu.\"","w":["I","will","help","you"],"a":"I will help you","why":"will + V1."}],"map":{"c":"FUTURE","b":[{"t":"💡 will","k":["spontan","janji","prediksi"]},{"t":"🎟️ going to","k":["rencana","ada bukti"]},{"t":"Rumus","k":["will + V1","be + going to + V1"]}]},"g":"⏰ Tenses"},{"n":"Present Perfect","steps":[{"s":"<b>Present Perfect</b> itu ibarat <b>jembatan</b> 🌉 yang menyambung masa lalu ke sekarang. Kejadiannya sudah lewat, tapi <b>akibat atau pengalamannya masih terasa</b>. Rumus: <b>have/has + V3</b>.","ex":["I <b>have lost</b> my keys. (sekarang masih hilang)","She <b>has visited</b> Bali. (pengalaman)"]},{"s":"Beda inti dengan Past Simple: waktunya <b>disebut jelas</b> atau <b>masih nyambung ke sekarang</b>?","ex":[],"tbl":[["","Past Simple","Present Perfect"],["Analogi","Foto lama","Jembatan ke sekarang"],["Waktu","jelas (yesterday, in 2020)","tak disebut / sampai sekarang"],["Penanda","ago, last year","already, yet, ever, never"],["Contoh","I ate at 7.","I have eaten already."]],"tip":"Waktu spesifik + Present Perfect ❌. I have seen him yesterday ❌."},{"s":"<b>For</b> = lamanya (durasi), <b>since</b> = titik awal. Ibarat lama perjalanan vs jam keberangkatan 🚆.","ex":["I have lived here <b>for</b> 5 years.","I have lived here <b>since</b> 2021."]}],"quiz":[{"t":"mc","q":"I ___ already eaten.","o":["have","has","had"],"a":0,"why":"I + <b>have</b> + V3."},{"t":"mc","q":"She ___ never been to Japan.","o":["have","has","did"],"a":1,"why":"She + <b>has</b>."},{"t":"type","q":"Ketik V3: He has ___ (see) that movie.","a":["seen"],"why":"see, saw, <b>seen</b>."},{"t":"mc","q":"Pilih yang benar:","o":["I have seen him yesterday.","I saw him yesterday.","I have saw him yesterday."],"a":1,"why":"Ada yesterday, jadi Past Simple."},{"t":"type","q":"Ketik for/since: I have studied English ___ 2020.","a":["since"],"why":"2020 = titik awal: <b>since</b>."}],"map":{"c":"PRESENT PERFECT","b":[{"t":"🌉 Rumus","k":["have/has + V3"]},{"t":"Penanda","k":["already","yet","ever","never"]},{"t":"For / Since","k":["for = durasi","since = titik awal"]},{"t":"⚠️","k":["tanpa yesterday/ago"]}]},"g":"⏰ Tenses"},{"n":"Parts of Speech","g":"🔗 Grammar Rules","steps":[{"s":"Kalimat itu seperti <b>tim sepak bola</b> ⚽. Tiap kata punya posisi: ada pemain (noun), aksi (verb), kostum (adjective), gaya main (adverb).","ex":[],"tbl":[["Kelas kata","Ibarat","Contoh"],["Noun","Pemain","teacher, book, Jakarta"],["Verb","Aksi","run, eat, is"],["Adjective","Kostum","big, happy, red"],["Adverb","Gaya main","quickly, always"],["Pronoun","Pemain pengganti","he, she, they"],["Preposition","Posisi lapangan","in, on, under"],["Conjunction","Tali penyambung","and, but, because"]]},{"s":"Jebakan: kelas kata ditentukan oleh <b>tugasnya di kalimat</b>, bukan katanya. <b>Run</b> bisa jadi verb atau noun, tergantung perannya.","ex":["I <b>run</b> every day. (verb)","I went for a <b>run</b>. (noun)"],"tip":"Adverb sering berakhiran <b>-ly</b> (quickly), tapi tidak selalu (fast, always)."}],"quiz":[{"t":"mc","q":"\"Beautiful\" dalam \"a beautiful flower\" adalah…","o":["noun","adjective","adverb"],"a":1,"why":"Menjelaskan benda: <b>adjective</b>."},{"t":"mc","q":"Kata \"quickly\" termasuk…","o":["adverb","verb","pronoun"],"a":0,"why":"Menjelaskan cara melakukan sesuatu: <b>adverb</b>."},{"t":"type","q":"Ketik kelas kata dari \"teacher\" (awalan n):","a":["noun"],"why":"Nama orang/benda: <b>noun</b>."},{"t":"mc","q":"Pada \"She sings beautifully\", kata \"beautifully\" adalah…","o":["adjective","adverb","noun"],"a":1,"why":"Menjelaskan kata kerja sings: <b>adverb</b>."}],"map":{"c":"PARTS OF SPEECH","b":[{"t":"⚽ Inti","k":["noun","verb"]},{"t":"👕 Penjelas","k":["adjective","adverb"]},{"t":"🔗 Penghubung","k":["preposition","conjunction"]},{"t":"🔁 Pengganti","k":["pronoun"]}]}},{"n":"Have / Has","steps":[{"s":"<b>Have</b> dan <b>has</b> artinya sama: <b>punya</b>. Bedanya hanya soal pemiliknya. Bayangkan <b>kunci rumah</b> 🔑: pemegang kunci tunggal pakai <b>has</b>, sisanya <b>have</b>.","ex":["I <b>have</b> a bike.","She <b>has</b> a bike."]},{"s":"Hanya <b>He / She / It</b> yang berhak pakai <b>has</b>. Nama orang dan benda tunggal juga masuk (Tom, my mother, the cat). Banyak orang tetap <b>have</b>.","ex":["I / You / We / They → <b>have</b>","He / She / It → <b>has</b>","My mother <b>has</b> two cats.","My parents <b>have</b> a car."]},{"s":"Hati-hati! Kalau <b>satpam do/does</b> sudah berdiri di depan, kata kerja di belakangnya <b>kembali polos</b>. Jadi <b>has</b> berubah jadi <b>have</b>.","ex":["She has a pen. → She <b>doesn't have</b> a pen.","Does she <b>have</b> a pen?"]},{"s":"Bonus: <b>have</b> juga berarti <b>melakukan/menikmati</b> sesuatu, bukan cuma punya.","ex":["She <b>has</b> breakfast at 6.","We <b>have</b> a meeting."]}],"quiz":[{"t":"mc","q":"My sister ___ long hair.","o":["have","has","haves"],"a":1,"why":"My sister = She, pemegang kunci tunggal: <b>has</b>."},{"t":"mc","q":"They ___ a new house.","o":["have","has"],"a":0,"why":"They = banyak, pakai <b>have</b>."},{"t":"type","q":"Ketik have/has: The cat ___ a ball.","a":["has"],"why":"The cat = It, jadi <b>has</b>."},{"t":"type","q":"Ketik have/has: Does she ___ a pen?","a":["have"],"why":"Setelah does, kata kerja polos: <b>have</b>."},{"t":"order","q":"Susun: \"Dia punya mobil merah.\"","w":["He","has","a","red","car"],"a":"He has a red car","why":"He pakai <b>has</b>."}],"map":{"c":"HAVE / HAS","b":[{"t":"🔑 Has","k":["He","She","It","nama tunggal"]},{"t":"🔑 Have","k":["I","You","We","They","banyak orang"]},{"t":"🛡️ Setelah do/does","k":["doesn't have","Does she have?"]},{"t":"Bonus","k":["have breakfast","have a meeting"]}]},"g":"🔗 Grammar Rules"},{"n":"Do / Does","steps":[{"s":"<b>Do</b> dan <b>does</b> itu ibarat <b>satpam kalimat</b> 🛡️. Tugasnya menjaga pintu kalimat <b>tanya</b> dan <b>negatif</b>. Tanpa dia, kalimat tidak boleh masuk.","ex":["<b>Do</b> you like tea?","She <b>does</b> not like tea."]},{"s":"Satpam punya dua seragam: <b>does</b> untuk He/She/It, <b>do</b> untuk sisanya. Kalau satpam sudah berdiri, kata kerja utama tidak butuh topi -s lagi (topinya sudah dipakai satpam).","ex":["Does she <b>like</b> tea? ✅","Does she <b>likes</b> tea? ❌"]},{"s":"Rumus: Tanya = <b>Do/Does + subjek + V1</b>. Negatif = <b>subjek + don't/doesn't + V1</b>. Jawaban singkat juga pakai satpam.","ex":["Do they play? → Yes, they <b>do</b>.","Does he work? → No, he <b>doesn't</b>."]},{"s":"Kadang <b>do/does</b> jadi kata kerja utama, artinya <b>mengerjakan</b>.","ex":["He <b>does</b> his homework.","I <b>do</b> yoga every morning."]}],"quiz":[{"t":"mc","q":"___ she like coffee?","o":["Do","Does","Is"],"a":1,"why":"She butuh satpam <b>Does</b>."},{"t":"mc","q":"They ___ not play chess.","o":["do","does","are"],"a":0,"why":"They pakai <b>do</b>."},{"t":"type","q":"Ketik: He doesn't ___ (like/likes) fish.","a":["like"],"why":"Satpam sudah berdiri, kata kerja polos: <b>like</b>."},{"t":"type","q":"Ketik do/does: ___ your parents work here?","a":["do"],"why":"Your parents = They, jadi <b>Do</b>."},{"t":"order","q":"Susun: \"Apakah dia berbicara bahasa Inggris?\"","w":["Does","she","speak","English"],"a":"Does she speak English","why":"Does + subjek + V1."}],"map":{"c":"DO / DOES","b":[{"t":"🛡️ Does","k":["He","She","It"]},{"t":"🛡️ Do","k":["I","You","We","They"]},{"t":"📐 Rumus","k":["Do/Does + S + V1","S + don't/doesn't + V1"]},{"t":"⚠️ Jebakan","k":["does + V-s ❌","does + V1 ✅"]}]},"g":"🔗 Grammar Rules"},{"n":"Go / Goes (-s/-es)","steps":[{"s":"Topi -s untuk He/She/It ternyata punya <b>3 model</b> 🎩 tergantung kata kerjanya. Kenalan satu per satu ya!","ex":["Model biasa: work → <b>works</b>","eat → <b>eats</b>"]},{"s":"Kata kerja berakhiran <b>-o, -s, -sh, -ch, -x, -z</b> itu \"kepalanya besar\", butuh topi besar <b>-es</b>. Jembatan keledai: <b>go-es</b>!","ex":["go → <b>goes</b>","do → <b>does</b>","watch → <b>watches</b>","wash → <b>washes</b>","fix → <b>fixes</b>"]},{"s":"Berakhiran <b>konsonan + y</b>: y \"pindah kamar\" jadi <b>i</b> lalu +es. Tapi <b>vokal + y</b> (play), y-nya santai, cukup +s.","ex":["study → <b>studies</b>","cry → <b>cries</b>","play → <b>plays</b>"]},{"s":"Yang spesial: <b>have</b> berubah total jadi <b>has</b>, bukan \"haves\". Murid bandel yang wajib dihafal!","ex":["have → <b>has</b>"]}],"quiz":[{"t":"mc","q":"He ___ to the gym every Monday.","o":["go","goes","going"],"a":1,"why":"Berakhiran -o, topi besar: <b>goes</b>."},{"t":"mc","q":"She ___ English at night.","o":["study","studys","studies"],"a":2,"why":"Konsonan + y: y jadi i + es = <b>studies</b>."},{"t":"type","q":"Ketik: My brother ___ (watch) TV every night.","a":["watches"],"why":"Berakhiran -ch: <b>watches</b>."},{"t":"type","q":"Ketik: The baby ___ (cry) loudly.","a":["cries"],"why":"Konsonan + y: <b>cries</b>."},{"t":"mc","q":"Pilih bentuk yang benar:","o":["She plays tennis.","She plaies tennis.","She playes tennis."],"a":0,"why":"Vokal + y cukup +s."}],"map":{"c":"TOPI -s / -es","b":[{"t":"🎩 -s","k":["work → works","eat → eats"]},{"t":"🎩 -es","k":["go → goes","watch → watches","fix → fixes"]},{"t":"🎩 y → ies","k":["study → studies","cry → cries"]},{"t":"🎩 vokal + y","k":["play → plays"]},{"t":"⭐ Spesial","k":["have → has"]}]},"g":"🔗 Grammar Rules"},{"n":"Modal: can / must / should","steps":[{"s":"<b>Modal verb</b> itu ibarat <b>tombol remote</b> 🎮 yang mengubah \"mode\" kalimat. Cara pakainya mudah: <b>modal + V1</b>, tanpa topi -s, tanpa to.","ex":["She <b>can swim</b>.","He <b>must go</b>.","You <b>should rest</b>."]},{"s":"Kekuatan tiap tombol berbeda, seperti level volume.","ex":[],"tbl":[["Modal","Arti","Analogi"],["can","bisa / boleh","kemampuan"],["must","wajib","lampu merah"],["should","sebaiknya","saran teman"],["may / might","mungkin","langit mendung"]]},{"s":"Modal itu \"VIP\": tidak butuh topi -s dan tidak butuh <b>do/does</b>. Negatif tinggal tambah <b>not</b>, tanya tinggal pindah ke depan.","ex":["She can swim. ✅","She cans swim. ❌","Can she swim?","He <b>mustn't</b> go."],"tip":"Setelah modal selalu V1 polos: should <b>go</b>, bukan should goes."}],"quiz":[{"t":"mc","q":"She ___ speak three languages.","o":["can","cans","is can"],"a":0,"why":"Modal tanpa -s: <b>can</b>."},{"t":"mc","q":"You ___ stop at a red light.","o":["must","may","can"],"a":0,"why":"Lampu merah = kewajiban: <b>must</b>."},{"t":"mc","q":"Saran teman: You ___ drink more water.","o":["should","must","are"],"a":0,"why":"Saran = <b>should</b>."},{"t":"type","q":"Ketik: He can ___ (swim) very fast.","a":["swim"],"why":"Setelah modal: V1 polos."},{"t":"order","q":"Susun: \"Bisakah dia berenang?\"","w":["Can","she","swim"],"a":"Can she swim","why":"Modal pindah ke depan."}],"map":{"c":"MODAL VERBS","b":[{"t":"🎮 Mode","k":["can = bisa","must = wajib","should = saran","may = mungkin"]},{"t":"Rumus","k":["modal + V1"]},{"t":"VIP","k":["tanpa -s","tanpa do/does"]}]},"g":"🔗 Grammar Rules"},{"n":"Comparative & Superlative","steps":[{"s":"Membandingkan itu ibarat <b>podium lomba</b> 🏆. Dua orang: pakai <b>-er + than</b>. Banyak orang: pakai <b>the -est</b> (juara satu).","ex":["Tom is <b>taller than</b> Ali.","Tom is <b>the tallest</b> in class."]},{"s":"Kata pendek cukup \"ditinggikan\" dengan -er. Kata panjang terlalu berat, jadi dibantu <b>more/most</b>, seperti naik lift.","ex":[],"tbl":[["Jenis kata","Comparative","Superlative"],["Pendek","tall → taller","the tallest"],["Berakhir y","happy → happier","the happiest"],["Panjang","beautiful → more beautiful","the most beautiful"],["Bandel","good → better","the best"]],"tip":"Jangan dobel: more taller ❌ → taller ✅."}],"quiz":[{"t":"mc","q":"Jakarta is ___ than Bandung.","o":["big","bigger","biggest"],"a":1,"why":"Dua kota + than: <b>bigger</b>."},{"t":"mc","q":"She is ___ girl in the class.","o":["the smartest","smarter","more smart"],"a":0,"why":"Juara satu: <b>the smartest</b>."},{"t":"type","q":"Ketik: This book is ___ (good) than that one.","a":["better"],"why":"Good itu bandel: <b>better</b>."},{"t":"mc","q":"The garden is ___ than the house.","o":["more beautiful","beautifuller","most beautiful"],"a":0,"why":"Kata panjang: <b>more</b> + adj."},{"t":"order","q":"Susun: \"Dia lebih tinggi daripada aku.\"","w":["He","is","taller","than","me"],"a":"He is taller than me","why":"-er + than."}],"map":{"c":"COMPARISON","b":[{"t":"🏆 Dua benda","k":["-er + than","more + adj + than"]},{"t":"🥇 Juara satu","k":["the -est","the most + adj"]},{"t":"Bandel","k":["good → better → best","bad → worse → worst"]}]},"g":"🔗 Grammar Rules"},{"n":"Quantifiers: much / many / some / any","steps":[{"s":"Benda ada dua jenis: <b>countable</b> = kelereng 🔵 (bisa dihitung satuan) dan <b>uncountable</b> = air 💧 (hanya bisa ditakar). Kata \"banyak\" harus cocok dengan jenisnya.","ex":["<b>many</b> marbles","<b>much</b> water","<b>a lot of</b> marbles / water (aman untuk keduanya)"]},{"s":"Tabel pilihan cepat.","ex":[],"tbl":[["Kata","Untuk","Contoh"],["many","countable jamak","How many books?"],["much","uncountable","How much water?"],["a few / a little","sedikit (cukup)","a few friends / a little time"],["some","positif","I have some milk."],["any","negatif & tanya","I don't have any milk."]],"tip":"Uncountable: water, rice, money, time, information. Tidak pernah pakai -s!"}],"quiz":[{"t":"mc","q":"How ___ students are there?","o":["many","much"],"a":0,"why":"Students bisa dihitung: <b>many</b>."},{"t":"mc","q":"How ___ money do you have?","o":["many","much"],"a":1,"why":"Money uncountable: <b>much</b>."},{"t":"mc","q":"I don't have ___ time.","o":["some","any"],"a":1,"why":"Negatif: <b>any</b>."},{"t":"type","q":"Ketik a little/a few: She has ___ rice.","a":["a little"],"why":"Rice uncountable: <b>a little</b>."},{"t":"mc","q":"Pilih yang benar:","o":["I need some informations.","I need some information.","I need many information."],"a":1,"why":"Information tidak pakai -s."}],"map":{"c":"QUANTIFIERS","b":[{"t":"🔵 Countable","k":["many","a few","few"]},{"t":"💧 Uncountable","k":["much","a little","little"]},{"t":"Positif / Negatif","k":["some","any"]},{"t":"Aman","k":["a lot of"]}]},"g":"🔗 Grammar Rules"},{"n":"Kata Sambung","steps":[{"s":"Kata sambung itu ibarat <b>kait gerbong kereta</b> 🚂. Dua kalimat pendek digandeng jadi satu rangkaian: <b>and</b> (tambah), <b>but</b> (lawan), <b>so</b> (akibat), <b>because</b> (sebab).","ex":["I like tea <b>and</b> coffee.","I like tea, <b>but</b> not coffee.","It rained, <b>so</b> I stayed home.","I stayed home <b>because</b> it rained."]},{"s":"<b>So</b> dan <b>because</b> itu panah yang arahnya berlawanan. Sebab → <b>so</b> → akibat. Akibat ← <b>because</b> ← sebab.","ex":[],"tip":"Setelah <b>because</b> selalu SEBAB. Setelah <b>so</b> selalu AKIBAT."}],"quiz":[{"t":"mc","q":"I am tired, ___ I go to bed. (akibat)","o":["so","because","but"],"a":0,"why":"Akibat: <b>so</b>."},{"t":"mc","q":"I go to bed ___ I am tired. (sebab)","o":["so","because","but"],"a":1,"why":"Sebab: <b>because</b>."},{"t":"mc","q":"She is smart ___ lazy.","o":["and","but","so"],"a":1,"why":"Berlawanan: <b>but</b>."},{"t":"type","q":"Ketik: I like apples ___ oranges. (dan)","a":["and"],"why":"Menambah: <b>and</b>."},{"t":"order","q":"Susun: \"Aku di rumah karena hujan.\"","w":["I","stayed","home","because","it","rained"],"a":"I stayed home because it rained","why":"Because + sebab."}],"map":{"c":"KATA SAMBUNG 🚂","b":[{"t":"and","k":["menambah"]},{"t":"but","k":["berlawanan"]},{"t":"so","k":["sebab → akibat"]},{"t":"because","k":["akibat ← sebab"]}]},"g":"🔗 Grammar Rules"},{"n":"Kosakata Sehari-hari & Mapel","g":"📚 Kosakata & Reading","steps":[{"s":"Kosakata itu seperti <b>isi tas sekolah</b> 🎒. Dua kantong utamanya: <b>mata pelajaran</b> dan <b>kegiatan sehari-hari</b>.","ex":[],"tbl":[["Mapel","Artinya"],["Mathematics","Matematika"],["Science","IPA"],["Social Studies","IPS"],["Physical Education (PE)","Olahraga"],["Civics","PKn"]]},{"s":"Kegiatan harian: ibarat <b>jadwal</b>. Pasangkan kata kerja dengan bendanya (<b>collocation</b>), seperti memasangkan sendok dengan garpu.","ex":["<b>take</b> a shower, <b>have</b> breakfast","<b>do</b> homework, <b>go</b> to school","<b>make</b> the bed, <b>wash</b> the dishes"]}],"quiz":[{"t":"mc","q":"\"Science\" adalah pelajaran…","o":["IPA","IPS","Olahraga"],"a":0,"why":"Science = <b>IPA</b>."},{"t":"mc","q":"Mana yang natural?","o":["make homework","do homework","take homework"],"a":1,"why":"Pasangan tetapnya: <b>do homework</b>."},{"t":"type","q":"Ketik: I ___ a shower every morning. (take/make)","a":["take"],"why":"Pasangan tetap: <b>take a shower</b>."},{"t":"order","q":"Susun: \"Aku sarapan jam enam.\"","w":["I","have","breakfast","at","six"],"a":"I have breakfast at six","why":"<b>have breakfast</b> = sarapan."}],"map":{"c":"KOSAKATA SEHARI-HARI","b":[{"t":"📘 Mapel","k":["Science","Mathematics","PE"]},{"t":"🗓️ Rutinitas","k":["take a shower","have breakfast","do homework"]}]},"fc":1},{"n":"Reading Skills","steps":[{"s":"Membaca ada dua gaya. <b>Skimming</b> = terbang pakai <b>drone</b> 🚁, lihat gambaran besar. <b>Scanning</b> = pakai <b>kaca pembesar</b> 🔍, cari satu detail (angka, nama).","ex":[]},{"s":"Coba bacaan singkat ini. Terbangkan drone dulu: <b>apa ide utamanya?</b>","ex":["<i>Many students feel tired in class. Experts say the main cause is lack of sleep. Teenagers need 8 to 10 hours, but most sleep only 6. Going to bed earlier and avoiding phones at night can help.</i>"],"tip":"Ide utama biasanya ada di <b>kalimat pertama atau terakhir</b> paragraf."},{"s":"Tiga jenis soal: <b>main idea</b> (drone), <b>detail</b> (kaca pembesar), dan <b>inference</b> (menyimpulkan yang tersirat, ibarat detektif membaca jejak 🕵️).","ex":[]}],"quiz":[{"t":"mc","q":"Ide utama bacaan tadi?","o":["Remaja kurang tidur dan itu membuat lelah","Ponsel itu berbahaya","Sekolah harus mulai lebih pagi"],"a":0,"why":"Main idea: kurang tidur → lelah."},{"t":"mc","q":"Berapa jam tidur yang dibutuhkan remaja?","o":["6 jam","8 sampai 10 jam","12 jam"],"a":1,"why":"Detail, cari dengan scanning."},{"t":"mc","q":"Solusi yang disarankan?","o":["Tidur lebih awal & hindari ponsel malam hari","Minum kopi","Tidur siang"],"a":0,"why":"Kalimat terakhir bacaan."},{"t":"mc","q":"Inference: kebanyakan remaja…","o":["cukup tidur","kurang tidur","tidur 10 jam"],"a":1,"why":"Mereka tidur 6 jam, padahal butuh 8 sampai 10."},{"t":"mc","q":"Mencari angka \"8 to 10\" disebut…","o":["Skimming","Scanning"],"a":1,"why":"Mencari detail = scanning."}],"map":{"c":"READING SKILLS","b":[{"t":"🚁 Skimming","k":["ide utama","judul","kalimat pertama"]},{"t":"🔍 Scanning","k":["angka","nama","detail"]},{"t":"🕵️ Inference","k":["tersirat","simpulkan dari jejak"]}]},"g":"📚 Kosakata & Reading"},{"n":"Peta 13 Jenis Teks","g":"📖 Jenis Teks","fc":1,"steps":[{"s":"13 jenis teks itu ibarat <b>rak-rak perpustakaan</b> 📚: tiap rak punya label tujuan sendiri. Kenali <b>tujuan</b>, <b>struktur</b>, dan <b>tense</b>-nya, maka teks apa pun mudah dikenali.","ex":[],"tbl":[["Teks","Tujuan","Struktur","Tense"],["Descriptive","Menggambarkan orang/benda/tempat","Identification → Description","Present"],["Procedure","Cara melakukan sesuatu","Goal → Materials → Steps","Present (perintah)"],["Report","Melaporkan hasil observasi","General classification → Description","Present"],["Narrative","Menceritakan cerita","Orientation → Complication → Resolution","Past"],["Recount","Menceritakan ulang kejadian lampau","Orientation → Events → Re-orientation","Past"],["News Item","Melaporkan peristiwa terkini","Newsworthy event → Background → Sources","Past"],["Discussion","Membahas dua sisi isu","Issue → Pro & Con → Conclusion","Present"]]},{"s":"Sisa rak-nya ada enam lagi. Perhatikan: <b>Report</b> dan <b>Explanation</b> sering tertukar, bedanya Report menjelaskan <i>apa itu</i>, Explanation menjelaskan <i>bagaimana/mengapa terjadi</i>.","ex":[],"tbl":[["Teks","Tujuan","Struktur","Tense"],["Explanation","Menjelaskan proses/fenomena","General statement → Sequenced explanation","Present"],["Analytical Exposition","Meyakinkan lewat argumen","Thesis → Arguments → Reiteration","Present"],["Announcement","Mengumumkan acara","Acara, waktu, tempat, kontak","Present / Future"],["Review","Menilai produk/jasa","Orientation → Evaluation → Summary","Present"],["Advertisement","Mempromosikan produk/jasa","Headline → Description → Slogan","Present"],["Spoof","Humor/satire","Orientation → Events → Twist","Past"]],"tip":"Tebak teks dengan 3 pertanyaan: <b>untuk apa</b> ditulis, <b>bagaimana</b> urutannya, <b>tense</b> apa yang dipakai."}],"quiz":[{"t":"mc","q":"\"The school will hold a bazaar on Friday at 9 a.m. in the hall.\" termasuk…","o":["Announcement","Report","Spoof"],"a":0,"why":"Ada acara, waktu, dan tempat: <b>Announcement</b>."},{"t":"mc","q":"\"Buy now! The lightest laptop for busy people!\" termasuk…","o":["Advertisement","Procedure","Recount"],"a":0,"why":"Mengajak membeli: <b>Advertisement</b>."},{"t":"mc","q":"Teks yang meyakinkan pembaca lewat thesis dan argumen…","o":["Analytical Exposition","Descriptive","News Item"],"a":0,"why":"Thesis → Arguments → Reiteration."},{"t":"mc","q":"Struktur \"Orientation → Complication → Resolution\" milik…","o":["Narrative","Report","Explanation"],"a":0,"why":"Cerita punya masalah dan penyelesaian: <b>Narrative</b>."},{"t":"mc","q":"Teks yang membahas dua sisi suatu isu…","o":["Discussion","Review","Spoof"],"a":0,"why":"Pro dan kontra: <b>Discussion</b>."},{"t":"mc","q":"Teks yang berakhir dengan kejutan lucu…","o":["Spoof","Procedure","Report"],"a":0,"why":"Twist lucu: <b>Spoof</b>."},{"t":"type","q":"Ketik jenis teks yang menilai produk/jasa (awalan r):","a":["review"],"why":"Menilai = <b>Review</b>."},{"t":"mc","q":"\"Today, a fire destroyed a market in Bandung...\" termasuk…","o":["News Item","Recount","Narrative"],"a":0,"why":"Peristiwa terkini: <b>News Item</b>."}],"map":{"c":"PETA 13 TEKS","b":[{"t":"🔍 Menggambarkan","k":["Descriptive","Report","Explanation","Procedure"]},{"t":"📖 Bercerita","k":["Narrative","Recount","News Item","Spoof"]},{"t":"⚖️ Berargumen","k":["Discussion","Analytical Exposition","Review"]},{"t":"📣 Mengajak & memberi info","k":["Announcement","Advertisement"]}]}},{"n":"Teks Faktual: Report, News Item, Explanation","g":"📖 Jenis Teks","steps":[{"s":"<b>Report</b> itu ibarat <b>papan info di kebun binatang</b> 🐘: fakta umum tentang satu kelompok. Struktur: <b>General classification</b> (apa itu) lalu <b>Description</b> (ciri). Tense: Present.","ex":["<b>Elephants</b> are large mammals.","They have long trunks and big ears."]},{"s":"<b>News Item</b> itu ibarat <b>siaran berita jam 7</b> 📺: peristiwa terkini yang penting. Struktur: <b>Newsworthy event</b>, <b>Background events</b>, <b>Sources</b> (kutipan narasumber). Tense: Past.","ex":["A fire destroyed a market in Bandung yesterday.","Firefighters said the fire started at 2 a.m."]},{"s":"<b>Explanation</b> itu ibarat <b>tutorial kenapa hujan turun</b> 🌧️: menjelaskan proses atau sebab-akibat. Struktur: <b>General statement</b> lalu <b>Sequenced explanation</b>, dengan kata <b>first, then, because, so</b>.","ex":["Rain forms when water vapor cools and becomes clouds.","<b>First</b>, water evaporates. <b>Then</b>, it forms clouds."],"tbl":[["","Report","News Item","Explanation"],["Fokus","Satu kelompok benda","Peristiwa terkini","Proses / sebab-akibat"],["Tense","Present","Past","Present"],["Ciri","Fakta umum","Kutipan narasumber","Urutan + sebab"]]}],"quiz":[{"t":"mc","q":"\"Elephants are mammals. They have long trunks.\" termasuk…","o":["Report","News Item","Narrative"],"a":0,"why":"Fakta umum tentang satu kelompok: <b>Report</b>."},{"t":"mc","q":"\"Firefighters said the fire started at 2 a.m.\" adalah bagian…","o":["News Item (Sources)","Report","Procedure"],"a":0,"why":"Kutipan narasumber: <b>Sources</b>."},{"t":"mc","q":"Teks dengan kata first, then, because biasanya…","o":["Explanation","Spoof","Announcement"],"a":0,"why":"Menjelaskan urutan dan sebab: <b>Explanation</b>."},{"t":"type","q":"Ketik tense News Item (awalan p, 4 huruf):","a":["past"],"why":"Peristiwa sudah terjadi: <b>Past</b>."},{"t":"order","q":"Susun: \"Gajah punya belalai panjang.\"","w":["Elephants","have","long","trunks"],"a":"Elephants have long trunks","why":"Report memakai Present."},{"t":"mc","q":"Report vs Explanation: Explanation menjelaskan…","o":["Bagaimana/mengapa sesuatu terjadi","Apa itu sesuatu","Cara membuat sesuatu"],"a":0,"why":"Explanation = proses dan sebab."}],"map":{"c":"TEKS FAKTUAL","b":[{"t":"🐘 Report","k":["General classification","Description","Present"]},{"t":"📺 News Item","k":["Newsworthy event","Background","Sources","Past"]},{"t":"🌧️ Explanation","k":["General statement","Sequenced explanation","first, then, because"]}]}},{"n":"Teks Penilaian & Promosi: Review, Advertisement, Spoof","g":"📖 Jenis Teks","steps":[{"s":"<b>Review</b> itu ibarat <b>ulasan kafe di aplikasi</b> ⭐: ada gambaran tempat, penilaian plus-minus, lalu rekomendasi. Struktur: <b>Orientation → Evaluation → Summary</b>.","ex":["The Green Cafe is a cozy place near my school.","The coffee is delicious, but the service is slow.","Overall, I <b>recommend</b> it."]},{"s":"<b>Advertisement</b> itu ibarat <b>baliho di pinggir jalan</b> 📣: harus menarik dalam sekejap. Struktur: <b>Headline → Product description → Slogan</b>. Banyak kata sifat dan kalimat ajakan.","ex":["<b>Fresh Juice!</b> Cold, sweet, and healthy.","<b>Try it today!</b>"]},{"s":"<b>Spoof</b> itu ibarat <b>lawakan dengan plot twist</b> 🎭: cerita berjalan biasa, lalu diakhiri kejutan lucu. Struktur: <b>Orientation → Events → Twist</b>. Tense: Past.","ex":["A man shouted, \"Thief!\" Everyone ran.","It was only his cat stealing fish."]}],"quiz":[{"t":"mc","q":"\"The coffee is delicious, but the service is slow. I recommend it.\" termasuk…","o":["Review","Advertisement","Spoof"],"a":0,"why":"Ada penilaian dan rekomendasi: <b>Review</b>."},{"t":"mc","q":"\"Try it today! Cold, sweet, and healthy!\" termasuk…","o":["Advertisement","Review","Report"],"a":0,"why":"Mengajak membeli: <b>Advertisement</b>."},{"t":"mc","q":"Ciri khas Spoof…","o":["Ada kejutan (twist) yang lucu","Berisi langkah-langkah","Berisi data riset"],"a":0,"why":"Spoof diakhiri <b>twist</b>."},{"t":"type","q":"Ketik bagian akhir Review (awalan s): Orientation, Evaluation, ___","a":["summary"],"why":"Penutup Review: <b>Summary</b>."},{"t":"mc","q":"Slogan biasanya ada di…","o":["Advertisement","Review","Report"],"a":0,"why":"Slogan = penutup iklan."},{"t":"order","q":"Susun: \"Saya merekomendasikan kafe ini.\"","w":["I","recommend","this","cafe"],"a":"I recommend this cafe","why":"Pelaku + recommend + objek."}],"map":{"c":"REVIEW · IKLAN · SPOOF","b":[{"t":"⭐ Review","k":["Orientation","Evaluation","Summary"]},{"t":"📣 Advertisement","k":["Headline","Description","Slogan"]},{"t":"🎭 Spoof","k":["Orientation","Events","Twist"]}]}},{"n":"Percakapan Dasar","g":"🗣️ Basic Conversation","steps":[{"s":"Percakapan itu seperti <b>main tenis</b> 🎾: satu orang memukul bola (bertanya), lawan <b>wajib memukul balik</b> (menjawab). Hafalkan pasangan pukul-baliknya.","ex":[],"tbl":[["Situasi","Pukulan","Balasan"],["Menyapa","How are you?","I'm fine, thanks. And you?"],["Berkenalan","Nice to meet you.","Nice to meet you too."],["Minta tolong","Could you help me?","Sure, no problem."],["Berterima kasih","Thank you.","You're welcome."],["Minta maaf","I'm sorry.","That's okay."]]},{"s":"Kalau tidak dengar atau tidak paham, jangan diam. Pakai <b>jurus penyelamat</b> ini:","ex":["Sorry, could you <b>repeat</b> that?","Could you <b>speak more slowly</b>, please?","What does <b>\"…\"</b> mean?"]}],"quiz":[{"t":"mc","q":"\"Thank you very much.\" Balasan yang pas?","o":["You're welcome.","I'm sorry.","Nice to meet you."],"a":0,"why":"Dibalas dengan <b>You're welcome</b>."},{"t":"mc","q":"Kamu tidak dengar ucapan lawan bicara. Kamu bilang…","o":["Could you repeat that?","See you later.","I'm fine."],"a":0,"why":"Minta diulang: <b>Could you repeat that?</b>"},{"t":"type","q":"Ketik: A: How are you? B: Fine, thanks. ___ you?","a":["and"],"why":"Bola dipukul balik: <b>And</b> you?"},{"t":"order","q":"Susun: \"Senang bertemu denganmu.\"","w":["Nice","to","meet","you"],"a":"Nice to meet you","why":"Ungkapan baku saat berkenalan."},{"t":"listen","say":"Could you repeat that, please?","q":"Orang ini sedang…","o":["Minta diulang","Berterima kasih","Menyapa"],"a":0,"why":"<b>Repeat</b> = mengulang.","wr":["","Berterima kasih pakai thank you.","Menyapa pakai hello atau how are you."]}],"map":{"c":"PERCAKAPAN DASAR","b":[{"t":"🎾 Sapaan","k":["How are you?","Nice to meet you"]},{"t":"🙏 Sopan santun","k":["Thank you","Sorry","Could you…?"]},{"t":"🆘 Penyelamat","k":["repeat that","speak slowly"]}]},"fc":1,"game":{"e":"☕","t":"Ngobrol di Kafe","sc":[["🧑‍🦰","☕","Kamu bertemu orang baru di kafe.|Apa kata pertamamu?",["Nice to meet you.","See you later.","You're welcome."],0,"🤝","hop","Berkenalan: Nice to meet you."],["🧑‍🦱","🗣️","Kamu tidak dengar apa yang dia bilang.|Apa yang kamu ucapkan?",["Could you repeat that, please?","Thank you very much.","I'm sorry, goodbye."],0,"👂","wiggle","Minta diulang: Could you repeat that?"],["🧑‍🦰","🎁","Dia memberimu hadiah.|Apa yang kamu ucapkan?",["Thank you so much!","Nice to meet you.","Could you help me?"],0,"🎁","spin","Menerima hadiah: Thank you."]]}}]},{"id":"sma","name":"Level SMA","tag":"Menengah","emoji":"🌳","mods":[{"n":"Conditional Type 1","steps":[{"s":"<b>Conditional</b> itu ibarat <b>sakelar lampu</b> 💡. Kalau sakelar ditekan (<b>If</b>), lampu menyala (<b>will</b>). Dipakai untuk kemungkinan nyata di masa depan.","ex":["If it rains, I <b>will stay</b> home."]},{"s":"Rumus: <b>If + Present</b>, lalu <b>will + Verb 1</b>. Jangan taruh \"will\" di sisi sakelar ya!","ex":["If you study, you <b>will pass</b>."]},{"s":"Ada seri sakelar lain. <b>Type 0</b>: fakta ilmiah (If + present, present). <b>Type 2</b>: khayalan, <b>If + past, would + V1</b>, ibarat \"andai lampunya ada\".","ex":["If you heat ice, it <b>melts</b>. (Type 0)","If I <b>were</b> rich, I <b>would travel</b>. (Type 2)"]},{"s":"<b>Unless</b> itu sakelar yang dibalik: <b>unless = if … not</b>. Setelah unless, kalimat tidak perlu negatif lagi.","ex":["Unless you study, you will fail.","= If you <b>don't</b> study, you will fail."],"tip":"Jangan tulis \"unless you don't\". Itu negatif ganda!"}],"quiz":[{"t":"mc","q":"If it rains, we ___ at home.","o":["stay","stayed","will stay"],"a":2,"why":"Hasilnya (lampu menyala) pakai <b>will + V1</b>."},{"t":"type","q":"Ketik: If he ___ (come), I will call him.","a":["comes"],"why":"Sisi sakelar pakai Present, dan he butuh topi: <b>comes</b>."},{"t":"order","q":"Susun kalimatnya:","w":["If","you","study","you","will","pass"],"a":"If you study you will pass","why":"If + Present dulu, baru will + V1."},{"t":"mc","q":"If I ___ a bird, I would fly.","o":["am","were","will be"],"a":1,"why":"Khayalan pakai past: <b>were</b>."},{"t":"mc","q":"If you heat ice, it ___.","o":["melts","would melt","melted"],"a":0,"why":"Fakta ilmiah: present + present."},{"t":"mc","q":"Unless you hurry, you ___ late.","o":["will be","won't be","are"],"a":0,"why":"Unless = if you don't hurry, hasilnya tetap positif: will be."},{"t":"type","q":"Ketik if/unless: ___ it rains, we will go out.","a":["unless"],"why":"Maknanya \"kalau tidak hujan\": <b>unless</b>."}],"map":{"c":"CONDITIONAL","b":[{"t":"Type 0 (fakta)","k":["If + present, present"]},{"t":"Type 1 (mungkin)","k":["If + present, will + V1"]},{"t":"Type 2 (khayalan)","k":["If + past, would + V1"]},{"t":"Unless","k":["= if … not","tanpa negatif ganda"]}]},"g":"🧠 Advanced Grammar","game":{"e":"💡","t":"Sakelar Lampu","sc":[["🧑‍💻","☔","Langit mendung. Kalau hujan, Budi akan membawa payung.|Susun rencana Budi.",["If it rains, I will take an umbrella.","If it will rain, I take an umbrella.","If it rained, I will take an umbrella."],0,"☂️","hop","If + Present, will + V1."],["🧑‍🎓","📚","Kalau Dina belajar, dia akan lulus.|Susun kalimatnya.",["If she studies, she will pass.","If she will study, she passes.","If she studied, she will pass."],0,"🎓","grow","Sisi sakelar pakai Present (studies), hasil pakai will + V1."],["🥱","🌙","Kalau kamu begadang, kamu akan mengantuk.|Beri peringatan.",["If you stay up late, you will be sleepy.","If you will stay up late, you are sleepy.","If you stayed up late, you will sleepy."],0,"🥱","wiggle","If + Present (stay), will + be + sleepy."]]}},{"n":"Reported Speech","steps":[{"s":"<b>Reported speech</b> itu ibarat <b>menceritakan ulang omongan orang</b> 🗣️. Karena sudah lewat, waktunya <b>mundur satu langkah</b>: present jadi past, will jadi would.","ex":["\"I <b>am</b> tired,\" she said.","→ She said (that) she <b>was</b> tired."]},{"s":"Ini <b>tabel mundur satu langkah</b>. Kata penunjuk waktu dan tempat juga ikut bergeser.","ex":[],"tbl":[["Langsung","Tidak langsung"],["am / is / are","was / were"],["play / plays","played"],["will","would"],["can","could"],["now / today","then / that day"],["here","there"]],"tip":"Pronoun ikut berubah: \"I\" menjadi he/she sesuai pembicaranya."}],"quiz":[{"t":"mc","q":"\"I am hungry,\" he said. → He said he ___ hungry.","o":["was","is","will be"],"a":0,"why":"Am mundur jadi <b>was</b>."},{"t":"mc","q":"\"I will help,\" she said. → She said she ___ help.","o":["would","will","can"],"a":0,"why":"Will mundur jadi <b>would</b>."},{"t":"type","q":"Ketik: \"I can swim,\" Tom said. → Tom said he ___ swim.","a":["could"],"why":"Can mundur jadi <b>could</b>."},{"t":"mc","q":"\"We play football,\" they said. → They said they ___ football.","o":["played","play","plays"],"a":0,"why":"Present mundur jadi past."},{"t":"order","q":"Susun: \"Dia bilang dia lelah.\"","w":["She","said","she","was","tired"],"a":"She said she was tired","why":"Was = mundur dari is."}],"map":{"c":"REPORTED SPEECH","b":[{"t":"⏪ Mundur","k":["am/is → was","play → played","will → would","can → could"]},{"t":"Ikut bergeser","k":["now → then","here → there","I → he/she"]}]},"g":"🧠 Advanced Grammar"},{"n":"Passive Voice","steps":[{"s":"Bayangkan kalimat itu panggung teater 🎭. Di <b>Active Voice</b>, lampu sorot menyorot <b>si pelaku</b> sebagai pemeran utama.","ex":["Mom <b>made</b> the cake."]},{"s":"Di <b>Passive Voice</b>, lampu sorot pindah ke <b>bendanya</b>. Si pelaku jadi kru di balik layar (boleh disebut pakai <b>by</b>, boleh juga tidak). Rumusnya: <b>be + Verb 3</b>.","ex":["The cake <b>was made</b> by Mom.","English <b>is spoken</b> in many countries."]},{"s":"\"be\"-nya mengikuti waktu: sekarang pakai <b>is/are</b>, lampau pakai <b>was/were</b>. Verb-nya selalu bentuk ke-3 (V3).","ex":["The window <b>was broken</b> yesterday.","Rice <b>is grown</b> in Indonesia."]},{"s":"Resepnya sama di semua waktu: <b>be</b> disesuaikan waktu + <b>V3</b>. Masa depan pakai <b>will be</b> + V3.","ex":["The letter <b>will be sent</b> tomorrow.","The room <b>is being cleaned</b> now."]},{"s":"Ini <b>tabel pindah lampu sorot</b> untuk 4 tense. Polanya selalu sama: <b>be</b> disesuaikan waktu + <b>V3</b>.","ex":[],"tbl":[["Tense","Active","Passive"],["Present","writes","is written"],["Past","wrote","was written"],["Future","will write","will be written"],["Present perfect","has written","has been written"]],"tip":"Cek V3-nya dulu (write, wrote, <b>written</b>), baru pilih be-nya."}],"quiz":[{"q":"The cake ___ by my mother yesterday.","o":["is made","was made","was make","made"],"a":1,"why":"Kejadian kemarin = lampau, jadi <b>was</b> + V3 (made)."},{"q":"English ___ in many countries.","o":["speaks","was speak","is spoken","are speaking"],"a":2,"why":"Fakta umum yang bendanya jadi sorotan: <b>is spoken</b> (is + V3)."},{"q":"Ubah ke passive: <i>They built this bridge in 1990.</i>","o":["This bridge is built in 1990.","This bridge was built in 1990.","This bridge built in 1990.","This bridge were built in 1990."],"a":1,"why":"Bridge itu satu benda dan terjadi di masa lalu: <b>was built</b>."},{"t":"mc","q":"The report ___ tomorrow.","o":["will be finished","was finished","finishes"],"a":0,"why":"Besok = masa depan: <b>will be</b> + V3."},{"t":"type","q":"Ketik V3 dari write: The book was ___ by him.","a":["written"],"why":"write, wrote, <b>written</b>."},{"t":"mc","q":"The problem has ___ solved.","o":["be","been","being"],"a":1,"why":"Present perfect passive: has <b>been</b> + V3."},{"t":"type","q":"Ketik V3: The letter will be ___ (send) tomorrow.","a":["sent"],"why":"send, sent, <b>sent</b>."}],"map":{"c":"PASSIVE VOICE","b":[{"t":"Rumus","k":["Object + be + V3","(+ by pelaku)"]},{"t":"Be per waktu","k":["is/are","was/were","will be"]},{"t":"Analogi","k":["lampu sorot pindah ke benda"]},{"t":"4 tense","k":["is written","was written","will be written","has been written"]}]},"g":"🧠 Advanced Grammar"},{"n":"Relative Clauses","steps":[{"s":"<b>Relative clause</b> itu ibarat <b>kait</b> 🪝 yang menggandeng kalimat tambahan ke sebuah benda, jadi dua kalimat pendek menyatu menjadi satu kalimat kompleks yang elegan.","ex":["I have a friend. + She lives in Bali.","→ I have a friend <b>who</b> lives in Bali."]},{"s":"Pilih kaitnya sesuai yang digandeng.","ex":[],"tbl":[["Kait","Untuk","Contoh"],["who","orang","The girl who sings is my sister."],["which","benda / hewan","The book which I read was long."],["whose","kepemilikan","The man whose car was stolen is angry."],["that","orang / benda (defining)","The song that I like is old."]]},{"s":"Ada dua jenis. <b>Defining</b>: info penting, tanpa koma. <b>Non-defining</b>: info tambahan, diapit <b>koma</b> seperti kurung opsional, dan <b>tidak boleh pakai that</b>.","ex":["The student <b>who</b> won is my friend. (penting)","Jakarta, <b>which</b> is huge, is busy. (tambahan)"],"tip":"Non-defining: koma + who/which saja. \"that\" dilarang!"}],"quiz":[{"t":"mc","q":"The woman ___ lives next door is a doctor.","o":["who","which","whose"],"a":0,"why":"Orang: <b>who</b>."},{"t":"mc","q":"This is the laptop ___ I bought yesterday.","o":["who","which","whose"],"a":1,"why":"Benda: <b>which</b>."},{"t":"type","q":"Ketik: The boy ___ bike was stolen is crying.","a":["whose"],"why":"Sepedanya milik si anak: <b>whose</b>."},{"t":"mc","q":"Pilih yang benar:","o":["Bali, that is beautiful, is popular.","Bali, which is beautiful, is popular.","Bali which, is beautiful is popular."],"a":1,"why":"Non-defining: koma + which, bukan that."},{"t":"type","q":"Ketik who/which: The car ___ I drive is old.","a":["which","that"],"why":"Benda: <b>which</b> (atau that)."},{"t":"order","q":"Susun: \"Pria yang tinggal di sana adalah paman saya.\"","w":["The","man","who","lives","there","is","my","uncle"],"a":"The man who lives there is my uncle","why":"Kait who menggandeng klausa ke man."}],"map":{"c":"RELATIVE CLAUSES","b":[{"t":"🪝 Kait","k":["who → orang","which → benda","whose → milik","that → orang/benda"]},{"t":"Defining","k":["info penting","tanpa koma"]},{"t":"Non-defining","k":["pakai koma","tanpa that"]}]},"g":"🧠 Advanced Grammar"},{"n":"Gerund vs Infinitive","steps":[{"s":"Dua kata kerja berurutan bikin pusing: <b>enjoy to swim</b> atau <b>enjoy swimming</b>? Analogi: <b>V-ing</b> = aktivitas yang dinikmati, seperti menonton rekaman 📼. <b>to + V</b> = <b>anak panah</b> 🏹 menuju tujuan.","ex":["I enjoy <b>swimming</b>. (kegiatan)","I want <b>to swim</b>. (tujuan)"]},{"s":"Hafalkan dari \"kepribadiannya\": kata kerja <b>menikmati atau menghindari</b> cenderung V-ing, kata kerja <b>bercita-cita</b> cenderung to V.","ex":[],"tbl":[["V-ing 📼","to + V 🏹"],["enjoy, finish, avoid, mind","want, need, decide, hope"],["keep, suggest, consider","plan, agree, promise, refuse"],["practice, quit, imagine","learn, manage, afford, expect"]],"tip":"Setelah preposisi selalu V-ing: interested <b>in learning</b>."},{"s":"Ada yang <b>berubah arti</b>: <b>stop</b>. Stop V-ing = berhenti melakukan. Stop to V = berhenti untuk melakukan sesuatu.","ex":["He stopped <b>smoking</b>. (berhenti merokok)","He stopped <b>to smoke</b>. (berhenti untuk merokok)"]}],"quiz":[{"t":"mc","q":"She enjoys ___ novels.","o":["reading","to read","read"],"a":0,"why":"Enjoy → V-ing."},{"t":"mc","q":"He decided ___ abroad.","o":["studying","to study","study"],"a":1,"why":"Decide → to V (tujuan)."},{"t":"type","q":"Ketik: I am interested in ___ (learn) French.","a":["learning"],"why":"Setelah preposisi: V-ing."},{"t":"mc","q":"Pilih yang benar:","o":["I avoid to eat sugar.","I avoid eating sugar.","I avoid eat sugar."],"a":1,"why":"Avoid → V-ing."},{"t":"mc","q":"She stopped ___ a coffee on her way. (berhenti untuk membeli)","o":["to buy","buying"],"a":0,"why":"Stop to V = berhenti untuk melakukan."}],"map":{"c":"GERUND vs INFINITIVE","b":[{"t":"📼 V-ing","k":["enjoy","finish","avoid","keep","mind"]},{"t":"🏹 to + V","k":["want","need","decide","hope","plan"]},{"t":"Setelah preposisi","k":["in learning","of going"]},{"t":"Beda arti","k":["stop smoking","stop to smoke"]}]},"g":"🧠 Advanced Grammar"},{"n":"Present Perfect Continuous","steps":[{"s":"<b>Present Perfect Continuous</b> itu <b>jembatan + video</b> 🌉🎥: aktivitas yang mulai di masa lalu, masih berjalan (atau baru selesai), dan <b>durasinya yang disorot</b>. Rumus: <b>have/has been + V-ing</b>.","ex":["I <b>have been studying</b> for 3 hours.","It <b>has been raining</b> since morning."]},{"s":"Beda halus dengan Present Perfect: sorot <b>hasil</b> atau sorot <b>proses</b>?","ex":[],"tbl":[["","Present Perfect","Pres. Perf. Continuous"],["Fokus","hasil / pengalaman","proses / durasi"],["Contoh","I have painted the room.","I have been painting all day."],["Petunjuk","ever, already, yet","for, since, all day, lately"]],"tip":"Hasil = Perfect. Proses = Perfect Continuous."}],"quiz":[{"t":"mc","q":"She is tired. She ___ for hours.","o":["has been running","is running","ran"],"a":0,"why":"Proses panjang sampai sekarang."},{"t":"mc","q":"I ___ the report. Here it is! (hasil)","o":["have finished","have been finishing"],"a":0,"why":"Hasil yang disorot: Perfect."},{"t":"type","q":"Ketik: It has been ___ (rain) since morning.","a":["raining"],"why":"been + V-ing."},{"t":"mc","q":"\"for three hours\" cocok dengan…","o":["Present Perfect Continuous","Past Simple","Future Simple"],"a":0,"why":"Durasi sampai sekarang."}],"map":{"c":"PRES. PERF. CONT.","b":[{"t":"🌉🎥 Rumus","k":["have/has been + V-ing"]},{"t":"Fokus","k":["proses","durasi"]},{"t":"Penanda","k":["for","since","all day","lately"]}]},"g":"⏰ Tenses Lanjutan"},{"n":"Past Perfect","steps":[{"s":"<b>Past Perfect</b> itu ibarat <b>flashback dalam film</b> 🎞️: dari dua kejadian lampau, yang <b>terjadi lebih dulu</b> memakai <b>had + V3</b>. Yang belakangan tetap Past Simple.","ex":["When I arrived, the film <b>had started</b>.","She <b>had finished</b> before he called."]},{"s":"Urutan waktunya seperti <b>dua anak tangga</b> 🪜: bawah = lebih dulu (had + V3), atas = kemudian (V2). Penanda: <b>before, after, by the time, already</b>.","ex":["By the time we arrived, they <b>had left</b>.","After he <b>had eaten</b>, he went out."],"tip":"Past Perfect butuh pasangan. Satu kejadian lampau saja cukup Past Simple."}],"quiz":[{"t":"mc","q":"When I arrived, the bus ___.","o":["had left","left","leaves"],"a":0,"why":"Bus berangkat lebih dulu: had + V3."},{"t":"mc","q":"Rumus Past Perfect:","o":["had + V3","was + V-ing","have + V3"],"a":0,"why":"had + V3."},{"t":"type","q":"Ketik V3: She had ___ (eat) before I came.","a":["eaten"],"why":"eat, ate, <b>eaten</b>."},{"t":"order","q":"Susun: \"Dia sudah pergi sebelum aku tiba.\"","w":["She","had","left","before","I","arrived"],"a":"She had left before I arrived","why":"Had left = lebih dulu."}],"map":{"c":"PAST PERFECT","b":[{"t":"🎞️ Rumus","k":["had + V3"]},{"t":"🪜 Urutan","k":["had V3 = lebih dulu","V2 = kemudian"]},{"t":"Penanda","k":["before","after","by the time","already"]}]},"g":"⏰ Tenses Lanjutan"},{"n":"Past Perfect Continuous","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Past Perfect Continuous</b> itu ibarat <b>rekaman video yang sudah berjalan lama</b> 🎥 sebelum kejadian lampau lain muncul. Fokusnya <b>durasi</b>. Rumus: <b>had been + V-ing</b>.","ex":["She <b>had been waiting</b> for two hours when the bus arrived.","They <b>had been studying</b> before the power went out."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + had been + V-ing","He had been working."],["Negatif","S + hadn't been + V-ing","He hadn't been working."],["Tanya","Had + S + been + V-ing?","Had he been working?"]],"tip":"Penanda: <b>for, since, before, by the time</b>. Kejadian yang lebih dulu pakai <b>had been</b>, yang menyusul pakai Past Simple."}]
