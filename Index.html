nya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + would + V1","They would help."],["Negatif","S + wouldn't + V1","They wouldn't help."],["Tanya","Would + S + V1?","Would they help?"]],"tip":"Jangan tertukar: <b>will</b> = rencana dilihat dari sekarang, <b>would</b> = rencana dilihat dari masa lalu. He says he <b>will</b> come → He said he <b>would</b> come."}],"quiz":[{"t":"mc","q":"She said she ___ call me.","o":["would","will","is"],"a":0,"why":"Dilaporkan dari masa lalu (said): <b>would</b>."},{"t":"mc","q":"He says, \"I will help.\" → He said he ___ help.","o":["would","will","did"],"a":0,"why":"will bergeser jadi <b>would</b>."},{"t":"type","q":"Ketik will/would: I knew they ___ win.","a":["would"],"why":"Knew = lampau, jadi <b>would</b>."},{"t":"order","q":"Susun: \"Dia bilang akan datang.\"","w":["He","said","he","would","come"],"a":"He said he would come","why":"said + would + V1."},{"t":"mc","q":"Fungsi would di Past Future?","o":["Masa depan dilihat dari masa lalu","Kebiasaan sekarang","Perintah"],"a":0,"why":"Itu inti Past Future."}],"map":{"c":"SIMPLE PAST FUTURE","b":[{"t":"Rumus","k":["would + V1"]},{"t":"Dipakai di","k":["reported speech"]},{"t":"Bandingkan","k":["will (sekarang)","would (masa lalu)"]}]}},{"n":"Past Future Continuous","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Past Future Continuous</b> = <b>would be + V-ing</b>. Ibarat <b>memutar ulang video lama</b> 📼: dulu seseorang bilang pada waktu tertentu di masa depan ia akan <b>sedang melakukan</b> sesuatu.","ex":["She said she <b>would be waiting</b> at the station at five.","I thought they <b>would be sleeping</b> by then."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + would be + V-ing","He would be working."],["Negatif","S + wouldn't be + V-ing","He wouldn't be working."],["Tanya","Would + S + be + V-ing?","Would he be working?"]],"tip":"Pola: kata kerja pelapor lampau (said, thought, knew) nflation","variable"],"a":0,"why":"Itu <b>hypothesis</b>."},{"t":"mc","q":"\"Inflation\" paling terkait dengan bidang…","o":["Ekonomi","Biologi","Olahraga"],"a":0,"why":"Kenaikan harga: <b>ekonomi</b>."}],"map":{"c":"KOSAKATA AKADEMIK","b":[{"t":"👔 Formal","k":["utilize","demonstrate","obtain"]},{"t":"🔧 Teknis","k":["variable","hypothesis","ecosystem","inflation"]}]},"fc":1},{"n":"Phrasal Verbs","steps":[{"s":"<b>Phrasal verb</b> itu <b>kata kerja + \"kancing\"</b> 🧥. Kata kerjanya sama, tapi ganti kancing (up, off, out, on), artinya <b>berubah total</b>. Hafalkan sebagai satu paket.","ex":["give <b>up</b> = menyerah","look <b>after</b> = merawat","turn <b>off</b> = mematikan","find <b>out</b> = mencari tahu"]},{"s":"Enam phrasal verb yang paling sering muncul.","ex":[],"tbl":[["Phrasal verb","Arti","Contoh"],["give up","menyerah","Never give up!"],["look for","mencari","I look for my keys."],["look after","merawat","She looks after her cat."],["turn on / off","menyalakan / mematikan","Turn off the light."],["find out","mencari tahu","Let's find out."],["run out of","kehabisan","We ran out of milk."]],"tip":"Tebak dari kancingnya: <b>up</b> = naik/selesai, <b>off</b> = lepas/mati, <b>out</b> = keluar/habis."}],"quiz":[{"t":"mc","q":"Never ___ ! (menyerah)","o":["give up","give out","give on"],"a":0,"why":"Give up = menyerah."},{"t":"mc","q":"Can you ___ my dog? (merawat)","o":["look after","look for","look up"],"a":0,"why":"Look after = merawat."},{"t":"type","q":"Ketik: Please turn ___ the light. (mematikan)","a":["off"],"why":"Turn off = mematikan."},{"t":"mc","q":"\"We ran out of milk\" artinya…","o":["kehabisan susu","berlari membawa susu","menumpahkan susu"],"a":0,"why":"Run out of = kehabisan."},{"t":"mc","q":"I ___ my keys everywhere. (mencari)","o":["look for","look after"],"a":0,"why":"Look for = mencari."}],"map":{"c":"PHRASAL VERBS","b":[{"t":"🧥 Kancing","k":["up = naik/selesai","off = lepas/mati","out = keluar/habis"]},{"t":"Contoh","k":["give up","look arus tahu arah tulisanmu dari awal, bukan ditebak-tebak sampai akhir.","ex":["Lemah: Social media is popular.","Kuat: <b>Although social media connects people, it harms teenagers' focus.</b>"]},{"s":"Thesis yang bagus punya 3 ciri: <b>spesifik</b>, <b>bisa diperdebatkan</b>, dan <b>menunjukkan arah</b> argumen. Fakta umum saja belum cukup.","ex":[]},{"s":"<b>Transition words</b> itu rambu lalu lintas 🚦. <b>However</b> = putar balik (berlawanan). <b>Moreover</b> = lurus terus (menambah). <b>Therefore</b> = sampai tujuan (akibat).","ex":["Online class is flexible. <b>However</b>, it reduces interaction."]},{"s":"Bonus idiom: <b>break the ice</b> = memecah es di kolam beku. Artinya <b>mencairkan suasana</b> yang canggung.","ex":["He told a joke to <b>break the ice</b>."]},{"s":"Struktur esai itu ibarat <b>hamburger</b> 🍔: roti atas = <b>Introduction</b> (hook + thesis), isi = <b>Body</b> (topic sentence + bukti), roti bawah = <b>Conclusion</b>.","ex":["Introduction → Body → Conclusion"]},{"s":"<b>Hedging</b> itu ibarat <b>sabuk pengaman</b> 🛡️ untuk klaimmu. Penulis akademik jarang bilang \"pasti\" karena bukti jarang 100%. Mereka melunakkan klaim dengan <b>may, tend to, suggests, appears to</b>.","ex":["❌ Social media destroys concentration.","✅ Social media <b>may</b> reduce concentration.","Studies <b>suggest</b> that sleep improves memory."],"tip":"Kata absolut (always, never, prove) berisiko. Hedging membuat tulisanmu kredibel."}],"quiz":[{"q":"Mana thesis statement yang paling kuat?","o":["This essay is about technology.","Many people use smartphones.","Schools should limit smartphone use because it reduces students' concentration."],"a":2,"why":"Opsi ini spesifik, punya posisi yang bisa didebat, dan memberi alasan: spoiler yang bagus!"},{"q":"Online classes are flexible. ___, they can reduce student interaction.","o":["Moreover","However","Therefore","Similarly"],"a":1,"why":"Isinya berlawanan, jadi butuh rambu putar balik: <b>However</b>."},{"q":"At the party, an?","o":["Introduction","Discussion","Methods"],"a":1,"why":"<b>Discussion</b> membahas makna temuan."},{"t":"type","q":"Ketik frasa: ___ to Smith (2020), sleep boosts memory.","a":["according"],"why":"<b>According</b> to + sumber."},{"t":"mc","q":"Tindakan yang tepat saat memakai ide orang lain?","o":["Cantumkan sumbernya","Tidak usah, sudah diparafrasa","Ganti dua kata saja"],"a":0,"why":"Parafrasa pun tetap wajib <b>disitasi</b>."},{"t":"mc","p":"Sleep is essential for learning. Researchers at several universities found that students who slept eight hours remembered more vocabulary than students who stayed awake all night. The study suggests that the brain organizes new information during sleep. However, the authors note that the sample was small, so the results should be interpreted with caution.","q":"Ide utama paragraf tadi?","o":["Tidur membantu otak mengolah memori","Siswa sebaiknya begadang","Kosakata sulit dipelajari"],"a":0,"why":"Main idea: tidur membantu memori."},{"t":"mc","p":"Sleep is essential for learning. Researchers at several universities found that students who slept eight hours remembered more vocabulary than students who stayed awake all night. The study suggests that the brain organizes new information during sleep. However, the authors note that the sample was small, so the results should be interpreted with caution.","q":"Mengapa penulis berhati-hati dengan hasilnya?","o":["Sampelnya kecil","Penelitiannya dibatalkan","Tidak ada universitas"],"a":0,"why":"Teks: the sample was <b>small</b>."},{"t":"mc","p":"Sleep is essential for learning. Researchers at several universities found that students who slept eight hours remembered more vocabulary than students who stayed awake all night. The study suggests that the brain organizes new information during sleep. However, the authors note that the sample was small, so the results should be interpreted with caution.","q":"Kata \"suggests\" menandakan…","o":["Klaim yang dilunakkan (hedging)","Bukti esis</b>."},{"t":"mc","q":"Discussion menyajikan…","o":["Argumen pro dan kontra","Hanya argumen pro","Langkah-langkah"],"a":0,"why":"Dua sisi, lalu kesimpulan."},{"t":"mc","q":"Struktur Analytical Exposition…","o":["Thesis → Arguments → Reiteration","Goal → Steps","Orientation → Events"],"a":0,"why":"Itu strukturnya."},{"t":"type","q":"Ketik kata kontras (awalan h): Online class is flexible. ___, it reduces interaction.","a":["however"],"why":"<b>However</b> = putar balik."},{"t":"mc","q":"___, schools should limit phone use. (kesimpulan)","o":["In conclusion","However","For example"],"a":0,"why":"Penutup pakai <b>In conclusion</b>."},{"t":"order","q":"Susun: \"Di sisi lain, kelas daring melelahkan.\"","w":["On","the","other","hand","online","classes","are","tiring"],"a":"On the other hand online classes are tiring","why":"Frasa kontras diikuti klausa."}],"map":{"c":"TEKS ARGUMENTATIF","b":[{"t":"⚖️ Exposition","k":["Thesis","Arguments","Reiteration","satu sisi"]},{"t":"👩‍⚖️ Discussion","k":["Issue","For","Against","Conclusion"]},{"t":"🚦 Penghubung","k":["moreover","however","in conclusion"]}]}}]},{"id":"kerja","name":"Level Kerja & Profesional","tag":"TOEFL · TOEIC · Dunia Kerja","emoji":"💼","mods":[{"n":"Job Interview","g":"💼 Komunikasi Kerja","steps":[{"s":"Wawancara kerja itu seperti <b>pitching di acara 60 detik</b> 🎤: kamu \"menjual\" dirimu. Pembuka paling umum: <b>Tell me about yourself</b>. Pakai rumus <b>sekarang, lalu, nanti</b>: kamu sekarang apa, pengalaman apa, kamu ingin apa.","ex":["I'm an administrative officer with <b>three years of experience</b>.","I'm skilled in <b>financial reporting</b>.","I'm excited to <b>contribute</b> to your team."]},{"s":"Untuk pertanyaan \"ceritakan pengalamanmu\", pakai metode <b>STAR</b> ⭐, ibarat <b>film pendek 4 adegan</b>.","ex":[],"tbl":[["Adegan","Isi","Contoh"],["Situation","Latar","Our report was late."],["Task","Tugasmu","I had to fix it."],["Action","Yang kamu lakukan","I created a checklist."],["Result","Hasilnya","We finished on time."]],"tip":"Saat ditanya kelemahan, sebut yang <b>nyata</b> lalu tambahkan <b>cara memperbaikinya</b>."}],"quiz":[{"t":"mc","q":"Pertanyaan pembuka \"Tell me about yourself\" dijawab dengan…","o":["ringkasan profil singkat","riwayat hidup sejak lahir","\"No comment\""],"a":0,"why":"Berikan ringkasan: sekarang, pengalaman, tujuan."},{"t":"mc","q":"STAR berarti…","o":["Situation, Task, Action, Result","Skill, Time, Ability, Role","Start, Think, Act, Rest"],"a":0,"why":"<b>S</b>ituation, <b>T</b>ask, <b>A</b>ction, <b>R</b>esult."},{"t":"type","q":"Ketik: I am responsible ___ managing the inventory.","a":["for"],"why":"Pasangan tetap: responsible <b>for</b>."},{"t":"order","q":"Susun: \"Saya ingin berkontribusi pada tim Anda.\"","w":["I","want","to","contribute","to","your","team"],"a":"I want to contribute to your team","why":"Frasa penutup yang positif."},{"t":"listen","say":"Tell me about yourself.","q":"Pewawancara meminta kamu…","o":["Memperkenalkan diri","Menyebut gaji","Menjelaskan kelemahan"],"a":0,"why":"<b>Tell me about yourself</b> = ceritakan tentang dirimu.","wr":["","Gaji disebut salary.","Kelemahan disebut weakness."]}],"map":{"c":"JOB INTERVIEW","b":[{"t":"🎤 Pitch","k":["Tell me about yourself","sekarang, pengalaman, tujuan"]},{"t":"⭐ STAR","k":["Situation","Task","Action","Result"]},{"t":"💪 Kelemahan","k":["nyata + solusi"]}]},"game":{"e":"💼","t":"Ruang Wawancara","sc":[["🧑‍💼","🪑","Pewawancara bilang: \"Tell me about yourself.\"|Jawab dengan pembuka terbaik.",["I'm an administrative officer with three years of experience.","My salary should be high.","I don't know."],0,"💼","hop","Jawab dengan ringkasan profil: peran, pengalaman, tujuan."],["🧑‍💼","⭐","\"Describe a challenge you solved.\" Pakai metode STAR, mulai dari Situation.|Pilih kalimat pembukanya.",["Our monthly report was late, so I had to fix it fast.","I am the best person here.","I like coffee."],0,"⭐","wiggle","Situation = latar masalah."],["🧑‍💼","🤝","Wawancara selesai. Tutup dengan sopan.|Pilih kalimat penutupnya.",["Thank you for your time. I look forward to hearing from you.","Bye, I want to go home.","Call me later."],0,"🤝","spin","Penutup sopan: terima kasih dan harapan kabar baik."]]}},{"n":"Presentasi","g":"💼 Komunikasi Kerja","steps":[{"s":"Presentasi itu ibarat <b>tur wisata</b> 🚌: kamu pemandunya. Penumpang harus tahu <b>tujuan</b> di awal, <b>pemberhentian</b> di tengah, dan <b>ringkasan</b> di akhir.","ex":[],"tbl":[["Tahap","Frasa"],["Membuka","Good morning everyone. Today I'd like to talk about…"],["Rute","First, I'll cover… Then, I'll show…"],["Pindah topik","Let's move on to…"],["Menunjuk slide","As you can see on this slide…"],["Menutup","To sum up…"],["Tanya jawab","Any questions?"]]},{"s":"Biar penumpang tidak tersesat, ucapkan <b>signpost</b> (rambu) tiap pindah bagian. Bicara pelan, jeda sebentar, dan lihat audiens.","ex":["Let's <b>move on to</b> the budget.","To <b>sum up</b>, we saved 20 percent.","Thank you for <b>your attention</b>."]}],"quiz":[{"t":"mc","q":"Frasa untuk MEMBUKA presentasi?","o":["Today I'd like to talk about…","To sum up…","Any questions?"],"a":0,"why":"Pembuka: <b>Today I'd like to talk about…</b>"},{"t":"mc","q":"Frasa untuk MENUTUP ringkasan?","o":["To sum up…","First, …","As you can see…"],"a":0,"why":"<b>To sum up</b> = ringkasnya."},{"t":"type","q":"Ketik: Let's move ___ to the next topic.","a":["on"],"why":"Pindah topik: <b>move on</b>."},{"t":"order","q":"Susun: \"Seperti yang Anda lihat pada slide ini.\"","w":["As","you","can","see","on","this","slide"],"a":"As you can see on this slide","why":"Frasa baku untuk menunjuk slide."},{"t":"listen","say":"To sum up, we saved twenty percent.","q":"Bagian presentasi yang mana ini?","o":["Penutup / ringkasan","Pembuka","Tanya jawab"],"a":0,"why":"<b>To sum up</b> = ringkasnya, dipakai saat menutup.","wr":["","Pembuka pakai Today I would like to talk about.","Tanya jawab pakai Any questions?"]}],"map":{"c":"PRESENTASI","b":[{"t":"🚌 Buka","k":["Today I'd like to talk about…"]},{"t":"🪧 Rambu","k":["First…","Let's move on to…"]},{"t":"🏁 Tutup","k":["To sum up…","Any questions?"]}]},"fc":1},{"n":"Email & Komunikasi Kantor","g":"💼 Komunikasi Kerja","steps":[{"s":"Email kerja itu ibarat <b>surat berjas</b> 👔: isinya jelas, nadanya sopan. Susunannya: <b>Subject, Greeting, Tujuan, Detail, Aksi yang diminta, Closing</b>.","ex":["<b>Subject:</b> Request for Meeting on Friday","<b>Dear</b> Mr. Rahman,","I am writing <b>to inform you that</b> …","<b>Best regards,</b> Ypt"]},{"s":"Untuk meminta sesuatu, <b>lunakkan nada</b> seperti memakai bantalan. Bandingkan pasangan kasar dan sopan ini, dipakai juga di rapat dan telepon klien.","ex":[],"tbl":[["Kasar","Sopan"],["Send me the file.","Could you please send me the file?"],["I need it today.","I would appreciate it if you could send it today."],["Wait.","Could you hold on a moment, please?"],["I don't agree.","I see your point, but I'm afraid I see it differently."]]}],"quiz":[{"t":"mc","q":"Pilih permintaan yang paling sopan:","o":["Send the report now.","Could you please send the report?","You must send the report."],"a":1,"why":"<b>Could you please…?</b> terdengar sopan."},{"t":"mc","q":"Salam pembuka ke orang yang tidak dikenal namanya?","o":["Hey you,","To whom it may concern,","Yo,"],"a":1,"why":"Formal: <b>To whom it may concern</b>."},{"t":"type","q":"Ketik: I look forward ___ hearing from you.","a":["to"],"why":"Pasangan tetap: look forward <b>to</b> + V-ing."},{"t":"order","q":"Susun: \"Mohon kirim berkasnya.\"","w":["Could","you","please","send","the","file"],"a":"Could you please send the file","why":"Could you please + V1."},{"t":"listen","say":"Could you please hold on a moment?","q":"Maksud kalimat ini…","o":["Mohon tunggu sebentar","Mohon kirim berkasnya","Terima kasih banyak"],"a":0,"why":"<b>Hold on</b> = tunggu sebentar, sering dipakai di telepon.","wr":["","Kirim berkas pakai send the file.","Terima kasih pakai thank you."]}],"map":{"c":"EMAIL & KOMUNIKASI","b":[{"t":"👔 Struktur","k":["Subject","Greeting","Tujuan","Closing"]},{"t":"🛏️ Sopan","k":["Could you please…?","I would appreciate it if…"]},{"t":"📞 Telepon","k":["Hold on a moment","I'm afraid…"]}]},"fc":1,"game":{"e":"📧","t":"Email ke Klien","sc":[["🧑‍💻","📧","Kamu meminta klien mengirim berkas.|Tulis permintaan yang sopan.",["Could you please send me the file?","Send the file now.","You must send the file."],0,"📨","slide","Could you please... terdengar sopan."],["🧑‍💻","👔","Salam pembuka untuk klien bernama Mr. Rahman.|Pilih salamnya.",["Dear Mr. Rahman,","Hey bro,","Yo Rahman,"],0,"👔","hop","Email formal dibuka dengan Dear + nama."],["🧑‍💻","⏳","Kamu menutup email dan menunggu balasan.|Pilih kalimat penutupnya.",["I look forward to hearing from you.","See ya soon.","Reply me fast."],0,"📬","grow","look forward to + V-ing, ungkapan penutup formal."]]}},{"n":"TOEFL: Parallelism & Kontras","steps":[{"s":"<b>Parallel structure</b> itu ibarat <b>barisan marching band</b> 🥁: semua pemain melangkah seragam. Kalau satu item pakai <b>V-ing</b>, semua harus V-ing. Ini jebakan favorit soal TOEFL Structure.","ex":["❌ She likes swimming, to run, and cycling.","✅ She likes <b>swimming, running, and cycling</b>."]},{"s":"Paralelisme juga berlaku untuk pasangan <b>both…and</b>, <b>either…or</b>, <b>not only…but also</b>. Kedua sisi harus sama bentuknya.","ex":["The course is <b>both</b> challenging <b>and</b> rewarding.","He <b>not only</b> writes essays <b>but also</b> designs posters."],"tip":"Strategi TOEFL: lihat bentuk item pertama, lalu cek semua item lain mengikutinya."},{"s":"Kata kontras itu ibarat <b>tikungan</b> dengan aturan masing-masing. Salah ikutan, kalimat langsung tergelincir.","ex":[],"tbl":[["Kata","Diikuti","Contoh"],["Although","klausa (S + V)","Although it rained, we left."],["Despite","noun / V-ing","Despite the rain, we left."],["However","kalimat baru + koma","It rained. However, we left."],["Whereas","kontras 2 klausa","He is shy, whereas she is outgoing."]]}],"quiz":[{"t":"mc","q":"Mana kalimat yang paralel?","o":["He enjoys reading, to write, and painting.","He enjoys reading, writing, and painting.","He enjoys to read, writing, and paint."],"a":1,"why":"Semua item berbentuk V-ing."},{"t":"mc","q":"___ the heavy traffic, she arrived on time.","o":["Although","Despite","However"],"a":1,"why":"Diikuti noun (traffic): <b>Despite</b>."},{"t":"mc","q":"___ the traffic was heavy, she arrived on time.","o":["Although","Despite","In spite of"],"a":0,"why":"Diikuti klausa (S + V): <b>Although</b>."},{"t":"type","q":"Ketik: He not only writes essays but also ___ (design) posters.","a":["designs"],"why":"Sisi kedua menyamai sisi pertama: <b>designs</b>."},{"t":"mc","q":"Temukan kesalahan: \"The study aims to analyze, compare, and evaluating data.\"","o":["analyze","compare","evaluating"],"a":2,"why":"Harus paralel: to analyze, compare, and <b>evaluate</b>."},{"t":"order","q":"Susun: \"Meskipun mahal, buku itu laris.\"","w":["Although","it","is","expensive","the","book","sells","well"],"a":"Although it is expensive the book sells well","why":"Although + klausa, lalu klausa utama."}],"map":{"c":"TOEFL STRUCTURE","b":[{"t":"🥁 Paralel","k":["V-ing, V-ing, V-ing","both…and","not only…but also"]},{"t":"↩️ Kontras","k":["Although + klausa","Despite + noun/V-ing","However, …"]},{"t":"🎯 Strategi","k":["cek item pertama","samakan bentuk"]}]},"g":"🎯 TOEFL & TOEIC"},{"n":"TOEIC: Detektif Kelas Kata","g":"🎯 TOEFL & TOEIC","steps":[{"s":"Soal <b>TOEIC Part 5</b> (isian kalimat) sering menguji <b>bentuk kata</b>. Jadilah <b>detektif kelas kata</b> 🕵️: lihat posisi kosongnya dulu, baru tentukan kelasnya.","ex":[],"tbl":[["Posisi kosong","Isi dengan","Contoh"],["Setelah a/the/adjective","Noun","a good <b>decision</b>"],["Sebelum noun","Adjective","a <b>quick</b> reply"],["Setelah verb","Adverb","works <b>efficiently</b>"],["Setelah to","Verb polos","to <b>increase</b>"]]},{"s":"Satu akar kata punya banyak \"baju\". Hafalkan keluarga katanya.","ex":["succeed → <b>success</b> → <b>successful</b> → <b>successfully</b>","decide → <b>decision</b> → <b>decisive</b> → <b>decisively</b>"],"tip":"Di TOEIC, jangan buru-buru lihat arti. Cek <b>posisi</b> dulu, jawaban sering ketahuan dari situ."}],"quiz":[{"t":"mc","q":"The manager made a ___ decision.","o":["quick","quickly","quickness"],"a":0,"why":"Sebelum noun: <b>adjective</b> quick."},{"t":"mc","q":"She completed the task ___.","o":["efficient","efficiently","efficiency"],"a":1,"why":"Setelah verb: <b>adverb</b> efficiently."},{"t":"type","q":"Ketik bentuk noun dari decide (awalan d):","a":["decision"],"why":"<b>Decision</b> = keputusan."},{"t":"mc","q":"The company announced a ___ increase in profit.","o":["significantly","significant","signify"],"a":1,"why":"Sebelum noun: <b>adjective</b> significant."},{"t":"listen","say":"When does the meeting start?","q":"TOEIC Part 2: jawaban paling tepat?","o":["At three o'clock.","Yes, it is.","In the conference room."],"a":0,"why":"Pertanyaan <b>When</b> dijawab waktu.","wr":["","Yes/No tidak cocok untuk When.","In the conference room menjawab Where."]},{"t":"listen","say":"Where is the meeting?","q":"TOEIC Part 2: jawaban paling tepat?","o":["In the conference room.","At three o'clock.","Yes, I did."],"a":0,"why":"Pertanyaan <b>Where</b> dijawab tempat.","wr":["","At three o'clock menjawab When.","Yes, I did tidak nyambung dengan Where."]},{"t":"mc","p":"<b>To:</b> All Staff · <b>From:</b> Rina Putri, HR Manager<br><b>Subject:</b> New Office Hours<br>Starting Monday, March 3, our office hours will change. The office will open at 8:00 a.m. and close at 4:30 p.m., instead of 9:00 a.m. to 5:30 p.m. This change will help staff avoid heavy evening traffic. Staff who need a different schedule should contact HR by Friday. The lunch break will remain from 12:00 to 1:00 p.m. Thank you for your cooperation.","q":"TOEIC Part 7: Apa tujuan email ini?","o":["Mengumumkan jam kerja baru","Mengundang rapat","Meminta cuti"],"a":0,"why":"Subject dan kalimat pertama menyebut <b>New Office Hours</b>.","wr":["","Tidak ada undangan rapat.","Tidak ada permintaan cuti."]},{"t":"mc","p":"<b>To:</b> All Staff · <b>From:</b> Rina Putri, HR Manager<br><b>Subject:</b> New Office Hours<br>Starting Monday, March 3, our office hours will change. The office will open at 8:00 a.m. and close at 4:30 p.m., instead of 9:00 a.m. to 5:30 p.m. This change will help staff avoid heavy evening traffic. Staff who need a different schedule should contact HR by Friday. The lunch break will remain from 12:00 to 1:00 p.m. Thank you for your cooperation.","q":"Pukul berapa kantor tutup mulai 3 Maret?","o":["4:30 p.m.","5:30 p.m.","1:00 p.m."],"a":0,"why":"Teks: close at <b>4:30 p.m.</b>","wr":["","5:30 itu jam tutup yang lama.","1:00 itu akhir jam makan siang."]},{"t":"mc","p":"<b>To:</b> All Staff · <b>From:</b> Rina Putri, HR Manager<br><b>Subject:</b> New Office Hours<br>Starting Monday, March 3, our office hours will change. The office will open at 8:00 a.m. and close at 4:30 p.m., instead of 9:00 a.m. to 5:30 p.m. This change will help staff avoid heavy evening traffic. Staff who need a different schedule should contact HR by Friday. The lunch break will remain from 12:00 to 1:00 p.m. Thank you for your cooperation.","q":"Siapa yang harus dihubungi untuk jadwal berbeda?","o":["HR","Rina Putri lewat telepon rumah","Semua staf"],"a":0,"why":"Teks: contact <b>HR</b> by Friday.","wr":["","Rina adalah HR, tapi yang diminta dihubungi adalah HR.","Tidak ada instruksi menghubungi staf lain."]},{"t":"mc","p":"<b>To:</b> All Staff · <b>From:</b> Rina Putri, HR Manager<br><b>Subject:</b> New Office Hours<br>Starting Monday, March 3, our office hours will change. The office will open at 8:00 a.m. and close at 4:30 p.m., instead of 9:00 a.m. to 5:30 p.m. This change will help staff avoid heavy evening traffic. Staff who need a different schedule should contact HR by Friday. The lunch break will remain from 12:00 to 1:00 p.m. Thank you for your cooperation.","q":"Apa yang TIDAK berubah?","o":["Jam istirahat siang","Jam buka","Jam tutup"],"a":0,"why":"Teks: lunch break <b>will remain</b> 12:00 to 1:00.","wr":["","Jam buka berubah ke 8:00.","Jam tutup berubah ke 4:30."]}],"map":{"c":"TOEIC PART 5","b":[{"t":"🕵️ Langkah","k":["lihat posisi","tentukan kelas kata"]},{"t":"🔤 Pola","k":["a/the + noun","adj + noun","verb + adverb"]}]}}]}];

LEVELS.forEach(L=>L.mods.forEach(M=>{if(M.map)M.steps=M.steps.concat([{s:'Terakhir, ini <b>peta konsep</b> 🧠 untuk merangkum semuanya. Simpan di kepala, lalu kita uji lewat kuis!',ex:[],map:M.map}])}));
function mmap(m){return `<div class="mm"><div class="mm-c">${m.c}</div>`+m.b.map((b,i)=>`<div class="mm-b" style="animation-delay:${i*.12}s"><b>${b.t}</b>${b.k.map(k=>`<span>${k}</span>`).join('')}</div>`).join('')+'</div>'}


const BADGES=[{id:'first',e:'🥇',n:'Kuis pertama'},{id:'perfect',e:'💯',n:'Skor sempurna'},{id:'streak3',e:'🔥',n:'3 hari beruntun'},{id:'master',e:'🎓',n:'Semua modul selesai'}];

const $=s=>document.querySelector(s);
const view=$('#view'),title=$('#title'),back=$('#back'),prog=$('#prog'),gear=$('#gear');
const DEF={name:'',xp:0,streak:0,last:'',stars:{},badges:[],dark:false,calm:false,sound:true,pass:{}};
let P=JSON.parse(JSON.stringify(DEF));
try{Object.assign(P,JSON.parse(localStorage.getItem('pakhoot2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('pakhoot2',JSON.stringify(P))}catch(e){}};
const S={view:'menu',lv:0,m:0,step:0,q:0,score:0,list:[],wrong:[],retry:false,locked:false,ex:null,kind:null};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
const lv=()=>LEVELS[S.lv], mod=()=>S.ex||lv().mods[S.m];
const star=(l,m)=>P.stars[LEVELS[l].id+':'+m]||0;
const starStr=n=>'★'.repeat(n)+'☆'.repeat(3-n);
const unlocked=i=>true; // level terbuka setelah lulus Ujian Akhir level sebelumnya (atau lewat Tes Penempatan)
function theme(){document.documentElement.dataset.theme=P.dark?'dark':'light';document.documentElement.toggleAttribute('data-calm',P.calm)}

/* ===== Navigasi ===== */
function go(v,o){if(v==='menu'||v==='mods'||v==='learn'){S.ex=null;S.kind=null}S.view=v;Object.assign(S,o||{});render()}
function render(){
  view.className='view';void view.offsetWidth;view.className='view in';
  back.style.visibility=S.view==='menu'?'hidden':'visible';
  gear.style.display=S.view==='menu'?'':'none';
  prog.innerHTML='';
  ({menu:vMenu,mods:vMods,learn:vLearn,quiz:vQuiz,result:vResult,set:vSet,fc:vFlash,gm:vGame,dl:(()=>vDlg())})[S.view]();
  view.scrollTop=0;
}
back.onclick=()=>{const v=S.view;
  if(v==='learn'&&S.step>0)go('learn',{step:S.step-1});
  else if(v==='gm'&&S.g)go('gm',{g:null});else if(v==='dl'&&S.d)go('dl',{d:null});else if(S.kind==='place')go('menu');else if(v==='learn'||v==='quiz')go('mods');
  else go('menu')};

   +`<div class="stats"><span class="pill">🔥 ${P.streak} hari</span><span class="pill">⭐ ${P.xp} XP</span>`
   +BADGES.filter(b=>P.badges.includes(b.id)).map(b=>`<span class="pill" title="${b.n}">${b.e}</span>`).join('')+'</div>'
   +'<div class="path">'+LEVELS.map((l,i)=>`<button class="card${unlocked(i)?'':' lock'}" data-i="${i}"><span class="ico">${l.emoji}</span>
     <span class="txt"><small>${l.tag}</small><b>${l.name}</b><em>${l.mods.length} modul</em></span>
     <span class="stars">${unlocked(i)?starStr(Math.min(...l.mods.map((_,m)=>star(i,m)))):'🔒'}</span></button>`).join('')+'</div>'+TOOLS;

}
function vMods(){
  const L=lv();title.textContent=L.name;
  const gs=[];L.mods.forEach((m,i)=>{let o=gs.find(x=>x.g===m.g);if(!o)gs.push(o={g:m.g,i:[]});o.i.push(i)});
  gs.forEach(o=>o.i.sort((a,b)=>L.mods[b].n.startsWith('Peta')-L.mods[a].n.startsWith('Peta'))); // "Peta" (gambaran besar) selalu di awal bab

   +gs.map(o=>`<section class="grp"><h3><span>${o.g}</span><small>${o.i.filter(i=>star(S.lv,i)>0).length}/${o.i.length} selesai</small></h3><div class="path">`
     +o.i.map((i,n)=>`<button class="card" data-m="${i}"><span class="ico">${L.emoji}</span><span class="txt"><small>Sub-modul ${n+1}${L.mods[i].game?' · 🎮 Misi':''}</small><b>${L.mods[i].n}</b></span><span class="stars">${starStr(star(S.lv,i))}</span></button>`).join('')+'</div></section>').join('');
  view.querySelectorAll('.card').forEach(b=>b.onclick=()=>go('learn',{m:+b.dataset.m,step:0}));const done=L.mods.filter((_,m)=>star(S.lv,m)>0).length;view.insertAdjacentHTML('beforeend',`<button class="card" id="ex" style="margin-bottom:18px"><span class="ico">📝</span><span class="txt"><small>${P.pass[L.id]?'Sudah lulus ✅':'Siap diambil (lulus min. 70%)'}</small><b>Ujian Akhir ${L.name}</b></span></button>`);$('#ex').onclick=()=>startExam();

/* ===== Fase Belajar (contoh kalimat bisa diklik untuk didengar) ===== */
function vLearn(){
  const M=mod(),st=M.steps[S.step],last=S.step===M.steps.length-1;
  title.textContent=M.n;dots(S.step+1,M.steps.length);
  view.innerHTML=guide(st.s)+(st.ex.length?`<div class="ex">${st.ex.map(e=>`<p>${e}</p>`).join('')}</div>`:'')
   +(st.tbl?tbl(st.tbl):'')+(st.tip?`<div class="tip">💡 ${st.tip}</div>`:'')
   +(st.map?mmap(st.map):'')
   +`<div class="foot"><button class="btn" id="nx">${last?'Mulai kuis 🎯':'Lanjut'}</button></div>`;
  view.querySelectorAll('.ex p').forEach(p=>p.onclick=()=>speak(p.textContent.replace(/^(Lemah|Kuat|Original|Paraphrase):/,'').replace(/\(.*?\)/g,'').replace(/→/g,' ')));
  $('#nx').onclick=()=>last?go('quiz',{q:0,score:0,list:shuffle(M.quiz.map((_,i)=>i)).slice(0,10),wrong:[],retry:false}):go('learn',{step:S.step+1});
}

/* ===== Fase Kuis: 3 tipe soal ===== */
function vQuiz(){
  const M=mod(),Q=M.quiz[S.list[S.q]],t=Q.t||'mc';S.locked=false;const lt=t==='listen',mcl=t==='mc'||(lt&&!!Q.o);
  title.textContent=S.retry?'Latihan ulang':M.n;dots(S.q+1,S.list.length);
  let body;
  if(mcl)body=`<div class="opts">${shuffle(Q.o.map((o,i)=>[o,i])).map(([o,i])=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  else if(t==='type'||(lt&&!Q.o))body='<input class="in" id="inp" autocomplete="off" autocapitalize="off" placeholder="Ketik jawabanmu…"><button class="btn" id="ck">Cek jawaban</button>';
  else body=`<div class="words slot" id="ans"></div><div class="words" id="bank">${shuffle(Q.w.map(w=>w)).map(w=>`<button class="chip">${w}</button>`).join('')}</div><button class="btn" id="ck">Cek jawaban</button>`;
  view.innerHTML=guide(`Soal ${S.q+1} dari ${S.list.length}. ${lt?'Putar suaranya dan dengarkan baik-baik!':t==='mc'?'Pilih jawaban yang paling pas ya!':t==='type'?'Kali ini kamu ngetik sendiri. Pasti bisa!':'Tap kata-kata ini sampai kalimatnya benar.'}`)
   +`<div class="qcard">${Q.p?`<div class="pas">${Q.p}</div>`:''}${lt?'<button class="btn ghost" id="pl">🔊 Putar suara</button>':''}<p class="q">${Q.q}</p>${body}<div id="why"></div></div><div class="foot" id="ft"></div>`;
  if(lt){$('#pl').onclick=()=>speak(Q.say,1);setTimeout(()=>speak(Q.say,1),400)}
  if(mcl)view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.locked)return;const i=+b.dataset.i;
    view.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.i===Q.a)o.classList.add('ok');else if(o===b)o.classList.add('bad')});
    finish(i===Q.a,Q.o[Q.a],i!==Q.a&&Q.wr&&Q.wr[i]?`Kamu memilih <b>${Q.o[i]}</b>: ${Q.wr[i]} `:'',Q.o[i]);});
  if(t==='type'||(lt&&!Q.o)){const inp=$('#inp');inp.onkeydown=e=>{if(e.key==='Enter')$('#ck').click()};
    $('#ck').onclick=()=>{if(S.locked||!inp.value.trim())return;const ok=Q.a.map(norm).includes(norm(inp.value));inp.disabled=true;$('#ck').remove();finish(ok,Q.a[0],'',inp.value)}}
  if(t==='order'){
    view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(!S.locked)(c.parentNode.id==='bank'?$('#ans'):$('#bank')).appendChild(c)});
    $('#ck').onclick=()=>{if(S.locked||!$('#ans').children.length)return;
      const got=[...$('#ans').children].map(c=>c.textContent).join(' ');S.locked=true;$('#ck').remove();
      finish(norm(got)===norm(Q.a),Q.a,'',got);if(norm(got)===norm(Q.a))speak(Q.a)}}
}
/* Reaksi karakter + penjelasan + tombol lanjut */
function finish(ok,ans,wr,given){
  S.locked=true;const M=mod(),idx=S.list[S.q];
  if(ok)S.score++;else if(!S.wrong.includes(idx))S.wrong.push(idx);
  say(pick(ok?CHEER:OOPS));react(ok?'cheer':'oops');
  $('#why').outerHTML=explain(ok,M.quiz[idx],M,ans,wr,given);
  const lastQ=S.q===S.list.length-1;
  $('#ft').innerHTML=`<button class="btn" id="nq">${lastQ?'Lihat hasil':'Soal berikutnya'}</button>`;
  $('#nq').onclick=()=>lastQ?go('result'):go('quiz',{q:S.q+1});
  if(ok)confetti(14);setTimeout(()=>$('#why').scrollIntoView({behavior:'smooth',block:ok?'end':'start'}),60);
}

/* ===== Hasil: bintang, XP, streak harian, lencana ===== */
function vResult(){
  const M=mod(),tot=S.list.length,n=S.score;title.textContent='Hasil kuis';dots(tot,tot);if(S.kind)return kindResult(tot,n);
  let msg,box;
  if(S.retry){
    msg=n===tot?'Nah, sekarang sudah paham semua! Hebat 🎉':'Sedikit lagi! Baca ulang materinya, lalu coba lagi 🌱';
    box=`<p>Latihan ulang: <b>${n}/${tot}</b> benar</p>`;
  }else{
    const st=Math.round(n/tot*3),xp=n*10+(n===tot?10:0),key=lv().id+':'+S.m;
    if(st>star(S.lv,S.m))P.stars[key]=st;P.xp+=xp;
    const today=new Date().toLocaleDateString('en-CA'),yest=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
    if(P.last!==today){P.streak=P.last===yest?P.streak+1:1;P.last=today}
    const won=[];const give=id=>{if(!P.badges.includes(id)){P.badges.push(id);won.push(BADGES.find(b=>b.id===id))}};
    give('first');if(n===tot)give('perfect');if(P.streak>=3)give('streak3');
    if(LEVELS.every((l,i)=>l.mods.every((_,m)=>star(i,m)>0)))give('master');
    save();
    msg=(n===tot?'Sempurna! Semua benar 🚀':n>0?'Bagus! Sedikit lagi sempurna 💪':'Belum beruntung, tapi kamu berani mencoba 🌱')
      +(won.length?`<br>Lencana baru: ${won.map(b=>b.e+' '+b.n).join(', ')}`:'');
    box=`<div class="big">${starStr(st)}</div><p>Skor <b>${n}/${tot}</b> · +${xp} XP · 🔥 ${P.streak} hari</p>`;
  }
  const nextMod=S.m+1<lv().mods.length,nextLv=LEVELS[S.lv+1]&&unlocked(S.lv+1);
  view.innerHTML=guide(msg)+`<div class="res">${box}</div><div class="foot">
    ${S.wrong.length?'<button class="btn" id="rw">Ulangi soal yang salah</button>':''}
    ${nextMod?'<button class="btn" id="nm">Modul berikutnya</button>':nextLv?'<button class="btn" id="nl">Buka level berikutnya</button>':''}
    ${M.game?'<button class="btn ghost" id="gm">🎮 Main Misi modul ini</button>':''}<button class="btn ghost" id="re">Belajar ulang</button><button class="btn ghost" id="mn">Kembali ke peta</button></div>`;
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on('#rw',()=>go('quiz',{list:S.wrong,wrong:[],q:0,score:0,retry:true}));
  on('#nm',()=>go('learn',{m:S.m+1,step:0}));
  on('#nl',()=>go('mods',{lv:S.lv+1}));
  on('#re',()=>go('learn',{step:0}));on('#gm',()=>startGame(M));
  on('#mn',()=>go('menu'));
  setTimeout(()=>{react(n>=2?'cheer':'oops');if(n===tot)confetti(40)},350);
}

/* ===== v4: Tes Penempatan, Ujian Akhir, Flashcard ===== */
const TOOLS=`<div class="path" style="padding-bottom:24px"><button class="card" id="tp"><span class="ico">🧭</span><span class="txt"><small>10 soal</small><b>Tes Penempatan</b><em>Cari level yang pas untukmu</em></span></button><button class="card" id="tg"><span class="ico">🎮</span><span class="txt"><small>Game interaktif</small><b>Misi Pak Yood</b><em>Beri perintah ke tokoh</em></span></button><button class="card" id="td"><span class="ico">💬</span><span class="txt"><small>Percakapan animasi</small><b>Ngobrol Seru</b><em>Balas obrolan, dapat penjelasan</em></span></button><button class="card" id="tf"><span class="ico">🃏</span><span class="txt"><small>Hafalan</small><b>Flashcard</b><em>Kosakata & frasa penting</em></span></button></div>`;
const pickQ=(l,n)=>{const z=new Set();return shuffle(LEVELS[l].mods.flatMap(M=>M.quiz)).filter(q=>{const k=JSON.stringify([q.q,q.o,q.a,q.say,q.pairs]);if(z.has(k))return false;z.add(k);return true}).slice(0,n)};
function startQuiz(qs,kind,name){go('quiz',{ex:{n:name,quiz:qs},kind,q:0,score:0,list:qs.map((_,i)=>i),wrong:[],retry:false})}
function startPlace(){startQuiz([...pickQ(0,2),...pickQ(1,3),...pickQ(2,3),...pickQ(3,2)],'place','Tes Penempatan')}
function startExam(){startQuiz(pickQ(S.lv,12),'exam','Ujian Akhir '+lv().name)}
function kindResult(tot,n){
  const pct=n/tot;let msg,box;
  if(S.kind==='exam'){const ok=pct>=.7;if(ok){P.pass[lv().id]=1;P.xp+=50;save()}
    msg=ok?'Lulus! Level berikutnya terbuka 🎓':'Belum lulus, butuh minimal 70%. Ulangi materinya lalu coba lagi 💪';
    box=`<div class="big">${ok?'🎓':'🌱'}</div><p>Skor <b>${n}/${tot}</b> (${Math.round(pct*100)}%)${ok?' · +50 XP':''}</p>`}
  else{const st=n<=3?0:n<=5?1:n<=8?2:3;for(let i=0;i<st;i++)P.pass[LEVELS[i].id]=1;save();
    msg=`Hasil tes: mulai dari <b>${LEVELS[st].name}</b>!`+(st?' Level-level sebelumnya sudah kubuka untukmu.':'');
    box=`<p>Skor <b>${n}/${tot}</b></p><p>Level awalmu: <b>${LEVELS[st].emoji} ${LEVELS[st].name}</b></p>`}
  view.innerHTML=guide(msg)+`<div class="res">${box}</div><div class="foot"><button class="btn" id="mn">Kembali ke peta</button></div>`;
  $('#mn').onclick=()=>go('menu');setTimeout(()=>{react(pct>=.5?'cheer':'oops');if(pct>=.7)confetti(40)},350)}
const strip=h=>h.replace(/<[^>]+>/g,'');
const deck=l=>{const c=[];LEVELS[l].mods.forEach(M=>{if(M.fc)M.steps.forEach(s=>(s.tbl||[]).slice(1).forEach(r=>c.push([strip(r[0]),strip(r.slice(1).join(' → '))])))});return c};
function vFlash(){
  title.textContent='Flashcard';
  if(!S.fc){const ds=LEVELS.map((_,i)=>[i,deck(i).length]).filter(d=>d[1]);
    view.innerHTML=guide('Pilih tumpukan kartunya. Tap kartu untuk membalik, lalu jujur ya: sudah hafal atau perlu diulang? 🃏')+'<div class="path">'+ds.map(([i,n])=>`<button class="card" data-i="${i}"><span class="ico">${LEVELS[i].emoji}</span><span class="txt"><small>${n} kartu</small><b>${LEVELS[i].name}</b></span></button>`).join('')+'</div>';
    view.querySelectorAll('.card').forEach(b=>b.onclick=()=>{S.fc={q:shuffle(deck(+b.dataset.i)),f:0,k:0};vFlash()});return}
  const F=S.fc,c=F.q[0];
  if(!c){view.innerHTML=guide('Semua kartu sudah kamu hafal. Mantap! 🎉')+'<div class="foot"><button class="btn" id="bk">Pilih tumpukan lain</button></div>';$('#bk').onclick=()=>{S.fc=null;vFlash()};return}
  dots(F.k,F.k+F.q.length);if(!F.f)speak(c[0]);
  view.innerHTML=guide(`Sisa <b>${F.q.length}</b> kartu. Tap kartu untuk melihat artinya.`)+`<button class="qcard" id="cd" style="min-height:160px;align-items:center;justify-content:center;text-align:center"><p class="q">${F.f?c[1]:c[0]}</p><small style="color:var(--mute)">${F.f?'artinya':'tap untuk membalik'}</small></button><div class="foot"><button class="btn" id="ok">Sudah hafal ✅</button><button class="btn ghost" id="ag">Ulang lagi 🔁</button></div>`;
  $('#cd').onclick=()=>{F.f=1-F.f;vFlash()};
  $('#ok').onclick=()=>{F.q.shift();F.k++;F.f=0;vFlash()};
  $('#ag').onclick=()=>{F.q.push(F.q.shift());F.f=0;vFlash()};
}

/* ===== v5: penjelasan runut saat salah + konfeti + owl interaktif ===== */
function explain(ok,Q,M,ans,wr,given){
  if(ok)return `<div class="why" id="why">✅ ${Q.why}</div>`;
  const t=Q.t||'mc',ex=[];
  (M.steps||[]).forEach(s=>(s.ex||[]).forEach(e=>{if(!/❌|Lemah/.test(e)&&e.length<90)ex.push(e)}));
  const tip=((M.steps||[]).find(s=>s.tip)||{}).tip;
  const rule=M.map?M.map.b.slice(0,4).map(b=>`<b>${b.t}</b>: ${b.k.slice(0,3).join(', ')}`).join('<br>'):'';
  const li=[];
  li.push(['Cek jawabanmu',given?(wr||`${t==='order'?'Susunanmu':'Kamu menjawab'}: <b>${esc(given)}</b>.`):'Belum ada jawaban yang masuk, jadi kita bahas dari awal.']);
  li.push(['Jawaban yang benar',`<b>${ans}</b>${Q.say?`<br>Kalimat yang diucapkan: <i>"${Q.say}"</i>`:''}`]);
  li.push(['Kenapa begitu',Q.why]);
  if(rule||tip)li.push([`Aturan di modul "${M.n}"`,rule+(tip?`<div class="ex2">💡 ${tip}</div>`:'')]);
  if(ex.length)li.push(['Contoh benar lainnya',shuffle(ex).slice(0,2).map(e=>`<div class="ex2">${e}</div>`).join('')]);
  li.push(['Biar tidak salah lagi','Baca soal pelan-pelan, cari kata kunci (penanda waktu, pelaku, atau kata sambung), lalu cocokkan dengan aturan di atas sebelum memilih.']);
  return `<div class="why full" id="why"><h4>🧐 Yuk, kita bedah pelan-pelan</h4><ol class="exp">${li.map(([h,b],i)=>`<li style="animation-delay:${i*.12}s"><strong>${h}</strong>${b}</li>`).join('')}</ol></div>`}
function confetti(n){if(P.calm)return;const app=$('#app'),E=['🎉','⭐','✨','💛','🧡','🌟'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=E[i%E.length];
    s.style.cssText=`left:${10+Math.random()*80}%;--dx:${(Math.random()-.5)*160}px;--r:${(Math.random()-.5)*720}deg;animation-delay:${Math.random()*.25}s;font-size:${14+Math.random()*14}px`;
    app.appendChild(s);setTimeout(()=>s.remove(),1900)}}
document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('.mascot');if(m){m.classList.remove('spin');void m.offsetWidth;m.classList.add('spin')}});
document.addEventListener('animationend',e=>{const m=e.target;if(m.classList&&m.classList.contains('mascot'))m.classList.remove('cheer','oops','spin')});

/* ===== v6: Misi Pak Yood (game skenario interaktif) ===== */
const GAMES=()=>LEVELS.flatMap(L=>L.mods.filter(m=>m.game).map(m=>[L,m]));
function startGame(M){go('gm',{g:{m:M,i:0,sc:0,w:0}})}
function vGame(){
  title.textContent='Misi Pak Yood';const G=S.g;
  if(!G){
    view.innerHTML=guide('Pilih misi! Di tiap misi kamu <b>memberi perintah</b> ke tokoh lewat kalimat bahasa Inggris yang tepat. Salah perintah? Tokohnya bisa kebingungan 😆')
      +'<div class="path">'+GAMES().map(([L,m])=>`<button class="card" data-n="${m.n}"><span class="ico">${m.game.e}</span><span class="txt"><small>${L.name}</small><b>${m.game.t}</b><em>${m.n}</em></span><span class="stars">${starStr((P.game||{})[m.n]||0)}</span></button>`).join('')+'</div>';
    view.querySelectorAll('.card').forEach(b=>b.onclick=()=>startGame(GAMES().find(x=>x[1].n===b.dataset.n)[1]));return}
  const M=G.m,T=M.game.sc;
  if(G.i>=T.length){
    const st=Math.round(G.sc/T.length*3);P.game=P.game||{};if(st>(P.game[M.n]||0))P.game[M.n]=st;P.xp+=G.sc*15;save();dots(T.length,T.length);
    view.innerHTML=guide(G.sc===T.length?'Misi sempurna! Tokohnya senang banget 🥳':'Misi selesai! Ulangi biar sempurna 💪')+`<div class="res"><div class="big">${starStr(st)}</div><p><b>${G.sc}/${T.length}</b> perintah tepat di percobaan pertama · +${G.sc*15} XP</p></div><div class="foot"><button class="btn" id="ag">Main lagi</button><button class="btn ghost" id="ls">Daftar misi</button></div>`;
    $('#ag').onclick=()=>startGame(M);$('#ls').onclick=()=>go('gm',{g:null});
    setTimeout(()=>{react(G.sc>=2?'cheer':'oops');if(G.sc===T.length)confetti(40)},350);return}
  const [e,p,n,o,a,fx,an,y]=T[G.i],[nar,cmd]=n.split('|');dots(G.i+1,T.length);
  view.innerHTML=guide(`<b>${nar}</b><br>🎮 ${cmd}`)+`<div class="stage"><div class="actor" id="ac">${e}</div><div class="prop">${p}</div><div class="cap" id="cp"></div></div><div class="opts">${shuffle(o.map((x,i)=>[x,i])).map(([x,i])=>`<button class="opt" data-i="${i}">${x}</button>`).join('')}</div><div id="why"></div><div class="foot" id="ft"></div>`;
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===a;
    view.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===a)x.classList.add('ok');else if(x===b)x.classList.add('bad')});
    $('#ac').className='actor a-'+(ok?an:'oops');

const P2=`<b>The Gig Economy: Freedom or Fragility?</b><br><br>In the past decade, the so-called gig economy has transformed the way millions of people earn a living. Instead of holding a permanent job with a single employer, gig workers take short-term assignments through digital platforms, such as ride-hailing apps, food-delivery services, or freelance websites.<br><br>Supporters argue that this model offers unprecedented flexibility. Workers can decide when, where, and how much they work, which is particularly attractive to students, parents, and those seeking supplementary income. Moreover, platforms allow small businesses to hire specialized talent without the cost of full-time salaries.<br><br>Critics, however, point out that flexibility often comes at a price. Because gig workers are classified as independent contractors rather than employees, they typically lack benefits such as health insurance, paid leave, and retirement plans. Their earnings can also fluctuate dramatically, making it difficult to plan for the future. Furthermore, algorithms that assign tasks and evaluate performance may lack transparency, leaving workers uncertain about how decisions affecting their income are made.<br><br>Consequently, governments around the world are debating how to regulate the sector. Some propose a new legal category that grants limited protections without eliminating flexibility, while others insist that most gig workers should simply be treated as employees. Whichever approach prevails, it is clear that the gig economy will remain a defining feature of modern labor markets.`;

const P3=`<b>Why Do We Forget?</b><br><br>Hermann Ebbinghaus, a German psychologist, was among the first to study forgetting scientifically. In the 1880s, he memorized lists of meaningless syllables and tested himself at different intervals. His results revealed what is now called the forgetting curve: memory declines sharply soon after learning, then levels off.<br><br>According to Ebbinghaus, roughly half of newly learned information may be lost within an hour if it is not reviewed, and a large portion disappears within a day. However, he also discovered that each review slows the decline, so the same material is retained for longer after every repetition.<br><br>These findings underpin the technique known as spaced repetition, in which learners review material at gradually increasing intervals. Rather than cramming everything the night before an exam, they revisit it after a day, then a few days, then a week. Research consistently shows that this approach produces far stronger long-term retention than massed study, even when the total study time is identical.<br><br>Nevertheless, it should be noted that Ebbinghaus's experiments used nonsense syllables. Meaningful material, such as a story or a concept that connects to prior knowledge, is generally forgotten more slowly. Thus, understanding what you learn is just as important as how often you review it.`;
