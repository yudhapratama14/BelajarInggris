{s:`<b>For vs Since</b> 🚆: <b>for</b> = lamanya perjalanan (angka + satuan waktu), <b>since</b> = jam keberangkatan (titik awal). Triknya: <b>for</b> dijawab "berapa lama?", <b>since</b> dijawab "mulai kapan?".`,ex:[`I have lived here <b>for 5 years</b>. (lamanya)`,`I have lived here <b>since 2021</b>. (mulai kapan)`,`She has studied English <b>for two hours</b> / <b>since 7 o'clock</b>.`]},
{s:`<b>Kata kunci</b> 🗝️: <b>ever</b> (pernah, untuk tanya), <b>never</b> (belum pernah), <b>just</b> (baru saja), <b>already</b> (sudah), <b>yet</b> (belum / sudah?, di akhir kalimat negatif & tanya), <b>so far</b> (sejauh ini). Semuanya duduk di antara <b>have/has</b> dan <b>V3</b>, kecuali <b>yet</b> yang di ujung.`,ex:[`Have you <b>ever</b> eaten sushi? (Pernahkah kamu makan sushi?)`,`I have <b>already</b> finished my homework.`,`He hasn't called <b>yet</b>. (Dia belum menelepon)`]},
{s:`<b>V3 ada dua jenis</b>: beraturan (tambah -ed: walk → walked → <b>walked</b>) dan tak beraturan yang harus dihafal (go → went → <b>gone</b>, eat → ate → <b>eaten</b>, see → saw → <b>seen</b>, write → wrote → <b>written</b>). Hati-hati: <b>been</b> = pernah pergi lalu sudah pulang, <b>gone</b> = pergi dan belum kembali.`,ex:[`She has <b>been</b> to Japan. (pernah ke sana, sekarang sudah pulang)`,`She has <b>gone</b> to Japan. (dia sedang di sana)`],tip:`Jebakan: <b>I have seen him yesterday</b> ❌. Ada waktu jelas (yesterday, last week, in 2020) → pakai <b>Past Simple</b>: I <b>saw</b> him yesterday ✅.`}]);
up(2,`Conditional Type 1`,[
{s:`<b>Conditional</b> itu ibarat <b>sakelar lampu</b> 💡. Kalau sakelar ditekan (<b>If</b> + kondisi), lampu menyala (<b>will</b> + hasil). Type 1 dipakai untuk <b>kemungkinan nyata di masa depan</b>: syaratnya mungkin terpenuhi, hasilnya masuk akal.`,ex:[`If it rains, I <b>will stay</b> home. (Kalau hujan, aku akan di rumah)`,`If you study hard, you <b>will pass</b> the exam.`]},
{s:`<b>Rumus</b>: <b>If + Present Simple</b>, <b>will + V1</b>. Sisi sakelar (If) <b>dilarang</b> pakai will. Urutan boleh dibalik: kalau If di depan, pakai <b>koma</b>; kalau If di belakang, <b>tanpa koma</b>.`,ex:[`If she <b>comes</b>, we <b>will start</b>. (sisi sakelar: present)`,`We <b>will start</b> if she <b>comes</b>. (dibalik, tanpa koma)`]},
{s:`Hasilnya tidak harus <b>will</b>. Ganti sesuai maksud: <b>can / may</b> (bisa / mungkin), <b>should</b> (sebaiknya), atau <b>perintah</b> (V1 langsung).`,ex:[`If you finish early, you <b>can</b> go home.`,`If you feel sick, <b>you should</b> rest.`,`If you see Tom, <b>tell</b> him to call me.`]},
2,
{k:3,s:`<b>Unless</b> itu sakelar yang dibalik: <b>unless = if … not</b>. Bagian setelah unless <b>tidak perlu negatif lagi</b>, sebab maknanya sudah negatif.`},
{s:`⚠️ <b>Jebakan nomor 1: will di sisi If.</b> Ini kesalahan paling sering di ujian. Sisi If cukup <b>present biasa</b>, will hanya milik sisi hasil.`,ex:[`If it <b>will rain</b>, I will stay home. ❌`,`If it <b>rains</b>, I will stay home. ✅`,`Unless you <b>don't</b> hurry, you'll be late. ❌ (unless sudah negatif)`],tip:`Cek cepat: kata <b>if</b> → tengok di sebelahnya. Kalau ada <b>will</b> di situ, hapus dan ganti present.`}]);
up(2,`Reported Speech`,[
{s:`<b>Reported speech</b> itu ibarat <b>menceritakan ulang omongan orang</b> 🗣️. Karena ucapannya sudah lewat, waktunya <b>mundur satu langkah</b> (backshift): present jadi past, will jadi would. Pelaku (I/you) dan penunjuk waktu juga ikut menyesuaikan sudut pandang pencerita.`,ex:[`"I <b>am</b> tired," she said. → She said (that) she <b>was</b> tired.`,`"I <b>will</b> call you," he said. → He said (that) he <b>would</b> call me.`]},
1,
{s:`<b>Rumus mundur</b> ⏪: am/is/are → <b>was/were</b>; do/does → <b>did</b>; will → <b>would</b>; can → <b>could</b>; V2 → <b>had + V3</b>. Penunjuk waktu: now → <b>then</b>, today → <b>that day</b>, tomorrow → <b>the next day</b>, yesterday → <b>the day before</b>, here → <b>there</b>.`,ex:[`"We <b>went</b> there." → They said they <b>had gone</b> there.`,`"I can swim." → She said she <b>could</b> swim.`]},
{s:`<b>Kalimat tanya</b> diubah jadi kalimat biasa (tanpa do/does dan tanpa tanda tanya). Pertanyaan <b>ya/tidak</b> memakai <b>if / whether</b>; pertanyaan <b>WH</b> tetap memakai kata tanyanya. Kata kerja <b>say</b> tanpa objek, <b>tell</b> selalu ada objek orangnya.`,ex:[`"Do you like tea?" → He asked <b>if</b> I <b>liked</b> tea.`,`"Where do you live?" → She asked <b>where</b> I <b>lived</b>.`,`He <b>told me</b> he was busy. / He <b>said</b> he was busy.`],tip:`Jebakan: <b>She asked where did I live</b> ❌ → She asked where I <b>lived</b> ✅ (urutan kembali seperti kalimat biasa).`}]);
up(2,`Passive Voice`,[0,1,2,
{s:`<b>3 langkah memindahkan lampu sorot</b> 🔦: <br>① Objek kalimat aktif naik jadi <b>subjek</b>.<br>② Pasang <b>be</b> sesuai waktu (is/are, was/were, will be).<br>③ Kata kerja berubah jadi <b>V3</b>, pelaku lama ke belakang pakai <b>by</b> (boleh dihapus).`,ex:[`Mom <b>made</b> the cake. → The cake <b>was made</b> by Mom.`,`They <b>speak</b> English here. → English <b>is spoken</b> here.`]},

{s:`⚠️ <b>Kapan pakai pasif?</b> Saat <b>pelakunya tidak penting, tidak diketahui, atau sudah jelas</b>. Dan hanya kata kerja yang <b>punya objek</b> yang bisa dipasifkan; kata kerja seperti <b>arrive, sleep, happen</b> tidak bisa.`,ex:[`My bike <b>was stolen</b>. (tidak tahu siapa pencurinya)`,`The accident <b>happened</b> last night. ✅ (bukan "was happened" ❌)`],tip:`Jebakan: <b>The window broken</b> ❌ (lupa be) → The window <b>was broken</b> ✅. Rumus wajib lengkap: <b>be + V3</b>.`}]);

up(1,`Present Continuous`,[
{s:`Kalau Simple Present itu <b>buku harian</b>, <b>Present Continuous</b> itu <b>siaran langsung</b> 🎥: kejadian yang <b>sedang berlangsung saat ini</b>. Rumus: <b>am / is / are + V-ing</b>. Kode penandanya: <b>now, right now, at the moment, Look!, Listen!</b>`,ex:[`She <b>is cooking</b> now. (Dia sedang memasak)`,`Look! The baby <b>is sleeping</b>. (Lihat! Bayinya sedang tidur)`,`I <b>am reading</b> at the moment.`]},
1,
{s:`Menambah <b>-ing</b> ada 3 aturan: ① biasa tambah -ing (play → playing). ② akhiran <b>e</b> dibuang (write → <b>writing</b>). ③ <b>1 vokal + 1 konsonan</b> di ujung, konsonannya digandakan (run → <b>running</b>, swim → <b>swimming</b>). Khusus <b>ie</b> jadi <b>y</b> (lie → <b>lying</b>).`,ex:[`make → <b>making</b>`,`sit → <b>sitting</b>`,`play → <b>playing</b> (berakhir w/y/x tidak digandakan)`]},
{k:3,s:`Ada kata kerja yang <b>tidak bisa disiarkan langsung</b>: kata kerja perasaan dan pikiran (<b>like, love, know, want, need, understand</b>). Ibarat patung: tidak "sedang melakukan", cuma "ada". Untuk itu pakai Simple Present.`},
{s:`⚠️ <b>Jebakan nomor 1: lupa to be.</b> Hanya V-ing saja <b>belum cukup</b>, harus ada <b>am/is/are</b> di depannya. Ibarat mobil (V-ing) yang butuh mesin (to be).`,ex:[`She <b>cooking</b> now. ❌ → She <b>is cooking</b> now. ✅`,`They <b>are play</b> football. ❌ → They <b>are playing</b> football. ✅`],tip:`Cek cepat: lihat <b>-ing</b> di kalimat? Pastikan ada <b>am/is/are</b> tepat sebelumnya.`}]);
up(1,`Past Tense`,[
{s:`<b>Past Tense</b> itu ibarat <b>foto lama</b> 📷: kejadiannya <b>sudah selesai dan waktunya jelas</b>. Kode penandanya: <b>yesterday, last night, last week, two days ago, in 2020</b>.`,ex:[`I <b>watched</b> a movie yesterday. (Aku menonton film kemarin)`,`She <b>visited</b> Bali last year.`]},
{s:`Kata kerja <b>beraturan</b> cukup tambah <b>-ed</b>, dengan 3 variasi: biasa (walk → walked), akhiran e cukup tambah d (like → <b>liked</b>), konsonan + y jadi <b>-ied</b> (study → <b>studied</b>).`,ex:[`play → <b>played</b>`,`dance → <b>danced</b>`,`cry → <b>cried</b>`]},
{s:`Kata kerja <b>tak beraturan</b> ibarat "murid bandel": bentuknya berubah total, hafalkan berkelompok biar mudah.`,ex:[`go → <b>went</b>, eat → <b>ate</b>, see → <b>saw</b>`,`buy → <b>bought</b>, teach → <b>taught</b>, think → <b>thought</b>`,`write → <b>wrote</b>, take → <b>took</b>, give → <b>gave</b>`]},
{s:`Di masa lampau, satpam hanya punya <b>satu seragam: did</b> 🛡️. Untuk negatif dan tanya, pakai <b>did / didn't</b>, lalu kata kerja <b>kembali polos (V1)</b>, karena "waktu lampau" sudah ditangani satpam.`,ex:[`I <b>didn't go</b> to school. (bukan didn't went)`,`<b>Did</b> you <b>see</b> it? → Yes, I <b>did</b>.`]},
{s:`⚠️ <b>Jebakan nomor 1: dua tanda lampau sekaligus.</b> Setelah <b>did</b>, jangan pakai V2 lagi.`,ex:[`Did she <b>went</b> home? ❌ → Did she <b>go</b> home? ✅`,`He didn't <b>bought</b> it. ❌ → He didn't <b>buy</b> it. ✅`],tip:`Satu kalimat, satu tanda lampau saja: kalau did sudah ada, kata kerja polos.`}]);
up(1,`Past Continuous`,[
{s:`<b>Past Continuous</b> itu ibarat <b>video yang di-pause di tengah adegan</b> ⏸️: aksi yang <b>sedang berlangsung di waktu tertentu di masa lalu</b>. Rumus: <b>was / were + V-ing</b> (was untuk I/He/She/It, were untuk You/We/They).`,ex:[`At 8 last night, I <b>was studying</b>. (Jam 8 semalam, aku sedang belajar)`,`They <b>were playing</b> when it rained.`]},
{s:`Sering berpasangan dengan Past Simple: aksi panjang ibarat <b>sungai mengalir</b> 🌊 yang dipotong aksi pendek ibarat <b>batu jatuh</b> 🪨. Sungai = Past Continuous, batu = Past Simple.`,ex:[`I <b>was cooking</b> when the phone <b>rang</b>. (sungai dipotong batu)`,`While she <b>was reading</b>, he <b>slept</b>.`],tip:`<b>While</b> + proses panjang (V-ing), <b>when</b> + kejadian pendek (V2).`},
{s:`Dua sungai mengalir <b>bersamaan</b>? Pakai past continuous di kedua sisi, disambung <b>while</b>. Dan ingat, kata kerja perasaan (know, like) tetap tidak dipakai di bentuk continuous.`,ex:[`<b>While</b> Mom <b>was cooking</b>, I <b>was cleaning</b>. (dua aktivitas bersamaan)`,`I <b>liked</b> the song. ✅ (bukan was liking)`]}]);
up(1,`Future: will & going to`,[
{s:`Dua cara bicara masa depan. <b>will</b> = keputusan <b>spontan</b>, janji, atau tebakan, seperti <b>ide mendadak</b> 💡. <b>going to</b> = <b>rencana yang sudah disiapkan</b> atau prediksi dengan bukti, seperti <b>tiket yang sudah dibeli</b> 🎟️.`,ex:[`The phone is ringing. I <b>will</b> answer it. (spontan)`,`I <b>am going to</b> visit Bali next week. (sudah direncanakan)`]},
1,
{s:`Rumus lengkapnya: <b>will + V1</b> (negatif <b>won't</b> / <b>will not</b>, tanya: Will you…?). <b>am/is/are going to + V1</b> (negatif: am/is/are <b>not</b> going to). Jangan lupa to be di going to!`,ex:[`I <b>won't</b> be late. (janji)`,`<b>Will</b> you help me? → Yes, I <b>will</b>.`,`She <b>is going to</b> study tonight.`]},
{s:`Prediksi dengan <b>bukti di depan mata</b> pakai <b>going to</b>. Prediksi dari <b>pendapat atau perasaan</b> (I think, I guess, maybe, probably) pakai <b>will</b>.`,ex:[`Look at those clouds! It <b>is going to</b> rain. (ada bukti)`,`I think she <b>will</b> win. (pendapat)`],tip:`Jebakan: <b>She going to study</b> ❌ (lupa is) → She <b>is going to</b> study ✅.`}]);
up(1,`Modal: can / must / should`,[
{s:`<b>Modal verb</b> itu ibarat <b>tombol remote</b> 🎮 yang mengubah "mode" kalimat. Rumus super mudah: <b>modal + V1</b>, tanpa -s dan tanpa to. Kemampuan (<b>can</b>), kewajiban (<b>must</b>), saran (<b>should</b>).`,ex:[`She <b>can swim</b>. (kemampuan)`,`He <b>must go</b>. (kewajiban)`,`You <b>should rest</b>. (saran)`]},
1,
2,
{s:`Modal lain untuk situasi sopan dan aturan: <b>may</b> (izin sopan), <b>could</b> (permintaan sopan), <b>mustn't</b> (dilarang keras), <b>don't have to</b> (tidak wajib, boleh tidak). Hati-hati: <b>mustn't ≠ don't have to</b>.`,ex:[`<b>May</b> I come in?`,`<b>Could</b> you help me, please?`,`You <b>mustn't</b> run here. (dilarang)`,`You <b>don't have to</b> come. (tidak wajib)`]},
{s:`⚠️ <b>Jebakan nomor 1: to dan -s nyasar.</b> Modal sudah "VIP": tidak mau ditemani <b>to</b> dan tidak butuh <b>-s</b>.`,ex:[`She can <b>to</b> swim. ❌ → She can swim. ✅`,`He should <b>goes</b>. ❌ → He should <b>go</b>. ✅`],tip:`Kecuali <b>have to</b> dan <b>ought to</b>, modal tidak pernah diikuti <b>to</b>.`}]);
up(1,`Comparative & Superlative`,[
{s:`Membandingkan itu ibarat <b>podium lomba</b> 🏆. <b>Dua</b> orang: pakai <b>-er + than</b> (comparative). <b>Banyak</b> orang: pakai <b>the -est</b> (juara satu, superlative).`,ex:[`Tom is <b>taller than</b> Ali. (Tom lebih tinggi dari Ali)`,`Tom is <b>the tallest</b> in the class. (paling tinggi di kelas)`]},
1,
{s:`Aturan ejaan: kata sifat <b>pendek</b> + er/est (tall → taller → the tallest). Berakhir e, tambah r/st (nice → nicer → <b>the nicest</b>). Konsonan + y jadi <b>-ier/-iest</b> (happy → <b>happier</b> → <b>the happiest</b>). 1 vokal + 1 konsonan, gandakan (big → <b>bigger</b> → <b>the biggest</b>).`,ex:[`A cat is <b>smaller</b> than a dog.`,`She is <b>happier</b> today.`]},

up(0,`Kemarin, Sekarang, Besok`,[
0,
{s:`Cara cepat menebak: <b>kemarin</b> → kata kerja berubah (play → <b>played</b>). <b>Sekarang</b> → kata kerja biasa. <b>Besok</b> → tambah <b>will</b> di depan kata kerja. Jadi kamu cuma perlu tahu "foto yang mana" dulu.`,ex:[`<b>Yesterday</b>, I <b>played</b> football. (kemarin)`,`<b>Every day</b>, I <b>play</b> football. (kebiasaan)`,`<b>Tomorrow</b>, I <b>will play</b> football. (besok)`]},
1,
{s:`Hati-hati sama kata kerja "murid bandel": bentuk kemarinnya tidak pakai -ed, tapi berubah total. Hafalkan pelan-pelan, mulai dari 4 ini dulu.`,ex:[`go → <b>went</b> (I went to school yesterday.)`,`eat → <b>ate</b> (She ate rice yesterday.)`,`see → <b>saw</b> (We saw a cat yesterday.)`,`have → <b>had</b> (He had breakfast.)`],tip:`Jebakan: <b>I will went</b> ❌ → I will <b>go</b> ✅. Setelah will, kata kerja selalu polos.`}]);
up(0,`Pertanyaan WH`,[
0,
{s:`Cara menyusun pertanyaan WH ada 2 rumus. Kalau kalimatnya pakai <b>to be</b>: <b>kata tanya + is/are + subjek</b>. Kalau pakai kata kerja biasa: <b>kata tanya + do/does + subjek + V1</b>. Ingat satpam <b>does</b> untuk He/She/It!`,ex:[`Where <b>is</b> she? (Dia di mana?)`,`Where <b>does</b> she <b>live</b>? (Dia tinggal di mana?)`,`What <b>do</b> you <b>want</b>? (Kamu mau apa?)`]},
{s:`Jawabannya mengikuti kata tanya. Kalau ditanya <b>Who</b>, jawab orang. <b>Where</b>, jawab tempat. <b>When</b>, jawab waktu. <b>What</b>, jawab benda. Jadi sebelum menjawab, tebak dulu "petunjuk apa yang dicari detektif?".`,ex:[`<b>Who</b> is he? → He is my teacher. (orang)`,`<b>When</b> is your birthday? → It is in May. (waktu)`]},
2,
{s:`⚠️ <b>Jebakan nomor 1: lupa pakai do/does.</b> Kata kerja biasa tidak bisa langsung loncat ke depan seperti to be. Panggil satpam dulu.`,ex:[`Where she lives? ❌ → Where <b>does</b> she <b>live</b>? ✅`,`What you want? ❌ → What <b>do</b> you want? ✅`],tip:`Dan ingat: sesudah does, kata kerja polos. Does she <b>live</b>, bukan does she lives.`}]);
up(0,`A / An`,[
0,
{s:`Aturannya cuma satu: lihat <b>bunyi pertama</b> kata sesudahnya. Bunyi <b>vokal</b> (a, i, u, e, o) pakai <b>an</b>, supaya enak diucapkan. Bunyi lainnya pakai <b>a</b>. Plus, <b>a/an</b> cuma untuk benda yang <b>tunggal</b> dan <b>bisa dihitung</b>.`,ex:[`<b>an</b> egg, <b>an</b> orange, <b>an</b> umbrella`,`<b>a</b> cat, <b>a</b> dog, <b>a</b> book`,`<b>a</b> books ❌ → books ✅ (jamak tidak pakai a)`]},
2,
3,
{s:`Kapan pakai <b>a/an</b>? Saat kamu menyebut benda <b>untuk pertama kali</b>, atau menyebut <b>profesi</b>. Kapan pakai <b>the</b>? Saat bendanya sudah <b>jelas</b>, karena sudah disebut atau cuma ada satu.`,ex:[`I see <b>a</b> dog. <b>The</b> dog is big. (pertama kali, lalu sudah jelas)`,`She is <b>a</b> teacher. / He is <b>an</b> engineer.`,`<b>The</b> sun is hot. (matahari cuma satu)`],tip:`Tes cepat: <b>an</b> hour ✅ (bunyi "aur"), <b>a</b> university ✅ (bunyi "yu"). Dengarkan bunyinya, bukan lihat hurufnya.`}]);
up(0,`Kata Ganti & Kepemilikan`,[
0,1,
{k:2,s:`Jebakan klasik: <b>its</b> vs <b>it's</b>. Apostrof itu tanda "ada huruf yang hilang": <b>it's</b> = it is. Kalau tidak ada yang hilang, itu kepemilikan. Hal yang sama untuk <b>your</b> (milikmu) vs <b>you're</b> (= you are), dan <b>their</b> (milik mereka) vs <b>they're</b> (= they are).`,ex:[`<b>It's</b> cold. (= It is)`,`The cat licks <b>its</b> paw.`,`<b>You're</b> late. / Where is <b>your</b> bag?`]},
3,
{s:`Cara pilih kostum yang tepat: tanya <b>"apa peranku di kalimat ini?"</b> Pelaku di depan → <b>I, he, she, we, they</b>. Penerima di belakang kata kerja → <b>me, him, her, us, them</b>. Pemilik sebelum benda → <b>my, his, her, our, their</b>.`,ex:[`<b>They</b> help <b>us</b>. (pelaku, penerima)`,`<b>Her</b> bag is red. (pemilik)`,`The red bag is <b>hers</b>. (milik dia, tanpa benda)`],tip:`Jebakan: <b>Me and he go</b> ❌ → <b>He and I</b> go ✅ (di posisi pelaku, pakai I/he).`}]);
up(0,`This / That / These / Those`,[
0,
{s:`Cara memilih gampang: tanya <b>2 hal</b>. ① <b>Dekat atau jauh</b> dari kamu? Dekat → <b>this/these</b> (pegang di tangan), jauh → <b>that/those</b> (tunjuk dari seberang). ② <b>Satu atau banyak</b>? Satu → <b>this/that</b>, banyak → <b>these/those</b>.`,ex:[`<b>This</b> pencil is new. (dekat, satu)`,`<b>That</b> house is big. (jauh, satu)`,`<b>These</b> books are mine. (dekat, banyak)`,`<b>Those</b> birds are beautiful. (jauh, banyak)`]},
1,
{s:`Kata tunjuk juga dipakai untuk <b>bertanya dan menjawab</b>. Pertanyaan <b>What's this?</b> dijawab <b>It's a …</b>, sedangkan <b>What are these?</b> dijawab <b>They're …</b> (karena banyak benda).`,ex:[`<b>What's this?</b> → <b>It's</b> a pen.`,`<b>What are those?</b> → <b>They're</b> birds.`],tip:`Satu benda jawab <b>It's</b>, banyak benda jawab <b>They're</b>.`}]);
up(0,`Preposisi: in / on / at`,[
0,
{s:`Preposisi tempat lainnya: <b>in front of</b> (di depan), <b>behind</b> (di belakang), <b>between</b> (di antara dua benda), <b>above</b> (di atas, tidak menempel), <b>under</b> (di bawah). Bayangkan boneka dan kotak tadi, lalu geser posisinya!`,ex:[`The ball is <b>behind</b> the chair.`,`The cat is <b>between</b> the box and the bag.`,`The lamp is <b>above</b> the table.`]},
1,
{s:`<b>Rumus waktu</b> ⏰ seperti corong terbalik: <b>in</b> untuk yang paling lebar (bulan, tahun, pagi/sore/malam), <b>on</b> untuk hari dan tanggal, <b>at</b> untuk yang paling sempit (jam dan titik waktu).`,ex:[`<b>in</b> May, <b>in</b> 2025, <b>in</b> the evening`,`<b>on</b> Monday, <b>on</b> 17 August`,`<b>at</b> 7 o'clock, <b>at</b> night, <b>at</b> noon`],tip:`Jebakan: <b>in the night</b> ❌ → <b>at night</b> ✅ (ini pengecualian, hafalkan!).`}]);
}catch(e){console.warn('v41 gagal',e)}})();
</script>
<script id="materi-v42">
/* v42: SD: Kosakata Dasar, Jenis-jenis Teks, Membaca & Menulis Dasar. SMP: Have/Has, Do/Does, Go/Goes (langkah ganda dirapikan) */
(function(){try{
const up=(li,name,list)=>{const M=LEVELS[li].mods.find(x=>x.n===name);if(!M)return;const old=M.steps,mp=old.find(s=>s.map);
M.steps=list.map(e=>typeof e==='number'?old[e]:(e.k!=null?Object.assign({},old[e.k],e):Object.assign({ex:[]},e)));if(mp)M.steps.push(mp)};
up(0,`Kosakata Dasar`,[
0,1,
{s:`<b>Keluarga</b> 👨‍👩‍👧: <b>father</b> ayah, <b>mother</b> ibu, <b>brother</b> saudara laki-laki, <b>sister</b> saudara perempuan, <b>grandmother</b> nenek, <b>grandfather</b> kakek. Trik: ucapkan kalimat tentang keluargamu sendiri, biar menempel di kepala.`,ex:[`My <b>father</b> is kind. (Ayahku baik hati)`,`I love my <b>sister</b>.`,`My <b>grandmother</b> cooks well.`]},
{s:`<b>Warna & hewan</b> 🎨🐱: <b>red</b> merah, <b>blue</b> biru, <b>green</b> hijau, <b>yellow</b> kuning, <b>cat</b> kucing, <b>bird</b> burung, <b>fish</b> ikan. Urutannya: <b>warna dulu, baru benda</b> (kebalikan bahasa Indonesia!).`,ex:[`A <b>red</b> bird. (burung merah, bukan "bird red")`,`The <b>blue</b> cat.`]},
{s:`<b>Angka & sekolah</b> 🔢🎒: one, two, three… ten. Benda sekolah: <b>book</b> buku, <b>pen</b> pulpen, <b>desk</b> meja, <b>bag</b> tas, <b>teacher</b> guru. Benda lebih dari satu biasanya tambah <b>-s</b>.`,ex:[`I have <b>three</b> books.`,`The <b>teacher</b> has a <b>pen</b> and a <b>bag</b>.`],tip:`Satu benda: a book. Banyak benda: three book<b>s</b> (jangan lupa -s).`}]);
up(0,`Jenis-jenis Teks`,[
0,
{s:`Mari kenali empat teks utama lewat <b>ciri khasnya</b>: <b>Descriptive</b> menggambarkan (pakai sekarang), <b>Recount</b> menceritakan pengalaman (pakai lampau), <b>Procedure</b> memberi langkah-langkah (pakai First, Then, Next), <b>Narrative</b> cerita khayalan (pakai Once upon a time).`,ex:[]},
1,
{s:`<b>Kata penanda</b> 🔖 membantu menebak jenis teks tanpa membaca semuanya. Ada <b>yesterday</b>? Itu Recount. Ada <b>First, Then, Finally</b>? Itu Procedure. Ada <b>Once upon a time</b>? Itu Narrative. Banyak <b>is/has</b> menggambarkan benda? Itu Descriptive.`,ex:[`<b>Yesterday</b>, we went to the beach. (Recount)`,`<b>First</b>, wash your hands. <b>Then</b>, dry them. (Procedure)`],tip:`Cara cepat: lihat kalimat pertama dan kata penghubungnya. Dari situ, teksnya sudah ketahuan.`}]);
up(0,`Membaca & Menulis Dasar`,[
0,
{s:`Aturan menulis kalimat yang benar: ① awali dengan <b>huruf kapital</b>. ② Ada <b>pelaku + kata kerja</b>. ③ Akhiri dengan <b>titik</b> (atau tanda tanya untuk pertanyaan). Kata <b>I</b> dan nama orang, hari, bulan selalu kapital.`,ex:[`<b>M</b>y name is Dina<b>.</b>`,`Do you like apples<b>?</b>`,`On <b>M</b>onday, I meet <b>T</b>om.`]},
1,
{s:`<b>Cara membaca teks pendek</b> 🔦: ① baca sekali untuk gambaran umum. ② baca soalnya. ③ sorot <b>kata kunci</b> di teks yang cocok dengan soal. Jangan menebak, jawabannya selalu ada di teks!`,ex:[`<b>Teks:</b> Dina has a red bag. It is new.`,`<b>Soal:</b> What color is Dina's bag? → <b>Red</b>.`],tip:`Kata kunci soal (what color, who, where) menunjukkan jenis jawabannya: warna, orang, atau tempat.`}]);
up(1,`Have / Has`,[
0,1,
{s:`Hati-hati! Kalau <b>satpam do/does</b> sudah berdiri di depan, kata kerja di belakangnya <b>kembali polos</b>. Jadi <b>has</b> berubah jadi <b>have</b>. Aturan ini sama dengan semua kata kerja lain.`,ex:[`She has a pen. → She <b>doesn't have</b> a pen.`,`<b>Does</b> she <b>have</b> a pen? → Yes, she <b>does</b>.`],tip:`Jebakan: <b>She doesn't has</b> ❌ → She doesn't <b>have</b> ✅.`},
{s:`<b>Have/has</b> tidak selalu berarti "punya". Bisa juga <b>makan/minum</b> (have breakfast), <b>melakukan/mengalami</b> (have a meeting, have fun), dan <b>sakit</b> (have a headache).`,ex:[`I <b>have</b> breakfast at six. (makan)`,`We <b>have</b> a meeting today. (mengadakan)`,`She <b>has</b> a good time. (menikmati)`]},
{s:`Beda <b>have got</b> dan <b>have</b>: artinya sama (punya), tapi <b>have got</b> lebih santai. Untuk He/She/It: <b>has got</b>. Negatif: <b>haven't got / hasn't got</b>.`,ex:[`I <b>have got</b> a new phone. (= I have a new phone)`,`She <b>has got</b> two brothers.`]}]);
up(1,`Do / Does`,[
0,1,2,
{s:`<b>Do/does</b> juga bisa jadi <b>kata kerja utama</b> yang artinya <b>mengerjakan</b>: do homework, do the dishes, do yoga. Beda dari satpam, di sini dia punya kata benda sesudahnya.`,ex:[`He <b>does</b> his homework. (mengerjakan PR)`,`I <b>do</b> the dishes. (mencuci piring)`]},
{s:`Kalau satpam <b>dan</b> kata kerja utama sama-sama do, jadinya: <b>Do you do yoga?</b> Satpam di depan, pekerja di belakang. Dan <b>does</b> pasangannya He/She/It.`,ex:[`<b>Does</b> she <b>do</b> her homework?`,`She <b>doesn't do</b> yoga.`],tip:`Jebakan: <b>She do her homework</b> ❌ → She <b>does</b> her homework ✅.`}]);
up(1,`Go / Goes (-s/-es)`,[
0,
{s:`Aturan topi besar: kata kerja berakhiran <b>-o, -s, -sh, -ch, -x, -z</b> itu "kepalanya besar", butuh topi <b>-es</b>. Jembatan keledai: <b>go-es</b>!`,ex:[`go → <b>goes</b>, do → <b>does</b>`,`watch → <b>watches</b>, wash → <b>washes</b>`,`fix → <b>fixes</b>, miss → <b>misses</b>`]},
2,3,
{s:`<b>Rangkuman 4 topi</b> 🎩: biasa +<b>s</b> (eats), -o/s/sh/ch/x/z +<b>es</b> (goes, watches), konsonan+y → <b>ies</b> (studies), <b>have → has</b> (spesial). Kalau ragu, lihat huruf terakhir kata kerjanya.`,ex:[`He <b>goes</b> home. / She <b>watches</b> TV.`,`My sister <b>studies</b> hard. / He <b>has</b> a dog.`],tip:`Topi ini hanya untuk kalimat <b>positif</b> He/She/It. Di negatif dan tanya, topinya pindah ke does.`}]);
}catch(e){console.warn('v42 gagal',e)}})();
</script>
<script id="materi-v43">
/* v43: SMP: Quantifiers, Kata Sambung, Parts of Speech, Kosakata Sehari-hari, Reading Skills, Percakapan Dasar */
(function(){try{
const up=(li,name,list)=>{const M=LEVELS[li].mods.find(x=>x.n===name);if(!M)return;const old=M.steps,mp=old.find(s=>s.map);
M.steps=list.map(e=>typeof e==='number'?old[e]:(e.k!=null?Object.assign({},old[e.k],e):Object.assign({ex:[]},e)));if(mp)M.steps.push(mp)};
up(1,`Quantifiers: much / many / some / any`,[
0,1,
{s:`Cara memilih: tanya dulu <b>"bisa dihitung satuan?"</b>. Bisa (apples, books) → <b>many</b>, <b>a few</b> (sedikit), <b>How many</b>. Tidak bisa (water, money, time) → <b>much</b>, <b>a little</b> (sedikit), <b>How much</b>. Di kalimat positif, <b>a lot of</b> aman untuk keduanya.`,ex:[`How <b>many</b> apples do you have? (terhitung)`,`How <b>much</b> water do you drink? (tak terhitung)`,`I have <b>a few</b> friends / <b>a little</b> time.`]},
{s:`<b>Some</b> dipakai di kalimat <b>positif</b> dan tawaran. <b>Any</b> dipakai di kalimat <b>negatif</b> dan <b>tanya</b>. Tapi saat menawarkan atau meminta, <b>some</b> tetap dipakai karena kita berharap jawabannya "ya".`,ex:[`I have <b>some</b> money.`,`I don't have <b>any</b> money.`,`Do you have <b>any</b> pens?`,`Would you like <b>some</b> tea? (tawaran)`],tip:`Jebakan: <b>much</b> jarang dipakai di kalimat positif. Ganti dengan <b>a lot of</b>: I have <b>a lot of</b> homework ✅.`}]);
up(1,`Kata Sambung`,[
0,
{s:`Kunci <b>so</b> vs <b>because</b>: keduanya menyambung <b>sebab dan akibat</b>, tapi arah panahnya berlawanan. Sebab → <b>so</b> → akibat. Akibat ← <b>because</b> ← sebab. Tanya diri sendiri: "bagian mana yang jadi alasan?"`,ex:[`I was tired, <b>so</b> I slept. (sebab dulu, lalu so)`,`I slept <b>because</b> I was tired. (akibat dulu, lalu because)`]},
{s:`<b>But</b> dan <b>although</b> sama-sama menunjukkan <b>pertentangan</b>. <b>But</b> disambung koma di tengah. <b>Although</b> (meskipun) boleh di depan, dan <b>tidak boleh dipasangkan dengan but</b> dalam satu kalimat.`,ex:[`It was cold, <b>but</b> we went swimming.`,`<b>Although</b> it was cold, we went swimming.`],tip:`Jebakan: <b>Although it was cold, but we swam</b> ❌ → pilih satu: although saja atau but saja.`},
{s:`<b>Or</b> untuk pilihan, <b>then</b> untuk urutan, dan <b>and</b> untuk menambah. Saat menyambung dua kalimat lengkap dengan <b>and / but / so</b>, taruh <b>koma</b> sebelum kata sambungnya.`,ex:[`Do you want tea <b>or</b> coffee?`,`I woke up, <b>and</b> I took a shower.`,`First I ate, <b>then</b> I studied.`]}]);
up(1,`Parts of Speech`,[
0,1,
{s:`Cara menebak kelas kata dari posisinya: <b>setelah the/a/my</b> biasanya <b>noun</b> atau adjective. <b>Setelah subjek</b> biasanya <b>verb</b>. <b>Sebelum noun</b> biasanya <b>adjective</b>. <b>Di akhir / dekat verb</b> biasanya <b>adverb</b>.`,ex:[`The <b>happy</b> <b>girl</b> <b>sings</b> <b>loudly</b>. (adj, noun, verb, adverb)`,`She <b>quickly</b> ran home. (adverb di depan verb)`]},
{s:`<b>8 kelas kata</b> sebagai tim: <b>noun</b> (benda), <b>pronoun</b> (pengganti benda), <b>verb</b> (aksi), <b>adjective</b> (sifat benda), <b>adverb</b> (cara/waktu/tempat), <b>preposition</b> (posisi), <b>conjunction</b> (penyambung), <b>interjection</b> (seruan, Wow!).`,ex:[`<b>Wow</b>! <b>She</b> <b>is</b> a <b>very</b> <b>good</b> singer <b>in</b> the class <b>and</b> at home.`]},
{s:`Kata sifat menjelaskan <b>benda</b> (a <b>beautiful</b> flower), kata keterangan menjelaskan <b>aksi</b> (she sings <b>beautifully</b>). Ingat: <b>good → well</b> (adverb), <b>fast → fast</b>.`,ex:[`She is a <b>good</b> singer. / She sings <b>well</b>.`,`He is a <b>fast</b> runner. / He runs <b>fast</b>.`],tip:`Jebakan: <b>She sings beautiful</b> ❌ → She sings <b>beautifully</b> ✅.`}]);
up(1,`Kosakata Sehari-hari & Mapel`,[
0,1,
{s:`<b>Collocation</b> (pasangan kata): kata kerja tertentu "cocok" dengan benda tertentu. <b>do</b> homework / the dishes, <b>make</b> the bed / a cake / a mistake, <b>take</b> a shower / a nap, <b>have</b> breakfast / lunch. Ucapkan sebagai satu paket, jangan satu-satu.`,ex:[`I <b>do</b> my homework after school.`,`She <b>makes</b> the bed every morning.`,`He <b>takes</b> a nap at noon.`],tip:`Jebakan: <b>make homework</b> ❌ → <b>do</b> homework ✅. <b>Do</b> untuk tugas, <b>make</b> untuk membuat sesuatu.`},
2,
{s:`Kosakata dipakai di <b>kalimat nyata</b> biar melekat. Latihan sederhana: pilih 3 kata baru hari ini, buat 1 kalimat tentang dirimu untuk tiap kata, lalu ucapkan keras-keras.`,ex:[`<b>Science</b>: I like Science because we do experiments.`,`<b>Ruler</b>: Can I borrow your ruler, please?`]}]);
up(1,`Reading Skills`,[
0,1,
{s:`<b>Langkah membaca teks soal</b> 🪜: ① <b>skim</b> dulu (judul, kalimat pertama tiap paragraf). ② Baca <b>soal</b> dan garis bawahi kata kunci. ③ <b>Scan</b> teks untuk mencocokkan kata kunci. ④ Pilih jawaban yang <b>didukung teks</b>, bukan yang kamu rasa benar.`,ex:[]},
2,
{s:`<b>Inference</b> = menyimpulkan yang tidak ditulis langsung, seperti detektif. Cari <b>petunjuk</b> di teks, lalu simpulkan. Dari teks tidur tadi: remaja tidur 6 jam padahal butuh 8-10, jadi <b>mereka kurang tidur</b>.`,ex:[`Teks: "Tom yawned and rubbed his eyes." → Tom is <b>sleepy</b>.`],tip:`Jebakan: jangan memilih jawaban yang "benar secara umum" tapi tidak ada di teks.`}]);
up(1,`Percakapan Dasar`,[
0,
{s:`<b>Salam dan perkenalan</b> 👋: kenalan pakai pola <b>Hello → nama → senang bertemu</b>. Tanya kabar dengan <b>How are you?</b>, lalu jangan lupa <b>balik bertanya</b>: <b>And you?</b>. Itulah yang membuat percakapan hidup.`,ex:[`A: Hi, I'm Rina. <b>Nice to meet you.</b>`,`B: Nice to meet you too. I'm Budi.`,`A: <b>How are you?</b> B: I'm fine, thanks. <b>And you?</b>`]},
1,2,
{s:`<b>Cara menjawab yang bagus</b> bukan cuma "yes/no", tapi tambah <b>satu informasi</b>. Jawaban ini membuat lawan bicara punya bahan untuk bertanya lagi, jadi obrolan jalan terus.`,ex:[`<b>Do you like music?</b> → Yes, I do. I love pop songs.`,`<b>Where do you live?</b> → I live in Jakarta. It's very busy.`],tip:`Rumus emas: jawab pertanyaan + tambah 1 kalimat info.`}]);

{s:`<b>Kata penanda waktu</b> 🔑 membantu memilih tense: <b>every day, usually</b> → Simple Present. <b>now, at the moment</b> → Present Continuous. <b>yesterday, ago</b> → Simple Past. <b>already, just, yet, since, for</b> → Present Perfect. <b>tomorrow, next week</b> → Future.`,ex:[`She <b>works</b> every day. (Simple Present)`,`She <b>is working</b> now. (Present Continuous)`,`She <b>has worked</b> here since 2020. (Present Perfect)`]},

up(1,`Peta 13 Jenis Teks`,[0,1,2,

up(1,`Teks Faktual: Report, News Item, Explanation`,[0,1,2,
{s:`<b>Ciri bahasa</b> tiap teks: <b>Report</b> pakai <b>present tense</b> dan kata benda jamak (Elephants are…). <b>News Item</b> pakai <b>past tense</b> dan kutipan (He said that…). <b>Explanation</b> pakai <b>present</b> dan kata urutan/sebab (first, then, because).`,ex:[`<b>Report:</b> Whales <b>are</b> mammals. They <b>live</b> in the ocean.`,`<b>News:</b> The mayor <b>said</b> the road <b>would be</b> repaired.`,`<b>Explanation:</b> Water <b>evaporates</b>, <b>then</b> it forms clouds.`]},

3]);

{s:`<b>Ciri bahasa</b>: <b>Review</b> pakai kata sifat penilaian (delicious, slow, fantastic) dan <b>but / however</b> untuk plus-minus. <b>Advertisement</b> pakai kalimat <b>perintah</b> (Try it!) dan kata sifat positif. <b>Spoof</b> pakai <b>past tense</b> dan akhir yang tak terduga.`,ex:[`<b>Review:</b> The food is <b>great</b>, <b>but</b> the room is small.`,`<b>Ad:</b> <b>Buy</b> one, get one free! <b>Hurry</b> up!`]},

3]);
up(2,`Relative Clauses`,[0,1,2,3,
{s:`<b>Relative pronoun boleh dihapus</b> kalau ia berperan sebagai <b>objek</b> (kata yang mengikutinya sudah punya subjek sendiri). Kalau ia berperan sebagai <b>subjek</b>, wajib ada.`,ex:[`The book <b>(which)</b> I read was great. (boleh dihapus)`,`The girl <b>who</b> sings is my sister. (wajib, who = subjek)`]},
{s:`<b>Where dan whose</b>: <b>where</b> untuk tempat (= in/at which), <b>whose</b> untuk kepemilikan, selalu diikuti <b>kata benda</b>.`,ex:[`This is the school <b>where</b> I studied.`,`The man <b>whose</b> car was stolen called the police.`],tip:`Jebakan: <b>The girl who she sings</b> ❌ → The girl <b>who sings</b> ✅. Jangan ulang subjeknya.`}]);
up(2,`Gerund vs Infinitive`,[0,1,2,3,
{s:`<b>Daftar yang wajib diingat</b> 📋: <b>+ V-ing</b>: enjoy, avoid, finish, mind, suggest, keep, practice, consider. <b>+ to V1</b>: want, hope, decide, plan, promise, need, learn, agree, refuse. Hafalkan dengan "kepribadian": menikmati/menghindari → V-ing, cita-cita/rencana → to V1.`,ex:[`She <b>avoids eating</b> sugar.`,`He <b>refused to help</b> us.`]},
{s:`<b>Remember, forget, try</b> juga berubah arti. <b>Remember to + V1</b> = ingat <b>untuk</b> melakukan (belum). <b>Remember V-ing</b> = ingat <b>pernah</b> melakukan (sudah). <b>Try to</b> = berusaha, <b>try V-ing</b> = mencoba hasilnya.`,ex:[`I <b>remembered to lock</b> the door. (aku ingat lalu mengunci)`,`I <b>remember meeting</b> him. (aku ingat pernah bertemu)`],tip:`Setelah <b>preposisi</b> (in, of, about, for) selalu <b>V-ing</b>: She is good <b>at swimming</b> ✅.`}]);

up(2,`Present Perfect Continuous`,[0,1,
{s:`<b>Kapan dipakai?</b> ① Aksi <b>masih berlangsung</b> dan durasinya disorot (for, since, all day). ② Aksi <b>baru berhenti</b> dan akibatnya terlihat sekarang. Penanda: <b>for, since, all day, lately, recently</b>.`,ex:[`I <b>have been studying</b> for two hours. (masih lanjut)`,`Why are you wet? It <b>has been raining</b>. (baru berhenti, bekasnya terlihat)`,`She <b>has been working</b> here <b>since</b> 2020.`]},
{s:`<b>Hasil atau proses?</b> Kalau yang disorot <b>jumlah / hasil</b> pakai Present Perfect. Kalau yang disorot <b>lamanya / prosesnya</b> pakai Perfect Continuous. Kata kerja perasaan (know, like, own) tetap tidak dipakai di bentuk continuous.`,ex:[`I <b>have written</b> three emails. (hasil: 3 email)`,`I <b>have been writing</b> emails all morning. (proses)`],tip:`Jebakan: <b>I have been knowing him</b> ❌ → I <b>have known</b> him for years ✅.`}]);
up(2,`Past Perfect`,[0,1,
{s:`<b>Cara menyusun</b>: tentukan dulu <b>dua kejadian lampau</b>. Yang <b>lebih dulu</b> → <b>had + V3</b>. Yang <b>menyusul</b> → Past Simple. Kata penghubung <b>before, after, by the time, when</b> menandai urutannya.`,ex:[`When I arrived, the film <b>had started</b>. (film mulai dulu, lalu aku datang)`,`She <b>had finished</b> her homework before she <b>went</b> out.`,`After he <b>had eaten</b>, he <b>left</b>.`]},
{s:`⚠️ <b>Jebakan nomor 1: pakai Past Perfect untuk satu kejadian saja.</b> Kalau tidak ada kejadian pembanding, cukup Past Simple. Past Perfect juga dipakai untuk menyatakan <b>penyesalan</b> atau alasan: <b>I had never seen</b> snow before I went to Japan.`,ex:[`I <b>had visited</b> Bali yesterday. ❌ → I <b>visited</b> Bali yesterday. ✅`,`She was sad because she <b>had lost</b> her phone. (alasan)`],tip:`Cek cepat: ada <b>dua</b> kejadian lampau dan satu <b>lebih dulu</b>? Kalau ya, pakai had + V3 untuk yang pertama.`}]);
up(2,`Past Perfect Continuous`,[0,1,
{s:`<b>Kapan dipakai?</b> Menekankan <b>lamanya</b> aksi sebelum kejadian lampau lain atau titik waktu lampau. Rumus <b>had been + V-ing</b> (sama untuk semua subjek). Penanda: <b>for, since, how long, before, by the time</b>.`,ex:[`She <b>had been waiting</b> for two hours when the bus <b>arrived</b>.`,`He was tired because he <b>had been working</b> all day.`]},
{s:`<b>Beda dengan Past Perfect</b>: Past Perfect menyorot <b>hasil</b> (sudah selesai), Past Perfect Continuous menyorot <b>proses / lamanya</b>. Bandingkan dua kalimat ini.`,ex:[`She <b>had cleaned</b> the house. (hasil: rumah sudah bersih)`,`She <b>had been cleaning</b> the house for hours. (proses: capeknya terasa)`],tip:`Jebakan: <b>had been waiting since two hours</b> ❌ → <b>for</b> two hours ✅ (for + durasi, since + titik waktu).`}]);
up(2,`Future Continuous`,[0,1,
{s:`<b>Kapan dipakai?</b> ① Aksi yang <b>sedang berlangsung</b> pada titik waktu tertentu di masa depan. ② Menanyakan rencana orang dengan <b>sopan</b> (Will you be using…?). Penanda: <b>at 8 p.m. tomorrow, this time next week, in two days</b>.`,ex:[`At 8 tomorrow, I <b>will be studying</b>. (Besok jam 8 aku sedang belajar)`,`<b>Will you be using</b> the car tonight? (tanya sopan)`]},
{s:`<b>Beda dengan Simple Future</b>: <b>will + V1</b> adalah keputusan/janji ("aku akan belajar"). <b>will be + V-ing</b> adalah <b>pemandangan pada saat itu</b> ("jam 8 aku sedang belajar").`,ex:[`I <b>will study</b> tonight. (janji)`,`I <b>will be studying</b> at 9 p.m. (sedang berlangsung)`],tip:`Jebakan: <b>will be study</b> ❌ → <b>will be studying</b> ✅. Setelah <b>will be</b>, kata kerja wajib -ing.`}]);
up(2,`Future Perfect`,[0,1,
{s:`<b>Kapan dipakai?</b> Menyatakan sesuatu yang <b>sudah selesai</b> pada titik waktu di masa depan (tenggat). Kunci: kata <b>by</b> (paling lambat saat itu). Penanda: <b>by next June, by 2030, by the time, before</b>.`,ex:[`By next June, I <b>will have finished</b> my report. (Paling lambat Juni, sudah rampung)`,`She <b>will have left</b> before you arrive.`]},
{s:`<b>By vs Until</b>: <b>by</b> = tenggat (Future Perfect: sudah selesai sebelum itu). <b>until</b> = berlangsung terus sampai saat itu (Simple Future). Dan setelah <b>by the time / before</b>, pakai <b>present simple</b> (bukan will).`,ex:[`I <b>will have finished</b> <b>by</b> 5. (selesai sebelum jam 5)`,`I <b>will work until</b> 5. (bekerja terus sampai jam 5)`,`By the time you <b>arrive</b>, she will have left.`],tip:`Jebakan: <b>By the time you will arrive</b> ❌ → <b>By the time you arrive</b> ✅.`}]);
up(2,`Future Perfect Continuous`,[0,1,
{s:`<b>Kapan dipakai?</b> Menyatakan <b>sudah berapa lama</b> sebuah aksi berlangsung pada titik waktu di masa depan. <b>by + waktu</b> dan <b>for + durasi</b> muncul bersama. Rumus <b>will have been + V-ing</b>.`,ex:[`By next month, I <b>will have been working</b> here <b>for</b> five years.`,`In June, they <b>will have been living</b> in Bandung <b>for</b> a decade.`]},
{s:`<b>Future Perfect vs Perfect Continuous</b>: sorot <b>hasil/selesai</b> → Future Perfect (will have + V3). Sorot <b>lamanya proses</b> → Future Perfect Continuous (will have been + V-ing). Tense ini jarang di percakapan, tapi sering di soal ujian.`,ex:[`By 5, I <b>will have finished</b> the book. (selesai)`,`By 5, I <b>will have been reading</b> for three hours. (lamanya)`],tip:`Rumus empat tense: <b>will be</b> + V-ing (sedang), <b>will have</b> + V3 (selesai), <b>will have been</b> + V-ing (durasi).`}]);

up(2,`Past Future Continuous`,[0,1,

up(2,`Past Future Perfect`,[0,1,

up(2,`Past Future Perfect Continuous`,[0,1,

up(2,`Phrasal Verbs`,[0,1,

up(2,`Academic Writing`,[0,
{s:`<b>Rumus thesis yang kuat</b> 🔧: <b>topik + sikap + alasan</b>. Pakai pola <b>Although …, … </b> agar terlihat menimbang dua sisi tapi tetap jelas posisinya. Tes cepat: bisakah orang lain <b>tidak setuju</b>? Kalau tidak, itu fakta, bukan thesis.`,ex:[`Lemah: Social media is popular. (fakta)`,`Kuat: <b>Although</b> social media connects people, <b>it harms</b> teenagers' focus <b>because</b> it distracts them.`]},
{s:`<b>Transition words</b> 🚦 dikelompokkan sesuai arah: <b>menambah</b> (moreover, in addition, furthermore), <b>berlawanan</b> (however, on the other hand, nevertheless), <b>akibat</b> (therefore, as a result, consequently), <b>contoh</b> (for example, for instance), <b>urutan</b> (first, then, finally).`,ex:[`Online class is flexible. <b>However</b>, it reduces interaction.`,`Sleep affects memory. <b>Therefore</b>, students need rest.`],tip:`Transition di awal kalimat diikuti <b>koma</b>: However<b>,</b> it is expensive.`},
4,
{s:`<b>Paragraf akademik</b> = <b>topic sentence</b> (ide utama) → <b>supporting details</b> (bukti, data, contoh) → <b>concluding sentence</b> (penutup). Satu paragraf = <b>satu ide</b>. Kalau ada ide kedua, buat paragraf baru.`,ex:[`<b>Topic:</b> Exercise improves mental health.`,`<b>Support:</b> For example, studies show that walking reduces stress.`,`<b>Concluding:</b> Thus, regular activity benefits the mind.`]},
5,3]);
up(2,`Paraphrasing`,[0,
{s:`<b>4 teknik ganti baju</b> 👔: ① ganti <b>sinonim</b> (use → rely on). ② ubah <b>kelas kata</b> (decide → decision). ③ ubah <b>struktur</b> (aktif ↔ pasif). ④ ubah <b>urutan klausa</b> (If it rains, we stay → We stay if it rains). Gabungkan 2-3 teknik, jangan satu saja.`,ex:[`Asli: Many students use phones.`,`Parafrasa: <b>A lot of learners rely on mobile phones.</b> (sinonim + struktur)`,`Asli: Pollution harms health. → Health <b>is harmed by</b> pollution. (aktif → pasif)`]},
2,
{s:`⚠️ <b>Jebakan "patchwriting"</b>: mengganti beberapa kata saja tapi struktur sama persis. Itu masih plagiat! Dan <b>istilah teknis</b> (mis. photosynthesis) tidak perlu diganti. Selalu <b>cantumkan sumber</b>.`,ex:[`Asli: Climate change affects farming.`,`Patchwriting ❌: Climate change influences agriculture.`,`Paraphrase ✅: <b>Farming is increasingly shaped by a changing climate</b> (Smith, 2020).`],tip:`Cek hasilmu: kalau lebih dari 3 kata berurutan sama persis dengan teks asli, tulis ulang atau beri tanda kutip.`}]);
up(2,`Esai & Karya Ilmiah (IMRaD)`,[0,
{s:`<b>IMRaD diterapkan pada pertanyaan</b>: <b>I</b> menjawab "kenapa penelitian ini penting?", <b>M</b> menjawab "bagaimana kamu meneliti?", <b>R</b> menjawab "apa yang kamu temukan?", <b>D</b> menjawab "apa artinya temuan itu?". Tiap bagian punya tugas, jangan dicampur.`,ex:[`<b>Introduction:</b> Sleep matters for teens. This study examines…`,`<b>Methods:</b> We surveyed 100 students.`,`<b>Results:</b> 70% preferred online classes.`,`<b>Discussion:</b> This suggests that flexibility matters.`]},
2,
{s:`<b>Bahasa karya ilmiah</b>: pakai <b>past tense</b> untuk Methods dan Results (We surveyed…), <b>present tense</b> untuk fakta umum dan Discussion (This suggests…). Hindari <b>I think</b> dan singkatan. Gunakan <b>passive</b> untuk menekankan proses.`,ex:[`Data <b>were collected</b> from 100 students. (Methods, passive)`,`The results <b>indicate</b> that online class <b>is</b> flexible. (Discussion)`]},
1]);
up(2,`Teks Argumentatif: Discussion & Analytical Exposition`,[0,1,
{s:`<b>Kata penanda</b> membedakan keduanya. <b>Exposition</b>: <b>I believe, should, must, therefore</b> (memihak). <b>Discussion</b>: <b>on the one hand, on the other hand, some people argue, others believe, in conclusion</b> (menimbang).`,ex:[`<b>Exposition:</b> Schools <b>should</b> limit phones <b>because</b>…`,`<b>Discussion:</b> <b>Some people argue</b> that phones help learning. <b>Others believe</b> they distract.`]},
{s:`<b>Argumen yang kuat</b> = <b>klaim + alasan + bukti</b>. Bukti bisa berupa data, contoh, atau pendapat ahli. Tanpa bukti, argumenmu hanya opini.`,ex:[`<b>Klaim:</b> Phones reduce focus.`,`<b>Alasan:</b> Notifications interrupt thinking.`,`<b>Bukti:</b> A 2019 study found students lost 20% focus.`],tip:`Jebakan: Exposition tidak boleh menyajikan sisi lawan tanpa membantahnya. Itu tugas Discussion.`}]);
}catch(e){console.warn('v47 gagal',e)}})();
</script>

up(3,`Job Interview`,[0,1,
{s:`<b>STAR</b> ⭐ per huruf: <b>S</b>ituation (latar), <b>T</b>ask (tugasmu), <b>A</b>ction (yang kamu lakukan, paling panjang), <b>R</b>esult (hasil, usahakan pakai <b>angka</b>). Pakai <b>I</b> (bukan we) di bagian Action supaya kontribusimu terlihat.`,ex:[`<b>Situation:</b> Our sales dropped last year.`,`<b>Task:</b> I was asked to find the cause.`,`<b>Action:</b> I <b>created</b> a new plan and <b>trained</b> the team.`,`<b>Result:</b> Sales <b>rose</b> by 20%.`]},
{s:`<b>Pertanyaan yang pasti muncul</b> beserta kerangka jawabnya: <b>Why do you want this job?</b> (kaitkan dengan perusahaan), <b>What are your strengths?</b> (sebut 2 dengan bukti), <b>Where do you see yourself in five years?</b> (tunjukkan pertumbuhan, bukan pindah kerja).`,ex:[`<b>I'm drawn to</b> your company because of its focus on innovation.`,`My strength is <b>problem-solving</b>. For example, I once…`,`In five years, I hope to <b>take on more responsibility</b>.`],tip:`Jebakan: jawaban satu kata ("Yes", "I'm good"). Selalu tambahkan <b>alasan atau contoh</b>.`},
3]);
up(3,`Presentasi`,[0,1,
{s:`<b>Opening yang kuat</b> 🚀: ① salam ② <b>hook</b> (pertanyaan atau fakta mengejutkan) ③ topik ④ <b>agenda</b> singkat. Dengan agenda, penumpang tahu tur ini akan lewat mana saja.`,ex:[`Good morning, everyone. <b>Have you ever wondered</b> why sales drop in June?`,`<b>Today I'm going to talk about</b> three things: first…, second…, finally…`]},
{s:`<b>Menjelaskan grafik</b> 📈: <b>naik</b> (rise, increase), <b>turun</b> (fall, decrease), <b>stabil</b> (remain stable), <b>puncak</b> (peak), <b>drastis</b> (sharply), <b>pelan</b> (slightly). Pola: <b>subjek + kata kerja + adverb + waktu</b>. Pakai <b>past tense</b> untuk data lampau.`,ex:[`Sales <b>rose sharply</b> in May.`,`Costs <b>remained stable</b> throughout the year.`,`Profit <b>peaked</b> at 20 million in July.`]},
{s:`<b>Menjawab pertanyaan audiens</b> 🙋: ① apresiasi (<b>Good question</b>) ② jawab ringkas ③ cek (<b>Does that answer your question?</b>). Kalau tidak tahu, katakan jujur: <b>I'll get back to you on that.</b>`,ex:[`<b>That's a great question.</b> The main reason is…`,`<b>I'm afraid I don't have the figures with me. I'll get back to you.</b>`],tip:`Closing wajib: ringkas (<b>To sum up…</b>) lalu ucapkan terima kasih. Jangan berhenti mendadak.`}]);
up(3,`Email & Komunikasi Kantor`,[0,1,
{s:`<b>Subject yang efektif</b> itu <b>spesifik dan singkat</b>: pembaca harus tahu isi email dari judulnya saja. Bandingkan ini.`,ex:[`❌ Hello / Urgent / Question`,`✅ <b>Request for Meeting on Friday</b>`,`✅ <b>Invoice #204 for March</b> (Payment Due)`]},
{s:`<b>Sapaan dan penutup</b> sesuaikan tingkat formalitas. Kenal nama: <b>Dear Mr. Rahman,</b> → <b>Best regards,</b>. Belum tahu nama: <b>Dear Sir or Madam,</b> → <b>Yours faithfully,</b>. Dekat dengan rekan: <b>Hi Sari,</b> → <b>Thanks,</b>.`,ex:[`<b>Dear Ms. Lee,</b> … <b>Best regards,</b> Ypt`,`<b>Hi team,</b> … <b>Thanks,</b> Ypt`]},
3,
{s:`<b>Ringkas dan jelas</b>: satu email = satu tujuan. Letakkan <b>permintaan utama</b> di awal, rincian di tengah, dan <b>tenggat</b> di akhir. Selalu <b>baca ulang</b> sebelum kirim (typo, lampiran, nama).`,ex:[`<b>Could you please send</b> the report <b>by Friday</b>?`,`<b>I look forward to your reply.</b>`],tip:`Jebakan: lupa lampiran. Kalau menulis <b>Please find attached</b>, pastikan filenya benar-benar terlampir.`}]);
up(3,`TOEFL: Parallelism & Kontras`,[0,1,
{s:`<b>Paralelisme dalam 3 pola</b>: ① daftar (A, B, and C: bentuk sama). ② pasangan (<b>both…and, either…or, not only…but also</b>). ③ perbandingan (<b>more …than</b>, bentuk sama di kedua sisi).`,ex:[`She likes <b>reading</b>, <b>writing</b>, and <b>painting</b>.`,`He is <b>both</b> smart <b>and</b> hardworking.`,`Walking is healthier <b>than</b> driving.`]},
2,
{s:`<b>Despite vs Although</b> adalah jebakan favorit. <b>Although/though</b> diikuti <b>klausa</b> (subjek + kata kerja). <b>Despite / in spite of</b> diikuti <b>noun atau V-ing</b>. Jangan campur.`,ex:[`<b>Although</b> it rained, we went out. (klausa)`,`<b>Despite</b> the rain, we went out. (noun)`,`<b>Despite</b> being tired, she finished. (V-ing)`],tip:`Jebakan: <b>Despite it rained</b> ❌ → <b>Despite the rain</b> ✅ atau <b>Although it rained</b> ✅.`},
{s:`<b>However vs whereas</b>: <b>However</b> membuka kalimat baru (titik/titik koma di depannya, koma di belakangnya). <b>Whereas / while</b> menyambung dua klausa untuk <b>membandingkan</b> dua hal.`,ex:[`It was cold. <b>However</b>, we went out.`,`Tom is tall, <b>whereas</b> Ali is short.`]}]);
up(3,`TOEIC: Detektif Kelas Kata`,[0,1,
{s:`<b>Peta posisi</b> 🗺️: <b>setelah the/a/my</b> → adjective atau noun. <b>Sebelum noun</b> → adjective. <b>Setelah to be</b> → adjective. <b>Setelah subjek</b> → verb. <b>Menerangkan verb/adjective</b> → adverb. Triknya: lihat <b>kata di kiri dan kanan</b> kosongnya.`,ex:[`The <b>decision</b> was approved. (setelah the → noun)`,`She is a <b>reliable</b> manager. (sebelum noun → adj)`,`He works <b>carefully</b>. (menerangkan verb → adv)`]},
{s:`<b>Akhiran penanda</b> 🔖: <b>noun</b> (-tion, -ment, -ness, -ity, -er), <b>adjective</b> (-ive, -ful, -able, -ous, -al), <b>adverb</b> (-ly), <b>verb</b> (-ize, -ate, -en). Hafalkan keluarga katanya sekaligus.`,ex:[`<b>succeed</b> → <b>success</b> → <b>successful</b> → <b>successfully</b>`,`<b>decide</b> → <b>decision</b> → <b>decisive</b> → <b>decisively</b>`],tip:`Jebakan: <b>very successfully</b> vs <b>very successful</b>. Kalau menerangkan kata kerja, pakai adverb.`},
3]);
}catch(e){console.warn('v48 gagal',e)}})();
</script>

const add=(li,name,list)=>{const M=LEVELS[li].mods.find(x=>x.n===name);if(!M)return;const i=M.steps.findIndex(s=>s.map);
const ns=list.map(e=>Object.assign({ex:[]},e));M.steps.splice(i<0?M.steps.length:i,0,...ns)};
add(2,`Slang & Bahasa Gaul (Gaya Film)`,[
{s:`<b>Cara memakai slang dengan aman</b> 🎯: ① kenali <b>lawan bicara</b> (teman = boleh, guru/bos = jangan). ② kenali <b>situasi</b> (chat santai = boleh, esai/email = jangan). ③ <b>jangan berlebihan</b>, satu atau dua kata gaul sudah cukup. Slang juga cepat basi, jadi pahami dulu sebelum ikut memakai.`,ex:[`Chat teman: <b>That's legit</b>, dude!`,`Email ke guru: <b>That is excellent.</b> (formal)`],tip:`Jebakan: memakai <b>gonna / wanna</b> di tulisan formal. Di esai tulis lengkap: <b>going to / want to</b>.`}]);
add(2,`Umpatan Ringan & Ungkapan Kasar`,[
{s:`<b>Kenapa perlu paham?</b> Bukan untuk dipakai sembarangan, tapi supaya kamu <b>tidak kaget</b> saat nonton film dan <b>tahu seberapa kasar</b> sebuah kata. Kalau ragu, <b>jangan pakai</b>. Lebih aman memakai ekspresi netral untuk kaget atau kesal.`,ex:[`Netral: <b>Oh no!</b> / <b>Oh my gosh!</b> / <b>That's annoying.</b>`,`Kesal: <b>I'm really frustrated.</b> (sopan dan jelas)`],tip:`Aturan emas: makin formal situasinya, makin netral bahasanya. Di sekolah dan kerja, pakai versi sopan.`}]);
add(3,`Presentasi: Q&A dengan Audiens`,[
{s:`<b>Frasa Q&A siap pakai</b> 🎯: <b>Mengundang</b>: Are there any questions? <b>Memastikan paham</b>: Just to clarify, are you asking about…? <b>Menjawab</b>: That's a good point. <b>Menunda</b>: I'll look into it and get back to you. <b>Menutup</b>: If there are no more questions, thank you for your time.`,ex:[`<b>Just to clarify</b>, are you asking about the budget?`,`<b>That's a good point.</b> The main reason is…`,`<b>I don't have that figure on hand</b>, but I'll email you later.`],tip:`Jebakan: mengarang jawaban saat tidak tahu. Lebih kredibel kalau jujur dan berjanji menindaklanjuti.`}]);
add(3,`Telepon & Video Call`,[
{s:`<b>Rumus telepon 3 langkah</b> 📞: ① <b>sapa + identitas</b> (Good morning, this is Sari from ABC.) ② <b>tujuan</b> (I'm calling about…) ③ <b>tindak lanjut</b> (Could you send it by email?). Saat tersambung ke orang yang salah: <b>Could I speak to…?</b>`,ex:[`<b>Good morning, this is</b> Sari from ABC. <b>I'm calling about</b> the invoice.`,`<b>Could I speak to</b> Mr. Rahman, please?`,`<b>Could you hold on for a moment?</b> (Mohon tunggu sebentar)`]},
{s:`<b>Kalimat penyelamat saat sinyal buruk</b>: <b>Sorry, you're breaking up.</b> (suaramu putus-putus), <b>Could you repeat that, please?</b>, <b>Can you hear me?</b>, <b>Let me share my screen.</b>, <b>You're on mute.</b> Ulangi detail penting di akhir supaya tidak salah paham.`,ex:[`<b>Sorry, you're breaking up.</b> Could you say that again?`,`<b>Let me confirm:</b> the meeting is on Friday at 10, right?`],tip:`Jebakan: menutup telepon tanpa konfirmasi. Ucapkan <b>Let me confirm…</b> untuk jam, tanggal, dan angka.`}]);
add(3,`Customer Service & Komplain`,[
{s:`<b>Rumus LAFS</b> 🤝 dalam kalimat: <b>L</b>isten (I understand your concern.) → <b>A</b>pologize (I'm sorry for the inconvenience.) → <b>S</b>olve (Let me replace it for you.) → <b>F</b>ollow up (I'll call you tomorrow to confirm.).`,ex:[`<b>I understand</b> how frustrating this is.`,`<b>I'm sorry for the inconvenience.</b>`,`<b>I'll check it right away</b> and get back to you.`]},
{s:`<b>Komplain yang sopan tapi tegas</b> 🛡️: sebutkan <b>masalah</b>, <b>bukti</b>, dan <b>permintaan</b>. Hindari menyerang pribadi. Pakai <b>I would like to…</b> dan <b>Could you please…</b>.`,ex:[`<b>I ordered</b> a blue shirt, <b>but I received</b> a red one.`,`<b>I would like to</b> exchange it. <b>Could you please</b> help me?`],tip:`Jebakan: <b>You are wrong!</b> ❌ → <b>I think there may be a mistake.</b> ✅`}]);
add(3,`Small Talk & Networking Kantor`,[
{s:`<b>Rumus small talk</b> ☕: <b>pertanyaan terbuka + tanggapan + pertanyaan balik</b>. Jawaban singkat saja akan mematikan obrolan, jadi tambahkan satu informasi dan lempar pertanyaan balik (<b>How about you?</b>).`,ex:[`A: <b>How was your weekend?</b>`,`B: It was great. I went hiking. <b>How about you?</b>`,`A: <b>Not bad, thanks. I mostly relaxed at home.</b>`]},
{s:`<b>Cara menyudahi obrolan dengan sopan</b>: <b>It was great talking to you.</b>, <b>I should get back to…</b>, <b>Let's keep in touch.</b> Tukar kontak dengan <b>Do you have a business card?</b> atau <b>Can I connect with you on LinkedIn?</b>`,ex:[`<b>It was great talking to you.</b> <b>Let's keep in touch.</b>`,`<b>Can I connect with you on LinkedIn?</b>`],tip:`Jebakan: mulai dengan topik sensitif (gaji, politik, agama). Pilih cuaca, hobi, atau perjalanan.`}]);
add(3,`Feedback & Evaluasi Kerja`,[
{s:`<b>SBI dalam kalimat</b> 🎯: <b>S</b>: In yesterday's meeting, … <b>B</b>: you interrupted two colleagues. <b>I</b>: As a result, they stopped sharing ideas. Fokus pada <b>perilaku yang terlihat</b>, bukan sifat ("kamu kasar").`,ex:[`<b>In yesterday's meeting</b>, you <b>presented the data clearly</b>. <b>It helped</b> us decide faster. (feedback positif)`,`<b>In the last report</b>, there were <b>three typos</b>. <b>It affected</b> our credibility.`]},
{s:`<b>Bungkus saran</b> dengan kata pelunak: <b>One suggestion is…</b>, <b>You might want to…</b>, <b>It would be even better if…</b>. Ganti <b>but</b> dengan <b>and</b> atau <b>and also</b> supaya tidak terdengar menyangkal pujian.`,ex:[`<b>It would be even better if</b> you added more examples.`,`<b>You might want to</b> double-check the numbers.`],tip:`Jebakan: <b>You are careless</b> ❌ (menyerang pribadi) → <b>There were three errors in the report</b> ✅ (menyebut fakta).`}]);
add(3,`Angka, Tanggal & Grafik Bisnis`,[
{s:`<b>Cara membaca angka</b> 🔢: <b>1,250</b> = one thousand two hundred fifty. <b>2.5</b> = two point five. <b>20%</b> = twenty percent. <b>$1.5 million</b> = one point five million dollars. Tanggal: <b>March 5th</b> dibaca March the fifth. Tahun: <b>2026</b> = twenty twenty-six.`,ex:[`<b>3,400</b> → three thousand four hundred`,`<b>0.75</b> → zero point seven five`,`<b>1/4</b> → a quarter`]},
{s:`<b>Kata keterangan grafik</b>: <b>sharply / dramatically</b> (drastis), <b>steadily</b> (stabil naik), <b>slightly</b> (sedikit), <b>gradually</b> (bertahap). Angka perubahan pakai <b>by</b> (naik <b>sebesar</b> 20%), titik akhir pakai <b>to</b> (naik <b>menjadi</b> 120).`,ex:[`Sales rose <b>by 20%</b>. (naik sebesar 20%)`,`Sales rose <b>to 120 units</b>. (naik jadi 120)`],tip:`Jebakan: <b>by</b> dan <b>to</b> sering tertukar. <b>By</b> = selisih, <b>to</b> = angka akhir.`}]);
add(3,`TOEIC Listening: Part 1-4`,[
{s:`<b>Strategi per part</b> 🎧: <b>Part 1</b>: lihat foto, tebak kata kerja (sedang apa). <b>Part 2</b>: dengarkan <b>kata tanya pertama</b>, singkirkan jawaban yang ulang kata yang sama. <b>Part 3 & 4</b>: baca <b>3 soal</b> dulu, lalu dengar sambil mencari jawabannya. Jangan terpaku satu soal: kalau terlewat, lanjut.`,ex:[`<b>Who</b> is responsible for the budget? → <b>Ms. Tan from Finance.</b> ✅`,`<b>Who</b> is responsible…? → <b>Next Monday.</b> ❌ (jawab waktu, padahal ditanya orang)`],tip:`Jebakan: kata yang <b>bunyinya mirip</b> (right/light) atau <b>diulang</b> dari pertanyaan. Biasanya itu pengecoh.`}]);
add(3,`Surat Pengunduran Diri`,[
{s:`<b>Contoh kerangka lengkap</b> ✉️: <b>Subject:</b> Resignation – Sari Wulandari. <b>Dear Mr. Rahman,</b> I am writing to formally resign from my position as Administrative Officer, effective <b>30 November</b>. Thank you for the opportunities. I am happy to help with the handover. <b>Best regards,</b> Sari.`,ex:[`<b>I am writing to formally resign</b> from my position as…`,`<b>My last working day will be</b> 30 November.`,`<b>I would be glad to assist</b> with the handover.`],tip:`Jebakan: menyalahkan atasan atau perusahaan. Surat resign dipakai sebagai referensi, jadi tulis positif dan singkat.`}]);
add(3,`Onboarding: Hari Pertama Kerja`,[
{s:`<b>Kalimat hari pertama</b> 👋: <b>Hi, I'm Rina. It's my first day.</b>, <b>Who should I report to?</b>, <b>Could you show me around?</b>, <b>Where can I find…?</b>. Setelah itu, <b>ulangi nama</b> orang yang baru kamu kenal supaya mudah diingat.`,ex:[`<b>Nice to meet you, Mr. Lee.</b> I'm looking forward to working with you.`,`<b>Could you show me around?</b>`],tip:`Jebakan: takut bertanya. Di minggu pertama, bertanya tepat dianggap tanda serius, bukan tanda bodoh.`}]);
}catch(e){console.warn('v49 gagal',e)}})();
</script>

  ({menu:vMenu,mods:vMods,learn:vLearn,quiz:vQuiz,result:vResult,set:vSet,fc:vFlash,gm:vGame,dl:(()=>vDlg())})[S.view]();

}
back.onclick=()=>{const v=S.view;
  if(v==='learn'&&S.step>0)go('learn',{step:S.step-1});
  else if(v==='gm'&&S.g)go('gm',{g:null});else if(v==='dl'&&S.d)go('dl',{d:null});else if(S.kind==='place')go('menu');else if(v==='learn'||v==='quiz')go('mods');
  else go('menu')};

/* ===== Fase Belajar (contoh kalimat bisa diklik untuk didengar) ===== */

/* ===== Fase Kuis: 3 tipe soal ===== */
function vQuiz(){
  const M=mod(),Q=M.quiz[S.list[S.q]],t=Q.t||'mc';S.locked=false;const lt=t==='listen',mcl=t==='mc'||(lt&&!!Q.o);
  title.textContent=S.retry?'Latihan ulang':M.n;dots(S.q+1,S.list.length);
  let body;
  if(mcl)body=`<div class="opts">${shuffle(Q.o.map((o,i)=>[o,i])).map(([o,i])=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div>`;
  else if(t==='type'||(lt&&!Q.o))body='<input class="in" id="inp" autocomplete="off" autocapitalize="off" placeholder="Ketik jawabanmu…"><button class="btn" id="ck">Cek jawaban</button>';
  else body=`<div class="words slot" id="ans"></div><div class="words" id="bank">${shuffle(Q.w.map(w=>w)).map(w=>`<button class="chip">${w}</button>`).join('')}</div><button class="btn" id="ck">Cek jawaban</button>`;
  view.innerHTML=guide(`Soal ${S.q+1} dari ${S.list.length}. ${lt?'Putar suaranya dan dengarkan baik-baik!':t==='mc'?'Pilih jawaban yang paling pas ya!':t==='type'?'Kali ini kamu ngetik sendiri. Pasti bisa!':'Tap kata-kata ini sampai kalimatnya benar.'}`)
   +`<div class="qcard">${Q.p?`<div class="pas">${Q.p}</div>`:''}${lt?'<button class="btn ghost" id="pl">🔊 Putar suara</button>':''}<p class="q">${Q.q}</p>${body}<div id="why"></div></div><div class="foot" id="ft"></div>`;
  if(lt){$('#pl').onclick=()=>speak(Q.say,1);setTimeout(()=>speak(Q.say,1),400)}
  if(mcl)view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.locked)return;const i=+b.dataset.i;
    view.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(+o.dataset.i===Q.a)o.classList.add('ok');else if(o===b)o.classList.add('bad')});
    finish(i===Q.a,Q.o[Q.a],i!==Q.a&&Q.wr&&Q.wr[i]?`Kamu memilih <b>${Q.o[i]}</b>: ${Q.wr[i]} `:'',Q.o[i]);});
  if(t==='type'||(lt&&!Q.o)){const inp=$('#inp');inp.onkeydown=e=>{if(e.key==='Enter')$('#ck').click()};
    $('#ck').onclick=()=>{if(S.locked||!inp.value.trim())return;const ok=Q.a.map(norm).includes(norm(inp.value));inp.disabled=true;$('#ck').remove();finish(ok,Q.a[0],'',inp.value)}}
  if(t==='order'){
    view.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(!S.locked)(c.parentNode.id==='bank'?$('#ans'):$('#bank')).appendChild(c)});
    $('#ck').onclick=()=>{if(S.locked||!$('#ans').children.length)return;
      const got=[...$('#ans').children].map(c=>c.textContent).join(' ');S.locked=true;$('#ck').remove();
      finish(norm(got)===norm(Q.a),Q.a,'',got);if(norm(got)===norm(Q.a))speak(Q.a)}}
}
/* Reaksi karakter + penjelasan + tombol lanjut */
function finish(ok,ans,wr,given){
  S.locked=true;const M=mod(),idx=S.list[S.q];
  if(ok)S.score++;else if(!S.wrong.includes(idx))S.wrong.push(idx);
  say(pick(ok?CHEER:OOPS));react(ok?'cheer':'oops');
  $('#why').outerHTML=explain(ok,M.quiz[idx],M,ans,wr,given);
  const lastQ=S.q===S.list.length-1;
  $('#ft').innerHTML=`<button class="btn" id="nq">${lastQ?'Lihat hasil':'Soal berikutnya'}</button>`;
  $('#nq').onclick=()=>lastQ?go('result'):go('quiz',{q:S.q+1});
  if(ok)confetti(14);setTimeout(()=>$('#why').scrollIntoView({behavior:'smooth',block:ok?'end':'start'}),60);
}

/* ===== Hasil: bintang, XP, streak harian, lencana ===== */
function vResult(){
  const M=mod(),tot=S.list.length,n=S.score;title.textContent='Hasil kuis';dots(tot,tot);if(S.kind)return kindResult(tot,n);
  let msg,box;
  if(S.retry){
    msg=n===tot?'Nah, sekarang sudah paham semua! Hebat 🎉':'Sedikit lagi! Baca ulang materinya, lalu coba lagi 🌱';
    box=`<p>Latihan ulang: <b>${n}/${tot}</b> benar</p>`;
  }else{
    const st=Math.round(n/tot*3),xp=n*10+(n===tot?10:0),key=lv().id+':'+S.m;
    if(st>star(S.lv,S.m))P.stars[key]=st;P.xp+=xp;
    const today=new Date().toLocaleDateString('en-CA'),yest=new Date(Date.now()-864e5).toLocaleDateString('en-CA');
    if(P.last!==today){P.streak=P.last===yest?P.streak+1:1;P.last=today}
    const won=[];const give=id=>{if(!P.badges.includes(id)){P.badges.push(id);won.push(BADGES.find(b=>b.id===id))}};
    give('first');if(n===tot)give('perfect');if(P.streak>=3)give('streak3');
    if(LEVELS.every((l,i)=>l.mods.every((_,m)=>star(i,m)>0)))give('master');
    save();
    msg=(n===tot?'Sempurna! Semua benar 🚀':n>0?'Bagus! Sedikit lagi sempurna 💪':'Belum beruntung, tapi kamu berani mencoba 🌱')
      +(won.length?`<br>Lencana baru: ${won.map(b=>b.e+' '+b.n).join(', ')}`:'');
    box=`<div class="big">${starStr(st)}</div><p>Skor <b>${n}/${tot}</b> · +${xp} XP · 🔥 ${P.streak} hari</p>`;
  }
  const nextMod=S.m+1<lv().mods.length,nextLv=LEVELS[S.lv+1]&&unlocked(S.lv+1);
  view.innerHTML=guide(msg)+`<div class="res">${box}</div><div class="foot">
    ${S.wrong.length?'<button class="btn" id="rw">Ulangi soal yang salah</button>':''}
    ${nextMod?'<button class="btn" id="nm">Modul berikutnya</button>':nextLv?'<button class="btn" id="nl">Buka level berikutnya</button>':''}
    ${M.game?'<button class="btn ghost" id="gm">🎮 Main Misi modul ini</button>':''}<button class="btn ghost" id="re">Belajar ulang</button><button class="btn ghost" id="mn">Kembali ke peta</button></div>`;
  const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  on('#rw',()=>go('quiz',{list:S.wrong,wrong:[],q:0,score:0,retry:true}));
  on('#nm',()=>go('learn',{m:S.m+1,step:0}));
  on('#nl',()=>go('mods',{lv:S.lv+1}));
  on('#re',()=>go('learn',{step:0}));on('#gm',()=>startGame(M));
  on('#mn',()=>go('menu'));
  setTimeout(()=>{react(n>=2?'cheer':'oops');if(n===tot)confetti(40)},350);
}

/* ===== v4: Tes Penempatan, Ujian Akhir, Flashcard ===== */
const TOOLS=`<div class="path" style="padding-bottom:24px"><button class="card" id="tp"><span class="ico">🧭</span><span class="txt"><small>10 soal</small><b>Tes Penempatan</b><em>Cari level yang pas untukmu</em></span></button><button class="card" id="tg"><span class="ico">🎮</span><span class="txt"><small>Game interaktif</small><b>Misi Pak Yood</b><em>Beri perintah ke tokoh</em></span></button><button class="card" id="td"><span class="ico">💬</span><span class="txt"><small>Percakapan animasi</small><b>Ngobrol Seru</b><em>Balas obrolan, dapat penjelasan</em></span></button><button class="card" id="tf"><span class="ico">🃏</span><span class="txt"><small>Hafalan</small><b>Flashcard</b><em>Kosakata & frasa penting</em></span></button></div>`;
const pickQ=(l,n)=>{const z=new Set();return shuffle(LEVELS[l].mods.flatMap(M=>M.quiz)).filter(q=>{const k=JSON.stringify([q.q,q.o,q.a,q.say,q.pairs]);if(z.has(k))return false;z.add(k);return true}).slice(0,n)};
function startQuiz(qs,kind,name){go('quiz',{ex:{n:name,quiz:qs},kind,q:0,score:0,list:qs.map((_,i)=>i),wrong:[],retry:false})}
function startPlace(){startQuiz([...pickQ(0,2),...pickQ(1,3),...pickQ(2,3),...pickQ(3,2)],'place','Tes Penempatan')}
function startExam(){startQuiz(pickQ(S.lv,12),'exam','Ujian Akhir '+lv().name)}
function kindResult(tot,n){
  const pct=n/tot;let msg,box;
  if(S.kind==='exam'){const ok=pct>=.7;if(ok){P.pass[lv().id]=1;P.xp+=50;save()}
    msg=ok?'Lulus! Level berikutnya terbuka 🎓':'Belum lulus, butuh minimal 70%. Ulangi materinya lalu coba lagi 💪';
    box=`<div class="big">${ok?'🎓':'🌱'}</div><p>Skor <b>${n}/${tot}</b> (${Math.round(pct*100)}%)${ok?' · +50 XP':''}</p>`}
  else{const st=n<=3?0:n<=5?1:n<=8?2:3;for(let i=0;i<st;i++)P.pass[LEVELS[i].id]=1;save();
    msg=`Hasil tes: mulai dari <b>${LEVELS[st].name}</b>!`+(st?' Level-level sebelumnya sudah kubuka untukmu.':'');
    box=`<p>Skor <b>${n}/${tot}</b></p><p>Level awalmu: <b>${LEVELS[st].emoji} ${LEVELS[st].name}</b></p>`}
  view.innerHTML=guide(msg)+`<div class="res">${box}</div><div class="foot"><button class="btn" id="mn">Kembali ke peta</button></div>`;
  $('#mn').onclick=()=>go('menu');setTimeout(()=>{react(pct>=.5?'cheer':'oops');if(pct>=.7)confetti(40)},350)}
const strip=h=>h.replace(/<[^>]+>/g,'');
const deck=l=>{const c=[];LEVELS[l].mods.forEach(M=>{if(M.fc)M.steps.forEach(s=>(s.tbl||[]).slice(1).forEach(r=>c.push([strip(r[0]),strip(r.slice(1).join(' → '))])))});return c};
function vFlash(){
  title.textContent='Flashcard';
  if(!S.fc){const ds=LEVELS.map((_,i)=>[i,deck(i).length]).filter(d=>d[1]);
    view.innerHTML=guide('Pilih tumpukan kartunya. Tap kartu untuk membalik, lalu jujur ya: sudah hafal atau perlu diulang? 🃏')+'<div class="path">'+ds.map(([i,n])=>`<button class="card" data-i="${i}"><span class="ico">${LEVELS[i].emoji}</span><span class="txt"><small>${n} kartu</small><b>${LEVELS[i].name}</b></span></button>`).join('')+'</div>';
    view.querySelectorAll('.card').forEach(b=>b.onclick=()=>{S.fc={q:shuffle(deck(+b.dataset.i)),f:0,k:0};vFlash()});return}
  const F=S.fc,c=F.q[0];
  if(!c){view.innerHTML=guide('Semua kartu sudah kamu hafal. Mantap! 🎉')+'<div class="foot"><button class="btn" id="bk">Pilih tumpukan lain</button></div>';$('#bk').onclick=()=>{S.fc=null;vFlash()};return}
  dots(F.k,F.k+F.q.length);if(!F.f)speak(c[0]);
  view.innerHTML=guide(`Sisa <b>${F.q.length}</b> kartu. Tap kartu untuk melihat artinya.`)+`<button class="qcard" id="cd" style="min-height:160px;align-items:center;justify-content:center;text-align:center"><p class="q">${F.f?c[1]:c[0]}</p><small style="color:var(--mute)">${F.f?'artinya':'tap untuk membalik'}</small></button><div class="foot"><button class="btn" id="ok">Sudah hafal ✅</button><button class="btn ghost" id="ag">Ulang lagi 🔁</button></div>`;
  $('#cd').onclick=()=>{F.f=1-F.f;vFlash()};
  $('#ok').onclick=()=>{F.q.shift();F.k++;F.f=0;vFlash()};
  $('#ag').onclick=()=>{F.q.push(F.q.shift());F.f=0;vFlash()};
}

/* ===== v5: penjelasan runut saat salah + konfeti + owl interaktif ===== */
function explain(ok,Q,M,ans,wr,given){
  if(ok)return `<div class="why" id="why">✅ ${Q.why}</div>`;
  const t=Q.t||'mc',ex=[];
  (M.steps||[]).forEach(s=>(s.ex||[]).forEach(e=>{if(!/❌|Lemah/.test(e)&&e.length<90)ex.push(e)}));
  const tip=((M.steps||[]).find(s=>s.tip)||{}).tip;
  const rule=M.map?M.map.b.slice(0,4).map(b=>`<b>${b.t}</b>: ${b.k.slice(0,3).join(', ')}`).join('<br>'):'';
  const li=[];
  li.push(['Cek jawabanmu',given?(wr||`${t==='order'?'Susunanmu':'Kamu menjawab'}: <b>${esc(given)}</b>.`):'Belum ada jawaban yang masuk, jadi kita bahas dari awal.']);
  li.push(['Jawaban yang benar',`<b>${ans}</b>${Q.say?`<br>Kalimat yang diucapkan: <i>"${Q.say}"</i>`:''}`]);
  li.push(['Kenapa begitu',Q.why]);
  if(rule||tip)li.push([`Aturan di modul "${M.n}"`,rule+(tip?`<div class="ex2">💡 ${tip}</div>`:'')]);
  if(ex.length)li.push(['Contoh benar lainnya',shuffle(ex).slice(0,2).map(e=>`<div class="ex2">${e}</div>`).join('')]);
  li.push(['Biar tidak salah lagi','Baca soal pelan-pelan, cari kata kunci (penanda waktu, pelaku, atau kata sambung), lalu cocokkan dengan aturan di atas sebelum memilih.']);
  return `<div class="why full" id="why"><h4>🧐 Yuk, kita bedah pelan-pelan</h4><ol class="exp">${li.map(([h,b],i)=>`<li style="animation-delay:${i*.12}s"><strong>${h}</strong>${b}</li>`).join('')}</ol></div>`}
function confetti(n){if(P.calm)return;const app=$('#app'),E=['🎉','⭐','✨','💛','🧡','🌟'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='cf';s.textContent=E[i%E.length];
    s.style.cssText=`left:${10+Math.random()*80}%;--dx:${(Math.random()-.5)*160}px;--r:${(Math.random()-.5)*720}deg;animation-delay:${Math.random()*.25}s;font-size:${14+Math.random()*14}px`;
    app.appendChild(s);setTimeout(()=>s.remove(),1900)}}
document.addEventListener('click',e=>{const m=e.target.closest&&e.target.closest('.mascot');if(m){m.classList.remove('spin');void m.offsetWidth;m.classList.add('spin')}});
document.addEventListener('animationend',e=>{const m=e.target;if(m.classList&&m.classList.contains('mascot'))m.classList.remove('cheer','oops','spin')});

/* ===== v6: Misi Pak Yood (game skenario interaktif) ===== */
const GAMES=()=>LEVELS.flatMap(L=>L.mods.filter(m=>m.game).map(m=>[L,m]));
function startGame(M){go('gm',{g:{m:M,i:0,sc:0,w:0}})}
function vGame(){
  title.textContent='Misi Pak Yood';const G=S.g;
  if(!G){
    view.innerHTML=guide('Pilih misi! Di tiap misi kamu <b>memberi perintah</b> ke tokoh lewat kalimat bahasa Inggris yang tepat. Salah perintah? Tokohnya bisa kebingungan 😆')
      +'<div class="path">'+GAMES().map(([L,m])=>`<button class="card" data-n="${m.n}"><span class="ico">${m.game.e}</span><span class="txt"><small>${L.name}</small><b>${m.game.t}</b><em>${m.n}</em></span><span class="stars">${starStr((P.game||{})[m.n]||0)}</span></button>`).join('')+'</div>';
    view.querySelectorAll('.card').forEach(b=>b.onclick=()=>startGame(GAMES().find(x=>x[1].n===b.dataset.n)[1]));return}
  const M=G.m,T=M.game.sc;
  if(G.i>=T.length){
    const st=Math.round(G.sc/T.length*3);P.game=P.game||{};if(st>(P.game[M.n]||0))P.game[M.n]=st;P.xp+=G.sc*15;save();dots(T.length,T.length);
    view.innerHTML=guide(G.sc===T.length?'Misi sempurna! Tokohnya senang banget 🥳':'Misi selesai! Ulangi biar sempurna 💪')+`<div class="res"><div class="big">${starStr(st)}</div><p><b>${G.sc}/${T.length}</b> perintah tepat di percobaan pertama · +${G.sc*15} XP</p></div><div class="foot"><button class="btn" id="ag">Main lagi</button><button class="btn ghost" id="ls">Daftar misi</button></div>`;
    $('#ag').onclick=()=>startGame(M);$('#ls').onclick=()=>go('gm',{g:null});
    setTimeout(()=>{react(G.sc>=2?'cheer':'oops');if(G.sc===T.length)confetti(40)},350);return}
  const [e,p,n,o,a,fx,an,y]=T[G.i],[nar,cmd]=n.split('|');dots(G.i+1,T.length);
  view.innerHTML=guide(`<b>${nar}</b><br>🎮 ${cmd}`)+`<div class="stage"><div class="actor" id="ac">${e}</div><div class="prop">${p}</div><div class="cap" id="cp"></div></div><div class="opts">${shuffle(o.map((x,i)=>[x,i])).map(([x,i])=>`<button class="opt" data-i="${i}">${x}</button>`).join('')}</div><div id="why"></div><div class="foot" id="ft"></div>`;
  view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,ok=i===a;
    view.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.i===a)x.classList.add('ok');else if(x===b)x.classList.add('bad')});

const P2=`<b>The Gig Economy: Freedom or Fragility?</b><br><br>In the past decade, the so-called gig economy has transformed the way millions of people earn a living. Instead of holding a permanent job with a single employer, gig workers take short-term assignments through digital platforms, such as ride-hailing apps, food-delivery services, or freelance websites.<br><br>Supporters argue that this model offers unprecedented flexibility. Workers can decide when, where, and how much they work, which is particularly attractive to students, parents, and those seeking supplementary income. Moreover, platforms allow small businesses to hire specialized talent without the cost of full-time salaries.<br><br>Critics, however, point out that flexibility often comes at a price. Because gig workers are classified as independent contractors rather than employees, they typically lack benefits such as health insurance, paid leave, and retirement plans. Their earnings can also fluctuate dramatically, making it difficult to plan for the future. Furthermore, algorithms that assign tasks and evaluate performance may lack transparency, leaving workers uncertain about how decisions affecting their income are made.<br><br>Consequently, governments around the world are debating how to regulate the sector. Some propose a new legal category that grants limited protections without eliminating flexibility, while others insist that most gig workers should simply be treated as employees. Whichever approach prevails, it is clear that the gig economy will remain a defining feature of modern labor markets.`;
A(2,'Reading Panjang SMA: The Gig Economy',G,[

 R('Which benefit is NOT listed for gig workers?',['Flexible schedules','Extra income','Paid leave','Choosing where to work'],2,'Fleksibilitas jadwal dan lokasi serta penghasilan tambahan disebut di paragraf 2. <b>Paid leave</b> justru termasuk tunjangan yang <b>tidak</b> dimiliki pekerja gig (paragraf 3).',['Ada di paragraf 2.','Ada: supplementary income.','','Ada: where they work.'],P2),

const P3=`<b>Why Do We Forget?</b><br><br>Hermann Ebbinghaus, a German psychologist, was among the first to study forgetting scientifically. In the 1880s, he memorized lists of meaningless syllables and tested himself at different intervals. His results revealed what is now called the forgetting curve: memory declines sharply soon after learning, then levels off.<br><br>According to Ebbinghaus, roughly half of newly learned information may be lost within an hour if it is not reviewed, and a large portion disappears within a day. However, he also discovered that each review slows the decline, so the same material is retained for longer after every repetition.<br><br>These findings underpin the technique known as spaced repetition, in which learners review material at gradually increasing intervals. Rather than cramming everything the night before an exam, they revisit it after a day, then a few days, then a week. Research consistently shows that this approach produces far stronger long-term retention than massed study, even when the total study time is identical.<br><br>Nevertheless, it should be noted that Ebbinghaus's experiments used nonsense syllables. Meaningful material, such as a story or a concept that connects to prior knowledge, is generally forgotten more slowly. Thus, understanding what you learn is just as important as how often you review it.`;
A(2,'Reading Panjang SMA: Why Do We Forget?',G,[
 {s:'Teks sains sering memuat <b>penelitian → temuan → penerapan → batasan</b>. Cari kata penanda batasan: <b>nevertheless, however, it should be noted</b>. Soal sering menguji batasan itu.',ex:[],...STRAT,tip:'Perhatikan kata hedging seperti <b>may, roughly, generally</b>; itu menandakan klaim tidak mutlak.'},
 {s:'Peta paragraf:',ex:['1️⃣ Ebbinghaus meneliti lupa; hasilnya: forgetting curve.','2️⃣ Sekitar setengah informasi bisa hilang dalam sejam; tiap review memperlambat lupa.','3️⃣ Spaced repetition: review berjarak lebih efektif daripada cramming.','4️⃣ Batasan: eksperimen memakai suku kata tak bermakna; materi bermakna lebih awet.']}
],[
 R('What is the passage mainly about?',['How forgetting works and how to reduce it','How to write German','Why exams are cancelled','A history of psychology prizes'],0,'Paragraf 1-2 menjelaskan pola lupa, paragraf 3 solusi (spaced repetition), dan paragraf 4 batasan. Main idea mencakup <b>penyebab dan cara mengurangi lupa</b>.',['','Tidak dibahas.','Tidak dibahas.','Tidak dibahas.'],P3),
 R('What does the forgetting curve show?',['Memory drops fast at first, then slows','Memory never changes','Memory improves every hour','Only meaningful words are forgotten'],0,'Definisi di paragraf 1: memori "declines sharply soon after learning, then levels off". <b>Levels off</b> = mendatar/melambat.',['','Bertentangan dengan teks.','Justru menurun.','Teks tidak berkata begitu.'],P3),
 R('"Cramming" in paragraph 3 means ...',['studying a lot in a short time','sleeping before an exam','reviewing slowly over weeks','teaching others'],0,'Kontrasnya jelas: <b>rather than cramming</b> lawan dari review berjarak. Jadi cramming = belajar kebut semalam.',['','Tidak berkaitan dengan tidur.','Itu justru spaced repetition.','Tidak berkaitan.'],P3),
 R('"They" in paragraph 3 ("they revisit it") refers to ...',['learners','syllables','psychologists','exams'],0,'Subjek kalimat sebelumnya adalah <b>learners</b> yang me-review materi dengan jarak makin lama. Pronoun merujuk ke pelaku itu.',['','Suku kata tidak bisa me-review.','Tidak disebut di kalimat itu.','Ujian tidak me-review.'],P3),
 R('According to the passage, spaced repetition is better than massed study ...',['even when total study time is the same','only for German students','only if you study less','when you skip review'],0,'Kalimat terakhir paragraf 3: lebih kuat "even when the total study time is identical". <b>Even when</b> menekankan bahwa kondisinya sama.',['','Tidak ada batasan itu.','Tidak disebut.','Bertentangan dengan teks.'],P3),
 R('Why does the author mention nonsense syllables in the last paragraph?',['To show a limitation of the experiments','To prove they are easy to learn','To criticize psychologists','To end the passage with a joke'],0,'Penanda <b>Nevertheless, it should be noted</b> memperkenalkan batasan: hasilnya mungkin berbeda untuk materi bermakna. Jadi fungsinya adalah menunjukkan keterbatasan.',['','Teks tidak membahas kemudahan.','Tidak ada kritik.','Nada teks serius.'],P3),
 T('Lengkapi (satu kata dari teks): Meaningful material is generally forgotten more ___ .','slowly','Paragraf 4: "is generally forgotten more <b>slowly</b>". Kata keterangan cara untuk kata kerja forgotten.',P3)
],K('FORGETTING CURVE',['📉 Kurva','turun cepat','lalu mendatar'],['🔁 Solusi','spaced repetition','review bertahap'],['⚠️ Batasan','suku kata tak bermakna']));
