<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF4E9">
<title>Pak Yood · Belajar Bahasa Inggris</title>
<!-- v31: font sans-serif (Bricolage Grotesque + Figtree), beranda ditata ulang. v29: tipografi baru (Figtree + Newsreader). v26: +fitur-v26 (target harian, backup, latihan ngomong). v25: 3 blok script (data-kurikulum, bank-tambahan, engine); 13 blok lama digabung -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens: Terracotta, Cream, White ===== */
:root{
  --terra:#C2593F; --terra-d:#9E4430; --terra-l:#F4DDD3;
  --cream:#FBF4E9; --cream-d:#EFE3D0; --white:#fff;
  --ink:#3A2A24; --mute:#8B7569;
  --ok:#4F7F55; --ok-bg:#E3EEDF; --bad:#B24334; --bad-bg:#F7DFD9;
  --r:18px; --ease:cubic-bezier(.3,.8,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;background:var(--cream-d);color:var(--ink);display:flex;justify-content:center;line-height:1.55}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--terra);outline-offset:2px}

/* ===== App shell (phone-like column) ===== */
#app{width:100%;max-width:480px;height:100%;background:var(--cream);display:flex;flex-direction:column;overflow:hidden;position:relative}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
#back{width:38px;height:38px;border-radius:50%;background:var(--white);font-size:18px;color:var(--terra);box-shadow:0 1px 0 var(--cream-d);transition:transform .2s var(--ease),background .2s}
#back:active{transform:scale(.88)}
#title{flex:1;font-weight:700;font-size:17px;letter-spacing:.2px}
#prog{display:flex;gap:5px}
#prog i{width:18px;height:6px;border-radius:6px;background:var(--cream-d);transition:background .3s,width .3s}
#prog i.on{background:var(--terra);width:26px}

/* ===== Views + page transition ===== */
.view{flex:1;overflow-y:auto;padding:8px 18px 0;display:flex;flex-direction:column;gap:16px}
.view>*{flex-shrink:0}
.view.in{animation:slide .38s var(--ease)}
@keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}

/* ===== Owl guide + speech bubble ===== */
.guide{display:flex;gap:12px;align-items:flex-start}
.mascot{width:84px;flex:none;transform-origin:50% 90%;animation:float 3.6s ease-in-out infinite}
.mascot svg{width:100%;display:block;overflow:visible}
.mascot .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
.mascot.cheer{animation:hop .8s var(--ease)}
.mascot.cheer::after{content:"✨";position:absolute;font-size:22px;margin:-6px 0 0 -14px;animation:spark .8s ease-out forwards}
.mascot.oops{animation:shake .5s}
.mascot{position:relative}
@keyframes float{50%{transform:translateY(-4px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-22px) rotate(-6deg)}60%{transform:translateY(0) rotate(5deg)}80%{transform:translateY(-8px)}100%{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-6px) rotate(-4deg)}40%,80%{transform:translateX(6px) rotate(4deg)}}
@keyframes spark{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-28px)}}
.bubble{position:relative;background:var(--white);border-radius:var(--r);padding:13px 15px;font-size:15px;box-shadow:0 2px 0 var(--cream-d);flex:1}
.bubble::before{content:"";position:absolute;left:-7px;top:22px;width:14px;height:14px;background:var(--white);transform:rotate(45deg);border-radius:3px}
.bubble.pop{animation:pop .35s var(--ease)}
@keyframes pop{from{opacity:.2;transform:scale(.94)}to{opacity:1;transform:none}}
.bubble b{color:var(--terra-d)}

/* ===== Menu: learning map ===== */
.path{display:flex;flex-direction:column;gap:12px;padding-bottom:24px;position:relative}
.path::before{content:"";position:absolute;left:36px;top:30px;bottom:50px;border-left:2px dashed var(--terra-l)}
.card{position:relative;display:flex;align-items:center;gap:14px;text-align:left;background:var(--white);border-radius:var(--r);padding:14px;box-shadow:0 2px 0 var(--cream-d);transition:transform .2s var(--ease),box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(158,68,48,.12)}
.card:active{transform:scale(.97)}
.ico{width:46px;height:46px;border-radius:50%;background:var(--terra-l);display:grid;place-items:center;font-size:24px;flex:none}
.txt{flex:1;display:flex;flex-direction:column}
.txt small{color:var(--mute);font-size:12px}
.txt b{font-size:17px}
.txt em{font-style:normal;color:var(--terra-d);font-size:13px}
.stars{color:var(--terra);letter-spacing:1px;font-size:15px}

/* ===== Lesson examples + quiz ===== */
.ex{background:var(--terra-l);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15px;animation:pop .4s var(--ease)}
.ex b{color:var(--terra-d)}
.qcard{background:var(--white);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.q{font-weight:700;font-size:16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:13px 15px;border-radius:14px;background:var(--cream);border:2px solid transparent;font-size:15px;transition:transform .15s var(--ease),background .25s,border-color .25s}
.opt:active{transform:scale(.97)}
.opt:hover:not(:disabled){border-color:var(--terra-l)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);animation:shake .4s}
.opt:disabled{cursor:default}
.why{font-size:14px;color:var(--ink);background:var(--cream);border-radius:12px;padding:11px 13px;animation:pop .35s var(--ease)}
.res{text-align:center;background:var(--white);border-radius:var(--r);padding:22px}
.res .big{font-size:38px;color:var(--terra);letter-spacing:4px}

/* ===== Buttons / sticky footer ===== */
.foot{margin-top:auto;position:sticky;bottom:0;display:flex;flex-direction:column;gap:8px;padding:12px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--cream) 28%)}
.btn{width:100%;padding:15px;border-radius:16px;background:var(--terra);color:var(--white);font-weight:700;font-size:16px;box-shadow:0 4px 0 var(--terra-d);transition:transform .15s var(--ease),box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--terra-d)}
.btn.ghost{background:var(--white);color:var(--terra-d);box-shadow:0 2px 0 var(--cream-d)}
.btn.ghost:active{transform:translateY(1px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ===== v2 additions ===== */
#gear{width:38px;height:38px;border-radius:50%;background:var(--white);font-size:18px;color:var(--terra);transition:transform .3s var(--ease)}
#gear:active{transform:rotate(60deg)}
[data-theme=dark]{--terra:#D9735A;--terra-d:#F2A892;--terra-l:#4A3029;--cream:#2A1D19;--cream-d:#1C1311;--white:#38271F;--ink:#F6EBDD;--mute:#B7A397;--ok:#8FC397;--ok-bg:#25382A;--bad:#F08C7C;--bad-bg:#4A2622}
[data-theme=dark] .btn{box-shadow:0 4px 0 #8E3F2D}
[data-calm] *{animation:none!important;transition:none!important}
.stats{display:flex;gap:8px;flex-wrap:wrap;font-size:14px}
.pill{background:var(--white);border-radius:99px;padding:6px 12px;font-weight:700}
.card.lock{opacity:.55}
.brow{opacity:0;transition:opacity .2s}
.mascot.oops .brow{opacity:1}
.ex p{cursor:pointer}.ex p::after{content:" 🔊";font-size:12px;opacity:.55}
.in{width:100%;padding:13px 15px;border-radius:14px;border:2px solid var(--cream-d);background:var(--cream);font:inherit;color:var(--ink);transition:border-color .2s}
.in:focus{outline:0;border-color:var(--terra)}
.words{display:flex;flex-wrap:wrap;gap:8px;min-height:46px}
.slot{border-bottom:2px dashed var(--terra-l);padding-bottom:8px}
.chip{padding:9px 13px;border-radius:12px;background:var(--cream);border:2px solid var(--terra-l);transition:transform .15s var(--ease)}
.chip:active{transform:scale(.92)}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--white);border-radius:var(--r);padding:14px 16px}
.sw{width:50px;height:28px;border-radius:99px;background:var(--cream-d);position:relative;transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--white);transition:transform .25s var(--ease)}
.sw.on{background:var(--terra)}.sw.on::after{transform:translateX(22px)}
/* ===== Peta konsep (mind map) ===== */
.mm{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:26px}
.mm::before{content:"";position:absolute;left:10px;top:20px;bottom:24px;border-left:2px solid var(--terra-l)}
.mm-c{align-self:flex-start;margin-left:-26px;background:var(--terra);color:#fff;font-weight:700;padding:11px 20px;border-radius:99px;position:relative;z-index:1}
.mm-b{position:relative;background:var(--white);border-radius:14px;padding:10px 12px;animation:pop .45s var(--ease) both}
.mm-b::before{content:"";position:absolute;left:-16px;top:21px;width:16px;border-top:2px solid var(--terra-l)}
.mm-b b{display:block;color:var(--terra-d);margin-bottom:6px;font-size:15px}
.mm-b span{display:inline-block;background:var(--terra-l);border-radius:99px;padding:3px 10px;margin:0 6px 6px 0;font-size:13px}
/* ===== Tabel & kotak peringatan ===== */
.tbl{overflow-x:auto;background:var(--white);border-radius:14px}
.tbl table{border-collapse:collapse;width:100%;font-size:14px}
.tbl th{background:var(--terra);color:#fff;padding:9px 10px;text-align:left;font-weight:700}
.tbl td{padding:9px 10px;border-top:1px solid var(--cream-d);vertical-align:top}
.tip{background:var(--white);border-left:4px solid var(--terra);border-radius:12px;padding:11px 14px;font-size:14px;animation:pop .4s var(--ease)}
/* ===== Bab (grup sub-modul) ===== */
.grp h3{display:flex;justify-content:space-between;align-items:baseline;font-size:16px;margin:2px 2px 10px}
.grp h3 small{color:var(--mute);font-weight:400;font-size:12px}
.grp .path{padding-bottom:4px}
.pas{background:var(--cream);border-left:4px solid var(--terra);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.65}
/* ===== v5 PREMIUM ===== */
:root{--gold:#E8A13A;--sh1:0 1px 2px rgba(110,50,30,.07),0 10px 26px -14px rgba(110,50,30,.35)}
body{font-family:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-.011em;background:radial-gradient(900px 500px at 15% -10%,#FAE6D3,transparent 70%),radial-gradient(700px 500px at 100% 110%,#F4D3C6,transparent 70%),var(--cream-d)}
[data-theme=dark] body{background:radial-gradient(900px 500px at 15% -10%,#3A2520,transparent 70%),var(--cream-d)}
@media(min-width:520px){body{padding:22px}#app{border-radius:34px;box-shadow:0 40px 90px -20px rgba(110,50,30,.4),0 0 0 1px rgba(255,255,255,.5) inset}}
#app{background:linear-gradient(180deg,var(--cream),color-mix(in srgb,var(--cream) 88%,var(--terra-l)))}
header{position:relative;z-index:5;background:color-mix(in srgb,var(--cream) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(194,89,63,.1)}
#title,.card b,.q,.grp h3{font-weight:700;letter-spacing:-.02em}
#title{font-size:18px}
#back,#gear{box-shadow:var(--sh1);border:1px solid rgba(194,89,63,.12)}
#prog i.on{background:linear-gradient(90deg,var(--terra),var(--gold))}
.card,.qcard,.res,.set,.tbl,.bubble,.mm-b,.pill{border:1px solid rgba(194,89,63,.09);box-shadow:var(--sh1)}
.card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(110,50,30,.08),0 18px 34px -14px rgba(158,68,48,.45)}
.ico{background:linear-gradient(145deg,var(--white),var(--terra-l));box-shadow:inset 0 0 0 1px rgba(194,89,63,.18),0 6px 12px -6px rgba(158,68,48,.4)}
.btn{background:linear-gradient(180deg,#D9704F,var(--terra));border-radius:18px;letter-spacing:.3px;text-shadow:0 1px 0 rgba(0,0,0,.15);box-shadow:0 4px 0 var(--terra-d),0 14px 22px -10px rgba(194,89,63,.6),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{background:var(--white);text-shadow:none;box-shadow:0 2px 0 var(--cream-d),0 10px 18px -12px rgba(0,0,0,.25)}
.btn:active{transform:translateY(3px) scale(.98,.96)}
.bubble{border-radius:20px}
.ex{background:linear-gradient(135deg,var(--terra-l),color-mix(in srgb,var(--terra-l) 55%,var(--white)));border:1px solid rgba(194,89,63,.12)}
.tbl th{background:linear-gradient(135deg,var(--terra),var(--terra-d))}
.mm-c{background:linear-gradient(135deg,var(--terra),var(--gold));box-shadow:0 8px 18px -8px rgba(194,89,63,.7)}
.opt{border:2px solid var(--cream-d);background:var(--white);box-shadow:0 2px 0 var(--cream-d)}
.opt.ok{animation:jelly .6s}
.why{border:1px solid rgba(194,89,63,.1)}
.mascot svg{filter:drop-shadow(0 8px 10px rgba(110,50,30,.28));animation:tilt 7s ease-in-out infinite}
.wing{transform-box:fill-box;transform-origin:50% 50%}
.wl{animation:flapl 3.4s ease-in-out infinite}.wr{animation:flapr 3.4s ease-in-out infinite}
.tas{transform-box:fill-box;transform-origin:50% 0;animation:sway 2s ease-in-out infinite}
.mascot.spin{animation:spin .8s var(--ease)}
.mascot.cheer{animation:hop .9s var(--ease)}
.mascot.oops::before{content:"💦";position:absolute;right:2px;top:2px;font-size:20px;animation:drip 1s ease-in forwards}
.view.in{animation:slide .45s cubic-bezier(.34,1.56,.64,1)}
.path .card,.mm-b{animation:rise .55s var(--ease) both}
.path .card:nth-child(2){animation-delay:.07s}.path .card:nth-child(3){animation-delay:.14s}.path .card:nth-child(4){animation-delay:.21s}.path .card:nth-child(5){animation-delay:.28s}.path .card:nth-child(6){animation-delay:.35s}
.res .big{animation:bigpop 1s var(--ease)}
.pill:first-child{animation:flame 2.4s ease-in-out infinite}
.why.full{padding:15px 16px}.why.full h4{font-size:16px;font-weight:700;color:var(--terra-d);margin-bottom:10px}
.exp{list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:12px}
.exp li{counter-increment:s;position:relative;padding-left:38px;font-size:14px;animation:rise .5s var(--ease) both}
.exp li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--terra),var(--gold));color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;box-shadow:0 4px 8px -3px rgba(194,89,63,.6)}
.exp li strong{display:block;color:var(--terra-d);margin-bottom:3px}
.ex2{background:var(--terra-l);border-radius:10px;padding:8px 10px;margin-top:5px}
.pas{background:var(--white)}
.cf{position:absolute;top:28%;pointer-events:none;z-index:50;animation:cf 1.6s ease-out forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}60%{transform:translateY(-3px) scale(1.01)}to{opacity:1;transform:none}}
@keyframes jelly{0%{transform:scale(1)}30%{transform:scale(1.07,.9)}50%{transform:scale(.95,1.06)}75%{transform:scale(1.03,.98)}100%{transform:scale(1)}}
@keyframes tilt{0%,84%,100%{transform:none}88%{transform:rotate(-9deg)}94%{transform:rotate(8deg)}}
@keyframes flapl{0%,72%,100%{transform:rotate(12deg)}80%{transform:rotate(-18deg)}88%{transform:rotate(20deg)}}
@keyframes flapr{0%,72%,100%{transform:rotate(-12deg)}80%{transform:rotate(18deg)}88%{transform:rotate(-20deg)}}
@keyframes sway{50%{transform:rotate(14deg)}}
@keyframes spin{0%{transform:scale(1)}40%{transform:rotate(360deg) scale(1.25)}70%{transform:rotate(360deg) scale(.9,1.1)}100%{transform:rotate(360deg) scale(1)}}
@keyframes drip{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(26px)}}
@keyframes bigpop{0%{transform:scale(.2) rotate(-20deg);opacity:0}55%{transform:scale(1.35) rotate(8deg);opacity:1}80%{transform:scale(.92) rotate(-3deg)}100%{transform:none}}
@keyframes flame{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg) scale(1.05)}75%{transform:rotate(4deg) scale(1.05)}}
@keyframes cf{0%{transform:translateY(0) scale(.4);opacity:1}20%{transform:translateY(-90px) scale(1)}100%{transform:translate(var(--dx),430px) rotate(var(--r));opacity:0}}
/* ===== v6 Misi ===== */
.stage{position:relative;height:200px;border-radius:26px;background:linear-gradient(180deg,#FFEBCF 0%,#FCD9BC 56%,#E6C39C 56%,#D4AE85 100%);overflow:hidden;display:flex;align-items:flex-end;justify-content:center;gap:22px;padding-bottom:30px;box-shadow:var(--sh1);border:1px solid rgba(194,89,63,.14)}
.stage::before{content:"☁️";position:absolute;top:34px;left:12%;font-size:26px;opacity:.7;animation:cloud 9s ease-in-out infinite alternate}
.stage::after{content:"☀️";position:absolute;top:10px;right:14px;font-size:28px}
[data-theme=dark] .stage{filter:brightness(.78)}
.actor{font-size:86px;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.22));transform-origin:50% 100%;position:relative;z-index:1}
.prop{font-size:58px;line-height:1;margin-bottom:6px;position:relative;z-index:1}
.cap{position:absolute;left:10px;right:10px;top:8px;z-index:2;text-align:center;background:rgba(255,255,255,.94);color:#3A2A24;border-radius:14px;padding:7px 10px;font-size:14px;font-weight:650;opacity:0;transform:translateY(-8px);transition:.3s;box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
.cap:not(:empty){opacity:1;transform:none}.cap span{font-size:20px;margin-right:4px}
.a-hop{animation:ahop .8s ease-in-out 2}.a-wiggle{animation:awig .45s ease-in-out 4}.a-slide{animation:aslide 1.3s ease-in-out}.a-spin{animation:aspin .9s ease-in-out}.a-grow{animation:agrow 1.1s ease-in-out}.a-oops{animation:aoops .9s ease-in-out}
@keyframes ahop{0%,100%{transform:none}50%{transform:translateY(-34px) scale(1.08,.94)}}
@keyframes awig{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg)}75%{transform:rotate(13deg)}}
@keyframes aslide{0%{transform:translateX(0)}35%{transform:translateX(-70px) rotate(-6deg)}70%{transform:translateX(70px) rotate(6deg)}100%{transform:none}}
@keyframes aspin{to{transform:rotate(360deg) scale(1.15)}}
@keyframes agrow{0%,100%{transform:none}50%{transform:scale(1.5)}}
@keyframes aoops{0%,100%{transform:none}20%{transform:rotate(-16deg) translateX(-12px)}40%{transform:rotate(16deg) translateX(12px)}60%{transform:rotate(-9deg)}80%{transform:rotate(6deg) scaleY(.88)}}
@keyframes cloud{to{transform:translateX(60px)}}
</style>

<style id="v19css">

:root{--serif:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;--gold:#E3A23B;--gold-d:#B97A12;--line:rgba(120,60,40,.13);

.view::-webkit-scrollbar{width:6px}.view::-webkit-scrollbar-thumb{background:var(--terra-l);border-radius:9px}

 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .26  0 0 0 0 .18  0 0 0 .38 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>")}
header,.view{position:relative;z-index:1}
header{background:color-mix(in srgb,var(--cream) 70%,transparent);border-bottom:1px solid var(--line)}
#title{font-family:var(--serif);font-weight:650;font-size:19px;letter-spacing:-.01em;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
#back,#gear{border:1px solid var(--line);box-shadow:var(--sh2);transition:transform .25s var(--ease),box-shadow .25s}
#back:hover,#gear:hover{box-shadow:var(--sh3)}
#prog i{height:5px;border-radius:5px;background:var(--line)}
#prog i.on{background:linear-gradient(90deg,var(--terra),var(--gold));box-shadow:0 0 10px -2px color-mix(in srgb,var(--gold) 70%,transparent)}
/* kartu */
.card{border-radius:20px;padding:15px 16px;border:1px solid var(--line);background:linear-gradient(180deg,var(--white),color-mix(in srgb,var(--white) 93%,var(--terra-l)));box-shadow:var(--sh2)}
.card:hover{transform:translateY(-3px);box-shadow:var(--sh3)}
.card .txt b{font-family:var(--serif);font-weight:650;font-size:17.5px;letter-spacing:-.012em;line-height:1.25}
.card .txt small{text-transform:uppercase;letter-spacing:.09em;font-size:10.5px;font-weight:800;color:var(--terra)}
.card .txt em{color:var(--mute)}
.ico{width:50px;height:50px;border-radius:16px;font-size:25px;background:linear-gradient(145deg,var(--white),var(--terra-l));box-shadow:inset 0 0 0 1px var(--line),0 8px 14px -8px rgba(158,68,48,.5)}
.stars{color:var(--gold);text-shadow:0 1px 0 rgba(185,122,18,.25);font-size:14px}
.path::before{left:40px;border-left:2px dashed color-mix(in srgb,var(--terra) 26%,transparent)}
.grp h3{font-family:var(--serif);font-size:18px;font-weight:650}
.grp h3 small{background:var(--terra-l);color:var(--terra-d);padding:3px 10px;border-radius:99px;font-weight:700;font-family:inherit}
/* tombol */
.btn{min-height:54px;border-radius:18px;background:linear-gradient(180deg,#D96E50 0%,#BC5237 100%);color:#fff;font-weight:700;letter-spacing:.01em;position:relative;overflow:hidden;
 text-shadow:0 1px 1px rgba(90,25,10,.32);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -2px 0 rgba(0,0,0,.14),0 16px 28px -14px rgba(188,82,55,.85)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.3) 50%,transparent 70%);transform:translateX(-130%);transition:transform .8s var(--ease)}
.btn:hover::after{transform:translateX(130%)}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:inset 0 2px 4px rgba(0,0,0,.2),0 6px 12px -8px rgba(188,82,55,.8)}
.btn.ghost{background:var(--white);color:var(--terra-d);border:1px solid var(--line);text-shadow:none;box-shadow:var(--sh2)}
.btn.ghost::after{display:none}
/* kuis */
.qcard{border-radius:24px;padding:20px;border:1px solid var(--line);box-shadow:var(--sh3);background:linear-gradient(180deg,var(--white),color-mix(in srgb,var(--white) 95%,var(--terra-l)))}
.q{font-size:18px;line-height:1.45;letter-spacing:-.015em}
.opts{counter-reset:opt}
.opt{position:relative;padding:14px 16px 14px 54px;border-radius:16px;border:1.5px solid var(--line);background:var(--white);box-shadow:0 1px 0 var(--line);font-weight:500}
.opt::before{counter-increment:opt;content:counter(opt,upper-alpha);position:absolute;left:12px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--terra-d);background:var(--terra-l);transition:background .25s,color .25s}
.opt:hover:not(:disabled){border-color:var(--terra);transform:translateY(-1px);box-shadow:0 10px 18px -12px rgba(158,68,48,.55)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.ok::before{content:"✓";background:var(--ok);color:#fff}
.opt.bad::before{content:"✕";background:var(--bad);color:#fff}
#ml .opt,#mr .opt{padding-left:16px}#ml .opt::before,#mr .opt::before{display:none}
.in{padding:15px 16px;border-radius:16px;border:1.5px solid var(--line);font-size:16px;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.in:focus{border-color:var(--terra);box-shadow:0 0 0 4px color-mix(in srgb,var(--terra) 18%,transparent)}
.chip{padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--white);box-shadow:0 2px 0 var(--line);font-weight:600}
.slot{min-height:54px;border-bottom:2px dashed color-mix(in srgb,var(--terra) 35%,transparent)}
.why{border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh2);background:linear-gradient(180deg,var(--white),color-mix(in srgb,var(--cream) 78%,var(--white)))}
.why.full h4{font-family:var(--serif);font-size:18px;font-weight:650}
.rqn{margin-top:12px;padding:9px 12px;border-radius:12px;background:var(--terra-l);color:var(--terra-d);font-size:13px;font-weight:600}
.nudge{padding:12px 14px;border-radius:14px;font-size:14px;background:color-mix(in srgb,var(--gold) 16%,var(--white));border:1px solid color-mix(in srgb,var(--gold) 50%,transparent);animation:pop .35s var(--ease)}
/* pembelajaran */
.bubble{border-radius:22px;border:1px solid var(--line);box-shadow:var(--sh2)}
.bubble::before{border-left:1px solid var(--line);border-bottom:1px solid var(--line)}
.ex{border-left:3px solid var(--terra);border-radius:18px}
.tip{border-left-color:var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--white))}
.tbl{border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh2)}
.tbl tr:nth-child(even) td{background:color-mix(in srgb,var(--cream) 70%,transparent)}
.res{border-radius:26px;padding:26px 20px;box-shadow:var(--sh3);background:linear-gradient(180deg,var(--white),color-mix(in srgb,var(--white) 91%,var(--terra-l)))}
.res .big{color:var(--gold);text-shadow:0 6px 14px rgba(185,122,18,.35);font-size:44px}
.set{border-radius:20px;border:1px solid var(--line);box-shadow:var(--sh2)}
/* dashboard beranda */
.dash{display:flex;align-items:center;gap:16px;padding:17px 18px;border-radius:26px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,#C85E42 0%,#A9442E 55%,#85341F 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 24px 42px -24px rgba(133,52,31,.95);animation:rise .6s var(--ease) both}
.dash::before{content:"";position:absolute;right:-50px;top:-70px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,150,.55),transparent 65%)}
.ring{--p:0;flex:none;position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#FFD27A calc(var(--p)*1%),rgba(255,255,255,.22) 0)}
.ring::before{content:"";position:absolute;inset:7px;border-radius:50%;background:#A9442E}
.ring b{position:relative;font-family:var(--serif);font-size:19px}
.dcol{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.dt{font-family:var(--serif);font-size:19px;font-weight:650;letter-spacing:-.01em}
.ds{font-size:13px;opacity:.88}
.dp{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.dp span{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.24);padding:4px 10px;border-radius:99px;font-size:12.5px;font-weight:700}
/* mode gelap */
[data-theme=dark]{--line:rgba(255,226,205,.11);--cream:#211613;--cream-d:#140D0B;--white:#2F201A;--terra-l:#4A2F27;
 --sh2:inset 0 1px 0 rgba(255,255,255,.04),0 16px 30px -18px rgba(0,0,0,.75);--sh3:inset 0 1px 0 rgba(255,255,255,.05),0 30px 54px -26px rgba(0,0,0,.85)}
[data-theme=dark] #app::before{opacity:.18;mix-blend-mode:screen}
[data-theme=dark] .btn{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.25),0 16px 28px -14px rgba(0,0,0,.8)}
[data-theme=dark] .btn.ghost{color:var(--terra-d)}
</style>

const LEVELS=[{"id":"sd","name":"Level SD","tag":"Pemula","emoji":"🌱","mods":[{"n":"To Be: am / is / are","steps":[{"s":"Halo, aku <b>Pak Yood</b> 🦉! Hari ini kita kenalan sama <b>To Be</b>. Anggap saja To Be itu <b>lem perekat kata</b>: dia menempelkan \"siapa\" ke \"apa/bagaimana\".","ex":[]},{"s":"Lemnya ada 3 ukuran. <b>am</b> itu lem kecil khusus buat <b>I</b> (kamu sendiri). <b>is</b> lem sedang buat satu orang atau benda lain. <b>are</b> lem besar buat kamu dan orang banyak.","ex":["I → <b>am</b>","He / She / It → <b>is</b>","You / We / They → <b>are</b>"]},{"s":"Lihat, lemnya selalu nempel di tengah, di antara dua kata!","ex":["I <b>am</b> happy.","She <b>is</b> a teacher.","They <b>are</b> friends."]},{"s":"Lem juga bisa dilepas atau dipindah. <b>Negatif</b>: tambah <b>not</b>. <b>Tanya</b>: lemnya maju ke depan, seperti orang yang menyerobot antrean paling depan.","ex":["I am <b>not</b> tired.","<b>Is</b> she a teacher?","<b>Are</b> they here?"]}],"quiz":[{"q":"I ___ a student.","o":["am","is","are"],"a":0,"why":"\"I\" pasangannya selalu <b>am</b>, lem kecil buat satu orang: kamu sendiri."},{"q":"She ___ my sister.","o":["am","is","are"],"a":1,"why":"She itu satu orang, jadi pakai lem sedang: <b>is</b>."},{"q":"We ___ best friends.","o":["is","am","are"],"a":2,"why":"We itu banyak orang (kamu + aku), jadi butuh lem besar: <b>are</b>."},{"t":"type","q":"Ketik am/is/are: ___ they your friends?","a":["are"],"why":"They butuh lem besar <b>are</b>, dan lemnya maju ke depan untuk bertanya."},{"t":"order","q":"Susun pertanyaan: \"Apakah dia dokter?\"","w":["Is","he","a","doctor"],"a":"Is he a doctor","why":"Lem <b>is</b> maju ke depan."},{"t":"listen","say":"She is a teacher.","q":"Dengarkan, lalu ketik kalimat yang kamu dengar:","a":["she is a teacher"],"why":"Kalimatnya: <b>She is a teacher.</b> She pakai lem is."}],"map":{"c":"TO BE (lem kata)","b":[{"t":"I","k":["am"]},{"t":"He / She / It","k":["is"]},{"t":"You / We / They","k":["are"]},{"t":"Negatif & Tanya","k":["+ not","Is she…?"]}]},"g":"⏰ Tenses Dasar","game":{"e":"🏫","t":"Hari Pertama di Kelas","sc":[["🧑‍🎓","🎒","Kamu murid baru dan harus memperkenalkan diri.|Pilih kalimat yang kamu ucapkan.",["I am a student.","I is a student.","I are a student."],0,"🙋","hop","I selalu berpasangan dengan am (lem kecil)."],["👩‍🏫","📚","Bu Sari masuk kelas. Perkenalkan beliau!|Pilih kalimatnya.",["She are a teacher.","She is a teacher.","She am a teacher."],1,"👏","wiggle","She = satu orang, jadi pakai is."],["🧑‍🤝‍🧑","⚽","Kamu dan temanmu satu tim. Umumkan!|Pilih kalimatnya.",["We is a team.","We am a team.","We are a team."],2,"🏆","spin","We = banyak orang, jadi pakai are."]]}},{"n":"Kemarin, Sekarang, Besok","g":"⏰ Tenses Dasar","steps":[{"s":"Bayangkan <b>album foto</b> 📸. Foto lama = <b>kemarin</b> (sudah selesai). Foto langsung = <b>sekarang</b> (kebiasaan). Foto yang belum dicetak = <b>besok</b> (rencana).","ex":["I <b>play</b> football every day.","I <b>played</b> football yesterday.","I <b>will play</b> football tomorrow."]},{"s":"Kata penunjuk waktu itu seperti <b>label di foto</b>. Lihat labelnya, langsung tahu fotonya yang mana.","ex":[],"tbl":[["Label waktu","Tense","Bentuk"],["every day, always","Sekarang (kebiasaan)","play / plays"],["yesterday, last week","Kemarin","played, went, ate"],["tomorrow, next week","Besok","will + play"]],"tip":"Setelah <b>will</b>, kata kerja selalu polos: I will <b>go</b>, bukan I will went."}],"quiz":[{"t":"mc","q":"Tomorrow, I ___ my grandmother.","o":["will visit","visited","visits"],"a":0,"why":"Tomorrow = besok, pakai <b>will + V1</b>."},{"t":"mc","q":"Yesterday she ___ rice.","o":["eat","ate","will eat"],"a":1,"why":"Yesterday = kemarin. Eat itu murid bandel: <b>ate</b>."},{"t":"type","q":"Ketik: I ___ (will/did) study tomorrow.","a":["will"],"why":"Besok = <b>will</b>."},{"t":"order","q":"Susun: \"Aku akan makan nasi besok.\"","w":["I","will","eat","rice","tomorrow"],"a":"I will eat rice tomorrow","why":"Pelaku + will + V1 + keterangan waktu."},{"t":"listen","say":"Yesterday I played football.","q":"Kapan kejadiannya?","o":["Kemarin","Besok","Kebiasaan sehari-hari"],"a":0,"why":"Ada <b>yesterday</b> dan <b>played</b>: kemarin.","wr":["","Besok pakai will, tidak ada will di kalimat ini.","Kebiasaan biasanya pakai every day."]}],"map":{"c":"TENSES DASAR","b":[{"t":"📸 Kemarin","k":["yesterday","played","went"]},{"t":"📸 Sekarang","k":["every day","play / plays"]},{"t":"📸 Besok","k":["tomorrow","will + V1"]}]},"game":{"e":"⏳","t":"Mesin Waktu Dapur","sc":[["🧑‍🍳","🍳","Budi selalu masak nasi goreng tiap hari.|Ceritakan kebiasaannya.",["He cooks fried rice every day.","He cooked fried rice every day.","He will cook fried rice every day."],0,"🍳","wiggle","every day = kebiasaan, jadi Simple Present: cooks."],["🧑‍🍳","🍝","Kemarin Budi masak spageti.|Ceritakan kejadiannya.",["He will cook spaghetti yesterday.","He cooked spaghetti yesterday.","He cooks spaghetti yesterday."],1,"🍝","slide","yesterday = lampau, jadi cooked."],["🧑‍🍳","🍰","Besok Budi akan membuat kue.|Ceritakan rencananya.",["He will make a cake tomorrow.","He made a cake tomorrow.","He makes a cake yesterday."],0,"🍰","grow","tomorrow = masa depan: will + V1."]]}},{"n":"Pertanyaan WH","steps":[{"s":"<b>WH-questions</b> itu ibarat <b>peralatan detektif</b> 🔍. Tiap kata tanya mencari satu jenis petunjuk.","ex":[],"tbl":[["Kata tanya","Mencari","Contoh"],["Who","orang","Who is she?"],["What","benda / hal","What is this?"],["Where","tempat","Where are you?"],["When","waktu","When is the party?"],["Why","alasan","Why are you sad?"],["How","cara / keadaan","How are you?"]]},{"s":"Rumus: <b>kata tanya + is/are + subjek</b>. Untuk kata kerja biasa: <b>kata tanya + do/does + subjek + V1</b>. Ingat satpam!","ex":["Where <b>is</b> she?","Where <b>does</b> she live?","What <b>do</b> you want?"],"tip":"Where she lives? ❌ → Where <b>does</b> she live? ✅"}],"quiz":[{"t":"mc","q":"___ is your teacher? (orang)","o":["Who","Where","When"],"a":0,"why":"Mencari orang: <b>Who</b>."},{"t":"mc","q":"___ do you live? (tempat)","o":["Where","Why","Who"],"a":0,"why":"Mencari tempat: <b>Where</b>."},{"t":"type","q":"Ketik kata tanya alasan: ___ are you late?","a":["why"],"why":"Alasan: <b>Why</b>."},{"t":"mc","q":"Pilih yang benar:","o":["Where does she live?","Where she lives?","Where does she lives?"],"a":0,"why":"Satpam does + V1 polos."},{"t":"order","q":"Susun: \"Apa yang kamu mau?\"","w":["What","do","you","want"],"a":"What do you want","why":"WH + do + S + V1."}],"map":{"c":"WH-QUESTIONS","b":[{"t":"🔍 Petunjuk","k":["who = orang","what = hal","where = tempat","when = waktu","why = alasan","how = cara"]},{"t":"Rumus","k":["WH + is/are + S","WH + do/does + S + V1"]}]},"g":"🧱 Dasar Kalimat"},{"n":"Kosakata Dasar","g":"📦 Kosakata & Tata Bahasa Dasar","steps":[{"s":"Kosakata itu ibarat <b>kotak mainan berlabel</b> 🧸. Makin banyak label yang kamu hafal, makin cepat kamu menemukan mainan yang dicari.","ex":[],"tbl":[["Kotak","Isi"],["Keluarga","father, mother, brother, sister, uncle, aunt"],["Warna","red, blue, green, yellow, black, white"],["Angka","one, two, three … ten"],["Hewan","cat, dog, bird, fish, cow"],["Sekolah","book, pen, desk, bag, teacher"]]},{"s":"Jangan hafal sendirian. Pasangkan kata dengan <b>kalimat</b> dan <b>bunyinya</b>. Ketuk contoh ini biar Pak Yood yang bacakan!","ex":["My <b>mother</b> has a <b>red</b> bag.","I have <b>three</b> books.","The <b>cat</b> is under the <b>desk</b>."]}],"quiz":[{"t":"mc","q":"Saudara laki-laki ibumu disebut…","o":["uncle","brother","father"],"a":0,"why":"Saudara laki-laki orang tua: <b>uncle</b>."},{"t":"mc","q":"Angka \"seven\" adalah…","o":["6","7","8"],"a":1,"why":"Seven = <b>7</b>."},{"t":"type","q":"Ketik bahasa Inggrisnya: kucing","a":["cat"],"why":"Kucing = <b>cat</b>."},{"t":"order","q":"Susun: \"Ayahku seorang guru.\"","w":["My","father","is","a","teacher"],"a":"My father is a teacher","why":"My father = He, jadi lemnya <b>is</b>."},{"t":"listen","say":"I have three books.","q":"Dengarkan, lalu ketik kalimat yang kamu dengar:","a":["i have three books"],"why":"Kalimatnya: <b>I have three books.</b>"}],"map":{"c":"KOSAKATA DASAR","b":[{"t":"👪 Keluarga","k":["father","mother","uncle"]},{"t":"🎨 Warna","k":["red","blue","green"]},{"t":"🔢 Angka","k":["one","two","three"]},{"t":"🐾 Hewan","k":["cat","dog","bird"]}]},"fc":1},{"n":"A / An","steps":[{"s":"<b>a</b> dan <b>an</b> itu ibarat <b>sandal</b> untuk kata benda 👡. Kalau salah pasang, bicaramu jadi \"tersandung\".","ex":["a book","an apple"]},{"s":"Pakai <b>an</b> kalau kata setelahnya <b>berbunyi vokal</b> (a, i, u, e, o), biar jalannya landai dan mulus. Selain itu pakai <b>a</b>.","ex":["an egg","an orange","a cat","a dog"]},{"s":"Jebakan! Yang dihitung itu <b>bunyi</b>, bukan huruf. <b>hour</b> bunyinya \"aur\" (vokal), <b>university</b> bunyinya \"yu\" (konsonan).","ex":["an <b>h</b>our","a <b>u</b>niversity"]}],"quiz":[{"t":"mc","q":"___ umbrella","o":["a","an"],"a":1,"why":"Umbrella diawali bunyi vokal, jadi sandalnya <b>an</b>."},{"t":"type","q":"Ketik a atau an: ___ elephant","a":["an"],"why":"Elephant diawali vokal \"e\", jadi <b>an</b>."},{"t":"order","q":"Susun kalimat: \"Aku punya seekor kucing.\"","w":["I","have","a","cat"],"a":"I have a cat","why":"Urutannya: pelaku + kata kerja + benda."},{"t":"mc","q":"___ university","o":["a","an"],"a":0,"why":"Bunyinya \"yu\", konsonan, jadi <b>a</b>."},{"t":"type","q":"Ketik a/an: ___ hour","a":["an"],"why":"Bunyinya \"aur\", vokal, jadi <b>an</b>."}],"map":{"c":"A / AN (sandal)","b":[{"t":"an","k":["bunyi vokal","an apple","an hour"]},{"t":"a","k":["bunyi konsonan","a book","a university"]},{"t":"Jebakan","k":["lihat bunyi, bukan huruf"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar"},{"n":"Kata Ganti & Kepemilikan","steps":[{"s":"Kata ganti itu ibarat <b>kostum aktor</b> 🎭. Orangnya sama, kostumnya ganti sesuai peran: jadi <b>pelaku</b> (I), <b>penerima</b> (me), atau <b>pemilik</b> (my).","ex":["<b>I</b> love her. (pelaku)","She loves <b>me</b>. (penerima)","This is <b>my</b> bag. (pemilik)"]},{"s":"Ini tabel kostum lengkapnya. Kolom <b>+ benda</b> itu label nama di barang (my bag). Kolom <b>sendirian</b> dipakai kalau bendanya sudah jelas (it is mine).","ex":["This is <b>my</b> bag.","This bag is <b>mine</b>."],"tbl":[["Pelaku","Penerima","+ benda","Sendirian"],["I","me","my","mine"],["you","you","your","yours"],["he","him","his","his"],["she","her","her","hers"],["we","us","our","ours"],["they","them","their","theirs"]]},{"s":"Jebakan klasik: <b>its</b> vs <b>it's</b>. Apostrof itu tanda \"ada yang hilang\": it's = it is. Kalau tidak ada yang hilang, itu kepemilikan.","ex":["<b>It's</b> cold. (= It is)","The cat licks <b>its</b> paw."],"tip":"Tes cepat: kalau bisa diganti \"it is\", pakai <b>it's</b>."}],"quiz":[{"t":"mc","q":"This is ___ book. (milikku)","o":["my","mine","me"],"a":0,"why":"Diikuti benda, pakai label <b>my</b>."},{"t":"mc","q":"Please give ___ the key. (kepada dia perempuan)","o":["she","her","hers"],"a":1,"why":"Penerima perempuan: <b>her</b>."},{"t":"type","q":"Ketik: This pen is ___. (punyaku)","a":["mine"],"why":"Tanpa benda di belakangnya: <b>mine</b>."},{"t":"type","q":"Ketik: They love ___ dog. (anjing milik mereka)","a":["their"],"why":"Diikuti benda: <b>their</b>."},{"t":"mc","q":"The cat licks ___ paw.","o":["its","it's","its'"],"a":0,"why":"Tidak bisa diganti \"it is\", jadi <b>its</b>."},{"t":"order","q":"Susun: \"Tas ini miliknya (perempuan).\"","w":["This","bag","is","hers"],"a":"This bag is hers","why":"Tanpa benda setelahnya: hers."}],"map":{"c":"KATA GANTI","b":[{"t":"Pelaku","k":["I","he","she","we","they"]},{"t":"Penerima","k":["me","him","her","us","them"]},{"t":"+ benda (label)","k":["my bag","her book"]},{"t":"Sendirian","k":["mine","hers","theirs"]},{"t":"Jebakan","k":["it's = it is","its = milik"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar"},{"n":"This / That / These / Those","steps":[{"s":"Kata tunjuk itu ibarat <b>jari telunjuk</b> 👉. Ada dua pertanyaan: <b>dekat atau jauh</b>, dan <b>satu atau banyak</b>.","ex":[],"tbl":[["","Satu","Banyak"],["Dekat","this","these"],["Jauh","that","those"]]},{"s":"Ingat: <b>this/that</b> menempel pada lem <b>is</b>, <b>these/those</b> pada lem <b>are</b>.","ex":["<b>This is</b> my bag.","<b>Those are</b> my shoes."],"tip":"Banyak benda selalu pakai are: These <b>are</b>, bukan These is."}],"quiz":[{"t":"mc","q":"___ is my pen. (dekat, satu)","o":["This","These","Those"],"a":0,"why":"Dekat + satu: <b>This</b>."},{"t":"mc","q":"___ are my shoes over there.","o":["That","Those","This"],"a":1,"why":"Jauh + banyak: <b>Those</b>."},{"t":"type","q":"Ketik: ___ books here are new. (dekat, banyak)","a":["these"],"why":"Dekat + banyak: <b>These</b>."},{"t":"mc","q":"Pilih yang benar:","o":["These is my friend.","This is my friend.","Those is my friend."],"a":1,"why":"Satu orang: this + is."},{"t":"order","q":"Susun: \"Itu adalah rumahku.\"","w":["That","is","my","house"],"a":"That is my house","why":"Jauh + satu: That is."}],"map":{"c":"THIS / THAT","b":[{"t":"Dekat","k":["this (satu)","these (banyak)"]},{"t":"Jauh","k":["that (satu)","those (banyak)"]},{"t":"Lem","k":["this/that + is","these/those + are"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar","game":{"e":"🧸","t":"Toko Mainan","sc":[["🧒","🚗","Mobil mainan ada di tanganmu (dekat, satu).|Tunjuk dan katakan.",["This is my car.","That is my car.","Those are my car."],0,"🚗","hop","Dekat + satu = this."],["🧒","🏠","Rumah itu jauh di seberang jalan.|Tunjuk dan katakan.",["This is my house.","That is my house.","These are my house."],1,"🏠","slide","Jauh + satu = that."],["🧒","👟","Sepatu-sepatu di rak sana jauh dan banyak.|Tunjuk dan katakan.",["Those are my shoes.","This are my shoes.","That is my shoes."],0,"👟","grow","Jauh + banyak = those + are."]]}},{"n":"Preposisi: in / on / at","steps":[{"s":"Preposisi itu ibarat <b>posisi boneka terhadap sebuah kotak</b> 🧸📦. Bayangkan boneka dan kotaknya, maka artinya langsung ketemu.","ex":["The doll is <b>in</b> the box. (di dalam)","The doll is <b>on</b> the box. (di atas, menempel)","The doll is <b>under</b> the box.","The doll is <b>next to</b> the box."]},{"s":"<b>in / on / at</b> juga dipakai untuk waktu dan tempat. Anggap <b>in</b> = ruang besar, <b>on</b> = permukaan, <b>at</b> = satu titik kecil.","ex":[],"tbl":[["Kata","Bayangan","Contoh"],["in","di dalam ruang/wadah","in the room, in Jakarta, in May"],["on","menempel di permukaan","on the table, on Monday"],["at","titik tertentu","at school, at 7 o'clock"]],"tip":"Waktu: <b>in</b> the morning, <b>on</b> Monday, <b>at</b> 5 o'clock."}],"quiz":[{"t":"mc","q":"The cat is ___ the box. (di dalam)","o":["in","on","at"],"a":0,"why":"Di dalam wadah: <b>in</b>."},{"t":"mc","q":"The book is ___ the table.","o":["in","on","at"],"a":1,"why":"Menempel di permukaan: <b>on</b>."},{"t":"mc","q":"I wake up ___ 6 o'clock.","o":["in","on","at"],"a":2,"why":"Jam = titik waktu: <b>at</b>."},{"t":"type","q":"Ketik: My birthday is ___ Monday.","a":["on"],"why":"Hari pakai <b>on</b>."},{"t":"order","q":"Susun: \"Bola itu ada di bawah kursi.\"","w":["The","ball","is","under","the","chair"],"a":"The ball is under the chair","why":"Under = di bawah."}],"map":{"c":"IN / ON / AT","b":[{"t":"in","k":["wadah","kota","bulan & tahun"]},{"t":"on","k":["permukaan","hari","tanggal"]},{"t":"at","k":["titik","jam","alamat"]},{"t":"Lainnya","k":["under","next to","between"]}]},"g":"📦 Kosakata & Tata Bahasa Dasar","game":{"e":"📦","t":"Boneka dan Kotak","sc":[["🧸","📦","Boneka beruang mau masuk ke DALAM kotak.|Beri perintah ke Pak Yood.",["Put the bear in the box.","Put the bear on the box.","Put the bear under the box."],0,"📦","hop","in = di dalam wadah."],["🧸","📦","Sekarang beruang harus duduk di ATAS kotak, menempel di permukaannya.|Beri perintah.",["Put the bear in the box.","Put the bear on the box.","Put the bear at the box."],1,"⬆️","hop","on = menempel di permukaan."],["🧸","⏰","Alarm berbunyi jam 7. Beruang bangun!|Pilih kalimat waktunya.",["The bear wakes up in 7 o'clock.","The bear wakes up at 7 o'clock.","The bear wakes up on 7 o'clock."],1,"⏰","wiggle","Jam = titik waktu, jadi at."]]}},{"n":"Jenis-jenis Teks","g":"📖 Jenis Teks","steps":[{"s":"Teks itu seperti <b>jenis tas</b> 🎒: ransel buat sekolah, koper buat liburan. Tiap teks punya tugas sendiri. Kenali tugasnya, kamu langsung tahu cara membacanya.","ex":[],"tbl":[["Teks","Ibarat","Tugasnya"],["Descriptive","Foto","Menggambarkan orang/benda"],["Recount","Buku harian","Menceritakan kejadian lalu"],["Procedure","Resep masakan","Memberi langkah-langkah"],["Narrative","Dongeng","Cerita dengan masalah & akhir"],["Announcement","Papan pengumuman","Memberi info acara"]]},{"s":"Biar makin jelas, lihat contoh pendeknya. Perhatikan <b>tense</b>-nya juga: deskripsi pakai sekarang, recount pakai lampau.","ex":["<b>Descriptive:</b> My cat is white. It has big eyes.","<b>Recount:</b> Yesterday I went to the zoo.","<b>Procedure:</b> First, boil the water. Then, add noodles.","<b>Narrative:</b> Once upon a time, there was a clever mouse."]}],"quiz":[{"t":"mc","q":"\"First, wash the rice. Then, cook it.\" termasuk teks apa?","o":["Descriptive","Procedure","Narrative"],"a":1,"why":"Ada urutan langkah (first, then): <b>Procedure</b>, seperti resep."},{"t":"mc","q":"\"Yesterday I went to the beach.\" termasuk teks apa?","o":["Recount","Announcement","Descriptive"],"a":0,"why":"Kejadian yang sudah lewat: <b>Recount</b>, seperti buku harian."},{"t":"mc","q":"\"Once upon a time...\" biasanya membuka teks…","o":["Procedure","Narrative","Announcement"],"a":1,"why":"Itu pembuka dongeng: <b>Narrative</b>."},{"t":"type","q":"Ketik jenis teks yang menggambarkan benda (awalan d):","a":["descriptive"],"why":"Menggambarkan seperti foto: <b>descriptive</b>."}],"map":{"c":"JENIS TEKS","b":[{"t":"📷 Descriptive","k":["gambarkan","is / has"]},{"t":"📔 Recount","k":["kejadian lalu","past tense"]},{"t":"🍳 Procedure","k":["langkah","first, then"]},{"t":"🧚 Narrative","k":["dongeng","once upon a time"]}]},"fc":1},{"n":"Membaca & Menulis Dasar","g":"✍️ Membaca & Menulis","steps":[{"s":"Menulis kalimat itu seperti <b>menyusun lego</b> 🧱: balok pertama <b>huruf kapital</b>, balok tengah <b>pelaku + kata kerja</b>, balok terakhir <b>titik</b>. Kurang satu, bangunannya miring.","ex":["<b>M</b>y name is Dina<b>.</b>","She likes apples<b>.</b>"],"tip":"Kata <b>I</b> dan nama orang selalu huruf kapital."},{"s":"Membaca? Pakai <b>senter</b> 🔦. Baca teks sekali untuk gambaran, lalu sorot kata kunci saat menjawab. Coba teks mini ini:","ex":["Dina has a <b>red</b> bag. It is new. She puts her books in it."]}],"quiz":[{"t":"mc","q":"Teks tadi: apa warna tas Dina?","o":["Red","Blue","Black"],"a":0,"why":"Ada di kalimat pertama: <b>red</b>."},{"t":"mc","q":"Kalimat mana yang ditulis benar?","o":["my name is budi.","My name is Budi.","My name is budi"],"a":1,"why":"Kapital di awal dan nama, titik di akhir."},{"t":"type","q":"Ketik: Dina puts her ___ in the bag.","a":["books"],"why":"Jawabannya ada di teks: <b>books</b>."},{"t":"order","q":"Susun: \"Namaku Dina.\"","w":["My","name","is","Dina"],"a":"My name is Dina","why":"Pemilik + benda + lem is + nama."}],"map":{"c":"MEMBACA & MENULIS","b":[{"t":"🧱 Menulis","k":["Kapital","Subjek + Verb","Titik"]},{"t":"🔦 Membaca","k":["baca sekali","sorot kata kunci"]}]}}]},{"id":"smp","name":"Level SMP","tag":"Pra-menengah","emoji":"🌿","mods":[{"n":"Peta 16 Tenses","g":"⏰ Tenses","fc":0,"steps":[{"s":"16 tenses itu ibarat <b>gedung 4 lantai dengan 4 kamar tiap lantai</b> 🏢. Lantainya adalah <b>waktu</b> (Present, Past, Future, Past Future). Kamarnya adalah <b>gaya</b> (Simple, Continuous, Perfect, Perfect Continuous). 4 × 4 = 16!","ex":[]},{"s":"Tiap gaya punya <b>ciri tetap</b> di semua lantai. Hafalkan gayanya, dan 16 rumus itu tinggal ganti kata bantu.","ex":["<b>Simple</b> 📸 = foto: kejadian apa adanya","<b>Continuous</b> 🎥 = video: sedang berlangsung (be + V-ing)","<b>Perfect</b> 📒 = rapor: hasil / sudah selesai (have + V3)","<b>Perfect Continuous</b> ⏱️ = durasi (have been + V-ing)"]},{"s":"Ini <b>denah gedungnya</b>. Baca per baris (waktu) lalu per kolom (gaya).","ex":[],"tbl":[["","Simple","Continuous","Perfect","Perfect Cont."],["Present","V1 / V-s","am/is/are + V-ing","has/have + V3","has/have been + V-ing"],["Past","V2","was/were + V-ing","had + V3","had been + V-ing"],["Future","will + V1","will be + V-ing","will have + V3","will have been + V-ing"],["Past Future","would + V1","would be + V-ing","would have + V3","would have been + V-ing"]],"tip":"Pola cepat: <b>Continuous = be + V-ing</b>, <b>Perfect = have + V3</b>, <b>Perfect Continuous = have been + V-ing</b>. Waktunya hanya mengubah kata bantu pertamanya."}],"quiz":[{"t":"mc","q":"Rumus \"will have + V3\" adalah…","o":["Future Perfect","Future Continuous","Simple Future"],"a":0,"why":"Future (will) + Perfect (have + V3)."},{"t":"mc","q":"\"had been + V-ing\" adalah…","o":["Past Perfect Continuous","Past Perfect","Past Continuous"],"a":0,"why":"Past (had) + Perfect Continuous (been + V-ing)."},{"t":"mc","q":"Gaya \"Continuous\" ibarat…","o":["Video (sedang berlangsung)","Foto","Rapor"],"a":0,"why":"Continuous = <b>video</b>."},{"t":"mc","q":"Tense \"would + V1\" berada di lantai…","o":["Past Future","Present","Future"],"a":0,"why":"would = bentuk lampau dari will: <b>Past Future</b>."},{"t":"type","q":"Ketik gaya yang menekankan hasil (awalan p):","a":["perfect"],"why":"Rapor = <b>Perfect</b>."},{"t":"mc","q":"\"I will be sleeping at 10\" adalah…","o":["Future Continuous","Future Perfect","Simple Future"],"a":0,"why":"will be + V-ing = <b>Future Continuous</b>."},{"t":"mc","q":"\"has been + V-ing\" adalah…","o":["Present Perfect Continuous","Present Perfect","Present Continuous"],"a":0,"why":"Present (has) + Perfect Continuous."},{"t":"order","q":"Susun rumus Future Perfect Continuous:","w":["will","have","been","V-ing"],"a":"will have been V-ing","why":"Urutan: will, have, been, V-ing."}],"map":{"c":"PETA 16 TENSES","b":[{"t":"🏢 4 Lantai","k":["Present","Past","Future","Past Future"]},{"t":"🚪 4 Kamar","k":["Simple","Continuous","Perfect","Perfect Cont."]},{"t":"🔑 Pola","k":["be + V-ing","have + V3","have been + V-ing"]}]}},{"n":"Simple Present Tense","steps":[{"s":"<b>Simple Present</b> itu ibarat <b>jadwal di buku harianmu</b>: kebiasaan atau hal yang terjadi berulang, bukan yang sedang terjadi detik ini.","ex":["I <b>wake up</b> at six.","They <b>play</b> football on Sunday."]},{"s":"Ada aturan unik: kalau pelakunya <b>He / She / It</b> (satu orang), kata kerja wajib pakai \"topi\" kecil, yaitu <b>-s / -es</b>. Ibarat satpam yang minta tamu tunggal pakai tanda pengenal.","ex":["She <b>eats</b> rice.","He <b>goes</b> to school.","They eat rice. (banyak orang, tanpa topi)"]},{"s":"Tips: kalau ada kata <b>every day, usually, always</b>, itu kode rahasia bahwa kalimatnya Simple Present.","ex":["My dad <b>drinks</b> coffee every morning."]},{"s":"<b>Termometer kebiasaan</b> 🌡️: always (100%), usually, often, sometimes, never (0%). Letaknya sebelum kata kerja utama, tapi setelah to be.","ex":["She <b>always</b> drinks tea.","He is <b>never</b> late."]},{"s":"Ini <b>peta tiga wajah</b> Simple Present: positif, negatif, tanya. Perhatikan: topi -s hanya muncul di kalimat positif. Di negatif dan tanya, topinya pindah ke satpam.","ex":[],"tbl":[["","Positif","Negatif","Tanya"],["I/You/We/They","They play","They don't play","Do they play?"],["He/She/It","She plays","She doesn't play","Does she play?"]],"tip":"Kesalahan umum: She don't like ❌ → She <b>doesn't</b> like ✅"}],"quiz":[{"q":"She ___ to school every day.","o":["go","goes","going"],"a":1,"why":"She itu satu orang, kata kerjanya wajib pakai topi: go + es = <b>goes</b>."},{"q":"They ___ football on Sunday.","o":["plays","play","playing"],"a":1,"why":"They itu banyak orang, jadi kata kerja tidak butuh topi: <b>play</b>."},{"q":"Tom ___ breakfast at 6 o'clock.","o":["eat","eating","eats"],"a":2,"why":"Tom = He (satu orang), topinya dipakai: <b>eats</b>."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["She always drinks tea.","She drinks always tea.","Always she drinks tea."],"a":0,"why":"Always berdiri sebelum kata kerja utama."},{"t":"order","q":"Susun: \"Dia tidak pernah makan daging.\"","w":["He","never","eats","meat"],"a":"He never eats meat","why":"Never sebelum kata kerja, dan He butuh topi: eats."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["She don't like fish.","She doesn't like fish.","She doesn't likes fish."],"a":1,"why":"Satpam doesn't sudah memakai topi, kata kerja polos."},{"t":"type","q":"Ketik: Does he ___ (play) chess?","a":["play"],"why":"Setelah does, kata kerja polos."}],"map":{"c":"SIMPLE PRESENT","b":[{"t":"Kapan?","k":["kebiasaan","fakta umum","every day"]},{"t":"Rumus","k":["S + V1","He/She/It + V-s/es"]},{"t":"Termometer","k":["always","usually","sometimes","never"]},{"t":"Tanya & negatif","k":["modul Do / Does"]},{"t":"Tiga wajah","k":["She plays","She doesn't play","Does she play?"]}]},"g":"⏰ Tenses","game":{"e":"⏰","t":"Rutinitas Pagi","sc":[["😴","🛏️","Dina selalu bangun jam enam tiap pagi.|Ceritakan kebiasaannya.",["She wake up at six.","She wakes up at six.","She waking up at six."],1,"⏰","hop","She butuh topi -s: wakes."],["🧑‍💼","☕","Ayah minum kopi tiap pagi.|Ceritakan kebiasaannya.",["My father drink coffee every morning.","My father drinks coffee every morning.","My father drinking coffee every morning."],1,"☕","wiggle","My father = He, jadi drinks."],["👧","🚌","Dina dan temannya naik bus ke sekolah.|Ceritakan kebiasaannya.",["They takes the bus.","They take the bus.","They taking the bus."],1,"🚌","slide","They = banyak, kata kerja tanpa topi: take."]]}},{"n":"Present Continuous","steps":[{"s":"Kalau Simple Present itu <b>buku harian</b>, <b>Present Continuous</b> itu <b>siaran langsung</b> 🎥: kejadian yang <b>sedang berlangsung sekarang</b>. Rumus: <b>am/is/are + V-ing</b>.","ex":["She <b>is cooking</b> now.","They <b>are playing</b> football."]},{"s":"Bandingkan dua \"kamera\" ini biar tidak tertukar.","ex":[],"tbl":[["","Simple Present","Present Continuous"],["Analogi","Buku harian","Siaran langsung"],["Rumus","V1 / V-s","be + V-ing"],["Penanda","every day, usually","now, Look!"],["Contoh","I drink tea daily.","I am drinking tea now."]]},{"s":"Menambah <b>-ing</b> ada aturannya. Anggap kata kerja itu balon: <b>e</b> di ujung dibuang, dan huruf akhir yang \"tegang\" digandakan.","ex":["write → <b>writing</b> (buang e)","run → <b>running</b> (gandakan n)","swim → <b>swimming</b>","lie → <b>lying</b>"]},{"s":"Ada kata kerja yang <b>tidak bisa disiarkan langsung</b>: kata kerja perasaan dan pikiran (<b>like, love, know, want, need</b>). Ibarat patung: tidak \"sedang melakukan\", cuma \"ada\".","ex":["I <b>know</b> the answer. ✅","I am knowing the answer. ❌"],"tip":"Ragu? Untuk kata kerja perasaan atau pikiran, pakai Simple Present."}],"quiz":[{"t":"mc","q":"Look! The baby ___.","o":["is sleeping","sleeps","sleep"],"a":0,"why":"\"Look!\" = sedang terjadi: <b>is sleeping</b>."},{"t":"mc","q":"I ___ coffee every morning.","o":["drink","am drinking","drinking"],"a":0,"why":"Every morning = kebiasaan: Simple Present."},{"t":"type","q":"Ketik: She is ___ (run) now.","a":["running"],"why":"Gandakan n: <b>running</b>."},{"t":"type","q":"Ketik: He is ___ (write) a letter.","a":["writing"],"why":"Buang e: <b>writing</b>."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["I am knowing her.","I know her.","I knowing her."],"a":1,"why":"Know itu \"patung\", tidak pakai -ing."},{"t":"order","q":"Susun: \"Mereka sedang bermain bola sekarang.\"","w":["They","are","playing","football","now"],"a":"They are playing football now","why":"be + V-ing."}],"map":{"c":"PRESENT CONTINUOUS","b":[{"t":"🎥 Rumus","k":["am/is/are + V-ing"]},{"t":"Penanda","k":["now","at the moment","Look!"]},{"t":"Ejaan -ing","k":["write → writing","run → running","lie → lying"]},{"t":"🗿 Tanpa -ing","k":["like","know","want","need"]}]},"g":"⏰ Tenses","game":{"e":"🎥","t":"Siaran Langsung","sc":[["👩‍🍳","🍲","LIHAT! Ibu sedang memasak sekarang.|Laporkan langsung.",["She is cooking now.","She cooks now.","She cooked now."],0,"🍲","wiggle","Sedang berlangsung = is + V-ing."],["🧑‍🎤","🎸","Kakak sedang bermain gitar.|Laporkan langsung.",["He plays guitar every day.","He is playing the guitar.","He is play the guitar."],1,"🎸","hop","Sedang = is + V-ing, jadi playing."],["🏃","🌳","Anak itu sedang berlari di taman.|Laporkan langsung.",["He is running now.","He is runing now.","He running now."],0,"🏃","slide","run: gandakan n jadi running."]]}},{"n":"Past Tense","steps":[{"s":"<b>Past Tense</b> itu ibarat <b>foto lama</b> 📷: kejadiannya sudah selesai. Kata kunci: <b>yesterday, last week, ago</b>.","ex":["I <b>watched</b> a movie yesterday."]},{"s":"Kata kerja biasa cukup ditambah <b>-ed</b>. Tapi ada \"murid bandel\" (irregular) yang punya bentuk sendiri dan harus dihafal.","ex":["play → <b>played</b>","go → <b>went</b>","eat → <b>ate</b>"]},{"s":"Di masa lampau, satpam hanya punya <b>satu seragam: did</b> 🛡️. Setelah did, kata kerja kembali polos (V1), karena \"waktu lampaunya\" sudah ditangani satpam.","ex":["I <b>didn't go</b> to school.","<b>Did</b> you eat?"]}],"quiz":[{"t":"mc","q":"Yesterday, I ___ to the market.","o":["go","went","goed"],"a":1,"why":"Go itu murid bandel: bentuk lampaunya <b>went</b>."},{"t":"type","q":"Ketik bentuk lampau: She ___ (play) tennis last week.","a":["played"],"why":"Kata kerja biasa + -ed = <b>played</b>."},{"t":"order","q":"Susun: \"Dia makan nasi tadi malam.\"","w":["She","ate","rice","last","night"],"a":"She ate rice last night","why":"Eat itu bandel, lampaunya <b>ate</b>."},{"t":"mc","q":"She didn't ___ yesterday.","o":["went","go","goes"],"a":1,"why":"Setelah didn't, kata kerja polos: <b>go</b>."},{"t":"type","q":"Ketik: Did he ___ (watch) the match?","a":["watch"],"why":"Setelah did, kata kerja polos: <b>watch</b>."}],"map":{"c":"PAST TENSE","b":[{"t":"Reguler","k":["+ed","play → played"]},{"t":"Irregular","k":["go → went","eat → ate","see → saw"]},{"t":"Satpam","k":["did + V1","didn't + V1"]},{"t":"Kata kunci","k":["yesterday","last week","ago"]}]},"g":"⏰ Tenses","game":{"e":"📷","t":"Foto Liburan","sc":[["🧑‍✈️","✈️","Kemarin Rudi pergi ke Bali.|Ceritakan fotonya.",["He goed to Bali yesterday.","He went to Bali yesterday.","He go to Bali yesterday."],1,"✈️","slide","go itu bandel: went."],["👧","🏖️","Dia bermain di pantai kemarin.|Ceritakan fotonya.",["She played on the beach yesterday.","She plays on the beach yesterday.","She playing on the beach yesterday."],0,"🏖️","hop","play + ed = played."],["🧑","🍜","Tadi malam dia makan bakso.|Ceritakan fotonya.",["He eated meatballs last night.","He ate meatballs last night.","He eats meatballs last night."],1,"🍜","grow","eat itu bandel: ate."]]}},{"n":"Past Continuous","steps":[{"s":"<b>Past Continuous</b> itu ibarat <b>video yang di-pause di tengah adegan</b> ⏸️: aksi yang <b>sedang berlangsung di masa lalu</b>. Rumus: <b>was/were + V-ing</b>.","ex":["At 8 last night, I <b>was studying</b>.","They <b>were playing</b> when it rained."]},{"s":"Sering dipasangkan dengan Past Simple: aksi panjang ibarat <b>sungai mengalir</b> 🌊 dipotong aksi pendek ibarat <b>batu jatuh</b> 🪨.","ex":["I <b>was cooking</b> when the phone <b>rang</b>.","While she <b>was reading</b>, he <b>slept</b>."],"tip":"<b>While</b> + proses panjang (V-ing), <b>when</b> + kejadian pendek (V2)."}],"quiz":[{"t":"mc","q":"At 7 pm yesterday, I ___ dinner.","o":["was eating","ate","am eating"],"a":0,"why":"Sedang berlangsung di waktu lampau tertentu."},{"t":"mc","q":"I was sleeping when the phone ___.","o":["rang","was ringing","rings"],"a":0,"why":"Batu jatuh = Past Simple."},{"t":"type","q":"Ketik: They ___ (play) football at 4 pm yesterday.","a":["were playing"],"why":"They + were + V-ing."},{"t":"order","q":"Susun: \"Dia sedang membaca ketika aku masuk.\"","w":["She","was","reading","when","I","came","in"],"a":"She was reading when I came in","why":"Sungai (was reading) + batu (came)."}],"map":{"c":"PAST CONTINUOUS","b":[{"t":"⏸️ Rumus","k":["was/were + V-ing"]},{"t":"🌊🪨 Gabungan","k":["sungai = was V-ing","batu = V2"]},{"t":"Penghubung","k":["while","when"]}]},"g":"⏰ Tenses"},{"n":"Future: will & going to","steps":[{"s":"Dua cara bicara masa depan. <b>will</b> = keputusan spontan atau prediksi, <b>ide mendadak</b> 💡. <b>going to</b> = rencana yang sudah disiapkan atau ada bukti, <b>tiket yang sudah dibeli</b> 🎟️.","ex":["The phone is ringing. I <b>will</b> answer it.","I <b>am going to</b> visit Bali next week."]},{"s":"Ringkasan perbedaannya.","ex":[],"tbl":[["","will","going to"],["Analogi","ide mendadak 💡","tiket sudah dibeli 🎟️"],["Rumus","will + V1","am/is/are + going to + V1"],["Untuk","janji, tawaran, prediksi","rencana, bukti terlihat"],["Contoh","I will help you.","Look at those clouds! It is going to rain."]]}],"quiz":[{"t":"mc","q":"Tiba-tiba haus: \"I ___ get some water.\"","o":["will","am going to"],"a":0,"why":"Keputusan mendadak: <b>will</b>."},{"t":"mc","q":"Sudah beli tiket: \"I ___ visit Japan.\"","o":["will","am going to"],"a":1,"why":"Rencana: <b>am going to</b>."},{"t":"mc","q":"Look at the dark clouds! It ___ rain.","o":["will","is going to"],"a":1,"why":"Ada bukti: <b>is going to</b>."},{"t":"type","q":"Ketik: She is going to ___ (study) tonight.","a":["study"],"why":"Going to + V1."},{"t":"order","q":"Susun: \"Aku akan membantumu.\"","w":["I","will","help","you"],"a":"I will help you","why":"will + V1."}],"map":{"c":"FUTURE","b":[{"t":"💡 will","k":["spontan","janji","prediksi"]},{"t":"🎟️ going to","k":["rencana","ada bukti"]},{"t":"Rumus","k":["will + V1","be + going to + V1"]}]},"g":"⏰ Tenses"},{"n":"Present Perfect","steps":[{"s":"<b>Present Perfect</b> itu ibarat <b>jembatan</b> 🌉 yang menyambung masa lalu ke sekarang. Kejadiannya sudah lewat, tapi <b>akibat atau pengalamannya masih terasa</b>. Rumus: <b>have/has + V3</b>.","ex":["I <b>have lost</b> my keys. (sekarang masih hilang)","She <b>has visited</b> Bali. (pengalaman)"]},{"s":"Beda inti dengan Past Simple: waktunya <b>disebut jelas</b> atau <b>masih nyambung ke sekarang</b>?","ex":[],"tbl":[["","Past Simple","Present Perfect"],["Analogi","Foto lama","Jembatan ke sekarang"],["Waktu","jelas (yesterday, in 2020)","tak disebut / sampai sekarang"],["Penanda","ago, last year","already, yet, ever, never"],["Contoh","I ate at 7.","I have eaten already."]],"tip":"Waktu spesifik + Present Perfect ❌. I have seen him yesterday ❌."},{"s":"<b>For</b> = lamanya (durasi), <b>since</b> = titik awal. Ibarat lama perjalanan vs jam keberangkatan 🚆.","ex":["I have lived here <b>for</b> 5 years.","I have lived here <b>since</b> 2021."]}],"quiz":[{"t":"mc","q":"I ___ already eaten.","o":["have","has","had"],"a":0,"why":"I + <b>have</b> + V3."},{"t":"mc","q":"She ___ never been to Japan.","o":["have","has","did"],"a":1,"why":"She + <b>has</b>."},{"t":"type","q":"Ketik V3: He has ___ (see) that movie.","a":["seen"],"why":"see, saw, <b>seen</b>."},{"t":"mc","q":"Pilih yang benar:","o":["I have seen him yesterday.","I saw him yesterday.","I have saw him yesterday."],"a":1,"why":"Ada yesterday, jadi Past Simple."},{"t":"type","q":"Ketik for/since: I have studied English ___ 2020.","a":["since"],"why":"2020 = titik awal: <b>since</b>."}],"map":{"c":"PRESENT PERFECT","b":[{"t":"🌉 Rumus","k":["have/has + V3"]},{"t":"Penanda","k":["already","yet","ever","never"]},{"t":"For / Since","k":["for = durasi","since = titik awal"]},{"t":"⚠️","k":["tanpa yesterday/ago"]}]},"g":"⏰ Tenses"},{"n":"Parts of Speech","g":"🔗 Grammar Rules","steps":[{"s":"Kalimat itu seperti <b>tim sepak bola</b> ⚽. Tiap kata punya posisi: ada pemain (noun), aksi (verb), kostum (adjective), gaya main (adverb).","ex":[],"tbl":[["Kelas kata","Ibarat","Contoh"],["Noun","Pemain","teacher, book, Jakarta"],["Verb","Aksi","run, eat, is"],["Adjective","Kostum","big, happy, red"],["Adverb","Gaya main","quickly, always"],["Pronoun","Pemain pengganti","he, she, they"],["Preposition","Posisi lapangan","in, on, under"],["Conjunction","Tali penyambung","and, but, because"]]},{"s":"Jebakan: kelas kata ditentukan oleh <b>tugasnya di kalimat</b>, bukan katanya. <b>Run</b> bisa jadi verb atau noun, tergantung perannya.","ex":["I <b>run</b> every day. (verb)","I went for a <b>run</b>. (noun)"],"tip":"Adverb sering berakhiran <b>-ly</b> (quickly), tapi tidak selalu (fast, always)."}],"quiz":[{"t":"mc","q":"\"Beautiful\" dalam \"a beautiful flower\" adalah…","o":["noun","adjective","adverb"],"a":1,"why":"Menjelaskan benda: <b>adjective</b>."},{"t":"mc","q":"Kata \"quickly\" termasuk…","o":["adverb","verb","pronoun"],"a":0,"why":"Menjelaskan cara melakukan sesuatu: <b>adverb</b>."},{"t":"type","q":"Ketik kelas kata dari \"teacher\" (awalan n):","a":["noun"],"why":"Nama orang/benda: <b>noun</b>."},{"t":"mc","q":"Pada \"She sings beautifully\", kata \"beautifully\" adalah…","o":["adjective","adverb","noun"],"a":1,"why":"Menjelaskan kata kerja sings: <b>adverb</b>."}],"map":{"c":"PARTS OF SPEECH","b":[{"t":"⚽ Inti","k":["noun","verb"]},{"t":"👕 Penjelas","k":["adjective","adverb"]},{"t":"🔗 Penghubung","k":["preposition","conjunction"]},{"t":"🔁 Pengganti","k":["pronoun"]}]}},{"n":"Have / Has","steps":[{"s":"<b>Have</b> dan <b>has</b> artinya sama: <b>punya</b>. Bedanya hanya soal pemiliknya. Bayangkan <b>kunci rumah</b> 🔑: pemegang kunci tunggal pakai <b>has</b>, sisanya <b>have</b>.","ex":["I <b>have</b> a bike.","She <b>has</b> a bike."]},{"s":"Hanya <b>He / She / It</b> yang berhak pakai <b>has</b>. Nama orang dan benda tunggal juga masuk (Tom, my mother, the cat). Banyak orang tetap <b>have</b>.","ex":["I / You / We / They → <b>have</b>","He / She / It → <b>has</b>","My mother <b>has</b> two cats.","My parents <b>have</b> a car."]},{"s":"Hati-hati! Kalau <b>satpam do/does</b> sudah berdiri di depan, kata kerja di belakangnya <b>kembali polos</b>. Jadi <b>has</b> berubah jadi <b>have</b>.","ex":["She has a pen. → She <b>doesn't have</b> a pen.","Does she <b>have</b> a pen?"]},{"s":"Bonus: <b>have</b> juga berarti <b>melakukan/menikmati</b> sesuatu, bukan cuma punya.","ex":["She <b>has</b> breakfast at 6.","We <b>have</b> a meeting."]}],"quiz":[{"t":"mc","q":"My sister ___ long hair.","o":["have","has","haves"],"a":1,"why":"My sister = She, pemegang kunci tunggal: <b>has</b>."},{"t":"mc","q":"They ___ a new house.","o":["have","has"],"a":0,"why":"They = banyak, pakai <b>have</b>."},{"t":"type","q":"Ketik have/has: The cat ___ a ball.","a":["has"],"why":"The cat = It, jadi <b>has</b>."},{"t":"type","q":"Ketik have/has: Does she ___ a pen?","a":["have"],"why":"Setelah does, kata kerja polos: <b>have</b>."},{"t":"order","q":"Susun: \"Dia punya mobil merah.\"","w":["He","has","a","red","car"],"a":"He has a red car","why":"He pakai <b>has</b>."}],"map":{"c":"HAVE / HAS","b":[{"t":"🔑 Has","k":["He","She","It","nama tunggal"]},{"t":"🔑 Have","k":["I","You","We","They","banyak orang"]},{"t":"🛡️ Setelah do/does","k":["doesn't have","Does she have?"]},{"t":"Bonus","k":["have breakfast","have a meeting"]}]},"g":"🔗 Grammar Rules"},{"n":"Do / Does","steps":[{"s":"<b>Do</b> dan <b>does</b> itu ibarat <b>satpam kalimat</b> 🛡️. Tugasnya menjaga pintu kalimat <b>tanya</b> dan <b>negatif</b>. Tanpa dia, kalimat tidak boleh masuk.","ex":["<b>Do</b> you like tea?","She <b>does</b> not like tea."]},{"s":"Satpam punya dua seragam: <b>does</b> untuk He/She/It, <b>do</b> untuk sisanya. Kalau satpam sudah berdiri, kata kerja utama tidak butuh topi -s lagi (topinya sudah dipakai satpam).","ex":["Does she <b>like</b> tea? ✅","Does she <b>likes</b> tea? ❌"]},{"s":"Rumus: Tanya = <b>Do/Does + subjek + V1</b>. Negatif = <b>subjek + don't/doesn't + V1</b>. Jawaban singkat juga pakai satpam.","ex":["Do they play? → Yes, they <b>do</b>.","Does he work? → No, he <b>doesn't</b>."]},{"s":"Kadang <b>do/does</b> jadi kata kerja utama, artinya <b>mengerjakan</b>.","ex":["He <b>does</b> his homework.","I <b>do</b> yoga every morning."]}],"quiz":[{"t":"mc","q":"___ she like coffee?","o":["Do","Does","Is"],"a":1,"why":"She butuh satpam <b>Does</b>."},{"t":"mc","q":"They ___ not play chess.","o":["do","does","are"],"a":0,"why":"They pakai <b>do</b>."},{"t":"type","q":"Ketik: He doesn't ___ (like/likes) fish.","a":["like"],"why":"Satpam sudah berdiri, kata kerja polos: <b>like</b>."},{"t":"type","q":"Ketik do/does: ___ your parents work here?","a":["do"],"why":"Your parents = They, jadi <b>Do</b>."},{"t":"order","q":"Susun: \"Apakah dia berbicara bahasa Inggris?\"","w":["Does","she","speak","English"],"a":"Does she speak English","why":"Does + subjek + V1."}],"map":{"c":"DO / DOES","b":[{"t":"🛡️ Does","k":["He","She","It"]},{"t":"🛡️ Do","k":["I","You","We","They"]},{"t":"📐 Rumus","k":["Do/Does + S + V1","S + don't/doesn't + V1"]},{"t":"⚠️ Jebakan","k":["does + V-s ❌","does + V1 ✅"]}]},"g":"🔗 Grammar Rules"},{"n":"Go / Goes (-s/-es)","steps":[{"s":"Topi -s untuk He/She/It ternyata punya <b>3 model</b> 🎩 tergantung kata kerjanya. Kenalan satu per satu ya!","ex":["Model biasa: work → <b>works</b>","eat → <b>eats</b>"]},{"s":"Kata kerja berakhiran <b>-o, -s, -sh, -ch, -x, -z</b> itu \"kepalanya besar\", butuh topi besar <b>-es</b>. Jembatan keledai: <b>go-es</b>!","ex":["go → <b>goes</b>","do → <b>does</b>","watch → <b>watches</b>","wash → <b>washes</b>","fix → <b>fixes</b>"]},{"s":"Berakhiran <b>konsonan + y</b>: y \"pindah kamar\" jadi <b>i</b> lalu +es. Tapi <b>vokal + y</b> (play), y-nya santai, cukup +s.","ex":["study → <b>studies</b>","cry → <b>cries</b>","play → <b>plays</b>"]},{"s":"Yang spesial: <b>have</b> berubah total jadi <b>has</b>, bukan \"haves\". Murid bandel yang wajib dihafal!","ex":["have → <b>has</b>"]}],"quiz":[{"t":"mc","q":"He ___ to the gym every Monday.","o":["go","goes","going"],"a":1,"why":"Berakhiran -o, topi besar: <b>goes</b>."},{"t":"mc","q":"She ___ English at night.","o":["study","studys","studies"],"a":2,"why":"Konsonan + y: y jadi i + es = <b>studies</b>."},{"t":"type","q":"Ketik: My brother ___ (watch) TV every night.","a":["watches"],"why":"Berakhiran -ch: <b>watches</b>."},{"t":"type","q":"Ketik: The baby ___ (cry) loudly.","a":["cries"],"why":"Konsonan + y: <b>cries</b>."},{"t":"mc","q":"Pilih bentuk yang benar:","o":["She plays tennis.","She plaies tennis.","She playes tennis."],"a":0,"why":"Vokal + y cukup +s."}],"map":{"c":"TOPI -s / -es","b":[{"t":"🎩 -s","k":["work → works","eat → eats"]},{"t":"🎩 -es","k":["go → goes","watch → watches","fix → fixes"]},{"t":"🎩 y → ies","k":["study → studies","cry → cries"]},{"t":"🎩 vokal + y","k":["play → plays"]},{"t":"⭐ Spesial","k":["have → has"]}]},"g":"🔗 Grammar Rules"},{"n":"Modal: can / must / should","steps":[{"s":"<b>Modal verb</b> itu ibarat <b>tombol remote</b> 🎮 yang mengubah \"mode\" kalimat. Cara pakainya mudah: <b>modal + V1</b>, tanpa topi -s, tanpa to.","ex":["She <b>can swim</b>.","He <b>must go</b>.","You <b>should rest</b>."]},{"s":"Kekuatan tiap tombol berbeda, seperti level volume.","ex":[],"tbl":[["Modal","Arti","Analogi"],["can","bisa / boleh","kemampuan"],["must","wajib","lampu merah"],["should","sebaiknya","saran teman"],["may / might","mungkin","langit mendung"]]},{"s":"Modal itu \"VIP\": tidak butuh topi -s dan tidak butuh <b>do/does</b>. Negatif tinggal tambah <b>not</b>, tanya tinggal pindah ke depan.","ex":["She can swim. ✅","She cans swim. ❌","Can she swim?","He <b>mustn't</b> go."],"tip":"Setelah modal selalu V1 polos: should <b>go</b>, bukan should goes."}],"quiz":[{"t":"mc","q":"She ___ speak three languages.","o":["can","cans","is can"],"a":0,"why":"Modal tanpa -s: <b>can</b>."},{"t":"mc","q":"You ___ stop at a red light.","o":["must","may","can"],"a":0,"why":"Lampu merah = kewajiban: <b>must</b>."},{"t":"mc","q":"Saran teman: You ___ drink more water.","o":["should","must","are"],"a":0,"why":"Saran = <b>should</b>."},{"t":"type","q":"Ketik: He can ___ (swim) very fast.","a":["swim"],"why":"Setelah modal: V1 polos."},{"t":"order","q":"Susun: \"Bisakah dia berenang?\"","w":["Can","she","swim"],"a":"Can she swim","why":"Modal pindah ke depan."}],"map":{"c":"MODAL VERBS","b":[{"t":"🎮 Mode","k":["can = bisa","must = wajib","should = saran","may = mungkin"]},{"t":"Rumus","k":["modal + V1"]},{"t":"VIP","k":["tanpa -s","tanpa do/does"]}]},"g":"🔗 Grammar Rules"},{"n":"Comparative & Superlative","steps":[{"s":"Membandingkan itu ibarat <b>podium lomba</b> 🏆. Dua orang: pakai <b>-er + than</b>. Banyak orang: pakai <b>the -est</b> (juara satu).","ex":["Tom is <b>taller than</b> Ali.","Tom is <b>the tallest</b> in class."]},{"s":"Kata pendek cukup \"ditinggikan\" dengan -er. Kata panjang terlalu berat, jadi dibantu <b>more/most</b>, seperti naik lift.","ex":[],"tbl":[["Jenis kata","Comparative","Superlative"],["Pendek","tall → taller","the tallest"],["Berakhir y","happy → happier","the happiest"],["Panjang","beautiful → more beautiful","the most beautiful"],["Bandel","good → better","the best"]],"tip":"Jangan dobel: more taller ❌ → taller ✅."}],"quiz":[{"t":"mc","q":"Jakarta is ___ than Bandung.","o":["big","bigger","biggest"],"a":1,"why":"Dua kota + than: <b>bigger</b>."},{"t":"mc","q":"She is ___ girl in the class.","o":["the smartest","smarter","more smart"],"a":0,"why":"Juara satu: <b>the smartest</b>."},{"t":"type","q":"Ketik: This book is ___ (good) than that one.","a":["better"],"why":"Good itu bandel: <b>better</b>."},{"t":"mc","q":"The garden is ___ than the house.","o":["more beautiful","beautifuller","most beautiful"],"a":0,"why":"Kata panjang: <b>more</b> + adj."},{"t":"order","q":"Susun: \"Dia lebih tinggi daripada aku.\"","w":["He","is","taller","than","me"],"a":"He is taller than me","why":"-er + than."}],"map":{"c":"COMPARISON","b":[{"t":"🏆 Dua benda","k":["-er + than","more + adj + than"]},{"t":"🥇 Juara satu","k":["the -est","the most + adj"]},{"t":"Bandel","k":["good → better → best","bad → worse → worst"]}]},"g":"🔗 Grammar Rules"},{"n":"Quantifiers: much / many / some / any","steps":[{"s":"Benda ada dua jenis: <b>countable</b> = kelereng 🔵 (bisa dihitung satuan) dan <b>uncountable</b> = air 💧 (hanya bisa ditakar). Kata \"banyak\" harus cocok dengan jenisnya.","ex":["<b>many</b> marbles","<b>much</b> water","<b>a lot of</b> marbles / water (aman untuk keduanya)"]},{"s":"Tabel pilihan cepat.","ex":[],"tbl":[["Kata","Untuk","Contoh"],["many","countable jamak","How many books?"],["much","uncountable","How much water?"],["a few / a little","sedikit (cukup)","a few friends / a little time"],["some","positif","I have some milk."],["any","negatif & tanya","I don't have any milk."]],"tip":"Uncountable: water, rice, money, time, information. Tidak pernah pakai -s!"}],"quiz":[{"t":"mc","q":"How ___ students are there?","o":["many","much"],"a":0,"why":"Students bisa dihitung: <b>many</b>."},{"t":"mc","q":"How ___ money do you have?","o":["many","much"],"a":1,"why":"Money uncountable: <b>much</b>."},{"t":"mc","q":"I don't have ___ time.","o":["some","any"],"a":1,"why":"Negatif: <b>any</b>."},{"t":"type","q":"Ketik a little/a few: She has ___ rice.","a":["a little"],"why":"Rice uncountable: <b>a little</b>."},{"t":"mc","q":"Pilih yang benar:","o":["I need some informations.","I need some information.","I need many information."],"a":1,"why":"Information tidak pakai -s."}],"map":{"c":"QUANTIFIERS","b":[{"t":"🔵 Countable","k":["many","a few","few"]},{"t":"💧 Uncountable","k":["much","a little","little"]},{"t":"Positif / Negatif","k":["some","any"]},{"t":"Aman","k":["a lot of"]}]},"g":"🔗 Grammar Rules"},{"n":"Kata Sambung","steps":[{"s":"Kata sambung itu ibarat <b>kait gerbong kereta</b> 🚂. Dua kalimat pendek digandeng jadi satu rangkaian: <b>and</b> (tambah), <b>but</b> (lawan), <b>so</b> (akibat), <b>because</b> (sebab).","ex":["I like tea <b>and</b> coffee.","I like tea, <b>but</b> not coffee.","It rained, <b>so</b> I stayed home.","I stayed home <b>because</b> it rained."]},{"s":"<b>So</b> dan <b>because</b> itu panah yang arahnya berlawanan. Sebab → <b>so</b> → akibat. Akibat ← <b>because</b> ← sebab.","ex":[],"tip":"Setelah <b>because</b> selalu SEBAB. Setelah <b>so</b> selalu AKIBAT."}],"quiz":[{"t":"mc","q":"I am tired, ___ I go to bed. (akibat)","o":["so","because","but"],"a":0,"why":"Akibat: <b>so</b>."},{"t":"mc","q":"I go to bed ___ I am tired. (sebab)","o":["so","because","but"],"a":1,"why":"Sebab: <b>because</b>."},{"t":"mc","q":"She is smart ___ lazy.","o":["and","but","so"],"a":1,"why":"Berlawanan: <b>but</b>."},{"t":"type","q":"Ketik: I like apples ___ oranges. (dan)","a":["and"],"why":"Menambah: <b>and</b>."},{"t":"order","q":"Susun: \"Aku di rumah karena hujan.\"","w":["I","stayed","home","because","it","rained"],"a":"I stayed home because it rained","why":"Because + sebab."}],"map":{"c":"KATA SAMBUNG 🚂","b":[{"t":"and","k":["menambah"]},{"t":"but","k":["berlawanan"]},{"t":"so","k":["sebab → akibat"]},{"t":"because","k":["akibat ← sebab"]}]},"g":"🔗 Grammar Rules"},{"n":"Kosakata Sehari-hari & Mapel","g":"📚 Kosakata & Reading","steps":[{"s":"Kosakata itu seperti <b>isi tas sekolah</b> 🎒. Dua kantong utamanya: <b>mata pelajaran</b> dan <b>kegiatan sehari-hari</b>.","ex":[],"tbl":[["Mapel","Artinya"],["Mathematics","Matematika"],["Science","IPA"],["Social Studies","IPS"],["Physical Education (PE)","Olahraga"],["Civics","PKn"]]},{"s":"Kegiatan harian: ibarat <b>jadwal</b>. Pasangkan kata kerja dengan bendanya (<b>collocation</b>), seperti memasangkan sendok dengan garpu.","ex":["<b>take</b> a shower, <b>have</b> breakfast","<b>do</b> homework, <b>go</b> to school","<b>make</b> the bed, <b>wash</b> the dishes"]}],"quiz":[{"t":"mc","q":"\"Science\" adalah pelajaran…","o":["IPA","IPS","Olahraga"],"a":0,"why":"Science = <b>IPA</b>."},{"t":"mc","q":"Mana yang natural?","o":["make homework","do homework","take homework"],"a":1,"why":"Pasangan tetapnya: <b>do homework</b>."},{"t":"type","q":"Ketik: I ___ a shower every morning. (take/make)","a":["take"],"why":"Pasangan tetap: <b>take a shower</b>."},{"t":"order","q":"Susun: \"Aku sarapan jam enam.\"","w":["I","have","breakfast","at","six"],"a":"I have breakfast at six","why":"<b>have breakfast</b> = sarapan."}],"map":{"c":"KOSAKATA SEHARI-HARI","b":[{"t":"📘 Mapel","k":["Science","Mathematics","PE"]},{"t":"🗓️ Rutinitas","k":["take a shower","have breakfast","do homework"]}]},"fc":1},{"n":"Reading Skills","steps":[{"s":"Membaca ada dua gaya. <b>Skimming</b> = terbang pakai <b>drone</b> 🚁, lihat gambaran besar. <b>Scanning</b> = pakai <b>kaca pembesar</b> 🔍, cari satu detail (angka, nama).","ex":[]},{"s":"Coba bacaan singkat ini. Terbangkan drone dulu: <b>apa ide utamanya?</b>","ex":["<i>Many students feel tired in class. Experts say the main cause is lack of sleep. Teenagers need 8 to 10 hours, but most sleep only 6. Going to bed earlier and avoiding phones at night can help.</i>"],"tip":"Ide utama biasanya ada di <b>kalimat pertama atau terakhir</b> paragraf."},{"s":"Tiga jenis soal: <b>main idea</b> (drone), <b>detail</b> (kaca pembesar), dan <b>inference</b> (menyimpulkan yang tersirat, ibarat detektif membaca jejak 🕵️).","ex":[]}],"quiz":[{"t":"mc","q":"Ide utama bacaan tadi?","o":["Remaja kurang tidur dan itu membuat lelah","Ponsel itu berbahaya","Sekolah harus mulai lebih pagi"],"a":0,"why":"Main idea: kurang tidur → lelah."},{"t":"mc","q":"Berapa jam tidur yang dibutuhkan remaja?","o":["6 jam","8 sampai 10 jam","12 jam"],"a":1,"why":"Detail, cari dengan scanning."},{"t":"mc","q":"Solusi yang disarankan?","o":["Tidur lebih awal & hindari ponsel malam hari","Minum kopi","Tidur siang"],"a":0,"why":"Kalimat terakhir bacaan."},{"t":"mc","q":"Inference: kebanyakan remaja…","o":["cukup tidur","kurang tidur","tidur 10 jam"],"a":1,"why":"Mereka tidur 6 jam, padahal butuh 8 sampai 10."},{"t":"mc","q":"Mencari angka \"8 to 10\" disebut…","o":["Skimming","Scanning"],"a":1,"why":"Mencari detail = scanning."}],"map":{"c":"READING SKILLS","b":[{"t":"🚁 Skimming","k":["ide utama","judul","kalimat pertama"]},{"t":"🔍 Scanning","k":["angka","nama","detail"]},{"t":"🕵️ Inference
