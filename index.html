(function(){try{
const W=[['kamu','lo'],['anda','lo'],['aku','gue'],['saya','gue'],['tidak','nggak'],['hanya','cuma'],['sudah','udah'],['agar','biar'],['supaya','biar'],['tetapi','tapi'],['namun','tapi'],['kemudian','terus'],['saja','aja'],['bagaimana','gimana'],['mengapa','kenapa'],['ingin','pengen'],['dapat','bisa'],['mudah','gampang'],['sulit','susah'],['seperti','kayak'],['memang','emang'],['benar','bener'],['lihat','liat'],['teman','temen'],['untuk','buat'],['sangat','super'],['ayo','yuk'],['mari','yuk'],['terima kasih','makasih']].map(([a,b])=>[new RegExp('\\b'+a+'\\b','gi'),b]);
const cap=(m,t)=>m[0]===m[0].toUpperCase()&&m[0]!==m[0].toLowerCase()?t[0].toUpperCase()+t.slice(1):t;
const conv=s=>{let r=s.replace(/\b([a-z]{4,})mu\b/gi,(m,b)=>b+' lo');for(const [x,t] of W)r=r.replace(x,m=>cap(m,t));return r};
const lvOf=()=>{const v=S.view;if(v==='gm')return S.g&&S.g.m?LEVELS.findIndex(L=>L.mods.includes(S.g.m)):-1;if(v==='dl')return S.d&&S.d.d?(S.d.d.l==='Level SD'?0:1):-1;if(v==='fc')return S.fc?S.fc.l:-1;if(['learn','mods','quiz','result'].includes(v)&&S.kind!=='place')return S.lv;return -1};
const walk=n=>{if(n.nodeType===3){const p=n.parentNode;if(p&&(/^(SCRIPT|STYLE|TEXTAREA|INPUT)$/.test(p.nodeName)||(p.closest&&p.closest('#ml,#mr'))))return;const v=n.nodeValue,w=conv(v);if(w!==v)n.nodeValue=w}else if(n.nodeType===1&&!/^(SCRIPT|STYLE)$/.test(n.nodeName))n.childNodes.forEach(walk)};
new MutationObserver(ms=>{if(lvOf()<1)return;ms.forEach(m=>{if(m.type==='characterData')walk(m.target);else m.addedNodes.forEach(walk)})}).observe($('#app'),{childList:true,subtree:true,characterData:true});

 $('#mres').innerHTML=`<div class="why"><b>${pc}%</b> kata tepat${xp}<br>${msg}<br><small>Terdengar: “${esc(best.h)}”</small></div>`;save();
 try{pc>=80?react('cheer'):react('oops')}catch(e){}}
render();
}catch(e){console.warn('v26 gagal',e)}})();
</script>
<script id="tampilan-v27">
/* v27: progres tipis di kartu level (modul yang sudah dapat bintang) */
(function(){try{const _vm=window.vMenu;window.vMenu=function(){_vm();view.querySelectorAll('.card[data-i]').forEach(b=>{const i=+b.dataset.i,L=LEVELS[i],t=b.querySelector('.txt');if(!L||!t||t.querySelector('.lp'))return;
 const n=L.mods.filter((_,m)=>star(i,m)>0).length;t.insertAdjacentHTML('beforeend',`<span class="lp" role="img" aria-label="${n} dari ${L.mods.length} modul selesai"><u style="width:${Math.round(n/L.mods.length*100)}%"></u></span>`)})};render();}catch(e){console.warn('v27 gagal',e)}})();

<script id="tampilan-v30">

(function(){try{const _vm=window.vMenu;window.vMenu=function(){_vm();view.classList.add('home');
 const tp=view.querySelector('#tp');if(!tp||view.querySelector('.sec'))return;
 const tools=tp.closest('.path'),lv=[...view.querySelectorAll('.path')].find(p=>p!==tools);if(!tools||!lv)return;

<script id="animasi-v34">
/* v34: owl nyanyi "na-na" (nada karangan sendiri), ikut scroll, back HP bergerak di dalam app */
(function(){try{
const Q=(q)=>document.querySelector(q),RM=matchMedia('(prefers-reduced-motion:reduce)');
const fo=document.createElement('div');fo.id='fo';fo.setAttribute('role','button');fo.setAttribute('aria-label','Pak Yood');fo.innerHTML=OWL;document.body.appendChild(fo);
const N=[523,523,659,784,659,523,587,0,587,587,698,880,784,659,523,0],W=['na','na','na','naaa','na','na','naa','','na','na','na','naaa','na','na','naaa~',''],COL=['#C2593F','#E3A23B','#4F7F55','#2C7C8A','#B24334','#7A55B8'];
let AC,st=0,tm=[];
const tone=(f,t,d)=>{const o=AC.createOscillator(),g=AC.createGain(),l=AC.createBiquadFilter();o.type='triangle';o.frequency.value=f;l.type='lowpass';l.frequency.value=1800;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.16,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(l);l.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05)};
const act=()=>{const m=Q('#app .mascot');if(m){const r=m.getBoundingClientRect();if(r.bottom>70&&r.top<innerHeight-60)return m}return fo.classList.contains('on')?fo:m};
const word=(txt,el)=>{if(RM.matches||!el)return;const r=el.getBoundingClientRect(),w=document.createElement('span');w.className='nw';w.textContent=txt;w.style.cssText=`left:${r.left+r.width*(.1+Math.random()*.6)}px;top:${r.top+r.height*.15}px;font-size:${18+(Math.random()*16|0)}px;color:${COL[Math.random()*COL.length|0]};--dx:${(Math.random()-.5)*60|0}px;--r:${(Math.random()-.5)*50|0}deg`;document.body.appendChild(w);setTimeout(()=>w.remove(),1600)};
const stop=()=>{st=0;tm.forEach(clearTimeout);tm=[];document.querySelectorAll('.sing').forEach(e=>e.classList.remove('sing'))};
const sing=()=>{if(st){stop();return}st=1;const q=P.sound&&!P.calm;
 if(q){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume()}catch(e){}}
 [Q('#app .mascot'),fo].forEach(e=>e&&e.classList.add('sing'));const B=400;
 for(let rep=0;rep<2;rep++)N.forEach((f,i)=>tm.push(setTimeout(()=>{const el=act();if(!el)return;
  if(W[i]){word(W[i],el);if(i%2)word(['♪','♫','🎵'][i%3],el)}
  if(q&&f&&AC)tone(f,AC.currentTime,.34)},(rep*16+i)*B)));
 tm.push(setTimeout(stop,32*B+300))};
const fun=(m,c)=>{m.classList.remove('spin','boing');void m.offsetWidth;m.classList.add(c);setTimeout(()=>m.classList.remove(c),950);word(c==='spin'?'wheee!':'boing!',m)};
document.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('#app .mascot,#fo');if(!t)return;e.stopPropagation();sing()},true);
/* owl ikut scroll: muncul saat owl utama tergulung, miring mengikuti arah gulir */
let ly=0,tt;const upd=()=>{const m=Q('#app .mascot'),r=m&&m.getBoundingClientRect();fo.classList.toggle('on',!!r&&r.bottom<70)};
view.addEventListener('scroll',()=>{const y=view.scrollTop,d=y-ly;ly=y;upd();fo.style.setProperty('--t',Math.max(-22,Math.min(22,d*.9))+'deg');clearTimeout(tt);tt=setTimeout(()=>fo.style.setProperty('--t','0deg'),140)},{passive:true});
const _r=window.render;window.render=function(){stop();_r();ly=0;upd()};
setInterval(()=>{if(st||document.hidden||RM.matches||P.calm)return;const m=Q('#app .mascot');if(!m)return;const r=m.getBoundingClientRect();if(r.bottom<70||r.top>innerHeight)return;fun(m,Math.random()<.5?'spin':'boing')},9000);
setTimeout(()=>{const m=Q('#app .mascot');if(m&&S.view==='menu'&&!st){m.classList.add('boing');word('colek aku! 🎵',m);setTimeout(()=>m.classList.remove('boing'),950)}},3500);
/* tombol back HP: mundur di dalam app; di beranda perlu 2x untuk keluar */
const g=()=>history.pushState({pk:1},'');history.replaceState({pk:0},'');g();
let armed=0,tb;const toast=t=>{const d=document.createElement('div');d.className='v34t';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)};
window.addEventListener('popstate',()=>{
 if(armed){armed=0;clearTimeout(tb);history.back();return}
 const mv=Q('#mov');if(mv){const b=mv.querySelector('.mrow button');if(b)b.click();g();return}
 if(S.view!=='menu'){back.onclick();g();return}
 armed=1;toast('Tekan back sekali lagi untuk keluar');g();tb=setTimeout(()=>armed=0,2000)});
upd();
}catch(e){console.warn('v34 gagal',e)}})();
</script>
