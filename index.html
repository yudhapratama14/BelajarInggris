","k":["tersirat","simpulkan dari jejak"]}]},"g":"📚 Kosakata & Reading"},{"n":"Peta 13 Jenis Teks","g":"📖 Jenis Teks","fc":1,"steps":[{"s":"13 jenis teks itu ibarat <b>rak-rak perpustakaan</b> 📚: tiap rak punya label tujuan sendiri. Kenali <b>tujuan</b>, <b>struktur</b>, dan <b>tense</b>-nya, maka teks apa pun mudah dikenali.","ex":[],"tbl":[["Teks","Tujuan","Struktur","Tense"],["Descriptive","Menggambarkan orang/benda/tempat","Identification → Description","Present"],["Procedure","Cara melakukan sesuatu","Goal → Materials → Steps","Present (perintah)"],["Report","Melaporkan hasil observasi","General classification → Description","Present"],["Narrative","Menceritakan cerita","Orientation → Complication → Resolution","Past"],["Recount","Menceritakan ulang kejadian lampau","Orientation → Events → Re-orientation","Past"],["News Item","Melaporkan peristiwa terkini","Newsworthy event → Background → Sources","Past"],["Discussion","Membahas dua sisi isu","Issue → Pro & Con → Conclusion","Present"]]},{"s":"Sisa rak-nya ada enam lagi. Perhatikan: <b>Report</b> dan <b>Explanation</b> sering tertukar, bedanya Report menjelaskan <i>apa itu</i>, Explanation menjelaskan <i>bagaimana/mengapa terjadi</i>.","ex":[],"tbl":[["Teks","Tujuan","Struktur","Tense"],["Explanation","Menjelaskan proses/fenomena","General statement → Sequenced explanation","Present"],["Analytical Exposition","Meyakinkan lewat argumen","Thesis → Arguments → Reiteration","Present"],["Announcement","Mengumumkan acara","Acara, waktu, tempat, kontak","Present / Future"],["Review","Menilai produk/jasa","Orientation → Evaluation → Summary","Present"],["Advertisement","Mempromosikan produk/jasa","Headline → Description → Slogan","Present"],["Spoof","Humor/satire","Orientation → Events → Twist","Past"]],"tip":"Tebak teks dengan 3 pertanyaan: <b>untuk apa</b> ditulis, <b>bagaimana</b> urutannya, <b>tense</b> apa yang dipakai."}],"quiz":[{"t":"mc","q":"\"The school will hold a bazaar on Friday at 9 a.m. in the hall.\" termasuk…","o":["Announcement","Report","Spoof"],"a":0,"why":"Ada acara, waktu, dan tempat: <b>Announcement</b>."},{"t":"mc","q":"\"Buy now! The lightest laptop for busy people!\" termasuk…","o":["Advertisement","Procedure","Recount"],"a":0,"why":"Mengajak membeli: <b>Advertisement</b>."},{"t":"mc","q":"Teks yang meyakinkan pembaca lewat thesis dan argumen…","o":["Analytical Exposition","Descriptive","News Item"],"a":0,"why":"Thesis → Arguments → Reiteration."},{"t":"mc","q":"Struktur \"Orientation → Complication → Resolution\" milik…","o":["Narrative","Report","Explanation"],"a":0,"why":"Cerita punya masalah dan penyelesaian: <b>Narrative</b>."},{"t":"mc","q":"Teks yang membahas dua sisi suatu isu…","o":["Discussion","Review","Spoof"],"a":0,"why":"Pro dan kontra: <b>Discussion</b>."},{"t":"mc","q":"Teks yang berakhir dengan kejutan lucu…","o":["Spoof","Procedure","Report"],"a":0,"why":"Twist lucu: <b>Spoof</b>."},{"t":"type","q":"Ketik jenis teks yang menilai produk/jasa (awalan r):","a":["review"],"why":"Menilai = <b>Review</b>."},{"t":"mc","q":"\"Today, a fire destroyed a market in Bandung...\" termasuk…","o":["News Item","Recount","Narrative"],"a":0,"why":"Peristiwa terkini: <b>News Item</b>."}],"map":{"c":"PETA 13 TEKS","b":[{"t":"🔍 Menggambarkan","k":["Descriptive","Report","Explanation","Procedure"]},{"t":"📖 Bercerita","k":["Narrative","Recount","News Item","Spoof"]},{"t":"⚖️ Berargumen","k":["Discussion","Analytical Exposition","Review"]},{"t":"📣 Mengajak & memberi info","k":["Announcement","Advertisement"]}]}},{"n":"Teks Faktual: Report, News Item, Explanation","g":"📖 Jenis Teks","steps":[{"s":"<b>Report</b> itu ibarat <b>papan info di kebun binatang</b> 🐘: fakta umum tentang satu kelompok. Struktur: <b>General classification</b> (apa itu) lalu <b>Description</b> (ciri). Tense: Present.","ex":["<b>Elephants</b> are large mammals.","They have long trunks and big ears."]},{"s":"<b>News Item</b> itu ibarat <b>siaran berita jam 7</b> 📺: peristiwa terkini yang penting. Struktur: <b>Newsworthy event</b>, <b>Background events</b>, <b>Sources</b> (kutipan narasumber). Tense: Past.","ex":["A fire destroyed a market in Bandung yesterday.","Firefighters said the fire started at 2 a.m."]},{"s":"<b>Explanation</b> itu ibarat <b>tutorial kenapa hujan turun</b> 🌧️: menjelaskan proses atau sebab-akibat. Struktur: <b>General statement</b> lalu <b>Sequenced explanation</b>, dengan kata <b>first, then, because, so</b>.","ex":["Rain forms when water vapor cools and becomes clouds.","<b>First</b>, water evaporates. <b>Then</b>, it forms clouds."],"tbl":[["","Report","News Item","Explanation"],["Fokus","Satu kelompok benda","Peristiwa terkini","Proses / sebab-akibat"],["Tense","Present","Past","Present"],["Ciri","Fakta umum","Kutipan narasumber","Urutan + sebab"]]}],"quiz":[{"t":"mc","q":"\"Elephants are mammals. They have long trunks.\" termasuk…","o":["Report","News Item","Narrative"],"a":0,"why":"Fakta umum tentang satu kelompok: <b>Report</b>."},{"t":"mc","q":"\"Firefighters said the fire started at 2 a.m.\" adalah bagian…","o":["News Item (Sources)","Report","Procedure"],"a":0,"why":"Kutipan narasumber: <b>Sources</b>."},{"t":"mc","q":"Teks dengan kata first, then, because biasanya…","o":["Explanation","Spoof","Announcement"],"a":0,"why":"Menjelaskan urutan dan sebab: <b>Explanation</b>."},{"t":"type","q":"Ketik tense News Item (awalan p, 4 huruf):","a":["past"],"why":"Peristiwa sudah terjadi: <b>Past</b>."},{"t":"order","q":"Susun: \"Gajah punya belalai panjang.\"","w":["Elephants","have","long","trunks"],"a":"Elephants have long trunks","why":"Report memakai Present."},{"t":"mc","q":"Report vs Explanation: Explanation menjelaskan…","o":["Bagaimana/mengapa sesuatu terjadi","Apa itu sesuatu","Cara membuat sesuatu"],"a":0,"why":"Explanation = proses dan sebab."}],"map":{"c":"TEKS FAKTUAL","b":[{"t":"🐘 Report","k":["General classification","Description","Present"]},{"t":"📺 News Item","k":["Newsworthy event","Background","Sources","Past"]},{"t":"🌧️ Explanation","k":["General statement","Sequenced explanation","first, then, because"]}]}},{"n":"Teks Penilaian & Promosi: Review, Advertisement, Spoof","g":"📖 Jenis Teks","steps":[{"s":"<b>Review</b> itu ibarat <b>ulasan kafe di aplikasi</b> ⭐: ada gambaran tempat, penilaian plus-minus, lalu rekomendasi. Struktur: <b>Orientation → Evaluation → Summary</b>.","ex":["The Green Cafe is a cozy place near my school.","The coffee is delicious, but the service is slow.","Overall, I <b>recommend</b> it."]},{"s":"<b>Advertisement</b> itu ibarat <b>baliho di pinggir jalan</b> 📣: harus menarik dalam sekejap. Struktur: <b>Headline → Product description → Slogan</b>. Banyak kata sifat dan kalimat ajakan.","ex":["<b>Fresh Juice!</b> Cold, sweet, and healthy.","<b>Try it today!</b>"]},{"s":"<b>Spoof</b> itu ibarat <b>lawakan dengan plot twist</b> 🎭: cerita berjalan biasa, lalu diakhiri kejutan lucu. Struktur: <b>Orientation → Events → Twist</b>. Tense: Past.","ex":["A man shouted, \"Thief!\" Everyone ran.","It was only his cat stealing fish."]}],"quiz":[{"t":"mc","q":"\"The coffee is delicious, but the service is slow. I recommend it.\" termasuk…","o":["Review","Advertisement","Spoof"],"a":0,"why":"Ada penilaian dan rekomendasi: <b>Review</b>."},{"t":"mc","q":"\"Try it today! Cold, sweet, and healthy!\" termasuk…","o":["Advertisement","Review","Report"],"a":0,"why":"Mengajak membeli: <b>Advertisement</b>."},{"t":"mc","q":"Ciri khas Spoof…","o":["Ada kejutan (twist) yang lucu","Berisi langkah-langkah","Berisi data riset"],"a":0,"why":"Spoof diakhiri <b>twist</b>."},{"t":"type","q":"Ketik bagian akhir Review (awalan s): Orientation, Evaluation, ___","a":["summary"],"why":"Penutup Review: <b>Summary</b>."},{"t":"mc","q":"Slogan biasanya ada di…","o":["Advertisement","Review","Report"],"a":0,"why":"Slogan = penutup iklan."},{"t":"order","q":"Susun: \"Saya merekomendasikan kafe ini.\"","w":["I","recommend","this","cafe"],"a":"I recommend this cafe","why":"Pelaku + recommend + objek."}],"map":{"c":"REVIEW · IKLAN · SPOOF","b":[{"t":"⭐ Review","k":["Orientation","Evaluation","Summary"]},{"t":"📣 Advertisement","k":["Headline","Description","Slogan"]},{"t":"🎭 Spoof","k":["Orientation","Events","Twist"]}]}},{"n":"Percakapan Dasar","g":"🗣️ Basic Conversation","steps":[{"s":"Percakapan itu seperti <b>main tenis</b> 🎾: satu orang memukul bola (bertanya), lawan <b>wajib memukul balik</b> (menjawab). Hafalkan pasangan pukul-baliknya.","ex":[],"tbl":[["Situasi","Pukulan","Balasan"],["Menyapa","How are you?","I'm fine, thanks. And you?"],["Berkenalan","Nice to meet you.","Nice to meet you too."],["Minta tolong","Could you help me?","Sure, no problem."],["Berterima kasih","Thank you.","You're welcome."],["Minta maaf","I'm sorry.","That's okay."]]},{"s":"Kalau tidak dengar atau tidak paham, jangan diam. Pakai <b>jurus penyelamat</b> ini:","ex":["Sorry, could you <b>repeat</b> that?","Could you <b>speak more slowly</b>, please?","What does <b>\"…\"</b> mean?"]}],"quiz":[{"t":"mc","q":"\"Thank you very much.\" Balasan yang pas?","o":["You're welcome.","I'm sorry.","Nice to meet you."],"a":0,"why":"Dibalas dengan <b>You're welcome</b>."},{"t":"mc","q":"Kamu tidak dengar ucapan lawan bicara. Kamu bilang…","o":["Could you repeat that?","See you later.","I'm fine."],"a":0,"why":"Minta diulang: <b>Could you repeat that?</b>"},{"t":"type","q":"Ketik: A: How are you? B: Fine, thanks. ___ you?","a":["and"],"why":"Bola dipukul balik: <b>And</b> you?"},{"t":"order","q":"Susun: \"Senang bertemu denganmu.\"","w":["Nice","to","meet","you"],"a":"Nice to meet you","why":"Ungkapan baku saat berkenalan."},{"t":"listen","say":"Could you repeat that, please?","q":"Orang ini sedang…","o":["Minta diulang","Berterima kasih","Menyapa"],"a":0,"why":"<b>Repeat</b> = mengulang.","wr":["","Berterima kasih pakai thank you.","Menyapa pakai hello atau how are you."]}],"map":{"c":"PERCAKAPAN DASAR","b":[{"t":"🎾 Sapaan","k":["How are you?","Nice to meet you"]},{"t":"🙏 Sopan santun","k":["Thank you","Sorry","Could you…?"]},{"t":"🆘 Penyelamat","k":["repeat that","speak slowly"]}]},"fc":1,"game":{"e":"☕","t":"Ngobrol di Kafe","sc":[["🧑‍🦰","☕","Kamu bertemu orang baru di kafe.|Apa kata pertamamu?",["Nice to meet you.","See you later.","You're welcome."],0,"🤝","hop","Berkenalan: Nice to meet you."],["🧑‍🦱","🗣️","Kamu tidak dengar apa yang dia bilang.|Apa yang kamu ucapkan?",["Could you repeat that, please?","Thank you very much.","I'm sorry, goodbye."],0,"👂","wiggle","Minta diulang: Could you repeat that?"],["🧑‍🦰","🎁","Dia memberimu hadiah.|Apa yang kamu ucapkan?",["Thank you so much!","Nice to meet you.","Could you help me?"],0,"🎁","spin","Menerima hadiah: Thank you."]]}}]},{"id":"sma","name":"Level SMA","tag":"Menengah","emoji":"🌳","mods":[{"n":"Conditional Type 1","steps":[{"s":"<b>Conditional</b> itu ibarat <b>sakelar lampu</b> 💡. Kalau sakelar ditekan (<b>If</b>), lampu menyala (<b>will</b>). Dipakai untuk kemungkinan nyata di masa depan.","ex":["If it rains, I <b>will stay</b> home."]},{"s":"Rumus: <b>If + Present</b>, lalu <b>will + Verb 1</b>. Jangan taruh \"will\" di sisi sakelar ya!","ex":["If you study, you <b>will pass</b>."]},{"s":"Ada seri sakelar lain. <b>Type 0</b>: fakta ilmiah (If + present, present). <b>Type 2</b>: khayalan, <b>If + past, would + V1</b>, ibarat \"andai lampunya ada\".","ex":["If you heat ice, it <b>melts</b>. (Type 0)","If I <b>were</b> rich, I <b>would travel</b>. (Type 2)"]},{"s":"<b>Unless</b> itu sakelar yang dibalik: <b>unless = if … not</b>. Setelah unless, kalimat tidak perlu negatif lagi.","ex":["Unless you study, you will fail.","= If you <b>don't</b> study, you will fail."],"tip":"Jangan tulis \"unless you don't\". Itu negatif ganda!"}],"quiz":[{"t":"mc","q":"If it rains, we ___ at home.","o":["stay","stayed","will stay"],"a":2,"why":"Hasilnya (lampu menyala) pakai <b>will + V1</b>."},{"t":"type","q":"Ketik: If he ___ (come), I will call him.","a":["comes"],"why":"Sisi sakelar pakai Present, dan he butuh topi: <b>comes</b>."},{"t":"order","q":"Susun kalimatnya:","w":["If","you","study","you","will","pass"],"a":"If you study you will pass","why":"If + Present dulu, baru will + V1."},{"t":"mc","q":"If I ___ a bird, I would fly.","o":["am","were","will be"],"a":1,"why":"Khayalan pakai past: <b>were</b>."},{"t":"mc","q":"If you heat ice, it ___.","o":["melts","would melt","melted"],"a":0,"why":"Fakta ilmiah: present + present."},{"t":"mc","q":"Unless you hurry, you ___ late.","o":["will be","won't be","are"],"a":0,"why":"Unless = if you don't hurry, hasilnya tetap positif: will be."},{"t":"type","q":"Ketik if/unless: ___ it rains, we will go out.","a":["unless"],"why":"Maknanya \"kalau tidak hujan\": <b>unless</b>."}],"map":{"c":"CONDITIONAL","b":[{"t":"Type 0 (fakta)","k":["If + present, present"]},{"t":"Type 1 (mungkin)","k":["If + present, will + V1"]},{"t":"Type 2 (khayalan)","k":["If + past, would + V1"]},{"t":"Unless","k":["= if … not","tanpa negatif ganda"]}]},"g":"🧠 Advanced Grammar","game":{"e":"💡","t":"Sakelar Lampu","sc":[["🧑‍💻","☔","Langit mendung. Kalau hujan, Budi akan membawa payung.|Susun rencana Budi.",["If it rains, I will take an umbrella.","If it will rain, I take an umbrella.","If it rained, I will take an umbrella."],0,"☂️","hop","If + Present, will + V1."],["🧑‍🎓","📚","Kalau Dina belajar, dia akan lulus.|Susun kalimatnya.",["If she studies, she will pass.","If she will study, she passes.","If she studied, she will pass."],0,"🎓","grow","Sisi sakelar pakai Present (studies), hasil pakai will + V1."],["🥱","🌙","Kalau kamu begadang, kamu akan mengantuk.|Beri peringatan.",["If you stay up late, you will be sleepy.","If you will stay up late, you are sleepy.","If you stayed up late, you will sleepy."],0,"🥱","wiggle","If + Present (stay), will + be + sleepy."]]}},{"n":"Reported Speech","steps":[{"s":"<b>Reported speech</b> itu ibarat <b>menceritakan ulang omongan orang</b> 🗣️. Karena sudah lewat, waktunya <b>mundur satu langkah</b>: present jadi past, will jadi would.","ex":["\"I <b>am</b> tired,\" she said.","→ She said (that) she <b>was</b> tired."]},{"s":"Ini <b>tabel mundur satu langkah</b>. Kata penunjuk waktu dan tempat juga ikut bergeser.","ex":[],"tbl":[["Langsung","Tidak langsung"],["am / is / are","was / were"],["play / plays","played"],["will","would"],["can","could"],["now / today","then / that day"],["here","there"]],"tip":"Pronoun ikut berubah: \"I\" menjadi he/she sesuai pembicaranya."}],"quiz":[{"t":"mc","q":"\"I am hungry,\" he said. → He said he ___ hungry.","o":["was","is","will be"],"a":0,"why":"Am mundur jadi <b>was</b>."},{"t":"mc","q":"\"I will help,\" she said. → She said she ___ help.","o":["would","will","can"],"a":0,"why":"Will mundur jadi <b>would</b>."},{"t":"type","q":"Ketik: \"I can swim,\" Tom said. → Tom said he ___ swim.","a":["could"],"why":"Can mundur jadi <b>could</b>."},{"t":"mc","q":"\"We play football,\" they said. → They said they ___ football.","o":["played","play","plays"],"a":0,"why":"Present mundur jadi past."},{"t":"order","q":"Susun: \"Dia bilang dia lelah.\"","w":["She","said","she","was","tired"],"a":"She said she was tired","why":"Was = mundur dari is."}],"map":{"c":"REPORTED SPEECH","b":[{"t":"⏪ Mundur","k":["am/is → was","play → played","will → would","can → could"]},{"t":"Ikut bergeser","k":["now → then","here → there","I → he/she"]}]},"g":"🧠 Advanced Grammar"},{"n":"Passive Voice","steps":[{"s":"Bayangkan kalimat itu panggung teater 🎭. Di <b>Active Voice</b>, lampu sorot menyorot <b>si pelaku</b> sebagai pemeran utama.","ex":["Mom <b>made</b> the cake."]},{"s":"Di <b>Passive Voice</b>, lampu sorot pindah ke <b>bendanya</b>. Si pelaku jadi kru di balik layar (boleh disebut pakai <b>by</b>, boleh juga tidak). Rumusnya: <b>be + Verb 3</b>.","ex":["The cake <b>was made</b> by Mom.","English <b>is spoken</b> in many countries."]},{"s":"\"be\"-nya mengikuti waktu: sekarang pakai <b>is/are</b>, lampau pakai <b>was/were</b>. Verb-nya selalu bentuk ke-3 (V3).","ex":["The window <b>was broken</b> yesterday.","Rice <b>is grown</b> in Indonesia."]},{"s":"Resepnya sama di semua waktu: <b>be</b> disesuaikan waktu + <b>V3</b>. Masa depan pakai <b>will be</b> + V3.","ex":["The letter <b>will be sent</b> tomorrow.","The room <b>is being cleaned</b> now."]},{"s":"Ini <b>tabel pindah lampu sorot</b> untuk 4 tense. Polanya selalu sama: <b>be</b> disesuaikan waktu + <b>V3</b>.","ex":[],"tbl":[["Tense","Active","Passive"],["Present","writes","is written"],["Past","wrote","was written"],["Future","will write","will be written"],["Present perfect","has written","has been written"]],"tip":"Cek V3-nya dulu (write, wrote, <b>written</b>), baru pilih be-nya."}],"quiz":[{"q":"The cake ___ by my mother yesterday.","o":["is made","was made","was make","made"],"a":1,"why":"Kejadian kemarin = lampau, jadi <b>was</b> + V3 (made)."},{"q":"English ___ in many countries.","o":["speaks","was speak","is spoken","are speaking"],"a":2,"why":"Fakta umum yang bendanya jadi sorotan: <b>is spoken</b> (is + V3)."},{"q":"Ubah ke passive: <i>They built this bridge in 1990.</i>","o":["This bridge is built in 1990.","This bridge was built in 1990.","This bridge built in 1990.","This bridge were built in 1990."],"a":1,"why":"Bridge itu satu benda dan terjadi di masa lalu: <b>was built</b>."},{"t":"mc","q":"The report ___ tomorrow.","o":["will be finished","was finished","finishes"],"a":0,"why":"Besok = masa depan: <b>will be</b> + V3."},{"t":"type","q":"Ketik V3 dari write: The book was ___ by him.","a":["written"],"why":"write, wrote, <b>written</b>."},{"t":"mc","q":"The problem has ___ solved.","o":["be","been","being"],"a":1,"why":"Present perfect passive: has <b>been</b> + V3."},{"t":"type","q":"Ketik V3: The letter will be ___ (send) tomorrow.","a":["sent"],"why":"send, sent, <b>sent</b>."}],"map":{"c":"PASSIVE VOICE","b":[{"t":"Rumus","k":["Object + be + V3","(+ by pelaku)"]},{"t":"Be per waktu","k":["is/are","was/were","will be"]},{"t":"Analogi","k":["lampu sorot pindah ke benda"]},{"t":"4 tense","k":["is written","was written","will be written","has been written"]}]},"g":"🧠 Advanced Grammar"},{"n":"Relative Clauses","steps":[{"s":"<b>Relative clause</b> itu ibarat <b>kait</b> 🪝 yang menggandeng kalimat tambahan ke sebuah benda, jadi dua kalimat pendek menyatu menjadi satu kalimat kompleks yang elegan.","ex":["I have a friend. + She lives in Bali.","→ I have a friend <b>who</b> lives in Bali."]},{"s":"Pilih kaitnya sesuai yang digandeng.","ex":[],"tbl":[["Kait","Untuk","Contoh"],["who","orang","The girl who sings is my sister."],["which","benda / hewan","The book which I read was long."],["whose","kepemilikan","The man whose car was stolen is angry."],["that","orang / benda (defining)","The song that I like is old."]]},{"s":"Ada dua jenis. <b>Defining</b>: info penting, tanpa koma. <b>Non-defining</b>: info tambahan, diapit <b>koma</b> seperti kurung opsional, dan <b>tidak boleh pakai that</b>.","ex":["The student <b>who</b> won is my friend. (penting)","Jakarta, <b>which</b> is huge, is busy. (tambahan)"],"tip":"Non-defining: koma + who/which saja. \"that\" dilarang!"}],"quiz":[{"t":"mc","q":"The woman ___ lives next door is a doctor.","o":["who","which","whose"],"a":0,"why":"Orang: <b>who</b>."},{"t":"mc","q":"This is the laptop ___ I bought yesterday.","o":["who","which","whose"],"a":1,"why":"Benda: <b>which</b>."},{"t":"type","q":"Ketik: The boy ___ bike was stolen is crying.","a":["whose"],"why":"Sepedanya milik si anak: <b>whose</b>."},{"t":"mc","q":"Pilih yang benar:","o":["Bali, that is beautiful, is popular.","Bali, which is beautiful, is popular.","Bali which, is beautiful is popular."],"a":1,"why":"Non-defining: koma + which, bukan that."},{"t":"type","q":"Ketik who/which: The car ___ I drive is old.","a":["which","that"],"why":"Benda: <b>which</b> (atau that)."},{"t":"order","q":"Susun: \"Pria yang tinggal di sana adalah paman saya.\"","w":["The","man","who","lives","there","is","my","uncle"],"a":"The man who lives there is my uncle","why":"Kait who menggandeng klausa ke man."}],"map":{"c":"RELATIVE CLAUSES","b":[{"t":"🪝 Kait","k":["who → orang","which → benda","whose → milik","that → orang/benda"]},{"t":"Defining","k":["info penting","tanpa koma"]},{"t":"Non-defining","k":["pakai koma","tanpa that"]}]},"g":"🧠 Advanced Grammar"},{"n":"Gerund vs Infinitive","steps":[{"s":"Dua kata kerja berurutan bikin pusing: <b>enjoy to swim</b> atau <b>enjoy swimming</b>? Analogi: <b>V-ing</b> = aktivitas yang dinikmati, seperti menonton rekaman 📼. <b>to + V</b> = <b>anak panah</b> 🏹 menuju tujuan.","ex":["I enjoy <b>swimming</b>. (kegiatan)","I want <b>to swim</b>. (tujuan)"]},{"s":"Hafalkan dari \"kepribadiannya\": kata kerja <b>menikmati atau menghindari</b> cenderung V-ing, kata kerja <b>bercita-cita</b> cenderung to V.","ex":[],"tbl":[["V-ing 📼","to + V 🏹"],["enjoy, finish, avoid, mind","want, need, decide, hope"],["keep, suggest, consider","plan, agree, promise, refuse"],["practice, quit, imagine","learn, manage, afford, expect"]],"tip":"Setelah preposisi selalu V-ing: interested <b>in learning</b>."},{"s":"Ada yang <b>berubah arti</b>: <b>stop</b>. Stop V-ing = berhenti melakukan. Stop to V = berhenti untuk melakukan sesuatu.","ex":["He stopped <b>smoking</b>. (berhenti merokok)","He stopped <b>to smoke</b>. (berhenti untuk merokok)"]}],"quiz":[{"t":"mc","q":"She enjoys ___ novels.","o":["reading","to read","read"],"a":0,"why":"Enjoy → V-ing."},{"t":"mc","q":"He decided ___ abroad.","o":["studying","to study","study"],"a":1,"why":"Decide → to V (tujuan)."},{"t":"type","q":"Ketik: I am interested in ___ (learn) French.","a":["learning"],"why":"Setelah preposisi: V-ing."},{"t":"mc","q":"Pilih yang benar:","o":["I avoid to eat sugar.","I avoid eating sugar.","I avoid eat sugar."],"a":1,"why":"Avoid → V-ing."},{"t":"mc","q":"She stopped ___ a coffee on her way. (berhenti untuk membeli)","o":["to buy","buying"],"a":0,"why":"Stop to V = berhenti untuk melakukan."}],"map":{"c":"GERUND vs INFINITIVE","b":[{"t":"📼 V-ing","k":["enjoy","finish","avoid","keep","mind"]},{"t":"🏹 to + V","k":["want","need","decide","hope","plan"]},{"t":"Setelah preposisi","k":["in learning","of going"]},{"t":"Beda arti","k":["stop smoking","stop to smoke"]}]},"g":"🧠 Advanced Grammar"},{"n":"Present Perfect Continuous","steps":[{"s":"<b>Present Perfect Continuous</b> itu <b>jembatan + video</b> 🌉🎥: aktivitas yang mulai di masa lalu, masih berjalan (atau baru selesai), dan <b>durasinya yang disorot</b>. Rumus: <b>have/has been + V-ing</b>.","ex":["I <b>have been studying</b> for 3 hours.","It <b>has been raining</b> since morning."]},{"s":"Beda halus dengan Present Perfect: sorot <b>hasil</b> atau sorot <b>proses</b>?","ex":[],"tbl":[["","Present Perfect","Pres. Perf. Continuous"],["Fokus","hasil / pengalaman","proses / durasi"],["Contoh","I have painted the room.","I have been painting all day."],["Petunjuk","ever, already, yet","for, since, all day, lately"]],"tip":"Hasil = Perfect. Proses = Perfect Continuous."}],"quiz":[{"t":"mc","q":"She is tired. She ___ for hours.","o":["has been running","is running","ran"],"a":0,"why":"Proses panjang sampai sekarang."},{"t":"mc","q":"I ___ the report. Here it is! (hasil)","o":["have finished","have been finishing"],"a":0,"why":"Hasil yang disorot: Perfect."},{"t":"type","q":"Ketik: It has been ___ (rain) since morning.","a":["raining"],"why":"been + V-ing."},{"t":"mc","q":"\"for three hours\" cocok dengan…","o":["Present Perfect Continuous","Past Simple","Future Simple"],"a":0,"why":"Durasi sampai sekarang."}],"map":{"c":"PRES. PERF. CONT.","b":[{"t":"🌉🎥 Rumus","k":["have/has been + V-ing"]},{"t":"Fokus","k":["proses","durasi"]},{"t":"Penanda","k":["for","since","all day","lately"]}]},"g":"⏰ Tenses Lanjutan"},{"n":"Past Perfect","steps":[{"s":"<b>Past Perfect</b> itu ibarat <b>flashback dalam film</b> 🎞️: dari dua kejadian lampau, yang <b>terjadi lebih dulu</b> memakai <b>had + V3</b>. Yang belakangan tetap Past Simple.","ex":["When I arrived, the film <b>had started</b>.","She <b>had finished</b> before he called."]},{"s":"Urutan waktunya seperti <b>dua anak tangga</b> 🪜: bawah = lebih dulu (had + V3), atas = kemudian (V2). Penanda: <b>before, after, by the time, already</b>.","ex":["By the time we arrived, they <b>had left</b>.","After he <b>had eaten</b>, he went out."],"tip":"Past Perfect butuh pasangan. Satu kejadian lampau saja cukup Past Simple."}],"quiz":[{"t":"mc","q":"When I arrived, the bus ___.","o":["had left","left","leaves"],"a":0,"why":"Bus berangkat lebih dulu: had + V3."},{"t":"mc","q":"Rumus Past Perfect:","o":["had + V3","was + V-ing","have + V3"],"a":0,"why":"had + V3."},{"t":"type","q":"Ketik V3: She had ___ (eat) before I came.","a":["eaten"],"why":"eat, ate, <b>eaten</b>."},{"t":"order","q":"Susun: \"Dia sudah pergi sebelum aku tiba.\"","w":["She","had","left","before","I","arrived"],"a":"She had left before I arrived","why":"Had left = lebih dulu."}],"map":{"c":"PAST PERFECT","b":[{"t":"🎞️ Rumus","k":["had + V3"]},{"t":"🪜 Urutan","k":["had V3 = lebih dulu","V2 = kemudian"]},{"t":"Penanda","k":["before","after","by the time","already"]}]},"g":"⏰ Tenses Lanjutan"},{"n":"Past Perfect Continuous","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Past Perfect Continuous</b> itu ibarat <b>rekaman video yang sudah berjalan lama</b> 🎥 sebelum kejadian lampau lain muncul. Fokusnya <b>durasi</b>. Rumus: <b>had been + V-ing</b>.","ex":["She <b>had been waiting</b> for two hours when the bus arrived.","They <b>had been studying</b> before the power went out."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + had been + V-ing","He had been working."],["Negatif","S + hadn't been + V-ing","He hadn't been working."],["Tanya","Had + S + been + V-ing?","Had he been working?"]],"tip":"Penanda: <b>for, since, before, by the time</b>. Kejadian yang lebih dulu pakai <b>had been</b>, yang menyusul pakai Past Simple."}],"quiz":[{"t":"mc","q":"When I arrived, she ___ for an hour.","o":["had been waiting","has been waiting","will be waiting"],"a":0,"why":"Berlangsung sebelum kejadian lampau lain: <b>had been + V-ing</b>."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["He had been run.","He had been running.","He has been ran."],"a":1,"why":"Setelah had been, kata kerja pakai -ing."},{"t":"type","q":"Ketik: They had been ___ (play) for two hours.","a":["playing"],"why":"had been + <b>playing</b>."},{"t":"order","q":"Susun: \"Dia sudah menunggu dua jam.\"","w":["She","had","been","waiting","for","two","hours"],"a":"She had been waiting for two hours","why":"Pelaku + had been + V-ing + durasi."},{"t":"mc","q":"Pilih kalimat tanya yang benar:","o":["Had you been sleeping?","Did you been sleeping?","Have you had sleeping?"],"a":0,"why":"Had maju ke depan untuk bertanya."}],"map":{"c":"PAST PERFECT CONT.","b":[{"t":"Rumus","k":["had been + V-ing"]},{"t":"Fokus","k":["durasi sebelum kejadian lampau"]},{"t":"Penanda","k":["for","since","before"]}]}},{"n":"Future Continuous","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Future Continuous</b> itu ibarat <b>menekan pause di jam tertentu besok</b> ⏸️: kita lihat apa yang <b>sedang berlangsung</b> saat itu. Rumus: <b>will be + V-ing</b>.","ex":["At 8 tomorrow, I <b>will be studying</b>.","This time next week, we <b>will be flying</b> to Bali."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + will be + V-ing","She will be working."],["Negatif","S + won't be + V-ing","She won't be working."],["Tanya","Will + S + be + V-ing?","Will she be working?"]],"tip":"Penanda: <b>at 8 p.m. tomorrow, this time next week</b>. Setelah <b>will be</b>, kata kerja wajib -ing."}],"quiz":[{"t":"mc","q":"At 9 tomorrow, I ___ in a meeting.","o":["will be sitting","sat","have sat"],"a":0,"why":"Sedang berlangsung di jam tertentu besok: <b>will be + V-ing</b>."},{"t":"mc","q":"This time next week, we ___ on the beach.","o":["will be lying","are lie","have lain"],"a":0,"why":"Penanda this time next week: Future Continuous."},{"t":"type","q":"Ketik: She will be ___ (cook) dinner at 7.","a":["cooking"],"why":"will be + <b>cooking</b>."},{"t":"order","q":"Susun: \"Besok jam tujuh aku sedang tidur.\"","w":["At","seven","tomorrow","I","will","be","sleeping"],"a":"At seven tomorrow I will be sleeping","why":"Waktu + pelaku + will be + V-ing."},{"t":"mc","q":"Pilih kalimat tanya yang benar:","o":["Will you be working tonight?","Will you working tonight?","Do you will be work tonight?"],"a":0,"why":"Will maju ke depan."}],"map":{"c":"FUTURE CONTINUOUS","b":[{"t":"Rumus","k":["will be + V-ing"]},{"t":"Fokus","k":["sedang berlangsung di waktu tertentu besok"]},{"t":"Penanda","k":["at 8 tomorrow","this time next week"]}]}},{"n":"Future Perfect","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Future Perfect</b> itu ibarat <b>centang di daftar tugas</b> ✅ sebelum tenggat: pada waktu tertentu di masa depan, pekerjaan itu <b>sudah selesai</b>. Rumus: <b>will have + V3</b>.","ex":["By next June, I <b>will have finished</b> my report.","She <b>will have left</b> before you arrive."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + will have + V3","I will have finished."],["Negatif","S + won't have + V3","I won't have finished."],["Tanya","Will + S + have + V3?","Will you have finished?"]],"tip":"Penanda: <b>by + waktu, by the time, before</b>. Tenggat (by) itu kuncinya: hasilnya sudah jadi pada saat itu."}],"quiz":[{"t":"mc","q":"By 2030, she ___ her degree.","o":["will have finished","will finish have","finished"],"a":0,"why":"Selesai sebelum tenggat: <b>will have + V3</b>."},{"t":"mc","q":"I ___ the report before you come.","o":["will have written","will have wrote","will be wrote"],"a":0,"why":"V3 dari write adalah <b>written</b>."},{"t":"type","q":"Ketik V3 dari eat: By noon, I w dying."],["Negatif","S + won't have been + V-ing","He won't have been studying."],["Tanya","Will + S + have been + V-ing?","Will he have been studying?"]],"tip":"Penanda: <b>by + waktu</b> dan <b>for + durasi</b> muncul bersama. Bedanya dengan Future Perfect: ini menekankan <b>lamanya proses</b>, bukan hasil."}],"quiz":[{"t":"mc","q":"By July, I ___ here for ten years.","o":["will have been working","will working","have been work"],"a":0,"why":"Durasi sampai titik masa depan: <b>will have been + V-ing</b>."},{"t":"mc","q":"Pilih kalimat yang benar:","o":["She will have been teaching for 20 years by 2030.","She will have been teach for 20 years.","She will been teaching for 20 years."],"a":0,"why":"Rumus lengkap: will + have + been + V-ing."},{"t":"type","q":"Ketik: By May, we will have been ___ (live) here for a year.","a":["living"],"why":"been + <b>living</b>."},{"t":"order","q":"Susun: \"Tahun depan aku sudah belajar lima tahun.\"","w":["Next","year","I","will","have","been","studying","for","five","years"],"a":"Next year I will have been studying for five years","why":"Titik waktu + will have been + V-ing + for durasi."},{"t":"mc","q":"Beda dengan Future Perfect?","o":["Menekankan lamanya proses","Menekankan hasil akhir","Dipakai untuk kebiasaan"],"a":0,"why":"Continuous = proses dan durasi."}],"map":{"c":"FUTURE PERFECT CONT.","b":[{"t":"Rumus","k":["will have been + V-ing"]},{"t":"Fokus","k":["lamanya proses sampai titik masa depan"]},{"t":"Penanda","k":["by + waktu","for + durasi"]}]}},{"n":"Simple Past Future","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Past Future</b> itu ibarat <b>menonton ulang trailer film lama</b> 🎞️: dulu orang bilang akan terjadi sesuatu, kini kita menceritakannya dari sudut pandang masa lalu. <b>Simple Past Future</b> = <b>would + V1</b>, sering muncul di <b>reported speech</b>.","ex":["He said he <b>would come</b> on Monday.","I knew she <b>would win</b>."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + would + V1","They would help."],["Negatif","S + wouldn't + V1","They wouldn't help."],["Tanya","Would + S + V1?","Would they help?"]],"tip":"Jangan tertukar: <b>will</b> = rencana dilihat dari sekarang, <b>would</b> = rencana dilihat dari masa lalu. He says he <b>will</b> come → He said he <b>would</b> come."}],"quiz":[{"t":"mc","q":"She said she ___ call me.","o":["would","will","is"],"a":0,"why":"Dilaporkan dari masa lalu (said): <b>would</b>."},{"t":"mc","q":"He says, \"I will help.\" → He said he ___ help.","o":["would","will","did"],"a":0,"why":"will bergeser jadi <b>would</b>."},{"t":"type","q":"Ketik will/would: I knew they ___ win.","a":["would"],"why":"Knew = lampau, jadi <b>would</b>."},{"t":"order","q":"Susun: \"Dia bilang akan datang.\"","w":["He","said","he","would","come"],"a":"He said he would come","why":"said + would + V1."},{"t":"mc","q":"Fungsi would di Past Future?","o":["Masa depan dilihat dari masa lalu","Kebiasaan sekarang","Perintah"],"a":0,"why":"Itu inti Past Future."}],"map":{"c":"SIMPLE PAST FUTURE","b":[{"t":"Rumus","k":["would + V1"]},{"t":"Dipakai di","k":["reported speech"]},{"t":"Bandingkan","k":["will (sekarang)","would (masa lalu)"]}]}},{"n":"Past Future Continuous","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Past Future Continuous</b> = <b>would be + V-ing</b>. Ibarat <b>memutar ulang video lama</b> 📼: dulu seseorang bilang pada waktu tertentu di masa depan ia akan <b>sedang melakukan</b> sesuatu.","ex":["She said she <b>would be waiting</b> at the station at five.","I thought they <b>would be sleeping</b> by then."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + would be + V-ing","He would be working."],["Negatif","S + wouldn't be + V-ing","He wouldn't be working."],["Tanya","Would + S + be + V-ing?","Would he be working?"]],"tip":"Pola: kata kerja pelapor lampau (said, thought, knew) + <b>would be + V-ing</b>."}],"quiz":[{"t":"mc","q":"He said he ___ at the station at 5.","o":["would be waiting","would waiting","will be wait"],"a":0,"why":"Lampau + sedang berlangsung di masa depan: <b>would be + V-ing</b>."},{"t":"mc","q":"She thought they ___ by then.","o":["would be sleeping","are sleeping","would sleep be"],"a":0,"why":"<b>would be sleeping</b>."},{"t":"type","q":"Ketik: I said I would be ___ (work) at noon.","a":["working"],"why":"would be + <b>working</b>."},{"t":"order","q":"Susun: \"Dia bilang jam delapan dia akan sedang belajar.\"","w":["She","said","she","would","be","studying","at","eight"],"a":"She said she would be studying at eight","why":"said + would be + V-ing."},{"t":"mc","q":"Bentuk laporan dari \"I will be working\":","o":["He said he would be working","He said he will be working","He said he was be working"],"a":0,"why":"will be bergeser jadi <b>would be</b>."}],"map":{"c":"PAST FUTURE CONT.","b":[{"t":"Rumus","k":["would be + V-ing"]},{"t":"Pola","k":["said / thought + would be + V-ing"]}]}},{"n":"Past Future Perfect","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Past Future Perfect</b> = <b>would have + V3</b>. Ibarat <b>kalender lama yang sudah dicentang</b> ✅: dulu seseorang memperkirakan suatu pekerjaan <b>akan sudah selesai</b> pada waktu tertentu.","ex":["He said he <b>would have finished</b> the report by Friday.","I thought they <b>would have arrived</b> by noon."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + would have + V3","She would have left."],["Negatif","S + wouldn't have + V3","She wouldn't have left."],["Tanya","Would + S + have + V3?","Would she have left?"]],"tip":"Hati-hati: <b>would have + V3</b> juga muncul di Conditional Type 3 (If I had known, I would have come) yang berarti <b>penyesalan</b>. Lihat konteksnya."}],"quiz":[{"t":"mc","q":"He said he ___ the work by Friday.","o":["would have finished","would finish have","will have finished"],"a":0,"why":"Dilaporkan dari masa lalu: will have → <b>would have</b>."},{"t":"mc","q":"Pilih bentuk yang benar:","o":["would have gone","would have went","would has gone"],"a":0,"why":"V3 dari go adalah <b>gone</b>."},{"t":"type","q":"Ketik V3 dari see: She said she would have ___ it by then.","a":["seen"],"why":"see, saw, <b>seen</b>."},{"t":"order","q":"Susun: \"Dia bilang sudah selesai pada hari Jumat.\"","w":["He","said","he","would","have","finished","by","Friday"],"a":"He said he would have finished by Friday","why":"said + would have + V3."},{"t":"mc","q":"Pada \"If I had known, I would have come\", would have + V3 berarti…","o":["Penyesalan masa lalu","Rencana besok","Kebiasaan"],"a":0,"why":"Itu Conditional Type 3."}],"map":{"c":"PAST FUTURE PERFECT","b":[{"t":"Rumus","k":["would have + V3"]},{"t":"Dipakai di","k":["reported speech"]},{"t":"Awas","k":["mirip Conditional Type 3"]}]}},{"n":"Past Future Perfect Continuous","g":"⏰ Tenses Lanjutan","steps":[{"s":"<b>Past Future Perfect Continuous</b> = <b>would have been + V-ing</b>. Tense terpanjang, ibarat <b>odometer di cerita lama</b> 🚗: dulu diperkirakan bahwa pada titik tertentu kegiatan <b>sudah berlangsung selama…</b>.","ex":["She said that by June she <b>would have been teaching</b> for ten years.","He thought they <b>would have been waiting</b> for hours."]},{"s":"Ini tiga wajahnya: positif, negatif, tanya. Perhatikan letak kata bantunya.","ex":[],"tbl":[["","Rumus","Contoh"],["Positif","S + would have been + V-ing","He would have been working."],["Negatif","S + wouldn't have been + V-ing","He wouldn't have been working."],["Tanya","Would + S + have been + V-ing?","Would he have been working?"]],"tip":"Jarang muncul, tapi enak dipecah jadi 3 potong: <b>would</b> (versi lampau dari will) + <b>have been</b> (perfect) + <b>V-ing</b> (berlangsung)."}],"quiz":[{"t":"mc","q":"She said that by 2030 she ___ for 20 years.","o":["would have been teaching","would be teach","will have been teach"],"a":0,"why":"<b>would have been + V-ing</b>."},{"t":"mc","q":"Rumus yang benar?","o":["would have been + V-ing","would been have + V-ing","would have be + V-ing"],"a":0,"why":"Urutannya: would, have, been, V-ing."},{"t":"type","q":"Ketik: He said he would have been ___ (wait) for hours.","a":["waiting"],"why":"been + <b>waiting</b>."},{"t":"order","q":"Susun: \"Dia bilang sudah bekerja sepuluh tahun.\"","w":["She","said","she","would","have","been","working","for","ten","years"],"a":"She said she would have been working for ten years","why":"said + would have been + V-ing + durasi."},{"t":"mc","q":"Fokus tense ini…","o":["Durasi sampai titik masa depan versi lampau","Kebiasaan","Perintah"],"a":0,"why":"Perfect Continuous = durasi."}],"map":{"c":"PAST FUTURE PERFECT CONT.","b":[{"t":"Rumus","k":["would have been + V-ing"]},{"t":"3 potong","k":["would","have been","V-ing"]}]}},{"n":"Kosakata Akademik & Teknis","g":"📖 Vocabulary","steps":[{"s":"Kosakata akademik itu ibarat <b>baju resmi</b> 👔. Maknanya sama dengan baju santai (kata sehari-hari), tapi dipakai di forum formal dan tulisan ilmiah.","ex":[],"tbl":[["Santai","Resmi (akademik)"],["use","utilize"],["show","demonstrate"],["help","assist / facilitate"],["get","obtain"],["big","significant"],["think about","analyze / evaluate"]]},{"s":"Kosakata <b>teknis</b> itu <b>alat khusus tukang</b> 🔧: tiap bidang punya sendiri. Kenali yang paling sering muncul di bacaan SMA dan ujian.","ex":["<b>variable</b> = nilai yang bisa berubah","<b>hypothesis</b> = dugaan yang diuji","<b>inflation</b> = kenaikan harga umum","<b>ecosystem</b> = jaringan makhluk hidup dan lingkungannya"]}],"quiz":[{"t":"mc","q":"Padanan formal dari \"show\" adalah…","o":["demonstrate","guess","fix"],"a":0,"why":"<b>Demonstrate</b> lebih akademik."},{"t":"type","q":"Ketik padanan formal \"get\" (awalan o):","a":["obtain"],"why":"<b>Obtain</b> = memperoleh."},{"t":"mc","q":"Dugaan awal yang diuji lewat penelitian disebut…","o":["hypothesis","inflation","variable"],"a":0,"why":"Itu <b>hypothesis</b>."},{"t":"mc","q":"\"Inflation\" paling terkait dengan bidang…","o":["Ekonomi","Biologi","Olahraga"],"a":0,"why":"Kenaikan harga: <b>ekonomi</b>."}],"map":{"c":"KOSAKATA AKADEMIK","b":[{"t":"👔 Formal","k":["utilize","demonstrate","obtain"]},{"t":"🔧 Teknis","k":["variable","hypothesis","ecosystem","inflation"]}]},"fc":1},{"n":"Phrasal Verbs","steps":[{"s":"<b>Phrasal verb</b> itu <b>kata kerja + \"kancing\"</b> 🧥. Kata kerjanya sama, tapi ganti kancing (up, off, out, on), artinya <b>berubah total</b>. Hafalkan sebagai satu paket.","ex":["give <b>up</b> = menyerah","look <b>after</b> = merawat","turn <b>off</b> = mematikan","find <b>out</b> = mencari tahu"]},{"s":"Enam phrasal verb yang paling sering muncul.","ex":[],"tbl":[["Phrasal verb","Arti","Contoh"],["give up","menyerah","Never give up!"],["look for","mencari","I look for my keys."],["look after","merawat","She looks after her cat."],["turn on / off","menyalakan / mematikan","Turn off the light."],["find out","mencari tahu","Let's find out."],["run out of","kehabisan","We ran out of milk."]],"tip":"Tebak dari kancingnya: <b>up</b> = naik/selesai, <b>off</b> = lepas/mati, <b>out</b> = keluar/habis."}],"quiz":[{"t":"mc","q":"Never ___ ! (menyerah)","o":["give up","give out","give on"],"a":0,"why":"Give up = menyerah."},{"t":"mc","q":"Can you ___ my dog? (merawat)","o":["look after","look for","look up"],"a":0,"why":"Look after = merawat."},{"t":"type","q":"Ketik: Please turn ___ the light. (mematikan)","a":["off"],"why":"Turn off = mematikan."},{"t":"mc","q":"\"We ran out of milk\" artinya…","o":["kehabisan susu","berlari membawa susu","menumpahkan susu"],"a":0,"why":"Run out of = kehabisan."},{"t":"mc","q":"I ___ my keys everywhere. (mencari)","o":["look for","look after"],"a":0,"why":"Look for = mencari."}],"map":{"c":"PHRASAL VERBS","b":[{"t":"🧥 Kancing","k":["up = naik/selesai","off = lepas/mati","out = keluar/habis"]},{"t":"Contoh","k":["give up","look after","find out","run out of"]}]},"g":"📖 Vocabulary"},{"n":"Idiom Populer","steps":[{"s":"<b>Idiom</b> itu ibarat <b>kode rahasia</b> 🔐: kalau diterjemahkan kata per kata, hasilnya absurd. Triknya: <b>bayangkan gambarnya</b>, lalu tebak maknanya.","ex":["It's a <b>piece of cake</b>. 🍰","I'm <b>under the weather</b>. ☁️"]},{"s":"Enam idiom populer beserta gambar pengingatnya.","ex":[],"tbl":[["Idiom","Gambar di kepala","Arti"],["Piece of cake","kue tinggal dimakan","sangat mudah"],["Hit the books","menabrak tumpukan buku","belajar giat"],["Under the weather","berteduh di cuaca mendung","kurang sehat"],["Once in a blue moon","bulan biru yang langka","sangat jarang"],["Spill the beans","kacang tumpah","membocorkan rahasia"],["Cost an arm and a leg","bayar dengan anggota tubuh","sangat mahal"]],"tip":"Idiom tidak boleh diubah katanya: \"spill the peas\" ❌."}],"quiz":[{"t":"mc","q":"The exam was a piece of cake.","o":["sulit sekali","sangat mudah","manis"],"a":1,"why":"Kue tinggal dimakan = gampang."},{"t":"mc","q":"I feel under the weather today.","o":["kurang sehat","kehujanan","senang"],"a":0,"why":"Berteduh di cuaca mendung = kurang enak badan."},{"t":"type","q":"Ketik satu kata: Don't ___ the beans! (jangan bocorkan)","a":["spill"],"why":"<b>Spill</b> the beans = bocorkan rahasia."},{"t":"mc","q":"That car cost an arm and a leg.","o":["sangat mahal","sangat murah","membuatnya cedera"],"a":0,"why":"Bayar pakai anggota tubuh = mahal sekali."},{"t":"mc","q":"We visit him once in a blue moon.","o":["setiap hari","sangat jarang","saat bulan purnama"],"a":1,"why":"Bulan biru itu langka."}],"map":{"c":"IDIOMS","b":[{"t":"🍰 Mudah & rajin","k":["piece of cake","hit the books"]},{"t":"🤒 Kondisi","k":["under the weather"]},{"t":"💸 Jumlah","k":["cost an arm and a leg","once in a blue moon"]},{"t":"🤫 Rahasia","k":["spill the beans"]}]},"g":"📖 Vocabulary"},{"n":"Academic Writing","steps":[{"s":"Di esai akademik, <b>thesis statement</b> itu ibarat <b>spoiler film</b> 🎬. Pembaca harus tahu arah tulisanmu dari awal, bukan ditebak-tebak sampai akhir.","ex":["Lemah: Social media is popular.","Kuat: <b>Although social media connects people, it harms teenagers' focus.</b>"]},{"s":"Thesis yang bagus punya 3 ciri: <b>spesifik</b>, <b>bisa diperdebatkan</b>, dan <b>menunjukkan arah</b> argumen. Fakta umum saja belum cukup.","ex":[]},{"s":"<b>Transition words</b> itu rambu lalu lintas 🚦. <b>However</b> = putar balik (berlawanan). <b>Moreover</b> = lurus terus (menambah). <b>Therefore</b> = sampai tujuan (akibat).","ex":["Online class is flexible. <b>However</b>, it reduces interaction."]},{"s":"Bonus idiom: <b>break the ice</b> = memecah es di kolam beku. Artinya <b>mencairkan suasana</b> yang canggung.","ex":["He told a joke to <b>break the ice</b>."]},{"s":"Struktur esai itu ibarat <b>hamburger</b> 🍔: roti atas = <b>Introduction</b> (hook + thesis), isi = <b>Body</b> (topic sentence + bukti), roti bawah = <b>Conclusion</b>.","ex":["Introduction → Body → Conclusion"]},{"s":"<b>Hedging</b> itu ibarat <b>sabuk pengaman</b> 🛡️ untuk klaimmu. Penulis akademik jarang bilang \"pasti\" karena bukti jarang 100%. Mereka melunakkan klaim dengan <b>may, tend to, suggests, appears to</b>.","ex":["❌ Social media destroys concentration.","✅ Social media <b>may</b> reduce concentration.","Studies <b>suggest</b> that sleep improves memory."],"tip":"Kata absolut (always, never, prove) berisiko. Hedging membuat tulisanmu kredibel."}],"quiz":[{"q":"Mana thesis statement yang paling kuat?","o":["This essay is about technology.","Many people use smartphones.","Schools should limit smartphone use because it reduces students' concentration."],"a":2,"why":"Opsi ini spesifik, punya posisi yang bisa didebat, dan memberi alasan: spoiler yang bagus!"},{"q":"Online classes are flexible. ___, they can reduce student interaction.","o":["Moreover","However","Therefore","Similarly"],"a":1,"why":"Isinya berlawanan, jadi butuh rambu putar balik: <b>However</b>."},{"q":"At the party, Rina told a joke to ___.","o":["break a leg","spill the beans","break the ice","hit the sack"],"a":2,"why":"Dia mencairkan suasana canggung, itu <b>break the ice</b>."},{"t":"mc","q":"Fungsi topic sentence di body paragraph?","o":["Menyimpulkan seluruh esai","Memberi tahu ide utama paragraf","Memberi hook"],"a":1,"why":"Topic sentence itu \"judul kecil\" paragraf."},{"t":"mc","q":"Kata transisi untuk menambah ide:","o":["However","Moreover","Therefore"],"a":1,"why":"Moreover = lurus terus."},{"t":"mc","q":"Mana kalimat yang paling akademik?","o":["Coffee always ruins your health.","Coffee may negatively affect sleep quality.","Coffee is terrible."],"a":1,"why":"Ada hedging (may) dan klaimnya spesifik."},{"t":"type","q":"Ketik hedge verb (awalan s): Research ___ that exercise helps mood.","a":["suggests"],"why":"<b>Suggests</b> lebih hati-hati daripada proves."}],"map":{"c":"ACADEMIC WRITING","b":[{"t":"🍔 Struktur","k":["Introduction","Body","Conclusion"]},{"t":"🎬 Thesis","k":["spesifik","debatable","ada arah"]},{"t":"🚦 Transisi","k":["However","Moreover","Therefore"]},{"t":"🧊 Idiom","k":["break the ice"]},{"t":"🛡️ Hedging","k":["may","tend to","suggests","appears to"]}]},"g":"✍️ Academic Writing"},{"n":"Paraphrasing","steps":[{"s":"<b>Paraphrasing</b> itu ibarat <b>ganti baju</b> 👔: orangnya (makna) sama, tampilannya (kata & struktur) beda. Ganti satu kancing saja masih dianggap plagiat!","ex":["Original: Pollution harms public health.","Paraphrase: <b>Contaminated air damages citizens' well-being.</b>"]},{"s":"Triknya: ganti sinonim, ubah struktur kalimat, jaga makna tetap sama, dan tetap cantumkan sumber.","ex":[]},{"s":"Tiga langkah ganti baju: <b>1)</b> pahami makna, <b>2)</b> tutup teks aslinya, <b>3)</b> tulis ulang dari ingatanmu lalu cek. Menyalin sambil melihat berarti kancingnya masih sama.","ex":[]}],"quiz":[{"t":"mc","q":"Paraphrase terbaik dari \"Exercise improves mental health\"?","o":["Exercise improves mental health a lot.","Physical activity boosts psychological well-being.","Exercise is good."],"a":1,"why":"Kata dan struktur berubah, makna tetap utuh."},{"t":"type","q":"Sinonim formal dari <i>buy</i> (awalan p):","a":["purchase"],"why":"<b>Purchase</b> lebih akademik daripada buy."},{"t":"order","q":"Susun kalimat akademik:","w":["Moreover","renewable","energy","reduces","costs"],"a":"Moreover renewable energy reduces costs","why":"Moreover (lurus terus) membuka kalimat tambahan."},{"t":"type","q":"Sinonim formal dari <i>show</i> (awalan d):","a":["demonstrate"],"why":"<b>Demonstrate</b> lebih akademik."},{"t":"mc","q":"Kesalahan paraphrase yang paling umum?","o":["Hanya mengganti satu-dua kata","Mengubah struktur kalimat","Mencantumkan sumber"],"a":0,"why":"Ganti satu kancing belum cukup."}],"map":{"c":"PARAPHRASING","b":[{"t":"👔 Prinsip","k":["makna sama","kata & struktur beda"]},{"t":"🪜 Langkah","k":["pahami","tutup teks","tulis ulang","cek"]},{"t":"⚠️ Hindari","k":["ganti 1-2 kata","lupa sumber"]}]},"g":"✍️ Academic Writing"},{"n":"Esai & Karya Ilmiah (IMRaD)","g":"✍️ Academic Writing","steps":[{"s":"Esai itu <b>hamburger</b> 🍔 (Introduction, Body, Conclusion). Nah, <b>research paper</b> itu seperti <b>laporan detektif</b> 🕵️ dengan 4 bagian yang disebut <b>IMRaD</b>.","ex":[],"tbl":[["Bagian","Pertanyaan detektif"],["Introduction","Kasus apa yang diselidiki?"],["Methods","Bagaimana cara menyelidikinya?"],["Results","Apa temuannya?"],["Discussion","Apa artinya temuan itu?"]]},{"s":"Karya ilmiah wajib <b>jujur soal sumber</b>. Tiap ide orang lain harus diberi <b>sitasi</b>. Gunakan frasa pelaporan yang netral ini:","ex":["According to Smith (2020), …","Recent studies indicate that …","The results suggest that …"],"tip":"Ganti kata, lupa sumber = tetap plagiat. Selalu cantumkan <b>referensi</b>."}],"quiz":[{"t":"mc","q":"Bagian yang menjelaskan CARA penelitian dilakukan?","o":["Methods","Results","Discussion"],"a":0,"why":"<b>Methods</b> = cara menyelidiki."},{"t":"mc","q":"Bagian yang menafsirkan arti temuan?","o":["Introduction","Discussion","Methods"],"a":1,"why":"<b>Discussion</b> membahas makna temuan."},{"t":"type","q":"Ketik frasa: ___ to Smith (2020), sleep boosts memory.","a":["according"],"why":"<b>According</b> to + sumber."},{"t":"mc","q":"Tindakan yang tepat saat memakai ide orang lain?","o":["Cantumkan sumbernya","Tidak usah, sudah diparafrasa","Ganti dua kata saja"],"a":0,"why":"Parafrasa pun tetap wajib <b>disitasi</b>."},{"t":"mc","p":"Sleep is essential for learning. Researchers at several universities found that students who slept eight hours remembered more vocabulary than students who stayed awake all night. The study suggests that the brain organizes new information during sleep. However, the authors note that the sample was small, so the results should be interpreted with caution.","q":"Ide utama paragraf tadi?","o":["Tidur membantu otak mengolah memori","Siswa sebaiknya begadang","Kosakata sulit dipelajari"],"a":0,"why":"Main idea: tidur membantu memori."},{"t":"mc","p":"Sleep is essential for learning. Researchers at several universities found that students who slept eight hours remembered more vocabulary than students who stayed awake all night. The study suggests that the brain organizes new information during sleep. However, the authors note that the sample was small, so the results should be interpreted with caution.","q":"Mengapa penulis berhati-hati dengan hasilnya?","o":["Sampelnya kecil","Penelitiannya dibatalkan","Tidak ada universitas"],"a":0,"why":"Teks: the sample was <b>small</b>."},{"t":"mc","p":"Sleep is essential for learning. Researchers at several universities found that students who slept eight hours remembered more vocabulary than students who stayed awake all night. The study suggests that the brain organizes new information during sleep. However, the authors note that the sample was small, so the results should be interpreted with caution.","q":"Kata \"suggests\" menandakan…","o":["Klaim yang dilunakkan (hedging)","Bukti 100% pasti","Pendapat penulis tanpa data"],"a":0,"why":"<b>Suggests</b> adalah hedging, bukan klaim mutlak."},{"t":"mc","p":"Sleep is essential for learning. Researchers at several universities found that students who slept eight hours remembered more vocabulary than students who stayed awake all night. The study suggests that the brain organizes new information during sleep. However, the authors note that the sample was small, so the results should be interpreted with caution.","q":"Siswa yang tidur 8 jam…","o":["Lebih banyak mengingat kosakata","Lebih sedikit mengingat","Sama saja"],"a":0,"why":"Teks: remembered <b>more</b> vocabulary."}],"map":{"c":"KARYA ILMIAH","b":[{"t":"🍔 Esai","k":["Intro","Body","Conclusion"]},{"t":"🕵️ IMRaD","k":["Introduction","Methods","Results","Discussion"]},{"t":"📎 Sitasi","k":["According to…","Studies indicate…"]}]}},{"n":"Teks Argumentatif: Discussion & Analytical Exposition","g":"📖 Jenis Teks","steps":[{"s":"<b>Analytical Exposition</b> itu ibarat <b>pengacara yang membela satu klien</b> ⚖️: penulis memilih satu posisi lalu meyakinkan pembaca. Struktur: <b>Thesis → Arguments → Reiteration</b>.","ex":["<b>Thesis:</b> Schools should limit phone use.","<b>Argument:</b> Phones reduce concentration.","<b>Reiteration:</b> Therefore, limits are necessary."]},{"s":"<b>Discussion</b> itu ibarat <b>hakim yang mendengar dua pihak</b> 👩‍⚖️: dua sisi disajikan adil, baru ditutup kesimpulan. Struktur: <b>Issue → Arguments for → Arguments against → Conclusion</b>.","ex":[],"tbl":[["Fungsi","Kata penghubung"],["Menambah argumen","firstly, moreover, in addition"],["Kontras / sisi lain","however, on the other hand, whereas"],["Kesimpulan","therefore, in conclusion, to sum up"]],"tip":"Beda utama: Exposition <b>memihak satu sisi</b>, Discussion <b>menimbang dua sisi</b>."}],"quiz":[{"t":"mc","q":"Posisi penulis di Analytical Exposition…","o":["Membela satu sudut pandang","Netral dua sisi","Tidak punya posisi"],"a":0,"why":"Penulis memihak lewat <b>thesis</b>."},{"t":"mc","q":"Discussion menyajikan…","o":["Argumen pro dan kontra","Hanya argumen pro","Langkah-langkah"],"a":0,"why":"Dua sisi, lalu kesimpulan."},{"t":"mc","q":"Struktur Analytical Exposition…","o":["Thesis → Arguments → Reiteration","Goal → Steps","Orientation → Events"],"a":0,"why":"Itu strukturnya."},{"t":"type","q":"Ketik kata kontras (awalan h): Online class is flexible. ___, it reduces interaction.","a":["however"],"why":"<b>However</b> = putar balik."},{"t":"mc","q":"___, schools should limit phone use. (kesimpulan)","o":["In conclusion","However","For example"],"a":0,"why":"Penutup pakai <b>In conclusion</b>."},{"t":"order","q":"Susun: \"Di sisi lain, kelas daring melelahkan.\"","w":["On","the","other","hand","online","classes","are","tiring"],"a":"On the other hand online classes are tiring","why":"Frasa kontras diikuti klausa."}],"map":{"c":"TEKS ARGUMENTATIF","b":[{"t":"⚖️ Exposition","k":["Thesis","Arguments","Reiteration","satu sisi"]},{"t":"👩‍⚖️ Discussion","k":["Issue","For","Against","Conclusion"]},{"t":"🚦 Penghubung","k":["moreover","however","in conclusion"]}]}}]},{"id":"kerja","name":"Level Kerja & Profesional","tag":"TOEFL · TOEIC · Dunia Kerja","emoji":"💼","mods":[{"n":"Job Interview","g":"💼 Komunikasi Kerja","steps":[{"s":"Wawancara kerja itu seperti <b>pitching di acara 60 detik</b> 🎤: kamu \"menjual\" dirimu. Pembuka paling umum: <b>Tell me about yourself</b>. Pakai rumus <b>sekarang, lalu, nanti</b>: kamu sekarang apa, pengalaman apa, kamu ingin apa.","ex":["I'm an administrative officer with <b>three years of experience</b>.","I'm skilled in <b>financial reporting</b>.","I'm excited to <b>contribute</b> to your team."]},{"s":"Untuk pertanyaan \"ceritakan pengalamanmu\", pakai metode <b>STAR</b> ⭐, ibarat <b>film pendek 4 adegan</b>.","ex":[],"tbl":[["Adegan","Isi","Contoh"],["Situation","Latar","Our report was late."],["Task","Tugasmu","I had to fix it."],["Action","Yang kamu lakukan","I created a checklist."],["Result","Hasilnya","We finished on time."]],"tip":"Saat ditanya kelemahan, sebut yang <b>nyata</b> lalu tambahkan <b>cara memperbaikinya</b>."}],"quiz":[{"t":"mc","q":"Pertanyaan pembuka \"Tell me about yourself\" dijawab dengan…","o":["ringkasan profil singkat","riwayat hidup sejak lahir","\"No comment\""],"a":0,"why":"Berikan ringkasan: sekarang, pengalaman, tujuan."},{"t":"mc","q":"STAR berarti…","o":["Situation, Task, Action, Result","Skill, Time, Ability, Role","Start, Think, Act, Rest"],"a":0,"why":"<b>S</b>ituation, <b>T</b>ask, <b>A</b>ction, <b>R</b>esult."},{"t":"type","q":"Ketik: I am responsible ___ managing the inventory.","a":["for"],"why":"Pasangan tetap: responsible <b>for</b>."},{"t":"order","q":"Susun: \"Saya ingin berkontribusi pada tim Anda.\"","w":["I","want","to","contribute","to","your","team"],"a":"I want to contribute to your team","why":"Frasa penutup yang positif."},{"t":"listen","say":"Tell me about yourself.","q":"Pewawancara meminta kamu…","o":["Memperkenalkan diri","Menyebut gaji","Menjelaskan kelemahan"],"a":0,"why":"<b>Tell me about yourself</b> = ceritakan tentang dirimu.","wr":["","Gaji disebut salary.","Kelemahan disebut weakness."]}],"map":{"c":"JOB INTERVIEW","b":[{"t":"🎤 Pitch","k":["Tell me about yourself","sekarang, pengalaman, tujuan"]},{"t":"⭐ STAR","k":["Situation","Task","Action","Result"]},{"t":"💪 Kelemahan","k":["nyata + solusi"]}]},"game":{"e":"💼","t":"Ruang Wawancara","sc":[["🧑‍💼","🪑","Pewawancara bilang: \"Tell me about yourself.\"|Jawab dengan pembuka terbaik.",["I'm an administrative officer with three years of experience.","My salary should be high.","I don't know."],0,"💼","hop","Jawab dengan ringkasan profil: peran, pengalaman, tujuan."],["🧑‍💼","⭐","\"Describe a challenge you solved.\" Pakai metode STAR, mulai dari Situation.|Pilih kalimat pembukanya.",["Our monthly report was late, so I had to fix it fast.","I am the best person here.","I like coffee."],0,"⭐","wiggle","Situation = latar masalah."],["🧑‍💼","🤝","Wawancara selesai. Tutup dengan sopan.|Pilih kalimat penutupnya.",["Thank you for your time. I look forward to hearing from you.","Bye, I want to go home.","Call me later."],0,"🤝","spin","Penutup sopan: terima kasih dan harapan kabar baik."]]}},{"n":"Presentasi","g":"💼 Komunikasi Kerja","steps":[{"s":"Presentasi itu ibarat <b>tur wisata</b> 🚌: kamu pemandunya. Penumpang harus tahu <b>tujuan</b> di awal, <b>pemberhentian</b> di tengah, dan <b>ringkasan</b> di akhir.","ex":[],"tbl":[["Tahap","Frasa"],["Membuka","Good morning everyone. Today I'd like to talk about…"],["Rute","First, I'll cover… Then, I'll show…"],["Pindah topik","Let's move on to…"],["Menunjuk slide","As you can see on this slide…"],["Menutup","To sum up…"],["Tanya jawab","Any questions?"]]},{"s":"Biar penumpang tidak tersesat, ucapkan <b>signpost</b> (rambu) tiap pindah bagian. Bicara pelan, jeda sebentar, dan lihat audiens.","ex":["Let's <b>move on to</b> the budget.","To <b>sum up</b>, we saved 20 percent.","Thank you for <b>your attention</b>."]}],"quiz":[{"t":"mc","q":"Frasa untuk MEMBUKA presentasi?","o":["Today I'd like to talk about…","To sum up…","Any questions?"],"a":0,"why":"Pembuka: <b>Today I'd like to talk about…</b>"},{"t":"mc","q":"Frasa untuk MENUTUP ringkasan?","o":["To sum up…","First, …","As you can see…"],"a":0,"why":"<b>To sum up</b> = ringkasnya."},{"t":"type","q":"Ketik: Let's move ___ to the next topic.","a":["on"],"why":"Pindah topik: <b>move on</b>."},{"t":"order","q":"Susun: \"Seperti yang Anda lihat pada slide ini.\"","w":["As","you","can","see","on","this","slide"],"a":"As you can see on this slide","why":"Frasa baku untuk menunjuk slide."},{"t":"listen","say":"To sum up, we saved twenty percent.","q":"Bagian presentasi yang mana ini?","o":["Penutup / ringkasan","Pembuka","Tanya jawab"],"a":0,"why":"<b>To sum up</b> = ringkasnya, dipakai saat menutup.","wr":["","Pembuka pakai Today I would like to talk about.","Tanya jawab pakai Any questions?"]}],"map":{"c":"PRESENTASI","b":[{"t":"🚌 Buka","k":["Today I'd like to talk about…"]},{"t":"🪧 Rambu","k":["First…","Let's move on to…"]},{"t":"🏁 Tutup","k":["To sum up…","Any questions?"]}]},"fc":1},{"n":"Email & Komunikasi Kantor","g":"💼 Komunikasi Kerja","steps":[{"s":"Email kerja itu ibarat <b>surat berjas</b> 👔: isinya jelas, nadanya sopan. Susunannya: <b>Subject, Greeting, Tujuan, Detail, Aksi yang diminta, Closing</b>.","ex":["<b>Subject:</b> Request for Meeting on Friday","<b>Dear</b> Mr. Rahman,","I am writing <b>to inform you that</b> …","<b>Best regards,</b> Ypt"]},{"s":"Untuk meminta sesuatu, <b>lunakkan nada</b> seperti memakai bantalan. Bandingkan pasangan kasar dan sopan ini, dipakai juga di rapat dan telepon klien.","ex":[],"tbl":[["Kasar","Sopan"],["Send me the file.","Could you please send me the file?"],["I need it today.","I would appreciate it if you could send it today."],["Wait.","Could you hold on a moment, please?"],["I don't agree.","I see your point, but I'm afraid I see it differently."]]}],"quiz":[{"t":"mc","q":"Pilih permintaan yang paling sopan:","o":["Send the report now.","Could you please send the report?","You must send the report."],"a":1,"why":"<b>Could you please…?</b> terdengar sopan."},{"t":"mc","q":"Salam pembuka ke orang yang tidak dikenal namanya?","o":["Hey you,","To whom it may concern,","Yo,"],"a":1,"why":"Formal: <b>To whom it may concern</b>."},{"t":"type","q":"Ketik: I look forward ___ hearing from you.","a":["to"],"why":"Pasangan tetap: look forward <b>to</b> + V-ing."},{"t":"order","q":"Susun: \"Mohon kirim berkasnya.\"","w":["Could","you","please","send","the","file"],"a":"Could you please send the file","why":"Could you please + V1."},{"t":"listen","say":"Could you please hold on a moment?","q":"Maksud kalimat ini…","o":["Mohon tunggu sebentar","Mohon kirim berkasnya","Terima kasih banyak"],"a":0,"why":"<b>Hold on</b> = tunggu sebentar, sering dipakai di telepon.","wr":["","Kirim berkas pakai send the file.","Terima kasih pakai thank you."]}],"map":{"c":"EMAIL & KOMUNIKASI","b":[{"t":"👔 Struktur","k":["Subject","Greeting","Tujuan","Closing"]},{"t":"🛏️ Sopan","k":["Could you please…?","I would appreciate it if…"]},{"t":"📞 Telepon","k":["Hold on a moment","I'm afraid…"]}]},"fc":1,"game":{"e":"📧","t":"Email ke Klien","sc":[["🧑‍💻","📧","Kamu meminta klien mengirim berkas.|Tulis permintaan yang sopan.",["Could you please send me the file?","Send the file now.","You must send the file."],0,"📨","slide","Could you please... terdengar sopan."],["🧑‍💻","👔","Salam pembuka untuk klien bernama Mr. Rahman.|Pilih salamnya.",["Dear Mr. Rahman,","Hey bro,","Yo Rahman,"],0,"👔","hop","Email formal dibuka dengan Dear + nama."],["🧑‍💻","⏳","Kamu menutup email dan menunggu balasan.|Pilih kalimat penutupnya.",["I look forward to hearing from you.","See ya soon.","Reply me fast."],0,"📬","grow","look forward to + V-ing, ungkapan penutup formal."]]}},{"n":"TOEFL: Parallelism & Kontras","steps":[{"s":"<b>Parallel structure</b> itu ibarat <b>barisan marching band</b> 🥁: semua pemain melangkah seragam. Kalau satu item pakai <b>V-ing</b>, semua harus V-ing. Ini jebakan favorit soal TOEFL Structure.","ex":["❌ She likes swimming, to run, and cycling.","✅ She likes <b>swimming, running, and cycling</b>."]},{"s":"Paralelisme juga berlaku untuk pasangan <b>both…and</b>, <b>either…or</b>, <b>not only…but also</b>. Kedua sisi harus sama bentuknya.","ex":["The course is <b>both</b> challenging <b>and</b> rewarding.","He <b>not only</b> writes essays <b>but also</b> designs posters."],"tip":"Strategi TOEFL: lihat bentuk item pertama, lalu cek semua item lain mengikutinya."},{"s":"Kata kontras itu ibarat <b>tikungan</b> dengan aturan masing-masing. Salah ikutan, kalimat langsung tergelincir.","ex":[],"tbl":[["Kata","Diikuti","Contoh"],["Although","klausa (S + V)","Although it rained, we left."],["Despite","noun / V-ing","Despite the rain, we left."],["However","kalimat baru + koma","It rained. However, we left."],["Whereas","kontras 2 klausa","He is shy, where R('Past Future Perfect',[['🧑‍🔧','🚗','Montir bilang mobilmu akan sudah beres sebelum makan siang.|Laporkan!',['The mechanic said he would have fixed the car before lunch.','The mechanic said he will have fixed the car before lunch.','The mechanic said he would fix have the car before lunch.'],'<b>would have + V3</b> setelah said (lampau).'],['🧁','🎂','Ibu bilang kuenya akan sudah matang pukul lima.|Laporkan!',['Mom said the cake would have been baked by five.','Mom said the cake will have been baked by five.','Mom said the cake would baked by five.'],'Pasif: <b>would have been + V3</b>.'],['🏔️','🚩','Pemandu bilang pukul 12 mereka akan sudah mencapai puncak.|Laporkan!',['The guide said they would have reached the summit by noon.','The guide said they will have reached the summit by noon.','The guide said they would have reach the summit by noon.'],'Setelah would have → <b>V3</b> (reached).']]);

:<br><b>Listen! Someone plays the piano.<\/b>","a":["Listen! Someone is playing the piano."],"why":"Versi yang benar: <b>Listen! Someone is playing the piano.<\/b><br><b>Listen!<\/b> menandakan sedang terjadi sekarang → is + V-ing."}},{"i":1,"j":2,"n":"Present Continuous","q":{"t":"listen","say":"They are playing football now.","q":"Dengarkan, lalu ketik kalimat yang kamu dengar:","a":["they are playing football now"],"why":"Kalimatnya: <b>They are playing football now.<\/b>"}},{"i":1,"j":2,"n":"Present Continuous","q":{"t":"type","q":"🇮🇩➜🇬🇧 Terjemahkan ke bahasa Inggris (ketik sendiri, tanpa bank kata):<br><b>“Mereka sedang bermain bola sekarang.”<\/b>","a":["They are playing football now."],"why":"Terjemahannya: <b>They are playing football now.<\/b><br>be + V-ing."}},{"i":1,"j":3,"n":"Past Tense","q":{"t":"type","q":"🔧 Kalimat ini ada yang salah. Tulis ulang versi yang benar:<br><b>Yesterday I buyed a new bike.<\/b>","a":["Yesterday I bought a new bike."],"why":"Versi yang benar: <b>Yesterday I bought a new bike.<\/b><br>buy tak beraturan: buy → <b>bought<\/b>."}},{"i":1,"j":3,"n":"Past Tense","q":{"t":"listen","say":"She ate rice last night.","q":"Dengarkan, lalu ketik kalimat yang kamu dengar:","a":["she ate rice last night"],"why":"Kalimatnya: <b>She ate rice last night.<\/b>"}},{"i":1,"j":3,"n":"Past Tense","q":{"t":"type","q":"🇮🇩➜🇬🇧 Terjemahkan ke bahasa Inggris (ketik sendiri, tanpa bank kata):<br><b>“Dia makan nasi tadi malam.”<\/b>","a":["She ate rice last night."],"why":"Terjemahannya: <b>She ate rice last night.<\/b><br>Eat itu bandel, lampaunya <b>ate<\/b>."}},{"i":1,"j":4,"n":"Past Continuous","q":{"t":"type","q":"🔧 Kalimat ini ada yang salah. Tulis ulang versi yang benar:<br><b>They was playing football at five yesterday.<\/b>","a":["They were playing football at five yesterday."],"why":"Versi yang benar: <b>They were playing football at five yesterday.<\/b><br>They → <b>were<\/b> + V-ing."}},{"i":1,"j":4,"n":"Past Continuous","q":{"t":"listen","say" iting to apply for the position of analyst.<\/b>"}},{"i":3,"j":11,"n":"English untuk Kampus & Beasiswa","q":{"t":"type","q":"🇮🇩➜🇬🇧 Terjemahkan ke bahasa Inggris (ketik sendiri, tanpa bank kata):<br><b>“Saya ingin melanjutkan studi S2 di bidang ekonomi.”<\/b>","a":["I want to pursue a master's degree in economics."],"why":"Terjemahannya: <b>I want to pursue a master's degree in economics.<\/b><br>pursue a degree = menempuh gelar."}},{"i":3,"j":12,"n":"English untuk Wisata & Ojol","q":{"t":"listen","say":"Can you take me to Soekarno-Hatta Airport.","q":"Dengarkan, lalu ketik kalimat yang kamu dengar:","a":["can you take me to soekarnohatta airport"],"why":"Kalimatnya: <b>Can you take me to Soekarno-Hatta Airport.<\/b>"}},{"i":3,"j":12,"n":"English untuk Wisata & Ojol","q":{"t":"type","q":"🇮🇩➜🇬🇧 Terjemahkan ke bahasa Inggris (ketik sendiri, tanpa bank kata):<br><b>“Bisa antar saya ke Bandara Soekarno-Hatta?”<\/b>","a":["Can you take me to Soekarno-Hatta Airport."],"why":"Terjemahannya: <b>Can you take me to Soekarno-Hatta Airport.<\/b><br>take me to = antar saya ke."}}];

const mk=(n,st,qz)=>({n,steps:st,quiz:qz.map(([q,o,why],i)=>{const c=o[0],k=i%o.length,r=o.slice(1);r.splice(k,0,c);return{t:'mc',q,o:r,a:k,why}})});
const mods=[
mk(`Slang & Bahasa Gaul (Gaya Film)`,[
{s:`😎 <b>Slang</b> = bahasa santai antarteman, sering muncul di film, series, dan lagu. Anggap slang itu <b>kaos oblong</b>, English formal itu <b>jas</b>: sama-sama baju, beda acara. Contoh adegan: dua sahabat kabur dari kejaran polisi di film aksi.`,ex:[`We <b>gotta</b> bounce. Now! (= have got to)`,`I'm <b>gonna</b> crash at your place. (= going to)`,`You <b>wanna</b> grab pizza? (= want to)`]},
{s:`🗣️ <b>Kata gaul</b> yang paling sering kamu dengar: <b>dude / bro</b> (bro), <b>chill</b> (santai), <b>legit</b> (beneran bagus), <b>sketchy</b> (mencurigakan), <b>cringe</b> (bikin malu sendiri), <b>ghost</b> (menghilang tanpa kabar), <b>flex</b> (pamer).`,ex:[`<b>Dude</b>, that heist plan is <b>sketchy</b>.`,`<b>Chill</b>, I got this.`,`He <b>ghosted</b> me after one date.`]},
{s:`🎬 <b>Reaksi spontan</b> ala dialog film: <b>No way!</b> (masa sih!), <b>You nailed it!</b> (kamu keren banget), <b>That's a bummer</b> (sayang banget), <b>I'm toast</b> (aku tamat), <b>Hang in there</b> (bertahanlah), <b>Spill it!</b> (ayo cerita!).`,ex:[`<b>No way!</b> You really beat the final boss?`,`The villain is behind us. <b>I'm toast.</b>`,`<b>Spill it!</b> Who took the diamond?`]},
{s:`🎩 <b>Register</b>: kata yang sama punya versi santai dan sopan. Di teman, pakai santai. Di guru, interview, atau email, pakai formal.`,ex:[`Santai: <b>Where's the dough?</b> Formal: <b>Where is the money?</b>`,`Santai: <b>I'm beat.</b> Formal: <b>I am very tired.</b>`,`Santai: <b>Gimme a sec.</b> Formal: <b>Please give me a moment.</b>`]},
{s:`Terakhir, ini <b>peta konsep</b> 🧠 untuk merangkum semuanya. Simpan di kepala, lalu kita uji lewat kuis!`,ex:[],map:{c:`SLANG`,b:[{t:`Singkatan lisan`,k:[`gonna, wanna, gotta`,`kinda = kind of`]},{t:`Kata gaul`,k:[`dude, chill, legit`,`sketchy, cringe, ghost`]},{t:`Reaksi film`,k:[`No way!, You nailed it!`,`I'm toast, Spill it!`]},{t:`Register`,k:[`teman: santai`,`guru/kerja: formal`]}]}}
],[
[`We ___ leave right now! (= have got to)`,[`gotta`,`gonna`,`wanna`],`<b>gotta</b> = have got to (harus).`],
[`I'm ___ call my mom later. (= going to)`,[`gonna`,`gotta`,`kinda`],`<b>gonna</b> = going to (akan).`],
[`That deal looks really suspicious. A casual word for it is ___.`,[`sketchy`,`legit`,`chill`],`<b>sketchy</b> = mencurigakan.`],
[`"He ___ me." (menghilang tanpa kabar setelah chat)`,[`ghosted`,`flexed`,`nailed`],`<b>ghost</b> = menghilang tanpa kabar.`],
[`Mana yang cocok dipakai saat ngobrol dengan guru?`,[`Could you give me a moment, please?`,`Gimme a sec, dude.`,`Chill, bro, wait.`],`Ke guru pakai bahasa <b>formal</b> dan sopan.`],
[`"You nailed it!" artinya …`,[`Kamu berhasil dengan keren`,`Kamu salah besar`,`Kamu membawa paku`],`<b>nail it</b> = melakukannya dengan sempurna.`]
]),
mk(`Umpatan Ringan & Ungkapan Kasar`,[
{s:`⚠️ <b>Aturan emas:</b> umpatan itu <b>cabai</b> 🌶️. Sedikit bikin hidup, kebanyakan bikin sakit perut. Pakai hanya ke teman dekat, <b>jangan</b> di sekolah, interview, atau ke orang yang lebih tua. Di materi ini kita belajar yang <b>ringan saja</b>, supaya kamu paham saat nonton film.`,ex:[`Level 1 (halus): <b>darn, heck, freaking</b>`,`Level 2 (ringan-kasar): <b>damn, hell, crap, sucks</b>`,`Level 3 (keras): sengaja tidak diajarkan, hindari.`]},
{s:`🎬 <b>Seruan kaget/kesal</b> yang sering muncul saat adegan menegangkan. Ini karangan bergaya film, bukan kutipan asli.`,ex:[`<b>Oh, crap!</b> I left the keys in the car.`,`<b>What the hell</b> is going on in here?`,`<b>Damn</b>, that was close!`,`This is <b>freaking</b> awesome!`]},
{s:`😤 <b>Ungkapan marah & menegur</b>: <b>pissed off</b> (kesal banget), <b>screw up</b> (mengacau), <b>lose it</b> (meledak emosinya), <b>Back off!</b> (menjauh!), <b>Cut it out!</b> (hentikan!), <b>Mind your own business</b> (urus urusanmu sendiri), <b>Don't be a jerk</b> (jangan nyebelin).`,ex:[`She was <b>pissed off</b> when he <b>screwed up</b> the plan.`,`<b>Back off!</b> This is my fight.`,`He <b>lost it</b> and threw the remote.`]},
{s:`🔄 <b>Ganti ke versi sopan</b> saat situasinya resmi. Pola ini bikin kamu aman di mana saja.`,ex:[`<b>That sucks</b> → <b>That's unfortunate.</b>`,`<b>Shut up!</b> → <b>Could you please be quiet?</b>`,`<b>What the hell?</b> → <b>What is going on?</b>`,`<b>I'm pissed off</b> → <b>I am quite upset.</b>`]},
{s:`Terakhir, ini <b>peta konsep</b> 🧠 untuk merangkum semuanya. Simpan di kepala, lalu kita uji lewat kuis!`,ex:[],map:{c:`UMPATAN RINGAN`,b:[{t:`Tingkat`,k:[`halus: darn, heck`,`ringan: damn, crap`]},{t:`Seruan`,k:[`Oh, crap!`,`What the hell?`]},{t:`Marah`,k:[`pissed off, lose it`,`Back off!, Cut it out!`]},{t:`Versi sopan`,k:[`That's unfortunate`,`Could you please…`]}]}}
],[
[`"Oh, crap!" dipakai untuk mengungkapkan …`,[`kaget atau kesal`,`rasa terima kasih`,`salam perpisahan`],`<b>crap</b> = seruan kesal ringan.`],
[`Versi sopan dari "That sucks" adalah …`,[`That's unfortunate.`,`Shut up.`,`What the hell?`],`Untuk situasi resmi, pakai <b>That's unfortunate</b>.`],
[`She was ___ when he screwed up the plan.`,[`pissed off`,`chill`,`legit`],`<b>pissed off</b> = kesal banget.`],
[`"Back off!" artinya …`,[`Menjauh!`,`Ayo maju!`,`Terima kasih!`],`<b>back off</b> = menjauh, jangan ikut campur.`],
[`Kapan umpatan ringan paling aman dipakai?`,[`Ke teman dekat yang santai`,`Saat interview kerja`,`Saat presentasi di kelas`],`Hanya ke <b>teman dekat</b>, itupun secukupnya.`],

up(1,`Simple Present Tense`,[
{s:`<b>Simple Present</b> itu ibarat <b>jadwal di buku harianmu</b> 📒. Dipakai untuk 3 hal: <b>(1) kebiasaan</b>, <b>(2) fakta umum</b>, <b>(3) jadwal tetap</b>. Intinya: sesuatu yang <b>berulang atau selalu benar</b>, bukan yang terjadi detik ini.`,ex:[`I <b>wake up</b> at six. (kebiasaan: aku bangun jam enam)`,`The sun <b>rises</b> in the east. (fakta: matahari terbit di timur)`,`The train <b>leaves</b> at 8. (jadwal: kereta berangkat jam 8)`]},

{s:`<b>Kode rahasia</b> 🔑: kata-kata ini hampir selalu menandakan Simple Present: <b>every day / week, usually, always, on Sundays, twice a week, at night</b>. Lihat salah satunya, langsung tebak: kebiasaan!`,ex:[`My dad <b>drinks</b> coffee <b>every morning</b>. (Ayahku minum kopi tiap pagi)`,`We <b>visit</b> Grandma <b>on Sundays</b>. (Kami mengunjungi nenek tiap hari Minggu)`]},
{s:`<b>Termometer kebiasaan</b> 🌡️: always (100%) → usually → often → sometimes → rarely → never (0%). Letaknya: <b>sebelum kata kerja utama</b>, tapi <b>sesudah to be</b>. Triknya: to be itu "tuan rumah", kata frekuensi duduk di belakangnya.`,ex:[`She <b>always</b> drinks tea. (sebelum kata kerja)`,`He is <b>never</b> late. (sesudah is)`,`I <b>sometimes</b> walk to school.`]},
4,
{s:`⚠️ <b>Jebakan nomor 1: dua topi sekaligus.</b> Di negatif dan tanya, topinya (-s) pindah ke <b>does</b>, jadi kata kerjanya <b>kembali polos</b>. Satpam sudah pakai tanda pengenal, kamu tidak perlu pakai dua.`,ex:[`She doesn't <b>likes</b> pizza. ❌ → She doesn't <b>like</b> pizza. ✅`,`Does he <b>goes</b> to school? ❌ → Does he <b>go</b> to school? ✅`],tip:`Rumus aman: <b>does / doesn't + V1 polos</b>. Cek dulu: kalau sudah ada does, hapus -s di kata kerjanya.`}]);
up(1,`Present Perfect`,[
{s:`<b>Present Perfect</b> itu ibarat <b>jembatan</b> 🌉 yang menyambung masa lalu ke sekarang. Kejadiannya sudah lewat, tapi <b>pengalaman atau akibatnya masih terasa sekarang</b>. Rumus: <b>have / has + V3</b> (has untuk He/She/It). Tiga fungsi utama: <b>pengalaman, hasil, dan durasi</b>.`,ex:[`I <b>have lost</b> my keys. (hasil: sekarang kuncinya masih hilang)`,`She <b>has visited</b> Bali. (pengalaman: pernah, kapan-kapannya tidak penting)`,`We <b>have lived</b> here for 5 years. (durasi: dan masih tinggal di sini)`]},
